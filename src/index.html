      {collections.length===0?<div className="empty"><i className="ti ti-folders"></i><h3>No collections</h3></div>:
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:12}}>
        {collections.map(col=>{
          const w=data.worlds.find(x=>x.id===col.world_id);
          const charCount=data.characters.filter(c=>(c.collections||[]).includes(col.id)||(col.companions||[]).includes(c.id)).length;
          const img=col.image_data||(w?.image)||null;
          return <div key={col.id} style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--rl)',overflow:'hidden',cursor:'pointer'}} onClick={()=>openColl(col)}>
            <div style={{height:80,background:'var(--bg3)',overflow:'hidden',position:'relative',display:'flex',alignItems:'center',justifyContent:'center'}}>
              {img?<img src={img} alt={col.name} style={{width:'100%',height:'100%',objectFit:'cover'}}/>:<i className="ti ti-folders" style={{fontSize:28,color:'var(--accent)',opacity:0.4}}></i>}
              <div style={{position:'absolute',inset:0,background:'linear-gradient(to top,rgba(15,14,19,0.7) 0%,transparent 60%)'}}></div>
              <div style={{position:'absolute',bottom:8,left:12,fontSize:13,fontWeight:600,color:'#fff'}}>{col.name}</div>
            </div>
            <div style={{padding:'10px 12px'}}>
              <div style={{fontSize:12,color:'var(--text3)',marginBottom:6,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                {w?<span>{w.emoji?w.emoji+' ':''}{w.name}</span>:<span style={{color:'var(--accent)',fontSize:11}}>Standalone</span>}
                {' · '}{charCount} characters
              </div>
              {col.definition&&<div style={{fontSize:11,color:'var(--text3)',marginBottom:6,overflow:'hidden',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical'}}>{col.definition}</div>}
              {(col.tags||[]).length>0&&<div className="char-tags" style={{marginBottom:8}}>{col.tags.slice(0,4).map(t=><span key={t} className="tag">{t}</span>)}</div>}
              <button className="btn" style={{padding:'4px 10px',fontSize:11}} onClick={e=>{e.stopPropagation();exportColl(col);}}><i className="ti ti-download"></i>Export</button>
            </div>
          </div>;
        })}
      </div>}
    </div>
  );
}

function SchedulePage({data,setSelectedChar}) {
  const entries=data.characters.filter(c=>c.schedule_dates&&c.schedule_dates.length>0).flatMap(c=>c.schedule_dates.map(d=>({char:c,date:new Date(d)}))).sort((a,b)=>a.date-b.date);
  const today=new Date(); today.setHours(0,0,0,0);
  const future=entries.filter(x=>x.date>=today);
  const past=entries.filter(x=>x.date<today);
  return (
    <div style={{display:'flex',flexDirection:'column',gap:24}}>
      {future.length>0&&<div><h3 style={{fontSize:11,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:12}}>Upcoming</h3>
        {future.map((x,i)=>{const w=data.worlds.find(w=>w.id===x.char.world_id); return <div key={i} className="upcoming-item" style={{cursor:'pointer'}} onClick={()=>setSelectedChar(x.char)}><div className="upcoming-date">{x.date.getDate()}<br/><span style={{fontSize:9}}>{MONTHS[x.date.getMonth()].slice(0,3)}</span></div><div className="upcoming-info flex-1"><div className="name">{x.char.display_name||x.char.name}</div><div className="world">{w?.name||'—'}</div></div><span className={`status-badge status-${x.char.status||'draft'}`}>{x.char.status||'draft'}</span></div>;})}
      </div>}
      {past.length>0&&<div style={{opacity:0.5}}><h3 style={{fontSize:11,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:12}}>Past</h3>
        {past.map((x,i)=>{const w=data.worlds.find(w=>w.id===x.char.world_id); return <div key={i} className="upcoming-item"><div className="upcoming-date">{x.date.getDate()}<br/><span style={{fontSize:9}}>{MONTHS[x.date.getMonth()].slice(0,3)}</span></div><div className="upcoming-info flex-1"><div className="name">{x.char.name}</div><div className="world">{w?.name||'—'}</div></div><span className={`status-badge status-${x.char.status||'draft'}`}>{x.char.status||'draft'}</span></div>;})}
      </div>}
      {entries.length===0&&<div className="empty"><i className="ti ti-calendar-event"></i><h3>No scheduled characters</h3><p>Open a character and add schedule dates to see them here.</p></div>}
    </div>
  );
}

function WorldSelectWithCreate({data,worldId,setWorldId,update}) {
  const [newName,setNewName]=useState('');
  const creating=worldId==='__new__';
  const createWorld=()=>{
    if(!newName.trim())return;
    const id=uuid();
    update(d=>d.worlds.push({id,name:newName.trim(),short_description:'',tags:[],fandom_tags:[],created_at:now()}));
    setWorldId(id);
  };
  return (
    <div className="form-group">
      <label>World</label>
      <select value={creating?'__new__':worldId} onChange={e=>setWorldId(e.target.value)}>
        <option value="">— Select —</option>
        {[...data.worlds].sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)).map(w=><option key={w.id} value={w.id}>{w.emoji?w.emoji+' ':''}{w.name}</option>)}
        <option value="__new__">＋ Create new world…</option>
      </select>
      {creating&&<div style={{display:'flex',gap:8,marginTop:8}}>
        <input autoFocus value={newName} onChange={e=>setNewName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&createWorld()} placeholder="New world name…" style={{flex:1,background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',padding:'8px 12px',borderRadius:'var(--r)',fontSize:13,outline:'none'}}/>
        <button className="btn primary" onClick={createWorld} disabled={!newName.trim()}>Create</button>
      </div>}
    </div>
  );
}

function Modal({modal,setModal,data,update,assignLore,assignChar,assignColl,updateCharFromJSON,updateLoreFromJSON,updateCollFromJSON,deleteChar,selectedWorld}) {
  const [form,setForm]=useState({});
  const defaultWorld = modal.worldId || selectedWorld?.id || '';
  const [worldId,setWorldId]=useState(defaultWorld);
  const f=(k,v)=>setForm(p=>({...p,[k]:v}));

  if(modal.type==='confirm-delete-char') return <div className="modal-bg"><div className="modal">
    <h2>Delete character?</h2>
    <p style={{fontSize:13,color:'var(--text3)',marginBottom:20}}>This will permanently delete <strong style={{color:'var(--text)'}}>{modal.char.display_name||modal.char.name}</strong>. This cannot be undone.</p>
    <div className="modal-footer"><button className="btn" onClick={()=>setModal(null)}>Cancel</button><button className="btn danger" onClick={()=>deleteChar(modal.char)}>Delete</button></div>
  </div></div>;

  if(modal.type==='confirm-update-char') return <div className="modal-bg"><div className="modal">
    <h2>Update existing character?</h2>
    <p style={{fontSize:13,color:'var(--text3)',marginBottom:8}}>A character with this ID already exists:</p>
    <p style={{fontSize:14,fontWeight:600,color:'var(--accent)',marginBottom:16}}>{modal.existing.display_name||modal.existing.name}</p>
    <p style={{fontSize:13,color:'var(--text3)',marginBottom:20}}>Importing will overwrite all fields from the JSON while keeping your app-specific data (world, status, schedule dates, portrait).</p>
    <div className="modal-footer">
      <button className="btn" onClick={()=>setModal(null)}>Cancel</button>
      <button className="btn" onClick={()=>assignChar(modal.existing.world_id||'')}>Import as New</button>
      <button className="btn primary" onClick={()=>updateCharFromJSON(modal.obj)}>Update Existing</button>
    </div>
  </div></div>;

  if(modal.type==='confirm-update-lore') return <div className="modal-bg"><div className="modal">
    <h2>Update existing lorebook?</h2>
    <p style={{fontSize:13,color:'var(--text3)',marginBottom:8}}>A lorebook with this ID already exists:</p>
    <p style={{fontSize:14,fontWeight:600,color:'var(--amber)',marginBottom:16}}>{modal.existing.name}</p>
    <p style={{fontSize:13,color:'var(--text3)',marginBottom:20}}>Importing will overwrite all content from the JSON while keeping the world assignment.</p>
    <div className="modal-footer">
      <button className="btn" onClick={()=>setModal(null)}>Cancel</button>
      <button className="btn" onClick={()=>{setModal({type:'assign-lore',obj:modal.obj});}}>Import as New</button>
      <button className="btn primary" onClick={()=>updateLoreFromJSON(modal.obj)}>Update Existing</button>
    </div>
  </div></div>;

  if(modal.type==='assign-coll') return <div className="modal-bg"><div className="modal"><h2>Assign Collection to World</h2><p style={{fontSize:13,color:'var(--text3)',marginBottom:8}}>"{modal.obj.name}"</p><p style={{fontSize:12,color:'var(--text3)',marginBottom:16}}>{(modal.obj.companions||[]).length} companions will be auto-linked if their IDs match existing characters.</p><WorldSelectWithCreate data={data} worldId={worldId} setWorldId={setWorldId} update={update}/><div className="modal-footer"><button className="btn" onClick={()=>setModal(null)}>Cancel</button><button className="btn primary" disabled={!worldId||worldId==='__new__'} onClick={()=>assignColl(worldId)}>Import</button></div></div></div>;

  if(modal.type==='confirm-update-coll') return <div className="modal-bg"><div className="modal"><h2>Update existing collection?</h2><p style={{fontSize:13,color:'var(--text3)',marginBottom:8}}>A collection with this ID already exists:</p><p style={{fontSize:14,fontWeight:600,color:'var(--teal)',marginBottom:16}}>{modal.existing.name}</p><p style={{fontSize:13,color:'var(--text3)',marginBottom:20}}>This will update the name, description and tags, and re-link any matching characters.</p><div className="modal-footer"><button className="btn" onClick={()=>setModal(null)}>Cancel</button><button className="btn" onClick={()=>{setModal({type:'assign-coll',obj:modal.obj});}}>Import as New</button><button className="btn primary" onClick={()=>updateCollFromJSON(modal.obj)}>Update Existing</button></div></div></div>;

  if(modal.type==='assign-lore') return <div className="modal-bg"><div className="modal"><h2>Assign Lorebook to World</h2><p style={{fontSize:13,color:'var(--text3)',marginBottom:16}}>"{modal.obj.name}"</p><WorldSelectWithCreate data={data} worldId={worldId} setWorldId={setWorldId} update={update}/><div className="modal-footer"><button className="btn" onClick={()=>setModal(null)}>Cancel</button><button className="btn primary" disabled={!worldId||worldId==='__new__'} onClick={()=>assignLore(worldId)}>Import</button></div></div></div>;

  if(modal.type==='assign-char') return <div className="modal-bg"><div className="modal"><h2>Assign Character to World</h2><p style={{fontSize:13,color:'var(--text3)',marginBottom:16}}>"{modal.obj.name}"</p><WorldSelectWithCreate data={data} worldId={worldId} setWorldId={setWorldId} update={update}/><div className="modal-footer"><button className="btn" onClick={()=>setModal(null)}>Cancel</button><button className="btn primary" disabled={!worldId||worldId==='__new__'} onClick={()=>assignChar(worldId)}>Import</button></div></div></div>;

  if(modal.type==='new-persona') return <div className="modal-bg"><div className="modal"><h2>New Persona</h2><div className="form-group"><label>Name</label><input autoFocus value={form.name||''} onChange={e=>f('name',e.target.value)} placeholder="Persona name"/></div><div className="form-group"><label>Pronouns</label><input value={form.pronouns||''} onChange={e=>f('pronouns',e.target.value)} placeholder="they/them, she/her…"/></div><div className="modal-footer"><button className="btn" onClick={()=>setModal(null)}>Cancel</button><button className="btn primary" disabled={!form.name?.trim()} onClick={()=>{update(d=>{if(!d.personas)d.personas=[];d.personas.push({id:uuid(),name:form.name.trim(),pronouns:form.pronouns||'',description:'',image:null,linked_lorebook:null,created_at:now()});});setModal(null);}}>Create</button></div></div></div>;

  if(modal.type==='confirm-delete-persona') return <div className="modal-bg"><div className="modal"><h2>Delete persona?</h2><p style={{fontSize:13,color:'var(--text3)',marginBottom:20}}>This will permanently delete <strong style={{color:'var(--text)'}}>{modal.persona.name}</strong>. This cannot be undone.</p><div className="modal-footer"><button className="btn" onClick={()=>setModal(null)}>Cancel</button><button className="btn danger" onClick={()=>{update(d=>{d.personas=(d.personas||[]).filter(p=>p.id!==modal.persona.id);});modal.onBack&&modal.onBack();setModal(null);}}>Delete</button></div></div></div>;

  if(modal.type==='new-world') return <div className="modal-bg"><div className="modal"><h2>New World</h2><div className="form-group"><label>Name</label><input autoFocus value={form.name||''} onChange={e=>f('name',e.target.value)} placeholder="e.g. Gardenverse"/></div><div className="form-group"><label>Short Description</label><textarea value={form.desc||''} onChange={e=>f('desc',e.target.value)} placeholder="What is this world about?"/></div><div className="form-group"><label>Tags (comma separated)</label><input value={form.tags||''} onChange={e=>f('tags',e.target.value)} placeholder="romance, sci-fi, historical…"/></div><div className="modal-footer"><button className="btn" onClick={()=>setModal(null)}>Cancel</button><button className="btn primary" disabled={!form.name?.trim()} onClick={()=>{update(d=>d.worlds.push({id:uuid(),name:form.name.trim(),short_description:form.desc||'',tags:form.tags?form.tags.split(',').map(t=>t.trim()).filter(Boolean):[],fandom_tags:[],notes:'',created_at:now()}));setModal(null);}}>Create</button></div></div></div>;

  if(modal.type==='new-char') return <div className="modal-bg"><div className="modal"><h2>New Character</h2>
    <div className="form-group"><label>Name</label><input autoFocus value={form.name||''} onChange={e=>f('name',e.target.value)} placeholder="Character name" onKeyDown={e=>e.key==='Enter'&&form.name?.trim()&&document.getElementById('create-char-btn').click()}/></div>
    <div className="form-group"><label>World</label><select value={form.wid||modal.worldId||''} onChange={e=>f('wid',e.target.value)}><option value="">— Select world —</option><option value="__none__">No World (standalone)</option>{[...data.worlds].sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)).map(w=><option key={w.id} value={w.id}>{w.emoji?w.emoji+' ':''}{w.name}</option>)}</select></div>
    {(()=>{
      const wid=form.wid||modal.worldId||'';
      const globalT=(data.templates||[]).filter(t=>!t.world_id);
      const worldT=(data.templates||[]).filter(t=>t.world_id===wid);
      const allT=[...globalT,...worldT];
      if(allT.length===0) return null;
      return <div className="form-group"><label>Template <span style={{color:'var(--text3)',fontWeight:'normal',textTransform:'none',letterSpacing:0,fontSize:11}}>— pre-fills character fields</span></label>
        <select value={form.templateId||''} onChange={e=>f('templateId',e.target.value)}>
          <option value="">None</option>
          {globalT.length>0&&<optgroup label="Global">{globalT.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}</optgroup>}
          {worldT.length>0&&<optgroup label="World">{worldT.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}</optgroup>}
        </select>
      </div>;
    })()}
    <div className="form-group"><label>Folder Name <span style={{color:'var(--text3)',fontWeight:'normal',textTransform:'none',letterSpacing:0,fontSize:11}}>— subfolder in Companions\ for auto-saving JSON</span></label><input value={form.folder!==undefined?form.folder:(form.name||'').replace(/[^a-zA-Z0-9_-]/g,'_')} onChange={e=>f('folder',e.target.value)} placeholder="CharacterName"/><div style={{fontSize:11,color:'var(--text3)',marginTop:4}}>Clear to disable auto-save (can be changed in Settings)</div></div>
    <div className="modal-footer"><button className="btn" onClick={()=>setModal(null)}>Cancel</button>
    <button id="create-char-btn" className="btn primary" disabled={!form.name?.trim()} onClick={()=>{
      const wid=form.wid||modal.worldId||'';
      const worldId=wid==='__none__'?null:wid||null;
      const tpl=(data.templates||[]).find(t=>t.id===form.templateId);
      const tf=tpl?.fields||{};
      const effectiveFolder = form.folder!==undefined ? form.folder.trim() : (form.name||'').replace(/[^a-zA-Z0-9_-]/g,'_');
      update(d=>d.characters.push({
        id:uuid(),name:form.name.trim(),
        display_name:tf.display_name_format?tf.display_name_format.replace('{{name}}',form.name.trim()):'',
        world_id:worldId,
        short_description:tf.short_description||'',
        full_description:tf.full_description||'',
        card:tf.card||'',
        example_dialogue:'',
        tags:[...(tf.tags||[])]  ,fandom_tags:[...(tf.fandom_tags||[])],
        sus:tf.sus||false,very_sus:tf.very_sus||false,
        starting_scenarios:[],
        formatting_instructions:tf.formatting_instructions||'',
        advanced_prompt:tf.advanced_prompt||'',
        access_level:tf.access_level||'private',
        open_definition:tf.open_definition||false,
        external_model_policy:'vetted_only',
        locked_starting_message:tf.locked_starting_message||false,
        unlocked_portraits:true,hide_on_owner_profile:false,
        suppress_companion_profile_banner:false,preserve_existing_chats:true,
        posted_at:now(),created_at:now(),updated_at:now(),
        voice_catalog_id:null,temperature_offset_percentage:tf.temperature_offset_percentage||0,
        status:'draft',schedule_dates:[],posted_dates:[],collections:[],linked_lorebooks:[],image:null,author_id:'',author_handle:'',
        companion_folder:effectiveFolder||null
      }));
      // Write initial JSON to disk if folder was specified
      if(effectiveFolder){
        const folderName=effectiveFolder;
        const tf2=tpl?.fields||{};
        const initData={name:form.name.trim(),display_name:tf2.display_name_format?tf2.display_name_format.replace('{{name}}',form.name.trim()):'',short_description:tf2.short_description||''  ,full_description:tf2.full_description||'',card:tf2.card||' ',example_dialogue:'',tags:[],fandom_tags:[],sus:tf2.sus||false,very_sus:tf2.very_sus||false,starting_scenarios:[],formatting_instructions:tf2.formatting_instructions||'',advanced_prompt:tf2.advanced_prompt||'',access_level:tf2.access_level||'private',open_definition:tf2.open_definition||false,external_model_policy:'vetted_only',locked_starting_message:tf2.locked_starting_message||false,unlocked_portraits:true,hide_on_owner_profile:false,suppress_companion_profile_banner:false,preserve_existing_chats:true,posted_at:now(),created_at:now(),updated_at:now(),voice_catalog_id:null,temperature_offset_percentage:tf2.temperature_offset_percentage||0,image:null,portraits:[]};
        window.lorekeeper.saveCompanionJson(folderName, initData);
      }
      setModal(null);
    }}>Create</button></div></div></div>;

  if(modal.type==='new-lore') return <div className="modal-bg"><div className="modal"><h2>New Lorebook</h2><div className="form-group"><label>Name</label><input autoFocus value={form.name||''} onChange={e=>f('name',e.target.value)} placeholder="Lorebook name"/></div><div className="form-group"><label>Short Description</label><textarea value={form.desc||''} onChange={e=>f('desc',e.target.value)} placeholder="What does this lorebook cover?"/></div><div className="form-group"><label>World</label><select value={form.wid!==undefined?form.wid:(modal.worldId||'')} onChange={e=>f('wid',e.target.value)}><option value="">No World (standalone)</option>{[...data.worlds].sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)).map(w=><option key={w.id} value={w.id}>{w.emoji?w.emoji+' ':''}{w.name}</option>)}</select></div><div className="modal-footer"><button className="btn" onClick={()=>setModal(null)}>Cancel</button><button className="btn primary" disabled={!form.name?.trim()} onClick={()=>{const wid=form.wid!==undefined?form.wid:(modal.worldId||'');const fname=(form.name.trim().replace(/[^a-zA-Z0-9_-]/g,'_'))+'.json';update(d=>d.lorebooks.push({id:uuid(),world_id:wid||null,name:form.name.trim(),short_description:form.desc||'',content:[],tags:[],fandom_tags:[],nsfw:false,very_nsfw:false,image_id:null,collaboration_type:'private',definition_protection:'copy_protection',has_been_public:false,posted_at:now(),updated_at:now(),hide_on_owner_profile:false,selected_chapter_index:0,access_level:'private',lorebook_filename:fname}));window.lorekeeper.saveLorebookJson(fname,{name:form.name.trim(),short_description:form.desc||'',content:[],tags:[],fandom_tags:[],nsfw:false,very_nsfw:false,image_id:null,collaboration_type:'private',definition_protection:'copy_protection',has_been_public:false,posted_at:now(),updated_at:now(),hide_on_owner_profile:false,access_level:'private'});setModal(null);}}>Create</button></div></div></div>;

  if(modal.type==='new-coll') return <div className="modal-bg"><div className="modal"><h2>New Collection</h2><div className="form-group"><label>Name</label><input autoFocus value={form.name||''} onChange={e=>f('name',e.target.value)} placeholder="Collection name"/></div><div className="form-group"><label>Public Definition</label><textarea value={form.def||''} onChange={e=>f('def',e.target.value)} placeholder="Public-facing description"/></div><div className="modal-footer"><button className="btn" onClick={()=>setModal(null)}>Cancel</button><button className="btn primary" disabled={!form.name?.trim()} onClick={()=>{const fname=(form.name.trim().replace(/[^a-zA-Z0-9_-]/g,'_'))+'.json';update(d=>d.collections.push({id:uuid(),world_id:modal.worldId||null,name:form.name.trim(),definition:form.def||'',tags:[],fandom_tags:[],access_level:'private',image:null,image_data:null,companions:[],has_been_public:false,very_nsfw:false,lorebook_display:false,posted_at:now(),updated_at:now(),hide_on_owner_profile:false,collection_filename:fname}));window.lorekeeper.saveCollectionJson(fname,{name:form.name.trim(),definition:form.def||'',tags:[],fandom_tags:[],access_level:'private',image:null,companions:[],has_been_public:false,very_nsfw:false,lorebook_display:false,posted_at:now(),updated_at:now(),hide_on_owner_profile:false});setModal(null);}}>Create</button></div></div></div>;

  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
