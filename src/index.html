<style>
  * { box-sizing: border-box; margin: 0; padding: 0; scrollbar-width: thin; scrollbar-color: var(--bg4) transparent; }

<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef, useMemo } = React;
const uuid = () => ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16));
const now = () => new Date().toISOString();
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

const initData = () => ({ worlds:[], characters:[], lorebooks:[], collections:[], gallery:[], schedule:[], notes:'', personas:[], templates:[], release_cycle:[], schedule_notes:{}, lorebook_templates:[], settings:{} });

function App() {
  const [data, setData] = useState(initData);
  const [saved, setSaved] = useState(false);

  const [page, setPage] = useState('dashboard');

  const [selectedWorld, setSelectedWorld] = useState(null);

  const [charInitialTab, setCharInitialTab] = useState(null);

  const [selectedPersona, setSelectedPersona] = useState(null);
  const [calDate, setCalDate] = useState(new Date());
  const [selDay, setSelDay] = useState(null);
  const [rightTab, setRightTab] = useState('notes');
  const [rightPanel, setRightPanel] = useState(false);
  const [newTemplate, setNewTemplate] = useState(false);
  const [ctxMenu, setCtxMenu] = useState(null);
  const saveTimer = useRef();

  // Load data from disk on startup
  useEffect(() => {
    window.lorekeeper.loadData().then(d => {
      if (d) setData(d);
    });
    window.lorekeeper.getDataPath().then(p => setDataPath(p));
  }, []);

  // Autosave to disk on every change
  useEffect(() => {
    clearTimeout(saveTimer.current);
    const debounceMs = (data.settings?.autosave_debounce || 600);
    saveTimer.current = setTimeout(() => {
      window.lorekeeper.saveData(data).then(ok => {
        if (ok) { setSaved(true); setTimeout(() => setSaved(false), 1500); }
      });
    }, debounceMs);
  }, [data]);

  // keep selectedChar/World in sync after updates
  useEffect(() => {
    if (selectedChar) { const fresh = data.characters.find(c=>c.id===selectedChar.id); if(fresh) setSelectedChar(fresh); }
  }, [data.characters]);
  useEffect(() => {
    if (selectedWorld) { const fresh = data.worlds.find(w=>w.id===selectedWorld.id); if(fresh) setSelectedWorld(fresh); }
  }, [data.worlds]);

  const update = (fn) => setData(d => { const nd = JSON.parse(JSON.stringify(d)); fn(nd); return nd; });

  const searchResults = useMemo(() => {
    if (!searchQ.trim()) return [];
    const q = searchQ.toLowerCase();
    const res = [];
    data.worlds.forEach(w => { if(w.name.toLowerCase().includes(q)) res.push({type:'world',id:w.id,name:w.name,sub:w.short_description||'',obj:w}); });
    data.characters.forEach(c => { if(c.name.toLowerCase().includes(q)||(c.display_name||'').toLowerCase().includes(q)) { const w=data.worlds.find(x=>x.id===c.world_id); res.push({type:'char',id:c.id,name:c.display_name||c.name,sub:w?.name||'',obj:c}); } });
    data.lorebooks.forEach(l => { if(l.name.toLowerCase().includes(q)) { const w=data.worlds.find(x=>x.id===l.world_id); res.push({type:'lore',id:l.id,name:l.name,sub:w?.name||'',obj:l}); } });
    data.collections.forEach(c => { if(c.name.toLowerCase().includes(q)) { const w=data.worlds.find(x=>x.id===c.world_id); res.push({type:'coll',id:c.id,name:c.name,sub:w?.name||'',obj:c}); } });
    return res.slice(0,8);
  }, [searchQ, data]);

  const goSearch = (r) => {
    setSearchQ(''); setShowSearch(false);
    if(r.type==='world') { setSelectedWorld(r.obj); setWorldTab('characters'); setPage('world'); }
    if(r.type==='char') { setSelectedChar(r.obj); setPage('char'); }
    if(r.type==='lore') { const w=data.worlds.find(x=>x.id===r.obj.world_id); setSelectedWorld(w); setSelectedLore(r.obj); setWorldTab('lorebooks'); setPage('world'); }
  };

  const importJSON = async () => {
    const content = await window.lorekeeper.importFile();
    if (!content) return;
    try {
      const json = JSON.parse(content);
      if(json.worlds !== undefined) { setData(json); return; }
      if(json.content && Array.isArray(json.content)) {
        const existing = json.id ? data.lorebooks.find(l=>l.id===json.id) : null;
        if(existing) { setModal({type:'confirm-update-lore', obj:json, existing}); }
        else { setModal({type:'assign-lore', obj:json}); }
      } else if(json.companions !== undefined && json.description !== undefined) {
        // collection JSON
        const existing = json.id ? data.collections.find(c=>c.id===json.id) : null;
        if(existing) { setModal({type:'confirm-update-coll', obj:json, existing}); }
        else { setModal({type:'assign-coll', obj:json}); }
      } else if(json.name && (json.full_description !== undefined || json.starting_scenarios !== undefined)) {
        const existing = json.id ? data.characters.find(c=>c.id===json.id) : null;
        if(existing) { setModal({type:'confirm-update-char', obj:json, existing}); }
        else { setModal({type:'assign-char', obj:json}); }
      } else { alert('Unrecognized JSON format.'); }
    } catch { alert('Invalid JSON file.'); }
  };

  const importImage = async () => {
    const data = await window.lorekeeper.importImage();
    return data;
  };

  const assignLore = (worldId) => {
    const obj = modal.obj;
    update(d => { d.lorebooks.push({id:obj.id||uuid(),world_id:worldId,name:obj.name||'Untitled',short_description:obj.short_description||'',content:obj.content||[],tags:obj.tags||[],fandom_tags:obj.fandom_tags||[],nsfw:obj.nsfw||false,very_nsfw:obj.very_nsfw||false,image_id:obj.image_id||null,collaboration_type:obj.collaboration_type||'private',definition_protection:obj.definition_protection||'copy_protection',has_been_public:obj.has_been_public||false,posted_at:obj.posted_at||now(),updated_at:now(),hide_on_owner_profile:obj.hide_on_owner_profile||false,selected_chapter_index:0,access_level:obj.access_level||'private'}); });
    setModal(null);
  };

  const assignChar = (worldId) => {
    const obj = modal.obj;
    const status = obj.access_level === 'public' ? 'posted' : 'draft';
    const portraits = obj.portraits || [];
    const image = obj.image || null;
    update(d => {
      d.characters.push({id:obj.id||uuid(),world_id:worldId,name:obj.name||'Unnamed',display_name:obj.display_name||obj.name||'',short_description:obj.short_description||'',full_description:obj.full_description||'',card:obj.card||'',example_dialogue:obj.example_dialogue||'',tags:obj.tags||[],fandom_tags:obj.fandom_tags||[],sus:obj.sus||false,very_sus:obj.very_sus||false,starting_scenarios:obj.starting_scenarios||[],formatting_instructions:obj.formatting_instructions||'',advanced_prompt:obj.advanced_prompt||'',access_level:obj.access_level||'private',open_definition:obj.open_definition||false,external_model_policy:obj.external_model_policy||'vetted_only',locked_starting_message:obj.locked_starting_message||false,unlocked_portraits:obj.unlocked_portraits!==undefined?obj.unlocked_portraits:true,hide_on_owner_profile:obj.hide_on_owner_profile||false,suppress_companion_profile_banner:obj.suppress_companion_profile_banner||false,preserve_existing_chats:obj.preserve_existing_chats!==undefined?obj.preserve_existing_chats:true,posted_at:obj.posted_at||now(),created_at:obj.created_at||now(),updated_at:now(),voice_catalog_id:obj.voice_catalog_id||null,temperature_offset_percentage:obj.temperature_offset_percentage||0,status,schedule_dates:[],collections:[],image,portraits,companion_profile_banner_image:obj.companion_profile_banner_image||null,author_id:obj.author_id||'',author_handle:obj.author_handle||''});
      // auto-link to any collections that reference this character's ID
      const charId = obj.id;
      if(charId) {
        const char = d.characters[d.characters.length-1];
        d.collections.forEach(coll => {
          if((coll.companions||[]).includes(charId) && !char.collections.includes(coll.id)) {
            char.collections.push(coll.id);
          }
        });
      }
    });
    setModal(null);
  };

  const updateCharFromJSON = (obj) => {
    update(d => {
      const idx = d.characters.findIndex(c=>c.id===obj.id);
      if(idx===-1) return;
      const existing = d.characters[idx];
      d.characters[idx] = { ...existing, name:obj.name||existing.name, display_name:obj.display_name||existing.display_name, short_description:obj.short_description||existing.short_description, full_description:obj.full_description||existing.full_description, card:obj.card||existing.card, example_dialogue:obj.example_dialogue||existing.example_dialogue, tags:obj.tags||existing.tags, fandom_tags:obj.fandom_tags||existing.fandom_tags, sus:obj.sus!==undefined?obj.sus:existing.sus, very_sus:obj.very_sus!==undefined?obj.very_sus:existing.very_sus, starting_scenarios:obj.starting_scenarios||existing.starting_scenarios, formatting_instructions:obj.formatting_instructions||existing.formatting_instructions, advanced_prompt:obj.advanced_prompt||existing.advanced_prompt, access_level:obj.access_level||existing.access_level, status:obj.access_level==='public'?'posted':existing.status, open_definition:obj.open_definition!==undefined?obj.open_definition:existing.open_definition, external_model_policy:obj.external_model_policy||existing.external_model_policy, locked_starting_message:obj.locked_starting_message!==undefined?obj.locked_starting_message:existing.locked_starting_message, unlocked_portraits:obj.unlocked_portraits!==undefined?obj.unlocked_portraits:existing.unlocked_portraits, hide_on_owner_profile:obj.hide_on_owner_profile!==undefined?obj.hide_on_owner_profile:existing.hide_on_owner_profile, suppress_companion_profile_banner:obj.suppress_companion_profile_banner!==undefined?obj.suppress_companion_profile_banner:existing.suppress_companion_profile_banner, preserve_existing_chats:obj.preserve_existing_chats!==undefined?obj.preserve_existing_chats:existing.preserve_existing_chats, updated_at:now(), voice_catalog_id:obj.voice_catalog_id!==undefined?obj.voice_catalog_id:existing.voice_catalog_id, portraits:obj.portraits||existing.portraits };
      // auto-link to any collections that reference this character's ID
      const char = d.characters[idx];
      d.collections.forEach(coll => {
        if((coll.companions||[]).includes(obj.id) && !char.collections.includes(coll.id)) {
          char.collections.push(coll.id);
        }
      });
    });
    setModal(null);
  };

  const updateLoreFromJSON = (obj) => {
    update(d => {
      const idx = d.lorebooks.findIndex(l=>l.id===obj.id);
      if(idx===-1) return;
      const existing = d.lorebooks[idx];
      d.lorebooks[idx] = { ...existing, name:obj.name||existing.name, short_description:obj.short_description||existing.short_description, content:obj.content||existing.content, tags:obj.tags||existing.tags, fandom_tags:obj.fandom_tags||existing.fandom_tags, nsfw:obj.nsfw!==undefined?obj.nsfw:existing.nsfw, very_nsfw:obj.very_nsfw!==undefined?obj.very_nsfw:existing.very_nsfw, updated_at:now() };
    });
    setModal(null);
  };

  const deleteChar = (char) => {
    update(d=>{d.characters=d.characters.filter(c=>c.id!==char.id);});
    setSelectedChar(null);
    setPage(selectedWorld?'world':'characters');
    setModal(null);
  };

  const assignColl = (worldId) => {
    const obj = modal.obj;
    // auto-link characters whose platform id matches companions list
    const companionIds = obj.companions || [];
    update(d => {
      d.collections.push({id:obj.id||uuid(), world_id:worldId, name:obj.name||'Untitled', definition:obj.description||'', tags:obj.tags||[], fandom_tags:obj.fandom_tags||[], access_level:obj.access_level||'private', image:obj.image||null, companions:obj.companions||[], has_been_public:obj.has_been_public||false, very_nsfw:obj.very_nsfw||false, lorebook_display:obj.lorebook_display||'', posted_at:obj.posted_at||now(), updated_at:now(), hide_on_owner_profile:obj.hide_on_owner_profile||false});
      // link matching characters
      companionIds.forEach(cid => { const char = d.characters.find(c=>c.id===cid); if(char) { if(!char.collections) char.collections=[]; if(!char.collections.includes(obj.id)) char.collections.push(obj.id||uuid()); } });
    });
    setModal(null);
  };

  const updateCollFromJSON = (obj) => {
    const companionIds = obj.companions || [];
    update(d => {
      const idx = d.collections.findIndex(c=>c.id===obj.id);
      if(idx===-1) return;
      const existing = d.collections[idx];
      d.collections[idx] = { ...existing, name:obj.name||existing.name, definition:obj.description||existing.definition, tags:obj.tags||existing.tags, fandom_tags:obj.fandom_tags||existing.fandom_tags, access_level:obj.access_level||existing.access_level, companions:obj.companions||existing.companions||[], updated_at:now() };
      companionIds.forEach(cid => { const char = d.characters.find(c=>c.id===cid); if(char) { if(!char.collections) char.collections=[]; if(!char.collections.includes(obj.id)) char.collections.push(obj.id); } });
    });
    setModal(null);
  };

  const exportAll = async () => {
    const res = await window.lorekeeper.exportBackup({});
    if (res && res.success) { const mb=(res.size/1048576).toFixed(1); alert("Backup saved ("+mb+" MB)"); }
  };
  const exportColl = (c) => {
    const {world_id,image_data,image_relpath,collection_filename,...rest}=c;
    window.lorekeeper.exportFile({ defaultName:`${c.name}-collection.json`, content:JSON.stringify(rest,null,2) });
    update(d=>{const cl=d.collections.find(x=>x.id===c.id);if(cl)cl.site_last_synced_at=new Date().toISOString();});
  };
  // Save platform fields back to Companions/FolderName/character.json
  const saveCompanionJson = (c) => {
    if (!c.companion_folder) return; // no folder assigned, skip
    const {world_id,status,schedule_dates,collections,linked_lorebooks,companion_folder,...rest} = c;
    const exportImage = rest.image?.id ? {id: rest.image.id} : null;
    const exportPortraits = (rest.portraits||[]).map(p => { const {data,...pRest} = p; return pRest; });
    const exportBanner = rest.companion_profile_banner_image?.id ? {id: rest.companion_profile_banner_image.id} : undefined;
    const safe = {...rest, image: exportImage, portraits: exportPortraits, companion_profile_banner_image: exportBanner, card: rest.card||' ', example_dialogue: rest.example_dialogue||'', temperature_offset_percentage: rest.temperature_offset_percentage||0};
    window.lorekeeper.saveCompanionJson(c.companion_folder, safe);
  };

  const exportChar = (c) => {
    const {world_id,status,schedule_dates,collections,linked_lorebooks,...rest}=c;
    // Strip base64 image data — site only accepts {id: "uuid"}
    const exportImage = rest.image?.id ? {id: rest.image.id} : null;
    const exportPortraits = (rest.portraits||[]).map(p => {
      const {data,...pRest} = p;
      return pRest;
    });
    const exportBanner = rest.companion_profile_banner_image?.id ? {id: rest.companion_profile_banner_image.id} : undefined;
    const safe = {
      ...rest,
      image: exportImage,
      portraits: exportPortraits,
      companion_profile_banner_image: exportBanner,
      card: rest.card||' ',
      example_dialogue: rest.example_dialogue||'',
      temperature_offset_percentage: rest.temperature_offset_percentage||0,
    };
    const warnings=[];
    if(!c.short_description) warnings.push('short_description is empty');
    if(!c.full_description) warnings.push('full_description is empty');
    if(!exportImage) warnings.push('image (portrait) ID not set — site will reject import');
    if(!c.card) warnings.push('card is empty — site requires it, exporting a placeholder space');
    if(warnings.length>0){const proceed=window.confirm(`Export warnings for ${c.name}:\n\n${warnings.map(w=>'• '+w).join('\n')}\n\nExport anyway?`);if(!proceed)return;}
    window.lorekeeper.exportFile({ defaultName:`${c.name}-companion.json`, content:JSON.stringify(safe,null,2) });
    update(d=>{const ch=d.characters.find(x=>x.id===c.id);if(ch)ch.site_last_synced_at=new Date().toISOString();});
  };
  const exportLore = (l) => {
    const {world_id,lorebook_filename,image_data,image_relpath,selected_chapter_index,...rest}=l;
    window.lorekeeper.exportFile({ defaultName: l.name+"-lorebook.json", content: JSON.stringify(rest, null, 2) });
    update(d=>{const lb=d.lorebooks.find(x=>x.id===l.id);if(lb)lb.site_last_synced_at=new Date().toISOString();});

  const exportWorldPlatformZip = async (world) => {
    const wChars = data.characters.filter(c => c.world_id === world.id && c.status === 'posted');
    const wLores = data.lorebooks.filter(l => l.world_id === world.id && l.access_level === 'public');
    const wColls = data.collections.filter(c => c.world_id === world.id && c.access_level === 'public');
    if (wChars.length === 0 && wLores.length === 0 && wColls.length === 0) {
      alert("Nothing to export: no posted characters, public lorebooks, or public collections in this world.");
      return;
    }
    const files = [];
    const warnings = [];
    wChars.forEach(c => {
      const {world_id,status,schedule_dates,posted_dates,collections,linked_lorebooks,companion_folder,site_last_synced_at,lorebook_entry_text,lorebook_entry_title,...rest} = c;
      const exportImage = rest.image && rest.image.id ? {id: rest.image.id} : null;
      const exportPortraits = (rest.portraits||[]).map(p => { const {data,...pr} = p; return pr; });
      const exportBanner = rest.companion_profile_banner_image && rest.companion_profile_banner_image.id ? {id: rest.companion_profile_banner_image.id} : undefined;
      const safe = {...rest, image: exportImage, portraits: exportPortraits, companion_profile_banner_image: exportBanner, card: rest.card||" ", example_dialogue: rest.example_dialogue||"", temperature_offset_percentage: rest.temperature_offset_percentage||0};
      if (!exportImage) warnings.push(c.name + ": no portrait UUID");
      const safeName = (c.name||"character").replace(/[^a-zA-Z0-9_-]/g, "_");
      files.push({name: "Companions/" + safeName + "-companion.json", content: JSON.stringify(safe, null, 2)});
    });

function renderMd(text) {
  if(!text) return '';
  // code blocks first
  let html = text.replace(/```([\s\S]*?)```/g, (_,c)=>`<pre><code>${c.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</code></pre>`);
  // inline code
  html = html.replace(/`([^`]+)`/g, (_,c)=>`<code>${c.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</code>`);
  // headings
  html = html.replace(/^#### (.+)$/gm,'<h4>$1</h4>');
  html = html.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm,'<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm,'<h1>$1</h1>');
  // hr
  html = html.replace(/^---+$/gm,'<hr/>');
  // bold+italic, bold, italic
  html = html.replace(/\*\*\*([^*]+)\*\*\*/g,'<strong><em>$1</em></strong>');
  html = html.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  html = html.replace(/\*([^*\n]+)\*/g,'<em>$1</em>');
  // blockquote
  html = html.replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>');
  // ul
  html = html.replace(/^[\-\*] (.+)$/gm,'<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
  // ol
  html = html.replace(/^\d+\. (.+)$/gm,'<li>$1</li>');
  // paragraphs: wrap non-tag lines
  html = html.split('\n').map(line=>{
    const trimmed=line.trim();
    if(!trimmed) return '<br/>';
    if(/^<(h[1-4]|ul|ol|li|pre|hr|blockquote)/.test(trimmed)) return trimmed;
    return `<p>${trimmed}</p>`;
  }).join('');
  return html;
}

function TagInput({value, onChange, max}) {
  const [raw, setRaw] = useState((value||[]).join(', '));
  // keep raw in sync when value changes externally (e.g. on import)
  const lastExternal = React.useRef((value||[]).join(', '));
  React.useEffect(()=>{
    const ext=(value||[]).join(', ');
    if(ext!==lastExternal.current){ lastExternal.current=ext; setRaw(ext); }
  },[value]);
  const commit=(str)=>{
    const tags=str.split(',').map(t=>t.trim()).filter(Boolean);
    const limited=max?tags.slice(0,max):tags;
    lastExternal.current=limited.join(', ');
    onChange(limited);
  };
  return <input value={raw}
    onChange={e=>setRaw(e.target.value)}
    onBlur={e=>commit(e.target.value)}
    onKeyDown={e=>{if(e.key==='Enter'){commit(raw);}}}
    placeholder="tag1, tag2, tag3…"
    style={{width:'100%',background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',padding:'6px 10px',borderRadius:'var(--r)',fontSize:13,outline:'none'}}
  />;
}

  const S2 = {box:{background:"var(--bg3)",border:"1px solid var(--border)",borderRadius:"var(--r)",padding:12},label:{fontSize:11,fontWeight:600,color:"var(--text3)",textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:10,display:"block"}};
  return (
    <div style={S2.box}>
      <span style={S2.label}>Swim Event</span>
      <button className="btn primary" style={{width:"100%",justifyContent:"center",marginBottom:10}} onClick={roll}>
        <i className="ti ti-send"></i>Roll event
      </button>
      {result&&(
        <div>
          <GenResult label="Stroke" value={result.stroke}/>
          <GenResult label="Distance" value={result.distance}/>
          <GenResult label="About" value={result.desc}/>

}

function ToolsPanel({data}) {
  const [tool, setTool] = useState(null);
  const [cm, setCm] = useState('');
  const [ftIn, setFtIn] = useState({ft:'',in:''});
  const [nameGender, setNameGender] = useState('any');
  const [nameResult, setNameResult] = useState(null);
  const [eyeResult, setEyeResult] = useState(null);
  const [hairResult, setHairResult] = useState(null);
  const [buildResult, setBuildResult] = useState(null);

  const cmToFtIn=(val)=>{const n=parseFloat(val);if(isNaN(n))return;const ti=n/2.54;setFtIn({ft:Math.floor(ti/12).toString(),in:(ti%12).toFixed(1)});};
  const ftInToCm=(ft,inch)=>{const f=parseFloat(ft)||0,i=parseFloat(inch)||0;setCm(((f*12+i)*2.54).toFixed(1));};

  const genName=()=>{
    const pool = nameGender==='masc'?NAMES_MASC : nameGender==='fem'?NAMES_FEM : nameGender==='neutral'?NAMES_NEUTRAL : [...NAMES_MASC,...NAMES_FEM,...NAMES_NEUTRAL];
    setNameResult(`${pick(pool)} ${pick(SURNAMES)}`);
  };
  const genEyes=()=>{
    const base=pick(EYE_BASE), detail=pick(EYE_DETAILS);
    setEyeResult(detail?`${base} ${detail}`:base);
  };
  const genHair=()=>{
    const color=pick(HAIR_COLOR), detail=pick(HAIR_DETAIL), length=pick(HAIR_LENGTH), texture=pick(HAIR_TEXTURE), style=pick(HAIR_STYLE);
    const parts=[`${color}${detail?' ('+detail+')':''}`,`${length}, ${texture}`,style].filter(Boolean);
    setHairResult(parts.join(' — '));
  };
  const genBuild=()=>{
    const frame=pick(BUILD_FRAME), height=pick(BUILD_HEIGHT), detail=pick(BUILD_DETAIL);
    setBuildResult(`${frame}, ${height}${detail?', '+detail:''}`);
  };

  const tools=[
    {id:'height',icon:'ti-ruler',label:'Height'},
    {id:'names',icon:'ti-user-circle',label:'Names'},
    {id:'physicals',icon:'ti-sparkles',label:'Physicals'},
    {id:'nationality',icon:'ti-world',label:'Nationality'},
    {id:'color',icon:'ti-palette',label:'Color'},
    {id:'diff',icon:'ti-scan',label:'Text Diff'},
    {id:'personality',icon:'ti-brain',label:'Personality'},
    {id:'plot',icon:'ti-books',label:'Plot'},
    {id:'esper',icon:'ti-sparkles',label:'Esper Powers'},
    {id:'hockey',icon:'ti-trophy',label:'Hockey'},
    {id:'swim',icon:'ti-send',label:'Swim'},
    {id:'western-zodiac',icon:'ti-stars',label:'Western Zodiac'},
    {id:'chinese-zodiac',icon:'ti-yin-yang',label:'Chinese Zodiac'},
  ];

  const S={box:{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--r)',padding:12},label:{fontSize:11,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:10,display:'block'},input:{width:'100%',background:'var(--bg2)',border:'1px solid var(--border)',color:'var(--text)',padding:'6px 10px',borderRadius:'var(--r)',fontSize:13,outline:'none'}};

  return (
    <div style={{padding:12,display:'flex',flexDirection:'column',gap:10}}>
      <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
        {tools.map(t=>(
          <button key={t.id} className={`btn${tool===t.id?' primary':''}`} style={{fontSize:11,padding:'4px 10px'}} onClick={()=>setTool(s=>s===t.id?null:t.id)}>
            <i className={`ti ${t.icon}`}></i>{t.label}
          </button>
        ))}
      </div>

      {tool==='height'&&(
        <div style={S.box}>
          <span style={S.label}>Height Converter</span>
          <div style={{marginBottom:8}}>
            <label style={{fontSize:11,color:'var(--text3)',display:'block',marginBottom:4}}>Centimeters</label>
            <input type="number" value={cm} onChange={e=>{setCm(e.target.value);cmToFtIn(e.target.value);}} placeholder="e.g. 178" style={S.input}/>
          </div>
          <div style={{display:'flex',gap:8,marginBottom:10}}>
            <div style={{flex:1}}>
              <label style={{fontSize:11,color:'var(--text3)',display:'block',marginBottom:4}}>Feet</label>
              <input type="number" value={ftIn.ft} onChange={e=>{const v={...ftIn,ft:e.target.value};setFtIn(v);ftInToCm(e.target.value,ftIn.in);}} placeholder="5" style={S.input}/>
            </div>
            <div style={{flex:1}}>
              <label style={{fontSize:11,color:'var(--text3)',display:'block',marginBottom:4}}>Inches</label>
              <input type="number" value={ftIn.in} onChange={e=>{const v={...ftIn,in:e.target.value};setFtIn(v);ftInToCm(ftIn.ft,e.target.value);}} placeholder="10" style={S.input}/>
            </div>
          </div>
          {cm&&ftIn.ft&&<div style={{fontSize:13,color:'var(--accent)',background:'var(--accent-dim)',border:'1px solid var(--accent2)',borderRadius:'var(--r)',padding:'8px 10px',textAlign:'center',fontWeight:500,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:8}}
            onClick={()=>navigator.clipboard.writeText(`${cm} cm = ${ftIn.ft}'${ftIn.in}"`)}
            title="Click to copy">
            {cm} cm = {ftIn.ft}'{ftIn.in}" <i className="ti ti-copy" style={{fontSize:12,opacity:0.7}}></i>
          </div>}
        </div>
      )}

      {tool==='names'&&(
        <div style={S.box}>
          <span style={S.label}>Name Generator</span>
          <div style={{display:'flex',gap:4,marginBottom:10,flexWrap:'wrap'}}>
            {[['any','Any'],['masc','Masc'],['fem','Fem'],['neutral','Neutral']].map(([v,l])=>(
              <button key={v} className={`btn${nameGender===v?' primary':''}`} style={{fontSize:11,padding:'3px 8px'}} onClick={()=>setNameGender(v)}>{l}</button>
            ))}
          </div>
          <button className="btn primary" style={{width:'100%',justifyContent:'center',marginBottom:10}} onClick={genName}>
            <i className="ti ti-refresh"></i>Generate name
          </button>
          <GenResult label="Name" value={nameResult}/>
        </div>
      )}

      {tool==='physicals'&&(
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          <div style={S.box}>
            <span style={S.label}>Eyes</span>
            <button className="btn primary" style={{width:'100%',justifyContent:'center',marginBottom:8}} onClick={genEyes}><i className="ti ti-refresh"></i>Roll eyes</button>
            <GenResult label="Eye color" value={eyeResult}/>
          </div>
          <div style={S.box}>
            <span style={S.label}>Hair</span>
            <button className="btn primary" style={{width:'100%',justifyContent:'center',marginBottom:8}} onClick={genHair}><i className="ti ti-refresh"></i>Roll hair</button>
            <GenResult label="Hair" value={hairResult}/>
          </div>
          <div style={S.box}>
            <span style={S.label}>Build</span>
            <button className="btn primary" style={{width:'100%',justifyContent:'center',marginBottom:8}} onClick={genBuild}><i className="ti ti-refresh"></i>Roll build</button>
            <GenResult label="Build" value={buildResult}/>
          </div>
          <button className="btn" style={{justifyContent:'center'}} onClick={()=>{genEyes();genHair();genBuild();}}>
            <i className="ti ti-dice"></i>Roll all physicals
          </button>
        </div>
      )}
      {tool==='nationality'&&<NationalityTool/>}
      {tool==='color'&&<ColorTool/>}
      {tool==='diff'&&<TextDiffTool/>}
      {tool==='personality'&&<PersonalityTool/>}
      {tool==='plot'&&<PlotTool data={data}/>}
      {tool==='esper'&&<EsperTool/>}
      {tool==='western-zodiac'&&<WesternZodiacTool/>}
      {tool==='chinese-zodiac'&&<ChineseZodiacTool/>}
      {tool==='hockey'&&<HockeyTool/>}
      {tool==='swim'&&<SwimTool/>}
    </div>
  );
}

            {Object.keys(groupedFiltered).length === 0 && !search.trim() && (
              <div style={{padding:'10px',fontSize:12,color:'var(--text3)'}}>Type to search tags…</div>
            )}
          </div>
        )}
      </div>
      {/* World tag suggestions */}
      {!open && worldSuggestions.length>0 && (
        <div style={{marginTop:6}}>
          <div style={{fontSize:9,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:4}}>Common in this world</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
            {worldSuggestions.map(({t,count})=>(
              <button key={t} onClick={()=>toggleTag(t)}
                style={{fontSize:10,padding:'2px 8px',borderRadius:4,background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text2)',cursor:'pointer',display:'flex',alignItems:'center',gap:4}}
                title={SAUCEPAN_TAGS[t]?.d||t}>
                {CW_TAGS.has(t)&&<span style={{color:'#fca5a5',fontSize:9}}>CW</span>}
                {t}
                <span style={{fontSize:9,color:'var(--text3)'}}>×{count}</span>
              </button>
            ))}
          </div>
        </div>
      )}
      {/* Click outside to close */}
      {open && <div style={{position:'fixed',inset:0,zIndex:99}} onClick={()=>{setOpen(false);}}/>}
    </div>
  );
}


function GalleryItem({src, label, sublabel, path}) {
  const [dims, setDims] = useState(null);
  const [hover, setHover] = useState(false);
  const ext = path ? path.split('.').pop().toUpperCase() : (src&&src.startsWith('data:'))?src.split(';')[0].split('/')[1].toUpperCase():'';
  return (
    <div className="gallery-item" style={{position:'relative'}}
      onMouseEnter={()=>setHover(true)}
      onMouseLeave={()=>setHover(false)}>
      <ResolvedImg src={src} alt={label} style={{width:'100%',height:'100%',objectFit:'cover'}}
        onDims={d=>setDims(d)}/>
      {/* Always visible label */}
      <div style={{position:'absolute',bottom:0,left:0,right:0,background:'rgba(0,0,0,0.65)',fontSize:9,padding:'3px 5px',color:'#fff',lineHeight:1.4}}>
        <div style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{label}{sublabel?' · '+sublabel:''}</div>
      </div>
      {/* Extension badge */}
      {ext&&<div style={{position:'absolute',top:4,right:4,background:'rgba(0,0,0,0.6)',color:'#fff',fontSize:8,padding:'1px 4px',borderRadius:3,fontWeight:600}}>{ext}</div>}
      {/* Hover overlay with details */}
      {hover&&(
        <div style={{position:'absolute',inset:0,background:'rgba(15,14,19,0.88)',display:'flex',flexDirection:'column',justifyContent:'center',padding:8,gap:3}}>
          <div style={{fontSize:10,color:'var(--text)',fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{label}</div>
          {sublabel&&<div style={{fontSize:9,color:'var(--text3)'}}>{sublabel}</div>}
          {dims&&<div style={{fontSize:9,color:'var(--accent)'}}>{dims.w} × {dims.h}px</div>}
          {path&&<div style={{fontSize:8,color:'var(--text3)',fontFamily:'monospace',wordBreak:'break-all',lineHeight:1.4,cursor:'pointer'}} title="Click to copy" onClick={e=>{e.stopPropagation();navigator.clipboard.writeText('I:\\Lorekeeper\\'+path.replace(/\//g,'\\'));}}>{'I:\\Lorekeeper\\'+path.replace(/\//g,'\\')}</div>}
          {ext&&<div style={{fontSize:9,color:'var(--text3)'}}>{ext}</div>}
        </div>
      )}
    </div>
  );
}


function ResolvedImg({src, alt, style, className, onDims}) {
  const [resolved, setResolved] = React.useState(null);
  React.useEffect(()=>{
    if(!src){setResolved(null);return;}
    if(src.startsWith('data:')){setResolved(src);return;}
    window.lorekeeper.readImagePath(src).then(b64=>{setResolved(b64||null);}).catch(()=>setResolved(null));
  },[src]);
  if(!resolved) return <div style={{...style,background:'var(--bg3)',display:'flex',alignItems:'center',justifyContent:'center'}}><i className="ti ti-photo" style={{color:'var(--text3)',fontSize:20}}></i></div>;
  return <img src={resolved} alt={alt||''} style={style} className={className}
    onLoad={e=>{if(onDims)onDims({w:e.target.naturalWidth,h:e.target.naturalHeight});}}/>;
}

function LoreTplManager({worldId, data, update}) {
  const [editing, setEditing] = useState(null); // null | 'new' | template_id
  const [form, setForm] = useState({name:'',template_text:'',lorebook_id:''});
  const templates = (data.lorebook_templates||[]).filter(t=>t.world_id===worldId);
  const worldLorebooks = data.lorebooks.filter(l=>l.world_id===worldId);

  const startNew = () => { setForm({name:'',template_text:'',lorebook_id:worldLorebooks[0]?.id||''}); setEditing('new'); };
  const startEdit = (t) => { setForm({name:t.name,title_template:t.title_template||'',template_text:t.template_text,lorebook_id:t.lorebook_id||''}); setEditing(t.id); };
  const save = () => {
    if(!form.name.trim()||!form.template_text.trim()) return;
    update(d=>{
      if(!d.lorebook_templates) d.lorebook_templates=[];
      if(editing==='new') {
        d.lorebook_templates.push({id:Math.random().toString(36).slice(2),world_id:worldId,name:form.name.trim(),title_template:form.title_template||'',template_text:form.template_text,lorebook_id:form.lorebook_id||null});
      } else {
        const t=d.lorebook_templates.find(x=>x.id===editing);
        if(t){t.name=form.name.trim();t.title_template=form.title_template||'';t.template_text=form.template_text;t.lorebook_id=form.lorebook_id||null;}
      }
    });
    setEditing(null);
  };
  const del = (id) => { if(window.confirm('Delete this lorebook template?')) update(d=>{d.lorebook_templates=(d.lorebook_templates||[]).filter(t=>t.id!==id);}); };

  const [showHelp, setShowHelp] = useState(false);

  if(editing!==null) return (
    <div style={{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--r)',padding:12,marginTop:6}}>
      <div style={{fontWeight:600,fontSize:12,marginBottom:10,color:'var(--text)'}}>{editing==='new'?'New Template':'Edit Template'}</div>
      <div className="field-block" style={{marginBottom:8}}>
        <label style={{fontSize:11}}>Template name</label>
        <input value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} placeholder="e.g. Hockey Player Profile"/>
      </div>
      <div className="field-block" style={{marginBottom:8}}>
        <label style={{fontSize:11}}>Target lorebook <span style={{color:'var(--text3)',fontWeight:'normal',textTransform:'none',fontSize:10}}>— where chapters will be saved</span></label>
        <select value={form.lorebook_id} onChange={e=>setForm(f=>({...f,lorebook_id:e.target.value}))}
          style={{width:'100%',background:'var(--bg2)',border:'1px solid var(--border)',color:'var(--text)',padding:'5px 8px',borderRadius:'var(--r)',fontSize:12,outline:'none'}}>
          <option value="">— Select lorebook —</option>
          {worldLorebooks.map(l=><option key={l.id} value={l.id}>{l.name}</option>)}
        </select>
        {worldLorebooks.length===0&&<div style={{fontSize:11,color:'var(--amber)',marginTop:4}}>No lorebooks in this world yet. Create one first.</div>}
      </div>
      <div className="field-block" style={{marginBottom:8}}>
        <label style={{fontSize:11}}>Chapter title template <span style={{color:'var(--text3)',fontWeight:'normal',textTransform:'none',fontSize:10}}>— use {'{{CHARACTER NAME}}'} as placeholder</span></label>
        <input value={form.title_template||''} onChange={e=>setForm(f=>({...f,title_template:e.target.value}))} placeholder="e.g. {{CHARACTER NAME}} | POSITION | ROLE" style={{fontFamily:'monospace'}}/>
      </div>
      <div className="field-block" style={{marginBottom:10}}>
        <label style={{fontSize:11}}>Template text <span style={{color:'var(--text3)',fontWeight:'normal',textTransform:'none',fontSize:10}}>— use {'{{CHARACTER NAME}}'} and {'{{CHAR}}'} as placeholders</span></label>
        <textarea value={form.template_text} onChange={e=>setForm(f=>({...f,template_text:e.target.value}))}
          style={{width:'100%',minHeight:200,background:'var(--bg2)',border:'1px solid var(--border)',color:'var(--text)',padding:'8px 10px',borderRadius:'var(--r)',fontSize:11,outline:'none',resize:'vertical',fontFamily:'monospace',lineHeight:1.5}}
          placeholder="# PROFILE — {{CHARACTER NAME}}&#10;**Name:**&#10;**Age:**&#10;..."/>
      </div>
      <div style={{display:'flex',gap:8}}>
        <button className="btn primary" disabled={!form.name.trim()||!form.template_text.trim()} onClick={save}><i className="ti ti-check"></i>Save</button>
        <button className="btn" onClick={()=>setEditing(null)}>Cancel</button>
      </div>
    </div>
  );

  return (
    <div style={{marginTop:6}}>
      <div style={{marginBottom:8}}>
        <button onClick={()=>setShowHelp(h=>!h)} style={{background:'none',border:'none',cursor:'pointer',color:'var(--text3)',fontSize:12,padding:0,display:'flex',alignItems:'center',gap:4}}>
          <i className={`ti ti-${showHelp?'chevron-up':'help-circle'}`} style={{fontSize:13}}></i>
          {showHelp?'Hide help':'How do lorebook templates work?'}
        </button>
        {showHelp&&<div style={{marginTop:8,padding:'10px 12px',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--r)',fontSize:12,color:'var(--text3)',lineHeight:1.8}}>
          <strong style={{color:'var(--text)',display:'block',marginBottom:6}}>Lorebook templates — quick guide</strong>
          <strong style={{color:'var(--text)'}}>1.</strong> Create a template here — set a title format (e.g. <code style={{background:'var(--bg2)',padding:'1px 4px',borderRadius:3,fontFamily:'monospace',fontSize:11}}>{"{{CHARACTER NAME}} | POSITION | ROLE"}</code>) and a body with your structured fields.<br/>
          <strong style={{color:'var(--text)'}}>2.</strong> Link it to a lorebook in this world — that lorebook collects all the character entries.<br/>
          <strong style={{color:'var(--text)'}}>3.</strong> Open any character in this world → <strong style={{color:'var(--text)'}}>Lorebook Entry</strong> tab.<br/>
          <strong style={{color:'var(--text)'}}>4.</strong> Edit the chapter title and fill in the body — <code style={{background:'var(--bg2)',padding:'1px 4px',borderRadius:3,fontFamily:'monospace',fontSize:11}}>{"{{CHARACTER NAME}}"}</code> and <code style={{background:'var(--bg2)',padding:'1px 4px',borderRadius:3,fontFamily:'monospace',fontSize:11}}>{"{{CHAR}}"}</code> are auto-replaced with the character's name.<br/>
          <strong style={{color:'var(--text)'}}>5.</strong> Click <strong style={{color:'var(--text)'}}>Save to Lorebook</strong> — creates or updates the chapter. Re-saving never duplicates.
        </div>}
      </div>
      {templates.length===0
        ? <div style={{fontSize:12,color:'var(--text3)',marginBottom:6}}>No templates yet.</div>
        : <div style={{display:'flex',flexDirection:'column',gap:6,marginBottom:8}}>
            {templates.map(t=>{
              const lb=data.lorebooks.find(l=>l.id===t.lorebook_id);
              return <div key={t.id} style={{display:'flex',alignItems:'center',gap:8,padding:'6px 10px',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--r)'}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12,fontWeight:500,color:'var(--text)'}}>{t.name}</div>
                  <div style={{fontSize:10,color:'var(--text3)'}}>{lb?'→ '+lb.name:'no lorebook linked'}</div>
                </div>
                <button className="btn" style={{fontSize:10,padding:'2px 7px'}} onClick={()=>startEdit(t)}><i className="ti ti-edit" style={{fontSize:10}}></i></button>
                <button className="btn danger" style={{fontSize:10,padding:'2px 7px'}} onClick={()=>del(t.id)}><i className="ti ti-trash" style={{fontSize:10}}></i></button>
              </div>;
            })}
          </div>
      }
      <button className="btn" style={{fontSize:11}} onClick={startNew}><i className="ti ti-plus"></i>New template</button>
    </div>
  );
}

function PlotArchetypeInput({worldId, update}) {
  const [val, setVal] = useState('');
  const add = () => {
    if(!val.trim()) return;
    update(d=>{const w=d.worlds.find(x=>x.id===worldId);if(w){if(!w.plot_archetypes)w.plot_archetypes=[];w.plot_archetypes.push(val.trim());}});
    setVal('');
  };
  return <div style={{display:'flex',gap:6}}>
    <input value={val} onChange={e=>setVal(e.target.value)}

// ── Color Tool ────────────────────────────────────────────

function hexToHsl(hex) {
  let r=parseInt(hex.slice(1,3),16)/255, g=parseInt(hex.slice(3,5),16)/255, b=parseInt(hex.slice(5,7),16)/255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b); let h,s,l=(max+min)/2;
  if(max===min){h=s=0;}else{const d=max-min;s=l>0.5?d/(2-max-min):d/(max+min);switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4;break;}h/=6;}
  return [Math.round(h*360),Math.round(s*100),Math.round(l*100)];
}
function hslToHex(h,s,l) {
  s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return '#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('');
}
function genPalette(baseHex, mode) {
  const [h,s,l]=hexToHsl(baseHex);
  if(mode==='complementary') return [baseHex, hslToHex((h+180)%360,s,l)];
  if(mode==='analogous') return [hslToHex((h-30+360)%360,s,l), baseHex, hslToHex((h+30)%360,s,l)];
  if(mode==='triadic') return [baseHex, hslToHex((h+120)%360,s,l), hslToHex((h+240)%360,s,l)];
  if(mode==='split') return [baseHex, hslToHex((h+150)%360,s,l), hslToHex((h+210)%360,s,l)];
  if(mode==='tetradic') return [baseHex, hslToHex((h+90)%360,s,l), hslToHex((h+180)%360,s,l), hslToHex((h+270)%360,s,l)];
  // shades
  return [hslToHex(h,s,Math.max(10,l-30)), hslToHex(h,s,Math.max(10,l-15)), baseHex, hslToHex(h,s,Math.min(90,l+15)), hslToHex(h,s,Math.min(90,l+30))];
}

          </div>
          <button className="btn" style={{padding:'4px 8px',fontSize:10}} onClick={()=>{copyHex(color);setHexInput('');}}><i className="ti ti-copy" style={{fontSize:10}}></i></button>
        </div>

            <input type="range" min={0} max={359} value={hue} onChange={e=>{setHue(+e.target.value);setHexInput('');}}
              style={sliderStyle('linear-gradient(to right,hsl(0,100%,50%),hsl(30,100%,50%),hsl(60,100%,50%),hsl(90,100%,50%),hsl(120,100%,50%),hsl(150,100%,50%),hsl(180,100%,50%),hsl(210,100%,50%),hsl(240,100%,50%),hsl(270,100%,50%),hsl(300,100%,50%),hsl(330,100%,50%),hsl(360,100%,50%))')}/>
          </div>

            <input type="range" min={0} max={100} value={sat} onChange={e=>{setSat(+e.target.value);setHexInput('');}}

// ── Text Diff Tool ────────────────────────────────────────

function TextDiffTool() {
  const [a, setA] = useState('');
  const [b, setB] = useState('');

  const computeDiff = (textA, textB) => {
    if(!textA.trim()&&!textB.trim()) return null;
    const wordsA = textA.split(/(\s+)/);
    const wordsB = textB.split(/(\s+)/);
    // Simple LCS-based word diff
    const m=wordsA.length, n=wordsB.length;
    const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
    for(let i=m-1;i>=0;i--) for(let j=n-1;j>=0;j--) dp[i][j]=wordsA[i]===wordsB[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
    const result=[];
    let i=0,j=0;
    while(i<m||j<n){
      if(i<m&&j<n&&wordsA[i]===wordsB[j]){result.push({t:'same',v:wordsA[i]});i++;j++;}
      else if(j<n&&(i>=m||dp[i+1]?.[j]<=dp[i]?.[j+1])){result.push({t:'add',v:wordsB[j]});j++;}
      else{result.push({t:'del',v:wordsA[i]});i++;}
    }
    return result;
  };

  const diff = computeDiff(a, b);
  const added = diff ? diff.filter(d=>d.t==='add'&&d.v.trim()).length : 0;
  const removed = diff ? diff.filter(d=>d.t==='del'&&d.v.trim()).length : 0;

  const S = {input:{width:'100%',minHeight:80,background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',padding:'6px 8px',borderRadius:'var(--r)',fontSize:11,outline:'none',resize:'vertical',fontFamily:'inherit',lineHeight:1.5}};

  return (
    <div style={{display:'flex',flexDirection:'column',gap:8}}>
      <div>
        <div style={{fontSize:9,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:4}}>Original</div>
        <textarea value={a} onChange={e=>setA(e.target.value)} placeholder="Paste original text…" style={S.input}/>
      </div>
      <div>
        <div style={{fontSize:9,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:4}}>Revised</div>
        <textarea value={b} onChange={e=>setB(e.target.value)} placeholder="Paste revised text…" style={S.input}/>
      </div>
      {diff&&(a.trim()||b.trim())&&(
        <div style={{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--r)',padding:10}}>
          <div style={{display:'flex',gap:12,marginBottom:8}}>
            <span style={{fontSize:11,color:'#6ee7b7'}}>+{added} added</span>
            <span style={{fontSize:11,color:'#fca5a5'}}>−{removed} removed</span>
          </div>
          <div style={{fontSize:11,lineHeight:1.8,wordBreak:'break-word'}}>
            {diff.map((d,i)=>{
              if(d.t==='same') return <span key={i}>{d.v}</span>;
              if(d.t==='add') return <span key={i} style={{background:'rgba(110,231,183,0.2)',color:'#6ee7b7',borderRadius:2,padding:'0 1px'}}>{d.v}</span>;
              return <span key={i} style={{background:'rgba(239,68,68,0.2)',color:'#fca5a5',borderRadius:2,padding:'0 1px',textDecoration:'line-through'}}>{d.v}</span>;
            })}
          </div>
        </div>
      )}
      {(a||b)&&<button className="btn" style={{justifyContent:'center',fontSize:11}} onClick={()=>{setA('');setB('');}}>
        <i className="ti ti-x"></i>Clear
      </button>}
    </div>
  );
}

function PersonalityTool() {
  const [results, setResults] = useState({});
  const sections = [
    {key:'literary', label:'Literary Archetype', pool:LITERARY_ARCHETYPES, color:'var(--accent)'},
    {key:'mbti', label:'MBTI Type', pool:MBTI_TYPES, color:'#a78bfa'},
    {key:'jungian', label:'Jungian Archetype', pool:JUNGIAN_ARCHETYPES, color:'#34d399'},
    {key:'attachment', label:'Attachment Style', pool:ATTACHMENT_STYLES, color:'#f59e0b'},
  ];
  const roll = (key, pool) => setResults(r=>({...r, [key]:pick(pool)}));
  const rollAll = () => sections.forEach(s=>roll(s.key, s.pool));
  const copy = () => {
    const text = sections.filter(s=>results[s.key]).map(s=>`${s.label}: ${results[s.key].name}\n${results[s.key].desc}`).join('\n\n');
    navigator.clipboard.writeText(text);
  };

  return (
    <div style={{display:'flex',flexDirection:'column',gap:8}}>
      {sections.map(s=>(
        <div key={s.key} style={{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--r)',padding:10}}>

            <span style={{fontSize:9,fontWeight:600,color:s.color,textTransform:'uppercase',letterSpacing:'0.06em'}}>{s.label}</span>
            <button className="btn" style={{padding:'2px 8px',fontSize:10}} onClick={()=>roll(s.key,s.pool)}><i className="ti ti-refresh" style={{fontSize:10}}></i>Roll</button>
          </div>
          {results[s.key]
            ? <div>
                <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:6}}>
                  <div style={{fontSize:12,fontWeight:600,color:'var(--text)',marginBottom:3,flex:1}}>{results[s.key].name}</div>
                  <button className="btn" style={{padding:'1px 6px',fontSize:10,flexShrink:0}} onClick={()=>navigator.clipboard.writeText(`${results[s.key].name}: ${results[s.key].desc}`)} title="Copy"><i className="ti ti-copy" style={{fontSize:10}}></i></button>
                </div>

              </div>
            : <div style={{fontSize:11,color:'var(--text3)',fontStyle:'italic'}}>Click Roll to generate</div>
          }
        </div>
      ))}
      <div style={{display:'flex',gap:6}}>
        <button className="btn primary" style={{flex:1,justifyContent:'center'}} onClick={rollAll}><i className="ti ti-dice"></i>Roll all</button>
        {Object.keys(results).length>0&&<button className="btn" style={{padding:'6px 10px'}} onClick={copy} title="Copy all"><i className="ti ti-copy"></i></button>}
      </div>

  );

function PlotTool({data}) {
  const [worldId, setWorldId] = useState('');
  const [result, setResult] = useState(null);
  const [source, setSource] = useState('');

  const worldPool = worldId
    ? (data.worlds.find(w=>w.id===worldId)?.plot_archetypes||[])
    : [];

  const roll = (pool, label) => {
    if(!pool.length) return;
    setResult(pick(pool));
    setSource(label);
  };

  const rollAny = () => {
    const combined = [...GLOBAL_PLOT_ARCHETYPES, ...worldPool];
    if(!combined.length) return;
    const r = pick(combined);
    setResult(r);
    setSource(GLOBAL_PLOT_ARCHETYPES.includes(r)?'Global':data.worlds.find(w=>w.id===worldId)?.name||'World');
  };

  return (
    <div style={{display:'flex',flexDirection:'column',gap:8}}>
      <div style={{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--r)',padding:10}}>
        <div style={{fontSize:9,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:6}}>World filter (optional)</div>
        <select value={worldId} onChange={e=>setWorldId(e.target.value)}
          style={{width:'100%',background:'var(--bg2)',border:'1px solid var(--border)',color:'var(--text)',padding:'5px 8px',borderRadius:'var(--r)',fontSize:12,outline:'none'}}>
          <option value="">Global pool ({GLOBAL_PLOT_ARCHETYPES.length})</option>
          {data.worlds.map(w=><option key={w.id} value={w.id}>{w.emoji?w.emoji+' ':''}{w.name}{(w.plot_archetypes||[]).length>0?` (+${(w.plot_archetypes||[]).length} custom)`:' (no custom)'}</option>)}
        </select>
      </div>
      <div style={{display:'flex',gap:6}}>
        <button className="btn primary" style={{flex:1,justifyContent:'center'}} onClick={rollAny}>
          <i className="ti ti-dice"></i>Roll{worldId&&worldPool.length>0?' (any)':''}
        </button>
        {worldId&&worldPool.length>0&&(
          <button className="btn" style={{flex:1,justifyContent:'center'}} onClick={()=>roll(worldPool,'World only')}>
            <i className="ti ti-world"></i>World only
          </button>
        )}
        {worldId&&<button className="btn" style={{flex:1,justifyContent:'center'}} onClick={()=>roll(GLOBAL_PLOT_ARCHETYPES,'Global')}>
          <i className="ti ti-books"></i>Global only

      {result&&(
        <div style={{background:'var(--bg3)',border:'1px solid var(--accent2)',borderRadius:'var(--r)',padding:12}}>
          <div style={{fontSize:9,color:'var(--accent)',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:4}}>{source}</div>
          <div style={{fontSize:14,fontWeight:600,color:'var(--text)',marginBottom:4}}>{result}</div>

        </div>

      {worldId&&(
