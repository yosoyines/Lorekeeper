  );
}


function LorebookEntryTab({charData, data, update, updChar}) {
  const world = data.worlds.find(w => w.id === charData.world_id);
  const worldTemplates = (data.lorebook_templates||[]).filter(t => t.world_id === charData.world_id);

  // Get or init entry text: use saved, or generate from template
  const fillPlaceholders = (text) => {
    const charName = (charData.display_name||charData.name||'').toUpperCase();
    return (text||'')
      .replace(/\{\{CHARACTER NAME\}\}/g, charName)
      .replace(/\{\{CHAR\}\}/g, charData.display_name||charData.name||'')
      .replace(/\{\{char\}\}/g, charData.display_name||charData.name||'')
      .replace(/\{\{name\}\}/g, charData.display_name||charData.name||'');
  };
  const [entryText, setEntryText] = useState(() => {
    if(charData.lorebook_entry_text) return charData.lorebook_entry_text;
    if(worldTemplates.length > 0) return fillPlaceholders(worldTemplates[0].template_text);
    return '';
  });
  const [entryTitle, setEntryTitle] = useState(() => {
    if(charData.lorebook_entry_title) return charData.lorebook_entry_title;
    if(worldTemplates.length > 0) return fillPlaceholders(worldTemplates[0].title_template||charData.display_name||charData.name||'');
    return charData.display_name||charData.name||'';
  });
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState('');
  const [selectedTemplateId, setSelectedTemplateId] = useState(worldTemplates[0]?.id||'');

  if(!world) return <div className="cd-no-world">Assign this character to a world first to use lorebook entry templates.</div>;
  if(worldTemplates.length === 0) return (
    <div className="cd-no-tpl">
      <div className="cd-sub" style={{marginBottom:12}}>No lorebook templates set up for <strong style={{color:'var(--text)'}}>{world.name}</strong>.</div>
      <div className="cd-sub12">Go to <strong style={{color:'var(--text)'}}>World Info → Lorebook Templates</strong> to create one.</div>
    </div>
  );

  const applyTemplate = () => {
    const tpl = (data.lorebook_templates||[]).find(t=>t.id===selectedTemplateId);
    if(!tpl) return;
    setEntryText(fillPlaceholders(tpl.template_text));
    setEntryTitle(fillPlaceholders(tpl.title_template||charData.display_name||charData.name||''));
  };

  const saveToLorebook = () => {
    const tpl = (data.lorebook_templates||[]).find(t=>t.id===selectedTemplateId);
    if(!tpl?.lorebook_id) { setMsg('No lorebook linked to this template.'); return; }
    setSaving(true);
    update(d => {
      const lb = d.lorebooks.find(l => l.id === tpl.lorebook_id);
      if(!lb) { setMsg('Lorebook not found.'); setSaving(false); return; }
      if(!lb.content) lb.content = [];
      const existing = lb.content.find(ch => ch.char_id === charData.id);
      if(existing) {
        existing.text = entryText;
        existing.title = entryTitle;
      } else {
        lb.content.push({ id: Math.random().toString(36).slice(2), title: entryTitle, text: entryText, char_id: charData.id });
      }
      lb.updated_at = new Date().toISOString();
    });
    updChar(c => { c.lorebook_entry_text = entryText; c.lorebook_entry_title = entryTitle; });
    setSaving(false);
    setMsg('✓ Saved to lorebook');
    setTimeout(() => setMsg(''), 3000);
  };

  const tpl = (data.lorebook_templates||[]).find(t=>t.id===selectedTemplateId);
  const targetLorebook = tpl ? data.lorebooks.find(l=>l.id===tpl.lorebook_id) : null;

  return (
    <div className="cd-col12">
      {worldTemplates.length > 1 && (
        <div className="field-block">
          <label>Template</label>
          <select value={selectedTemplateId} onChange={e=>setSelectedTemplateId(e.target.value)} style={CS.templateSelect}>
            {worldTemplates.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
          </select>
        </div>
      )}
      {(()=>{
        const [showHelp,setShowHelp]=useState(false);
        return <div>
          <div className="cd-lore-entry-hdr">
            <span className="cd-world-lbl" style={{flex:1,marginBottom:0}}>Lorebook Entry</span>
            <button onClick={()=>setShowHelp(h=>!h)} style={CS.helpBtn} title="How does this work?">?</button>
          </div>
          {showHelp&&<div style={CS.helpBox}>
            <strong style={{color:'var(--text)',display:'block',marginBottom:6}}>How lorebook entries work:</strong>
            1. Set up a template in <strong style={{color:'var(--text)'}}>World Info → Lorebook Templates</strong><br/>
            2. Edit the chapter title and body below<br/>
            3. Click <strong style={{color:'var(--text)'}}>Save to Lorebook</strong> — creates or updates a chapter in the linked lorebook<br/>
            4. Click <strong style={{color:'var(--text)'}}>Re-apply template</strong> to reset the content from the template (fills in the character name)<br/>
            <span style={{fontSize:11,marginTop:4,display:'block',color:'var(--text3)'}}>The chapter is matched by character ID, so renaming the character won't create a duplicate.</span>
          </div>}
        </div>;
      })()}
      <div style={{display:'flex',gap:8,alignItems:'center',padding:'8px 12px',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--r)',fontSize:12}}>
        <i className="ti ti-book" style={{color:'var(--accent)',fontSize:14}}></i>
        <span style={{color:'var(--text3)'}}>Saves to:</span>
        <span style={{color:'var(--text)',fontWeight:500}}>{targetLorebook?.name||<span style={{color:'var(--red)'}}>No lorebook linked</span>}</span>
        {targetLorebook&&<span style={{color:'var(--text3)',marginLeft:'auto',fontSize:11}}>{(targetLorebook.content||[]).find(ch=>ch.char_id===charData.id)?'✓ entry exists':'new entry'}</span>}
      </div>
      <div className="cd-reapply-row">
        <button className="btn" style={{fontSize:11}} onClick={applyTemplate}><i className="ti ti-refresh"></i>Re-apply template</button>
        <span className="cd-sub" style={{alignSelf:'center'}}>resets title and body from template</span>
      </div>
      <div className="field-block" style={{marginBottom:8}}>
        <label>Chapter title</label>
        <input value={entryTitle} onChange={e=>setEntryTitle(e.target.value)} style={CS.titleInp} placeholder="e.g. GABRIEL OLLARSON | BUTTERFLY STROKE | CAPTAIN"/>
      </div>
      <textarea value={entryText} onChange={e=>setEntryText(e.target.value)} style={CS.loreTextarea} placeholder="Your lorebook entry content…"/>
      <div className="cd-save-row">
        <button className="btn primary" style={{fontSize:12}} onClick={saveToLorebook} disabled={saving||!targetLorebook}>
          <i className="ti ti-device-floppy"></i>{saving?'Saving…':'Save to Lorebook'}
        </button>
        {msg&&<span style={{fontSize:12,color:'var(--green)'}}>{msg}</span>}
      </div>
    </div>
  );
}

function LoreItemRestoreCard({lorebook, update}) {
  const [pasteText, setPasteText] = React.useState('');
  const [errors, setErrors] = React.useState([]);
  const [dropActive, setDropActive] = React.useState(false);
  const loreFileRef = React.useRef(null);

  const validateLore = (obj) => {
    const errs = [];
    if(typeof obj.name !== 'string' || !obj.name.trim()) errs.push('name: expected non-empty string');
    if(!Array.isArray(obj.content)) errs.push('content: expected array of chapters');
    return errs;
  };

  const handleLoreText = (text) => {
    setPasteText(text);
    if(!text.trim()) { setErrors([]); return; }
    try { const obj = JSON.parse(text); setErrors(validateLore(obj)); }
    catch(e) { setErrors(['Invalid JSON: ' + e.message]); }
  };

  const handleLoreFileDrop = (e) => {
    e.preventDefault(); setDropActive(false);
    const file = e.dataTransfer.files[0]; if(!file) return;
    const r = new FileReader(); r.onload = (ev) => handleLoreText(ev.target.result); r.readAsText(file);
  };

  const handleLoreFileSelect = (e) => {
    const file = e.target.files[0]; if(!file) return;
    const r = new FileReader(); r.onload = (ev) => handleLoreText(ev.target.result); r.readAsText(file);
    e.target.value = '';
  };

  const handleLorePaste = async () => {
    try { const t = await navigator.clipboard.readText(); handleLoreText(t); } catch(e) {}
  };

  const handleLoreBackup = () => {
    const {world_id,lorebook_filename,image_data,image_relpath,collaboration_type,status,...rest} = lorebook;
    const safe = {...rest, selected_chapter_index: lorebook.selected_chapter_index||0, collaboration_type: lorebook.access_level === 'public' ? 'public' : 'private'};
    window.lorekeeper.exportFile({defaultName:(lorebook.name||'lorebook').replace(/[^a-zA-Z0-9_-]/g,'_')+'-lorebook.json', content:JSON.stringify(safe,null,2), folder:'Lorebooks'});
  };

  const doLoreRestore = () => {
    try {
      const obj = JSON.parse(pasteText);
      update(d => {
        const lb = d.lorebooks.find(x => x.id === lorebook.id);
        if(!lb) return;
        if(obj.name) lb.name = obj.name;
        if(obj.short_description !== undefined) lb.short_description = obj.short_description;
        if(Array.isArray(obj.content)) lb.content = obj.content;
        if(Array.isArray(obj.tags)) lb.tags = obj.tags;
        if(Array.isArray(obj.fandom_tags)) lb.fandom_tags = obj.fandom_tags;
        if(obj.nsfw !== undefined) lb.nsfw = obj.nsfw;
        if(obj.very_nsfw !== undefined) lb.very_nsfw = obj.very_nsfw;
        if(obj.image_id) lb.image_id = obj.image_id;
        if(obj.access_level) lb.access_level = obj.access_level;
        if(obj.definition_protection) lb.definition_protection = obj.definition_protection;
        if(obj.hide_on_owner_profile !== undefined) lb.hide_on_owner_profile = obj.hide_on_owner_profile;
        lb.updated_at = new Date().toISOString();
      });
      setPasteText(''); setErrors([]);
    } catch(e) { setErrors(['Restore failed: ' + e.message]); }
  };

  const loreCanRestore = pasteText.trim() && errors.length === 0;

  return (
    <div className="export-card">
      <div className="export-card-title">Backup / Restore</div>
      <p className="export-card-desc">Save a platform-format backup or restore from a pasted or dropped JSON. Restore keeps world, auto-save filename, and all app-only data.</p>
      <div style={{display:'flex',gap:8,marginBottom:12}}>
        <button className="btn" onClick={handleLoreBackup}><i className="ti ti-database-export"></i>Backup Lore Book</button>
        <button className="btn" onClick={()=>loreFileRef.current&&loreFileRef.current.click()}><i className="ti ti-database-import"></i>Restore Lore Book</button>
        <input ref={loreFileRef} type="file" accept=".json" style={{display:'none'}} onChange={handleLoreFileSelect}/>
      </div>
      <div style={{marginBottom:8}}>
        <div style={CS.pasteLblRow}>
          <span style={CS.pasteLabel}>Paste Lore Book Backup:</span>
          <button className="btn" style={{padding:'2px 8px',fontSize:11}} onClick={handleLorePaste}><i className="ti ti-clipboard"></i>Paste</button>
        </div>
        <textarea value={pasteText} onChange={e=>handleLoreText(e.target.value)} style={CS.pasteArea} placeholder="{...paste lorebook JSON here...}"/>
      </div>
      <div onClick={()=>loreFileRef.current&&loreFileRef.current.click()}
        onDragOver={e=>{e.preventDefault();setDropActive(true);}} onDragLeave={()=>setDropActive(false)} onDrop={handleLoreFileDrop}
        className={"cd-restore-drop "+(dropActive?'active':'idle')}>
        {'Drag & drop a JSON file here, or click to select a file'}
      </div>
      {errors.length>0&&<div style={{marginBottom:10}}>
        <div style={CS.errHdr}>Validation errors:</div>
        {errors.map((err,ei)=><div key={ei} style={CS.errItem}>{'• '+err}</div>)}
      </div>}
      <div className="cd-restore-footer">
        <button className="btn primary" disabled={!loreCanRestore} onClick={doLoreRestore}><i className="ti ti-restore"></i>Restore Data</button>
      </div>
    </div>
  );
}

        {col.collection_filename?<div className="field-hint">{["I:","Lorekeeper","Collections",col.collection_filename].join(BS)}</div>:null}
      </div>
      <CollectionCharPicker coll={col} data={data} update={update} setSelectedChar={openChar}/>
      <div style={{paddingTop:8,borderTop:'1px solid var(--border)'}}>
        <button className="btn danger" onClick={()=>setModal({type:'confirm-delete-coll',coll:col})}><i className="ti ti-trash"></i>Delete Collection</button>
      </div>
    </div>
  );
}


function CollItemRestoreCard({coll, update}) {
  const [collPasteText, setCollPasteText] = React.useState('');
  const [collErrors, setCollErrors] = React.useState([]);
  const [collDropActive, setCollDropActive] = React.useState(false);
  const collFileRef = React.useRef(null);

  const validateColl = (obj) => {
    const errs = [];
    if(typeof obj.name !== 'string' || !obj.name.trim()) errs.push('name: expected non-empty string');
    return errs;
  };

  const handleCollText = (text) => {
    setCollPasteText(text);
    if(!text.trim()) { setCollErrors([]); return; }
    try { const obj = JSON.parse(text); setCollErrors(validateColl(obj)); }
    catch(e) { setCollErrors(['Invalid JSON: ' + e.message]); }
  };

  const handleCollFileDrop = (e) => {
    e.preventDefault(); setCollDropActive(false);
    const file = e.dataTransfer.files[0]; if(!file) return;
    const r = new FileReader(); r.onload = (ev) => handleCollText(ev.target.result); r.readAsText(file);
  };

  const handleCollFileSelect = (e) => {
    const file = e.target.files[0]; if(!file) return;
    const r = new FileReader(); r.onload = (ev) => handleCollText(ev.target.result); r.readAsText(file);
    e.target.value = '';
  };

  const handleCollPaste = async () => {
    try { const t = await navigator.clipboard.readText(); handleCollText(t); } catch(e) {}
  };

  const handleCollBackup = () => {
    const {world_id,collection_filename,image_data,image_relpath,...rest} = coll;
    const safe = {...rest, description: rest.definition||'', lorebooks: coll.lorebooks||[]};
    window.lorekeeper.exportFile({defaultName:(coll.name||'collection').replace(/[^a-zA-Z0-9_-]/g,'_')+'-collection.json', content:JSON.stringify(safe,null,2), folder:'Collections'});
  };

  const doCollRestore = () => {
    try {
      const obj = JSON.parse(collPasteText);
      update(d => {
        const col = d.collections.find(x => x.id === coll.id);
        if(!col) return;
        if(obj.name) col.name = obj.name;
        if(obj.description !== undefined) col.definition = obj.description;
        if(obj.definition !== undefined) col.definition = obj.definition;
        if(Array.isArray(obj.tags)) col.tags = obj.tags;
        if(Array.isArray(obj.fandom_tags)) col.fandom_tags = obj.fandom_tags;
        if(obj.access_level) col.access_level = obj.access_level;
        if(obj.image && obj.image.id) { if(!col.image) col.image={}; col.image.id = obj.image.id; }
        if(Array.isArray(obj.companions)) col.companions = obj.companions;
        if(obj.very_nsfw !== undefined) col.very_nsfw = obj.very_nsfw;
        if(obj.hide_on_owner_profile !== undefined) col.hide_on_owner_profile = obj.hide_on_owner_profile;
        col.updated_at = new Date().toISOString();
      });
      setCollPasteText(''); setCollErrors([]);
    } catch(e) { setCollErrors(['Restore failed: ' + e.message]); }
  };

  const collCanRestore = collPasteText.trim() && collErrors.length === 0;

  return (
    <div className="export-card">
      <div className="export-card-title">Backup / Restore</div>
      <p className="export-card-desc">Save a platform-format backup or restore from a pasted or dropped JSON. Restore keeps world, auto-save filename, and all app-only data.</p>
      <div style={{display:'flex',gap:8,marginBottom:12}}>
        <button className="btn" onClick={handleCollBackup}><i className="ti ti-database-export"></i>Backup Collection</button>
        <button className="btn" onClick={()=>collFileRef.current&&collFileRef.current.click()}><i className="ti ti-database-import"></i>Restore Collection</button>
        <input ref={collFileRef} type="file" accept=".json" style={{display:'none'}} onChange={handleCollFileSelect}/>
      </div>
      <div style={{marginBottom:8}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}}>
          <span style={{fontSize:12,color:'var(--text3)'}}>Paste Collection Backup:</span>
          <button className="btn" style={{padding:'2px 8px',fontSize:11}} onClick={handleCollPaste}><i className="ti ti-clipboard"></i>Paste</button>
        </div>
        <textarea value={collPasteText} onChange={e=>handleCollText(e.target.value)}
          style={{width:'100%',minHeight:120,background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',padding:'8px',borderRadius:'var(--r)',fontSize:11,fontFamily:'monospace',outline:'none',resize:'vertical'}}
          placeholder="{...paste collection JSON here...}"/>
      </div>
      <div onClick={()=>collFileRef.current&&collFileRef.current.click()}
        onDragOver={e=>{e.preventDefault();setCollDropActive(true);}} onDragLeave={()=>setCollDropActive(false)} onDrop={handleCollFileDrop}
        style={{border:'2px dashed '+(collDropActive?'var(--accent)':'var(--border2)'),borderRadius:'var(--r)',padding:'16px',textAlign:'center',fontSize:12,color:'var(--text3)',marginBottom:12,background:collDropActive?'var(--accent-dim)':'transparent',transition:'all 0.15s',cursor:'pointer'}}>
        {'Drag & drop a JSON file here, or click to select a file'}
      </div>
      {collErrors.length>0&&<div style={{marginBottom:10}}>
        <div style={{fontSize:12,fontWeight:600,color:'var(--red)',marginBottom:4}}>Validation errors:</div>
        {collErrors.map((err,ei)=><div key={ei} style={{fontSize:11,color:'var(--red)',paddingLeft:8}}>{'• '+err}</div>)}
      </div>}
      <div style={{display:'flex',justifyContent:'flex-end'}}>
        <button className="btn primary" disabled={!collCanRestore} onClick={doCollRestore}><i className="ti ti-restore"></i>Restore Data</button>
      </div>
    </div>
  );
}

function CharExportTab({charData, data, exportChar, importJSON}) {
  const buildMd = () => {
    const c = charData;
    const lines = [];
    lines.push("# " + (c.display_name||c.name||"Character"));
    if(c.name && c.display_name && c.name !== c.display_name) lines.push("**Name:** " + c.name);
    lines.push("");
    if(c.short_description) { lines.push("## Short Description"); lines.push(c.short_description); lines.push(""); }
    if(c.full_description) { lines.push("## Full Description"); lines.push(c.full_description); lines.push(""); }
    if(c.card && c.card.trim() && c.card.trim() !== " ") { lines.push("## Character Card"); lines.push(c.card); lines.push(""); }
    if(c.advanced_prompt) { lines.push("## Advanced Prompt"); lines.push(c.advanced_prompt); lines.push(""); }
    if(c.formatting_instructions) { lines.push("## Formatting Instructions"); lines.push(c.formatting_instructions); lines.push(""); }
    if((c.starting_scenarios||[]).length > 0) {
      lines.push("## Starting Scenarios");
      c.starting_scenarios.forEach((s,i) => {
        lines.push("### " + (s.title||("Scenario " + (i+1))));
        if(s.message) lines.push(s.message);
        lines.push("");
      });
    }
    if((c.tags||[]).length > 0) { lines.push("## Tags"); lines.push(c.tags.join(", ")); lines.push(""); }
    return lines.join("\n");
  };
  const exportMd = () => {
    const md = buildMd();
    const safeName = (charData.display_name||charData.name||"character").replace(/[^a-zA-Z0-9_-]/g,"_");
    window.lorekeeper.exportFile({defaultName: safeName + "-character.md", content: md, folder:charData.companion_folder?"Companions/"+charData.companion_folder:"Companions"});
  };
  const [mdPreview, setMdPreview] = React.useState(false);
  const md = buildMd();
  return (
    <div className="export-panel">
      {importJSON?<div className="export-card">
        <div className="export-card-title">Update from JSON</div>
        <p className="export-card-desc">Re-import this character's JSON to overwrite its fields (keeps world, status, schedule, and portrait — app-specific data isn't touched).</p>
        <button className="btn" onClick={importJSON}><i className="ti ti-refresh"></i>Update from JSON</button>
      </div>:null}
      <div className="export-card">
        <div className="export-card-title">Export to JSON</div>
        <p className="export-card-desc">Platform-ready JSON stripped of all app-only fields. Upload directly to Saucepan.</p>
        <button className="btn primary" onClick={()=>exportChar(charData)}><i className="ti ti-download"></i>Export JSON</button>
      </div>
      <div className="export-card">
        <div className="export-card-title">Export to Markdown</div>
        <p className="export-card-desc">Display name, short + full description, character card, advanced prompt, formatting instructions, scenarios, tags.</p>
        <div className="export-card-meta">
          {[
            [charData.short_description,"short desc"],
            [charData.full_description,"full desc"],
            [charData.card&&charData.card.trim()&&charData.card.trim()!==" ","card"],
            [charData.advanced_prompt,"advanced prompt"],
            [(charData.starting_scenarios||[]).length>0,"scenarios"]
          ].map(([ok,label])=>(
            <span key={label} className={"export-field-"+(ok?"ok":"missing")}>{ok?"✓":"–"} {label}</span>
          ))}
        </div>
        <div className="export-row">
          <button className="btn primary" onClick={exportMd}><i className="ti ti-file-text"></i>Export MD</button>
          <button className="btn" onClick={()=>setMdPreview(p=>!p)}><i className={"ti "+(mdPreview?"ti-eye-off":"ti-eye")}></i>{mdPreview?"Hide":"Preview"}</button>
        </div>
        {mdPreview?<pre className="md-preview">{md}</pre>:null}
      </div>
    </div>
  );
}

function RelPortrait({id, src, r, onMouseDown}) {
  const [resolved, setResolved] = React.useState(null);
  React.useEffect(() => {
    if (!src) { setResolved(null); return; }
    if (src.startsWith('data:')) { setResolved(src); return; }
    window.lorekeeper.readImagePath(src).then(b64 => setResolved(b64||null)).catch(() => setResolved(null));
  }, [src]);
  if (!resolved) return <text x={r} y={r+6} textAnchor="middle" fontSize={22} fill="var(--text3)" style={{pointerEvents:'none',userSelect:'none'}}>👤</text>;
  return (
    <image href={resolved} x={0} y={0} width={r*2} height={r*2} clipPath={"url(#clip-"+id+")"} preserveAspectRatio="xMidYMid slice" onMouseDown={onMouseDown}/>
  );
}

function RelationshipsPage({data, update, initialWorld}) {
  const worlds = data.worlds || [];
  const [worldId, setWorldId] = useState(initialWorld || worlds[0]?.id || null);
  const [positions, setPositions] = useState({});
  const [connecting, setConnecting] = useState(null);
  const [labelInput, setLabelInput] = useState(null);
  const [labelText, setLabelText] = useState('');
  const [editEdge, setEditEdge] = useState(null);
  const [editLabelText, setEditLabelText] = useState('');
  const [dragging, setDragging] = useState(null); // node drag only
  // Draggable edit popup
  const [popupPos, setPopupPos] = useState({x: null, y: null});
  const [popupDrag, setPopupDrag] = useState(null);
  const svgRef = React.useRef();
  const posRef = React.useRef({}); // mirrors positions state — avoids stale closure in mouseUp

  // Sync initialWorld prop → worldId state (prop changes when user switches worlds in sidebar)
  React.useEffect(() => { if(initialWorld && initialWorld !== worldId) setWorldId(initialWorld); }, [initialWorld]);

  const worldCollIds = worldId ? data.collections.filter(col=>col.world_id===worldId).map(col=>col.id) : [];
  const worldCollCompanions = worldId ? data.collections.filter(col=>col.world_id===worldId).flatMap(col=>col.companions||[]) : [];
  const worldChars = (data.characters || []).filter(c => {
    if (!worldId) return false;
    if (c.world_id === worldId) return true;
    return (c.collections||[]).some(cid=>worldCollIds.includes(cid)) || worldCollCompanions.includes(c.id);
  });
  const rels = (data.relationships || []).filter(r => r.worldId === worldId);

  React.useEffect(() => {
    setConnecting(null);
    setLabelInput(null);
    setEditEdge(null);
    const collIds = (data.collections||[]).filter(col=>col.world_id===worldId).map(col=>col.id);
    const collCompanions = (data.collections||[]).filter(col=>col.world_id===worldId).flatMap(col=>col.companions||[]);
    const chars = (data.characters||[]).filter(c => {
      if (c.world_id === worldId) return true;
      return (c.collections||[]).some(cid=>collIds.includes(cid)) || collCompanions.includes(c.id);
    });
    const cols = Math.max(1, Math.ceil(Math.sqrt(chars.length)));
    const saved = (data.map_positions && data.map_positions[worldId]) || {};
    const next = {};
    chars.forEach((c, i) => {
      // Use saved position if available, otherwise place in grid
      next[c.id] = saved[c.id] || {x: 120 + (i % cols) * 170, y: 100 + Math.floor(i / cols) * 170};
    });
    setPositions(next);
    posRef.current = next;
  }, [worldId, data.characters]);

  const getSvgPoint = (e) => {
    const svg = svgRef.current;
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  };

  const getPos = (id) => positions[id] || {x: 120, y: 120};

  const onNodeMouseDown = (e, id) => {
    if (connecting) {
      if (connecting !== id) { setLabelInput({charA: connecting, charB: id}); setLabelText(''); }
      setConnecting(null);
      return;
    }
    e.preventDefault();
    const svgP = getSvgPoint(e);
    const pos = getPos(id);
    setDragging({id, ox: svgP.x - pos.x, oy: svgP.y - pos.y});
  };

  const onSvgMouseMove = (e) => {
    if (!dragging) return;
    const svgP = getSvgPoint(e);
    const newPos = {x: svgP.x - dragging.ox, y: svgP.y - dragging.oy};
    posRef.current = {...posRef.current, [dragging.id]: newPos};
    setPositions(prev => ({...prev, [dragging.id]: newPos}));
  };

  const onSvgMouseUp = () => {
    if (dragging) {
      const finalPos = posRef.current;
      update(d => {
        if (!d.map_positions) d.map_positions = {};
        d.map_positions[worldId] = {...finalPos};
      });
    }
    setDragging(null);
  };

  // Popup drag handlers (on the DOM, not SVG)
  const popupRef = React.useRef();
  const onPopupMouseDown = (e) => {
    e.preventDefault();
    const rect = popupRef.current ? popupRef.current.getBoundingClientRect() : {left:0,top:0};
    setPopupPos({x: rect.left, y: rect.top});
    setPopupDrag({ox: e.clientX - rect.left, oy: e.clientY - rect.top});
  };
  React.useEffect(() => {
    if (!popupDrag) return;
    const onMove = (e) => setPopupPos({x: e.clientX - popupDrag.ox, y: e.clientY - popupDrag.oy});
    const onUp = () => setPopupDrag(null);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    return () => { window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onUp); };
  }, [popupDrag]);

  const openEdge = (id, label) => {
    setEditEdge(id);
    setEditLabelText(label);
    setPopupPos({x: null, y: null}); // reset to default position
  };

  const saveRelationship = () => {
    if (!labelText.trim() || !labelInput) return;
    update(d => {
      if (!d.relationships) d.relationships = [];
      d.relationships.push({id: uuid(), worldId, charA: labelInput.charA, charB: labelInput.charB, label: labelText.trim()});
    });
    setLabelInput(null); setLabelText('');
  };

  const saveEditLabel = () => {
    if (!editLabelText.trim()) return;
    update(d => { const r = (d.relationships||[]).find(x=>x.id===editEdge); if(r) r.label = editLabelText.trim(); });
    setEditEdge(null);
  };

  const deleteRel = (id) => {
    update(d => { d.relationships = (d.relationships||[]).filter(r=>r.id!==id); });
    setEditEdge(null);
  };

  const NODE_R = 36;

  // Popup positioning
  const popupStyle = {
    position: 'fixed',
    background: 'var(--bg2)',
    border: '1px solid var(--border)',
    borderRadius: 'var(--rl)',
    padding: '10px 14px',
    display: 'flex',
    alignItems: 'center',
    gap: 10,
    zIndex: 100,
    boxShadow: '0 4px 16px rgba(0,0,0,0.3)',
    cursor: 'default',
    userSelect: 'none',
  };
  if (popupPos.x !== null) {
    popupStyle.left = popupPos.x;
    popupStyle.top = popupPos.y;
  } else {
    popupStyle.bottom = 24;
    popupStyle.left = '50%';
    popupStyle.transform = 'translateX(-50%)';
  }

  return (
    <div className="rel-page">
      <div className="rel-toolbar">
        <select value={worldId||''} onChange={e=>setWorldId(e.target.value||null)} className="rel-world-select">
          <option value="">— Pick a world —</option>
          {worlds.map(w=><option key={w.id} value={w.id}>{w.emoji?w.emoji+' ':''}{w.name}</option>)}
        </select>
        {connecting&&<span className="rel-hint">Click another character to connect — click same to cancel</span>}
        {!connecting&&worldChars.length>0&&<span className="rel-hint">Drag nodes · Click + connect to draw a relationship · Click label to edit</span>}
        {worldId&&<span className="rel-hint" style={{marginLeft:'auto',opacity:0.5}}>{worldChars.length} characters</span>}
        {worldId&&worldChars.length>0&&<button className="btn" style={{fontSize:11,padding:'3px 8px'}} onClick={()=>{const cIds=(data.collections||[]).filter(col=>col.world_id===worldId).map(col=>col.id);const cComp=(data.collections||[]).filter(col=>col.world_id===worldId).flatMap(col=>col.companions||[]);const chars=(data.characters||[]).filter(c=>{if(c.world_id===worldId)return true;return(c.collections||[]).some(cid=>cIds.includes(cid))||cComp.includes(c.id);});const cols=Math.max(1,Math.ceil(Math.sqrt(chars.length)));const next={};chars.forEach((c,i)=>{next[c.id]={x:120+(i%cols)*170,y:100+Math.floor(i/cols)*170};});setPositions(next);}}>Reset layout</button>}
        {rels.length>0&&<button className="btn danger" style={{fontSize:11,padding:"3px 8px"}} onClick={()=>{if(window.confirm("Clear all relationships for this world?"))update(d=>{d.relationships=(d.relationships||[]).filter(r=>r.worldId!==worldId);});}}>Clear all</button>}
      </div>

      {worldId&&worldChars.length===0&&<p className="text-muted" style={{padding:24}}>No characters in this world yet.</p>}

      {worldId&&worldChars.length>0&&(
        <svg ref={svgRef} className="rel-canvas" onMouseMove={onSvgMouseMove} onMouseUp={onSvgMouseUp} onMouseLeave={onSvgMouseUp}>
          <defs>
            {worldChars.map(c=>(
              <clipPath key={'clip-'+c.id} id={'clip-'+c.id}>
                <circle cx={NODE_R} cy={NODE_R} r={NODE_R}/>
              </clipPath>
            ))}
          </defs>

          {rels.map(r => {
            const a = getPos(r.charA), b = getPos(r.charB);
            const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
            const dx = b.x-a.x, dy = b.y-a.y;
            const len = Math.sqrt(dx*dx+dy*dy)||1;
            const ax = a.x+(dx/len)*NODE_R, ay = a.y+(dy/len)*NODE_R;
            const bx = b.x-(dx/len)*NODE_R, by = b.y-(dy/len)*NODE_R;
            const isSelected = editEdge===r.id;
            const labelW = Math.max(60, r.label.length*7+16);
            return (
              <g key={r.id} onClick={()=>openEdge(r.id, r.label)} style={{cursor:'pointer'}}>
                <line x1={ax} y1={ay} x2={bx} y2={by} stroke="transparent" strokeWidth={12}/>
                <line x1={ax} y1={ay} x2={bx} y2={by} stroke={isSelected?'var(--accent)':'var(--text3)'} strokeWidth={isSelected?2.5:1.5} strokeDasharray={isSelected?'':'4 3'} style={{pointerEvents:'none'}}/>
                <rect x={mx-labelW/2} y={my-10} width={labelW} height={20} rx={4} fill="var(--bg2)" stroke={isSelected?'var(--accent)':'var(--border)'} strokeWidth={1}/>
                <text x={mx} y={my+5} textAnchor="middle" fontSize={10} fill={isSelected?'var(--accent)':'var(--text2)'} style={{pointerEvents:'none',userSelect:'none'}}>{r.label}</text>
              </g>
            );
          })}

          {worldChars.map(c => {
            const pos = getPos(c.id);
            const isConnecting = connecting===c.id;
            const imgSrc = c.image?(c.image.data||c.image.relPath||null):null;
            return (
              <g key={c.id} transform={"translate("+(pos.x-NODE_R)+","+(pos.y-NODE_R)+")"} style={{cursor:dragging?.id===c.id?'grabbing':'grab'}}>
                <circle cx={NODE_R} cy={NODE_R} r={NODE_R+2} fill={isConnecting?'var(--accent)':'var(--bg2)'} stroke={isConnecting?'var(--accent)':'var(--border)'} strokeWidth={isConnecting?3:1.5} onMouseDown={e=>onNodeMouseDown(e,c.id)}/>
                <RelPortrait id={c.id} src={imgSrc} r={NODE_R} onMouseDown={e=>onNodeMouseDown(e,c.id)}/>
                <text x={NODE_R} y={NODE_R*2+14} textAnchor="middle" fontSize={11} fill="var(--text)" fontWeight="600" style={{pointerEvents:'none',userSelect:'none'}}>{(c.name||'').slice(0,18)}</text>
                <text x={NODE_R} y={NODE_R*2+26} textAnchor="middle" fontSize={9} fill={isConnecting?"var(--accent)":"var(--text3)"} style={{userSelect:'none',cursor:'pointer'}} onClick={e=>{e.stopPropagation();setConnecting(connecting===c.id?null:c.id);}}>
                  {isConnecting?'cancel':'+ connect'}
                </text>
              </g>
            );
          })}
        </svg>
      )}

      {editEdge&&(
        <div ref={popupRef} style={popupStyle}>
          <div onMouseDown={onPopupMouseDown} style={{cursor:'grab',padding:'0 4px',color:'var(--text3)',fontSize:14}}>⠿</div>
          <input className="rel-label-input" style={{width:140,padding:'4px 8px',fontSize:12}} value={editLabelText} onChange={e=>setEditLabelText(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')saveEditLabel();if(e.key==='Escape')setEditEdge(null);}}/>
          <button className="btn primary" style={{fontSize:11,padding:'3px 8px'}} onClick={saveEditLabel} disabled={!editLabelText.trim()}><i className="ti ti-check"></i>Save</button>
          <button className="btn danger" style={{fontSize:11,padding:'3px 8px'}} onClick={()=>deleteRel(editEdge)}><i className="ti ti-trash"></i></button>
          <button className="btn" style={{fontSize:11,padding:'3px 8px'}} onClick={()=>setEditEdge(null)}>✕</button>
        </div>
      )}

      {labelInput&&(
        <div className="rel-label-modal">
          <div className="rel-label-box">
            <div style={{fontSize:13,fontWeight:600,marginBottom:8,color:'var(--text)'}}>
              {(data.characters.find(c=>c.id===labelInput.charA)?.name||'?')}
              {' — '}
              {(data.characters.find(c=>c.id===labelInput.charB)?.name||'?')}
            </div>
            <input className="rel-label-input" value={labelText} onChange={e=>setLabelText(e.target.value)} placeholder="e.g. rivals, lovers, siblings..." onKeyDown={e=>{if(e.key==='Enter')saveRelationship();if(e.key==='Escape'){setLabelInput(null);setLabelText('');}}} autoFocus/>
            <div style={{display:'flex',gap:8,marginTop:10}}>
              <button className="btn primary" onClick={saveRelationship} disabled={!labelText.trim()}><i className="ti ti-check"></i>Add</button>
              <button className="btn" onClick={()=>{setLabelInput(null);setLabelText('');}}>Cancel</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

  if(models === null) {

}

function ImageMigrationPanel({data, update}) {
  const [status, setStatus] = useState(null); // null | 'scanning' | 'scanned' | 'migrating' | 'done'
  const [report, setReport] = useState([]);
  const [migrated, setMigrated] = useState(0);
  const [cleanupResult, setCleanupResult] = useState(null);

  const rescanImages = async () => {
    setStatus('scanning');
    const [loreResults, collResults] = await Promise.all([
      window.lorekeeper.scanLorebooks(),
      window.lorekeeper.scanCollections(),
    ]);
    let count = 0;
    update(d => {
      for(const item of loreResults) {
        if(!item.imageRelPath) continue;
        const l = item.jsonData?.id && d.lorebooks.find(x => x.id === item.jsonData.id);
        if(l && !l.image_relpath) { l.image_relpath = item.imageRelPath; count++; }
      }
      for(const item of collResults) {
        if(!item.imageRelPath) continue;
        const c = item.jsonData?.id && d.collections.find(x => x.id === item.jsonData.id);
        if(c && !c.image_relpath) { c.image_relpath = item.imageRelPath; count++; }
      }
    });
    setStatus('rescan_done');
    setMigrated(count);
  };

  const scan = async () => {
    setStatus('scanning');
    const items = [];
    const checkItem = async (type, id, name, imageData, imageRelpath, filename, files) => {
      if(!imageData && !imageRelpath) return;
      if(imageRelpath) {
        const ok = await window.lorekeeper.readImagePath(imageRelpath).then(r=>!!r).catch(()=>false);
        if(ok && imageData) {
          items.push({type, id, name, status:'leftover_data', relpath:imageRelpath});
        } else {
          items.push({type, id, name, status: ok?'relpath_ok':'relpath_broken', relpath:imageRelpath});
        }
      } else if(imageData) {
        items.push({type, id, name, filename, files, status:'needs_migration'});
      }
    };
    // Same reasoning as the companion-folder scan below: check what's already sitting
    // in each type's folder so needs_migration items can link instead of duplicate-write.
    let byType = {lorebook:[], collection:[], world:[], persona:[]};
    try {
      const [loreFiles, collFiles, worldFiles, personaFiles] = await Promise.all([
        window.lorekeeper.listFolderImages('Lorebooks'),
        window.lorekeeper.listFolderImages('Collections'),
        window.lorekeeper.listFolderImages('Worlds'),
        window.lorekeeper.listFolderImages('Personas'),
      ]);
      byType = {lorebook:loreFiles||[], collection:collFiles||[], world:worldFiles||[], persona:personaFiles||[]};
    } catch(e) {}
    for(const l of data.lorebooks) await checkItem('lorebook', l.id, l.name, l.image_data, l.image_relpath, l.lorebook_filename, byType.lorebook);
    for(const c of data.collections) await checkItem('collection', c.id, c.name, c.image_data, c.image_relpath, c.collection_filename, byType.collection);
    for(const w of data.worlds) await checkItem('world', w.id, w.name, w.image, w.image_relpath, w.name.replace(/[^a-zA-Z0-9_-]/g,'_'), byType.world);
    for(const p of (data.personas||[])) await checkItem('persona', p.id, p.name, p.image?.data, p.image_relpath, p.name.replace(/[^a-zA-Z0-9_-]/g,'_'), byType.persona);
    // Portraits and main images are the bulk of the base64. Match them against files
    // already present in each companion folder so nothing gets written twice.
    let folderImages = {};
    try {
      const comps = await window.lorekeeper.scanCompanions();
      (comps||[]).forEach(f => { folderImages[f.folderName] = f.imageFiles || []; });
    } catch(e) { folderImages = {}; }
    for(const c of data.characters) {
      const files = c.companion_folder ? (folderImages[c.companion_folder] || []) : [];
      const safeCharName = (c.name||'image').replace(/[^a-zA-Z0-9_-]/g,'_');
      if(c.companion_profile_banner_image?.data) {
        if(c.companion_profile_banner_image?.relPath) {
          items.push({key:c.id+'-banner', type:'companion_banner', id:c.id, name:(c.display_name||c.name)+' (banner)', status:'leftover_data', relpath:c.companion_profile_banner_image.relPath});
        } else {
          items.push({key:c.id+'-banner', type:'companion_banner', id:c.id, name:(c.display_name||c.name)+' (banner)', filename:(c.companion_folder||safeCharName)+'_banner', status:'needs_migration'});
        }
      }
      if(c.image?.data) {
        if(c.image?.relPath) {
          items.push({key:c.id+'-image', type:'char_image', id:c.id, name:(c.display_name||c.name)+' — main image', status:'leftover_data', relpath:c.image.relPath});
        } else {
          // Exact matches only — guessing from leftover files picks the wrong picture when
          // portrait numbering has gaps. Anything unmatched is chosen by hand below.
          const m = files.find(f=>f.name===c.name)
                 || files.find(f=>f.name===safeCharName)
                 || files.find(f=>/profile[_-]?pic|main|cover/i.test(f.name));
          items.push({key:c.id+'-image', type:'char_image', id:c.id, name:(c.display_name||c.name)+' — main image', match:m?m.relPath:null, files:files, filename:safeCharName, status:'needs_migration'});
        }
      }
      (c.portraits||[]).forEach((p,idx)=>{
        if(p.data) {
          if(p.relPath) {
            items.push({key:c.id+'-p'+idx, type:'portrait', id:c.id, idx:idx, name:(c.display_name||c.name)+' — '+(p.name||('portrait '+(idx+1))), status:'leftover_data', relpath:p.relPath});
          } else {
            const m = files.find(f=>f.name===p.name);
            items.push({key:c.id+'-p'+idx, type:'portrait', id:c.id, idx:idx, name:(c.display_name||c.name)+' — '+(p.name||('portrait '+(idx+1))), match:m?m.relPath:null, files:files, filename:(p.name||('portrait'+(idx+1))).replace(/[^a-zA-Z0-9_-]/g,'_'), status:'needs_migration'});
          }
        }
      });
    }
    setReport(items);
    setStatus('scanned');
  };

  const setMatch = (key, relPath) => setReport(prev => prev.map(x => ((x.key||x.id)===key ? {...x, match: relPath||null} : x)));

  const migrate = async () => {
    setStatus('migrating');
    const folderMap = {lorebook:'Lorebooks', collection:'Collections', world:'Worlds', persona:'Personas'};
    const resolved = [];
    for(const item of report) {
      if(item.status !== 'needs_migration') continue;
      // Already sitting in the folder — link it instead of writing a duplicate.
      if(item.match) { resolved.push({item:item, relPath:item.match}); continue; }
      const basename = item.filename ? item.filename.replace(/\.json$/i,'') : item.name.replace(/[^a-zA-Z0-9_-]/g,'_').replace(/_+/g,'_').replace(/^_|_$/g,'');
      let base64 = null;
      let destFolder = folderMap[item.type]||'Misc';
      if(item.type==='lorebook') base64 = data.lorebooks.find(x=>x.id===item.id)?.image_data;
      else if(item.type==='collection') base64 = data.collections.find(x=>x.id===item.id)?.image_data;
      else if(item.type==='world') base64 = data.worlds.find(x=>x.id===item.id)?.image;
      else if(item.type==='persona') base64 = (data.personas||[]).find(x=>x.id===item.id)?.image?.data;
      else {
        const ch = data.characters.find(x=>x.id===item.id);
        destFolder = 'Companions/' + (ch?.companion_folder || basename);
        if(item.type==='companion_banner') base64 = ch?.companion_profile_banner_image?.data;
        else if(item.type==='char_image') base64 = ch?.image?.data;
        else if(item.type==='portrait') base64 = (ch?.portraits||[])[item.idx]?.data;
      }
      if(!base64) continue;
      const res = await window.lorekeeper.writeImageFromBase64({ base64, destFolder, filename: basename });
      if(res?.relPath) resolved.push({item:item, relPath:res.relPath});
    }
    // One state write for the whole batch — updating per image would deep-clone the
    // entire dataset once per portrait, which is the very cost this migration removes.
    const applyMigration = (d) => {
      resolved.forEach(r=>{
        const item = r.item, rel = r.relPath;
        if(item.type==='lorebook'){ const o=d.lorebooks.find(x=>x.id===item.id); if(o){o.image_relpath=rel;o.image_data=null;} }
        else if(item.type==='collection'){ const o=d.collections.find(x=>x.id===item.id); if(o){o.image_relpath=rel;o.image_data=null;} }
        else if(item.type==='world'){ const o=d.worlds.find(x=>x.id===item.id); if(o){o.image_relpath=rel;o.image=null;} }
        else if(item.type==='persona'){ const o=(d.personas||[]).find(x=>x.id===item.id); if(o){o.image_relpath=rel;if(o.image)o.image.data=null;} }
        else {
          const o=d.characters.find(x=>x.id===item.id);
          if(!o) return;
          if(item.type==='companion_banner') o.companion_profile_banner_image={...(o.companion_profile_banner_image||{}), data:null, relPath:rel};
          else if(item.type==='char_image'){ if(!o.image)o.image={}; o.image.relPath=rel; o.image.data=null; }
          else if(item.type==='portrait'){ const p=(o.portraits||[])[item.idx]; if(p){p.relPath=rel;p.data=null;} }
        }
      });
    };
    if(resolved.length) {
      update(applyMigration);
      // Same shrink-guard problem as the leftover cleanup — force this one through too.
      const nd = structuredClone(data);
      applyMigration(nd);
      await window.lorekeeper.saveDataAllowShrink(nd, 'migrate base64 to local files');
    }
    setMigrated(resolved.length);
    setStatus('done');
  };


  const cleanupLeftover = async () => {
    const items = report.filter(r=>r.status==='leftover_data');
    if(!items.length) return;
    const applyCleanup = (d) => {
      items.forEach(item=>{
        if(item.type==='lorebook'){ const o=d.lorebooks.find(x=>x.id===item.id); if(o) o.image_data=null; }
        else if(item.type==='collection'){ const o=d.collections.find(x=>x.id===item.id); if(o) o.image_data=null; }
        else if(item.type==='world'){ const o=d.worlds.find(x=>x.id===item.id); if(o) o.image=null; }
        else if(item.type==='persona'){ const o=(d.personas||[]).find(x=>x.id===item.id); if(o&&o.image) o.image.data=null; }
        else {
          const o=d.characters.find(x=>x.id===item.id);
          if(!o) return;
          if(item.type==='companion_banner' && o.companion_profile_banner_image) o.companion_profile_banner_image.data=null;
          else if(item.type==='char_image' && o.image) o.image.data=null;
          else if(item.type==='portrait') { const p=(o.portraits||[])[item.idx]; if(p) p.data=null; }
        }
      });
    };
    update(applyCleanup);
    // The ordinary autosave measures this write against the pre-cleanup file size and
    // refuses it as a suspicious shrink, so push it through the explicit path instead.
    const nd = structuredClone(data);
    applyCleanup(nd);
    const res = await window.lorekeeper.saveDataAllowShrink(nd, 'clear leftover base64');
    setCleanupResult(res && res.success ? {ok:true, count:items.length} : {ok:false, error:(res&&res.error)||'save failed'});
    setReport(prev => prev.map(r => r.status==='leftover_data' ? {...r, status:'relpath_ok'} : r));
  };

  const needsMigration = report.filter(r=>r.status==='needs_migration');
  const relpathOk = report.filter(r=>r.status==='relpath_ok');
  const relpathBroken = report.filter(r=>r.status==='relpath_broken');
  const leftoverData = report.filter(r=>r.status==='leftover_data');
  const linkCount = needsMigration.filter(r=>r.match).length;
  const writeCount = needsMigration.length - linkCount;
  const migrateLabel = buildMigrateLabel(linkCount, writeCount);
  const migrateIcon = (linkCount && !writeCount) ? 'ti ti-link' : 'ti ti-file-export';

  const S = {
    box: {marginTop:24,background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--rl)',padding:16},
    label: {fontSize:11,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.06em'},
  };

  return (
    <div style={S.box}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
        <span style={S.label}>Image Storage Audit</span>
        <div style={{display:'flex',gap:6}}>
          <button className="btn" style={{fontSize:11}} onClick={rescanImages} disabled={status==='scanning'||status==='migrating'} title="Scan folders for new images and link them — touches nothing else">
            <i className="ti ti-photo-scan"></i>Rescan images
          </button>
          <button className="btn" style={{fontSize:11}} onClick={scan} disabled={status==='scanning'||status==='migrating'}>
            <i className={`ti ${status==='scanning'?'ti-loader':'ti-scan'}`}></i>
            {status==='scanning'?'Scanning…':'Audit base64'}
          </button>
        </div>
      </div>
      <p style={{fontSize:12,color:'var(--text3)',marginBottom:status?12:0}}>

      </p>
      {status==='scanned'&&report.length===0&&(
        <div style={{fontSize:12,color:'#6ee7b7'}}>✓ No base64 images found — all clean.</div>
      )}
      {status==='scanned'&&report.length>0&&(
        <div style={{display:'flex',flexDirection:'column',gap:6}}>
          {relpathOk.length>0&&<div>
            <div style={{fontSize:12,color:'#6ee7b7',marginBottom:4}}>✓ {relpathOk.length} already using local file (relpath verified)</div>
            {relpathOk.map(r=><div key={r.id} style={{fontSize:10,color:'var(--text3)',paddingLeft:12,padding:'1px 0 1px 12px'}}>

              {r.name} → <span style={{fontFamily:'monospace'}}>{r.relpath}</span>
            </div>)}
          </div>}
          {relpathBroken.length>0&&<div style={{fontSize:12,color:'var(--amber)'}}>⚠ {relpathBroken.length} have relpath but file not found: {relpathBroken.map(r=>r.name).join(', ')}</div>}
          {leftoverData.length>0&&<div>
            <div style={{fontSize:12,color:'var(--amber)',marginBottom:4}}>⚠ {leftoverData.length} item{leftoverData.length>1?'s':''} already {leftoverData.length>1?'have':'has'} a working local file but still carry leftover base64 in the data — safe to clear:</div>
            {leftoverData.map(r=><div key={r.key||r.id} style={{fontSize:10,color:'var(--text3)',paddingLeft:12,padding:'1px 0 1px 12px'}}>
              {r.name} → <span style={{fontFamily:'monospace'}}>{r.relpath}</span>
            </div>)}
            <button className="btn" style={{marginTop:8,fontSize:12}} onClick={cleanupLeftover}>
              <i className="ti ti-eraser"></i>Clear {leftoverData.length} leftover base64 blob{leftoverData.length>1?'s':''}
            </button>
          </div>}
          {cleanupResult&&cleanupResult.ok&&<div style={{fontSize:12,color:'#6ee7b7'}}>✓ Cleared {cleanupResult.count} leftover blob{cleanupResult.count!==1?'s':''} and written to disk. A pre-cleanup snapshot was saved alongside the data file.</div>}
          {cleanupResult&&!cleanupResult.ok&&<div style={{fontSize:12,color:'var(--amber)'}}>⚠ Cleanup did not reach disk: {cleanupResult.error}</div>}
          {needsMigration.length>0&&(
            <div>
              <div style={{fontSize:12,color:'var(--amber)',marginBottom:8}}>
                {needsMigration.length} item{needsMigration.length>1?'s':''} storing image as base64 — can be migrated to local files:
              </div>
              <div style={{fontSize:11,color:'var(--text3)',marginBottom:6}}>
                {needsMigration.filter(r=>r.match).length} will link to a file already in the folder · {needsMigration.filter(r=>!r.match).length} will be written out from base64
              </div>
              {needsMigration.map(r=>(
                <div key={r.key||r.id} style={{fontSize:11,color:'var(--text3)',padding:'3px 0',display:'flex',gap:8,alignItems:'center'}}>
                  <i className={`ti ${r.type==='lorebook'?'ti-book':r.type==='portrait'?'ti-photo':'ti-folders'}`} style={{color:r.match?'#6ee7b7':'var(--amber)',fontSize:12}}></i>
                  {r.name}
                  {r.files&&r.files.length>0
                    ?<select value={r.match||''} onChange={e=>setMatch(r.key||r.id,e.target.value)} style={AUDIT_SELECT_STYLE}>
                        <option value="">write a new file</option>
                        {r.files.map(f=><option key={f.relPath} value={f.relPath}>link {f.filename||f.name}</option>)}
                      </select>
                    :<span style={AUDIT_WRITE_STYLE}>write new file</span>}
                </div>
              ))}
              <button className="btn primary" style={{marginTop:10,fontSize:12}} onClick={migrate}>
                <i className={migrateIcon}></i>{migrateLabel}
              </button>
            </div>
          )}
        </div>
      )}
      {status==='migrating'&&<div style={{fontSize:12,color:'var(--text3)'}}><i className="ti ti-loader"></i> Migrating…</div>}
      {status==='rescan_done'&&<div style={{fontSize:12,color:'#6ee7b7'}}>✓ Linked {migrated} new image{migrated!==1?'s':''} from local folders.{migrated===0?' All already up to date.':''}</div>}
      {status==='done'&&<div style={{fontSize:12,color:'#6ee7b7'}}>✓ Resolved {migrated} image{migrated!==1?'s':''} to local files. base64 cleared from data.</div>}
    </div>
  );
}

function BatchImportPage({data,update,importJSON,exportAll}) {
  const [companions,setCompanions]=useState([]);
  const [lorebooks,setLorebooks]=useState([]);
  const [collections,setCollections]=useState([]);
  const [scanning,setScanning]=useState(false);
  const [scanned,setScanned]=useState(false);
  const [assignments,setAssignments]=useState({}); // id -> worldId
  const [importing,setImporting]=useState(false);
  const [forceImport,setForceImport]=useState(false); // global override: ignore "local newer" protection
  const [forceItems,setForceItems]=useState(new Set()); // per-item override ids
  const [done,setDone]=useState(null);
  // Backup/Restore state (inlined from old BackupRestorePanel)
  const [selectedWorldId,setSelectedWorldId]=useState('');
  const [bkStatus,setBkStatus]=useState(null);
  const [mergePlan,setMergePlan]=React.useState(null);
  const [bkMsg,setBkMsg]=useState('');
  const [bkLg,setBkLg]=React.useState(null);
  React.useEffect(()=>{window.lorekeeper.getLastgoodInfo().then(i=>setBkLg(i)).catch(()=>{});},[]);
  const bkGlobal=async()=>{
    setBkStatus('working');setBkMsg('Creating backup…');
    const res=await window.lorekeeper.exportBackup({});
    if(res.cancelled){setBkStatus(null);return;}
    if(res.success){setBkStatus('ok');setBkMsg('✓ Backup saved ('+(res.size/1024).toFixed(0)+' KB)');}
    else{setBkStatus('err');setBkMsg('Error: '+res.error);}
  };
  const bkWorld=async(world)=>{
    setBkStatus('working');setBkMsg('Exporting '+world.name+'…');
    const res=await window.lorekeeper.exportBackup({worldId:world.id});
    if(res.cancelled){setBkStatus(null);return;}
    if(res.success){setBkStatus('ok');setBkMsg('✓ '+world.name+' exported ('+(res.size/1024).toFixed(0)+' KB)');}
    else{setBkStatus('err');setBkMsg('Error: '+res.error);}
  };
  const bkRestore=async()=>{
    if(!window.confirm('Restore from backup? This will overwrite your current data. Back up first!')) return;
    setBkStatus('working');setBkMsg('Restoring…');
    const res=await window.lorekeeper.restoreBackup();
    if(res.cancelled){setBkStatus(null);return;}
    if(res.success){
      if(res.data._world_export){
        update(d=>{
          res.data.worlds.forEach(w=>{if(!d.worlds.find(x=>x.id===w.id))d.worlds.push(w);else Object.assign(d.worlds.find(x=>x.id===w.id),w);});
          res.data.characters.forEach(c=>{if(!d.characters.find(x=>x.id===c.id))d.characters.push(c);else Object.assign(d.characters.find(x=>x.id===c.id),c);});
          res.data.lorebooks.forEach(l=>{if(!d.lorebooks.find(x=>x.id===l.id))d.lorebooks.push(l);else Object.assign(d.lorebooks.find(x=>x.id===l.id),l);});
          res.data.collections.forEach(c=>{if(!d.collections.find(x=>x.id===c.id))d.collections.push(c);else Object.assign(d.collections.find(x=>x.id===c.id),c);});
          (res.data.templates||[]).forEach(t=>{if(!d.templates.find(x=>x.id===t.id))d.templates.push(t);});
          (res.data.lorebook_templates||[]).forEach(t=>{if(!d.lorebook_templates)d.lorebook_templates=[];if(!d.lorebook_templates.find(x=>x.id===t.id))d.lorebook_templates.push(t);});
          (res.data.relationships||[]).forEach(r=>{if(!d.relationships)d.relationships=[];if(!d.relationships.find(x=>x.id===r.id))d.relationships.push(r);});
        });
        setBkStatus('ok');setBkMsg('✓ World restored and merged into existing data.');
      } else {
        update(()=>res.data);
        setBkStatus('ok');setBkMsg('✓ Full restore complete. Restart Lorekeeper to ensure everything is fresh.');
      }
    } else {setBkStatus('err');setBkMsg('Error: '+res.error);}
  };
  const bkRestoreLg=async()=>{
    if(!window.confirm('Restore from last good backup? This replaces all current data.')) return;
    setBkStatus('working');setBkMsg('Restoring from lastgood…');
    const res=await window.lorekeeper.restoreLastgood();
    if(res.success){update(()=>res.data);setBkStatus('ok');setBkMsg('✓ Restored from lastgood ('+Math.round(res.size/1024)+' KB). Restart recommended.');}
    else{setBkStatus('err');setBkMsg('Error: '+res.error);}
  };

  const bkMerge=async()=>{
    setBkStatus('working');setBkMsg('Reading backup\u2026');
    const res=await window.lorekeeper.restoreBackup();
    if(res.cancelled){setBkStatus(null);return;}
    if(!res.success){setBkStatus('err');setBkMsg('Error: '+res.error);return;}
    setBkStatus(null);setBkMsg('');
    setMergePlan({plan:planMerge(data,res.data),backupData:res.data});
  };

  const confirmMerge=(resolutions)=>{
    const {plan,backupData}=mergePlan;
    const merged=applyMerge(data,backupData,plan,resolutions);
    update(d=>{Object.assign(d,merged);});
    setMergePlan(null);
    const n=plan.toAdd.length+plan.toUpdate.length+plan.conflicts.filter(c=>(resolutions[c.item.id]||'local')==='backup').length;
    setBkStatus('ok');setBkMsg('\u2713 Merge complete \u2014 '+n+' item'+(n!==1?'s':'')+' imported.');
  };

  const scan=async()=>{
    setScanning(true);
    const results = await Promise.all([
      window.lorekeeper.scanCompanions(),
      window.lorekeeper.scanLorebooks(),
      window.lorekeeper.scanCollections()
    ]);
    const c=results[0], l=results[1], col=results[2];
    setCompanions(c||[]);
    setLorebooks(l||[]);
    setCollections(col||[]);
    // Auto-assign world based on existing data
    const auto={};
    (c||[]).forEach(item=>{
      if(item.jsonData?.id){
        const existing=data.characters.find(x=>x.id===item.jsonData.id);
        if(existing) auto[item.jsonData.id]=existing.world_id||'__none__';
      }
    });
    (l||[]).forEach(item=>{
      if(item.jsonData?.id){
        const existing=data.lorebooks.find(x=>x.id===item.jsonData.id);
        if(existing) auto[item.jsonData.id]=existing.world_id||'__none__';
      }
    });
    (col||[]).forEach(item=>{
      if(item.jsonData?.id){
        const existing=data.collections.find(x=>x.id===item.jsonData.id);
        if(existing) auto[item.jsonData.id]=existing.world_id||'__none__';
      }
    });
    setAssignments(auto);
    setScanning(false);
    setScanned(true);
  };

  const setA=(id,val)=>setAssignments(a=>({...a,[id]:val}));

  const importAll=async()=>{
    setImporting(true);
    let charCount=0,loreCount=0,collCount=0,skipCount=0;

    update(d=>{
      // Import collections first
      collections.forEach(item=>{
        if(!item.jsonData) return;
        const wid=assignments[item.jsonData.id||item.filename];
        if(!wid||wid==='__skip__') return;
        const worldId = wid==='__none__' ? null : wid;
        const obj=item.jsonData;
        const existing=d.collections.find(x=>x.id===obj.id);
        if(existing){
          const pts=parseTimestamp;
          const forced=forceImport||forceItems.has(obj.id||item.filename);
          if(!forced&&pts(existing.updated_at)>pts(obj.updated_at)&&pts(existing.updated_at)>0){skipCount++;return;}
          existing.name=obj.name||existing.name;
          existing.definition=obj.description||existing.definition;
          existing.tags=obj.tags||existing.tags;
          existing.companions=obj.companions||existing.companions;
          existing.updated_at=now();
          if(item.filename&&!existing.collection_filename)existing.collection_filename=item.filename;
          if(item.imageRelPath&&!existing.image_relpath)existing.image_relpath=item.imageRelPath;
          collCount++;
        } else {
          d.collections.push({id:obj.id||uuid(),world_id:worldId,name:obj.name||'',definition:obj.description||'',tags:obj.tags||[],fandom_tags:obj.fandom_tags||[],access_level:obj.access_level||'private',image:obj.image||null,image_data:null,image_relpath:item.imageRelPath||null,companions:obj.companions||[],has_been_public:obj.has_been_public||false,very_nsfw:obj.very_nsfw||false,lorebook_display:obj.lorebook_display||'',posted_at:obj.posted_at||now(),updated_at:now(),hide_on_owner_profile:false,collection_filename:item.filename||null});
          collCount++;
        }
      });

      // Import lorebooks
      lorebooks.forEach(item=>{
        if(!item.jsonData) return;
        const wid=assignments[item.jsonData.id||item.filename];
        if(!wid||wid==='__skip__') return;
        const worldId = wid==='__none__' ? null : wid;
        const obj=item.jsonData;
        const existing=d.lorebooks.find(x=>x.id===obj.id);
        if(existing){
          const pts=parseTimestamp;
          const forced=forceImport||forceItems.has(obj.id||item.filename);
          if(!forced&&pts(existing.updated_at)>pts(obj.updated_at)&&pts(existing.updated_at)>0){skipCount++;return;}
          existing.content=obj.content||existing.content;
          existing.tags=obj.tags||existing.tags;
          existing.name=obj.name||existing.name;
          existing.short_description=obj.short_description||existing.short_description;
          existing.updated_at=now();
          if(item.filename&&!existing.lorebook_filename)existing.lorebook_filename=item.filename;
          if(item.imageRelPath&&!existing.image_relpath)existing.image_relpath=item.imageRelPath;
          loreCount++;
        } else {
          d.lorebooks.push({id:obj.id||uuid(),world_id:worldId,name:obj.name||'',short_description:obj.short_description||'',content:obj.content||[],tags:obj.tags||[],fandom_tags:obj.fandom_tags||[],nsfw:obj.nsfw||false,very_nsfw:obj.very_nsfw||false,image_id:obj.image_id||null,image_data:null,image_relpath:item.imageRelPath||null,collaboration_type:obj.collaboration_type||'private',definition_protection:obj.definition_protection||'copy_protection',has_been_public:obj.has_been_public||false,posted_at:obj.posted_at||now(),updated_at:now(),hide_on_owner_profile:false,selected_chapter_index:0,access_level:obj.access_level||'private',lorebook_filename:item.filename||null});
          loreCount++;
        }
      });

      // Import companions
      companions.forEach(item=>{
        if(!item.jsonData) return;
        const wid=assignments[item.jsonData.id||item.folderName];
        if(!wid) return;
        const worldId = wid==='__none__' ? null : wid;
        const obj=item.jsonData;
        const status=obj.access_level==='public'?'posted':'draft';
        // Build portrait list from JSON, then match image files by normalized name
        // Normalize: lowercase, collapse spaces+underscores to _, strip parens
        const normName=n=>(n||'').toLowerCase().replace(/[()]/g,'').replace(/[\s_]+/g,'_').replace(/^_|_$/g,'');
        const portraits=(obj.portraits||[]).map(p=>({...p,data:null,relPath:null}));
        const matchedRelPaths=new Set();
        // Pass 1: normalized name match — each JSON portrait gets its image file
        portraits.forEach(p=>{
          const img=item.imageFiles.find(f=>normName(f.name)===normName(p.name));
          if(img){p.relPath=img.relPath;matchedRelPaths.add(img.relPath);}
        });
        // Pass 2: push truly unmatched image files as extra portrait slots
        item.imageFiles.filter(f=>!matchedRelPaths.has(f.relPath)).forEach(imgFile=>{
          if(portraits.length<10) portraits.push({name:imgFile.name,description:imgFile.name==='profile_pic'?'Profile picture':'',very_sus:false,data:null,relPath:imgFile.relPath,image:undefined});
        });

        const existing=d.characters.find(x=>x.id===obj.id);
        if(existing){
          const parseTs=parseTimestamp;
          const localTime = parseTs(existing.updated_at);
          const importTime = parseTs(obj.updated_at);
          const forced=forceImport||forceItems.has(obj.id||item.folderName);
          // Skip if local is newer — user has edited since last platform export (unless forced)
          if(!forced && localTime > importTime && localTime > 0){ skipCount++; return; }
          // Preserve the platform image UUID from the import if present; only fall back to a
          // local-file relPath when the site export genuinely has no UUID (e.g. unposted/private).
          const ppRelPath = (portraits.find(p=>p.name==='profile_pic')?.relPath) || portraits[0]?.relPath || null;
          const mainImage = obj.image?.id ? {id:obj.image.id, relPath:ppRelPath} : (ppRelPath ? {relPath:ppRelPath} : existing.image);
          const folderName = item.folderName || existing.companion_folder;
          // Preserve portrait descriptions that exist locally but are missing in incoming data
          const mergedPortraits = portraits.map(p => {
            const ep = (existing.portraits||[]).find(x =>
              (p.image?.id && x.image?.id && p.image.id === x.image.id) ||
              (!p.image?.id && p.name && x.name === p.name)
            );
            return (!p.description && ep?.description) ? {...p, description:ep.description} : p;
          });
          // posted_dates: if the site export shows this is posted and we don't already have a
          // posted date locally, derive one from posted_at (or updated_at as a fallback) instead
          // of leaving posted_dates empty and forcing a manual "Add Posted Date" later.
          const sitePostedDates = (status==='posted'&&(!existing.posted_dates||existing.posted_dates.length===0)&&(obj.posted_at||obj.updated_at))
            ? [(obj.posted_at||obj.updated_at).split(/[ T]/)[0]]
            : existing.posted_dates;
          Object.assign(existing,{name:obj.name||existing.name,display_name:obj.display_name||existing.display_name,short_description:obj.short_description||existing.short_description,full_description:obj.full_description||existing.full_description,card:obj.card||existing.card,example_dialogue:obj.example_dialogue||existing.example_dialogue,tags:obj.tags||existing.tags,fandom_tags:obj.fandom_tags||existing.fandom_tags,sus:obj.sus!==undefined?obj.sus:existing.sus,very_sus:obj.very_sus!==undefined?obj.very_sus:existing.very_sus,starting_scenarios:obj.starting_scenarios||existing.starting_scenarios,formatting_instructions:obj.formatting_instructions||existing.formatting_instructions,advanced_prompt:obj.advanced_prompt||existing.advanced_prompt,access_level:obj.access_level||existing.access_level,status,image:mainImage,portraits:mergedPortraits,posted_dates:sitePostedDates,updated_at:obj.updated_at||now(),companion_folder:folderName||existing.companion_folder||null});
          charCount++;
        } else {
          // posted_dates: derive from the site's posted_at (or updated_at as fallback) when this
          // character comes in already posted, so it's not left empty requiring manual entry.
          const newCharPostedDates = (status==='posted'&&(obj.posted_at||obj.updated_at)) ? [(obj.posted_at||obj.updated_at).split(/[ T]/)[0]] : [];
          const char={id:obj.id||uuid(),world_id:worldId,name:obj.name||item.folderName,display_name:obj.display_name||obj.name||'',short_description:obj.short_description||'',full_description:obj.full_description||'',card:obj.card||'',example_dialogue:obj.example_dialogue||'',tags:obj.tags||[],fandom_tags:obj.fandom_tags||[],sus:obj.sus||false,very_sus:obj.very_sus||false,starting_scenarios:obj.starting_scenarios||[],formatting_instructions:obj.formatting_instructions||'',advanced_prompt:obj.advanced_prompt||'',access_level:obj.access_level||'private',open_definition:obj.open_definition||false,external_model_policy:obj.external_model_policy||'vetted_only',locked_starting_message:obj.locked_starting_message||false,unlocked_portraits:obj.unlocked_portraits!==undefined?obj.unlocked_portraits:true,hide_on_owner_profile:obj.hide_on_owner_profile||false,suppress_companion_profile_banner:obj.suppress_companion_profile_banner||false,preserve_existing_chats:obj.preserve_existing_chats!==undefined?obj.preserve_existing_chats:true,posted_at:obj.posted_at||now(),created_at:obj.created_at||now(),updated_at:obj.updated_at||now(),voice_catalog_id:obj.voice_catalog_id||null,temperature_offset_percentage:obj.temperature_offset_percentage||0,status,schedule_dates:[],posted_dates:newCharPostedDates,collections:[],linked_lorebooks:[],image:obj.image?.id?{id:obj.image.id,relPath:(portraits.find(p=>p.name==='profile_pic')?.relPath||portraits[0]?.relPath||null)}:(portraits[0]?.relPath?{relPath:portraits[0].relPath}:null),portraits,companion_profile_banner_image:null,author_id:obj.author_id||'',author_handle:obj.author_handle||'',companion_folder:item.folderName||null};
          // Auto-link collections
          d.collections.forEach(col=>{if((col.companions||[]).includes(char.id))char.collections.push(col.id);});
          d.characters.push(char);
          charCount++;
        }
      });
    });

    setDone({charCount,loreCount,collCount,skipCount});
    setImporting(false);
  };

  const swWorlds=sortedWorlds(data);
  const WorldSelect = ({id}) => (
    <select value={assignments[id]||''} onChange={e=>setA(id,e.target.value)} style={{background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',padding:'5px 8px',borderRadius:'var(--r)',fontSize:12,outline:'none',flexShrink:0}}>

  if(!scanned) return (
    <div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(280px,1fr))',gap:16,marginBottom:20}}>

        {/* ── BACKUP ── */}
        <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--rl)',padding:20,display:'flex',flexDirection:'column',gap:12}}>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <i className="ti ti-archive" style={{fontSize:18,color:'var(--accent)'}}></i>
            <span style={{fontSize:13,fontWeight:700,color:'var(--text)'}}>Backup</span>
          </div>
          <div style={{fontSize:12,color:'var(--text3)',lineHeight:1.6}}>Save a zip of everything. Store it somewhere safe outside Lorekeeper.</div>
          <button className="btn" style={{justifyContent:'center'}} onClick={bkGlobal} disabled={bkStatus==='working'}>
            <i className="ti ti-archive"></i>Export full backup (.zip)
          </button>
          <div>
            <div style={{fontSize:10,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:6}}>Per world</div>
            <div style={{display:'flex',gap:8}}>
              <select value={selectedWorldId} onChange={e=>setSelectedWorldId(e.target.value)}
                style={{flex:1,background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',padding:'5px 8px',borderRadius:'var(--r)',fontSize:12,outline:'none'}}>
                <option value="">Select a world…</option>
                {sortedWorlds(data).map(w=>(
                  <option key={w.id} value={w.id}>{w.emoji?w.emoji+' ':''}{w.name}</option>
                ))}
              </select>
              <button className="btn" disabled={!selectedWorldId||bkStatus==='working'}
                onClick={()=>{const w=data.worlds.find(x=>x.id===selectedWorldId);if(w)bkWorld(w);}}>
                <i className="ti ti-archive"></i>Export

            </div>
          </div>
          {bkStatus&&<div style={{fontSize:11,color:bkStatus==='ok'?'var(--green)':bkStatus==='err'?'var(--red)':'var(--text3)'}}>{bkMsg}</div>}
        </div>

        {/* ── RESTORE ── */}
        <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--rl)',padding:20,display:'flex',flexDirection:'column',gap:12}}>

            <i className="ti ti-restore" style={{fontSize:18,color:'var(--amber)'}}></i>
            <span style={{fontSize:13,fontWeight:700,color:'var(--text)'}}>Restore</span>

          <div>
            <div style={{fontSize:12,color:'var(--text3)',lineHeight:1.6,marginBottom:8}}>Merge content from a backup into existing data — nothing is deleted. Reviews changes before applying.</div>

              <i className="ti ti-file-import"></i>Import &amp; merge from backup…
            </button>
          </div>
          <div style={{borderTop:'1px solid var(--border)',paddingTop:12}}>
            <div style={{fontSize:12,color:'var(--text3)',lineHeight:1.6,marginBottom:6}}>Auto-saved last-good file — use when data is corrupted or empty. No zip needed.</div>
            {bkLg&&<div style={{fontSize:11,color:'var(--text3)',marginBottom:8}}>Last saved: {bkLg.mtime.split('T')[0]} {bkLg.mtime.split('T')[1].slice(0,5)} — {(bkLg.size/1024).toFixed(0)} KB</div>}
            <button className="btn danger" style={{justifyContent:'center',width:'100%'}} disabled={bkStatus==='working'||!bkLg} onClick={bkRestoreLg}>

          {bkStatus&&<div style={{fontSize:11,color:bkStatus==='ok'?'var(--green)':bkStatus==='err'?'var(--red)':'var(--text3)'}}>{bkMsg}</div>}
        </div>

        {/* ── IMPORT ── */}
        <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--rl)',padding:20,display:'flex',flexDirection:'column',gap:12}}>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <i className="ti ti-file-import" style={{fontSize:18,color:'var(--green)'}}></i>
            <span style={{fontSize:13,fontWeight:700,color:'var(--text)'}}>Import</span>
          </div>

            <button className="btn" style={{justifyContent:'center',width:'100%'}} onClick={importJSON}>
              <i className="ti ti-file-import"></i>Import item from JSON…
            </button>
          </div>
          <div style={{borderTop:'1px solid var(--border)',paddingTop:12}}>
            <div style={{fontSize:12,color:'var(--text3)',lineHeight:1.6,marginBottom:8}}>Bulk import from Saucepan companion export folders.</div>
            <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:6}}>
              <button className="btn" style={{flex:1,justifyContent:'center'}} onClick={scan} disabled={scanning}>
                <i className="ti ti-scan"></i>{scanning?'Scanning…':'Scan Folders'}
              </button>
              <button className="btn" onClick={()=>window.lorekeeper.openFolder('')}>
                <i className="ti ti-folder-open"></i>Open I:\Lorekeeper
              </button>

            <BatchImportHelp/>
            <div style={{marginTop:8,fontSize:10,color:'var(--text3)',lineHeight:1.6}}>
              Place files in <code style={{background:'var(--bg3)',padding:'1px 4px',borderRadius:3}}>Companions\Name\companion.json</code>,{' '}
              <code style={{background:'var(--bg3)',padding:'1px 4px',borderRadius:3}}>Lorebooks\lorebook.json</code>, or{' '}
              <code style={{background:'var(--bg3)',padding:'1px 4px',borderRadius:3}}>Collections\collection.json</code>
            </div>
          </div>
        </div>
      </div>

      <ImageMigrationPanel data={data} update={update}/>
      <NotesBackupPanel data={data}/>
      {mergePlan&&<MergePreviewModal plan={mergePlan.plan} onConfirm={confirmMerge} onCancel={()=>setMergePlan(null)}/>}
    </div>
  );

  if(done) return (
    <div style={{maxWidth:500,textAlign:'center',padding:'40px 0'}}>
      <i className="ti ti-circle-check" style={{fontSize:48,color:'var(--green)',display:'block',marginBottom:16}}></i>
      <h2 style={{fontSize:20,fontWeight:600,color:'var(--text)',marginBottom:8}}>Import complete!</h2>
      <p style={{fontSize:14,color:'var(--text3)',lineHeight:1.8}}>
        {done.charCount} characters imported or updated<br/>
        {done.loreCount} lorebooks imported<br/>
        {done.collCount} collections imported<br/>
        {done.skipCount} skipped (local is newer)
      </p>
      <p style={{fontSize:13,color:'var(--text3)',marginTop:16}}>Images are linked by file path — they'll load from I:\Lorekeeper\Companions\ automatically.</p>
      <button className="btn primary" style={{margin:'20px auto 0',display:'flex'}} onClick={()=>{setScanned(false);setDone(null);setCompanions([]);setLorebooks([]);setCollections([]);}}>
        <i className="ti ti-refresh"></i>Scan again
      </button>
    </div>
  );

  const pts=parseTimestamp;
  const willImport=(item,existingLocal,id)=>{
    if(!existingLocal) return true; // new
    if(forceImport||forceItems.has(id)) return true; // forced override
    const localTime=pts(existingLocal.updated_at);
    const importTime=pts(item.jsonData?.updated_at);
    return !(localTime>importTime&&localTime>0); // skip if local is newer
  };
  const totalToImport=[
    ...companions.filter(item=>{
      const id=item.jsonData?.id||item.folderName;
      const a=assignments[id];
      if(!a||a==='__skip__') return false;
      const existing=item.jsonData?.id&&data.characters.find(x=>x.id===item.jsonData.id);
      return willImport(item,existing,id);
    }),
    ...lorebooks.filter(item=>{
      const id=item.jsonData?.id||item.filename;
      const a=assignments[id];
      if(!a||a==='__skip__') return false;
      const existing=item.jsonData?.id&&data.lorebooks.find(x=>x.id===item.jsonData.id);
      return willImport(item,existing,id);
    }),
    ...collections.filter(item=>{
      const id=item.jsonData?.id||item.filename;
      const a=assignments[id];
      if(!a||a==='__skip__') return false;
      const existing=item.jsonData?.id&&data.collections.find(x=>x.id===item.jsonData.id);
      return willImport(item,existing,id);
    }),
  ].length;

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
        <div style={{fontSize:13,color:'var(--text3)'}}>{companions.length} companions · {lorebooks.length} lorebooks · {collections.length} collections found</div>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <label style={{display:'flex',alignItems:'center',gap:6,fontSize:12,color:forceImport?'var(--amber)':'var(--text3)',cursor:'pointer'}} title="Ignore the 'local newer' protection and overwrite local edits with the scanned files">
            <input type="checkbox" checked={forceImport} onChange={e=>setForceImport(e.target.checked)}/>

          </label>
          <button className="btn" onClick={scan}><i className="ti ti-refresh"></i>Rescan</button>
          <button className="btn primary" disabled={totalToImport===0||importing} onClick={importAll}>
            <i className="ti ti-download"></i>{importing?'Importing…':`Import ${totalToImport} items`}
          </button>
        </div>
      </div>
      {forceImport?<div style={{display:'flex',alignItems:'center',gap:8,padding:'8px 12px',background:'rgba(251,191,36,0.1)',border:'1px solid rgba(251,191,36,0.3)',borderRadius:'var(--r)',marginBottom:16,fontSize:12,color:'var(--amber)'}}>
        <i className="ti ti-alert-triangle"></i>Force import is ON — every item will overwrite local data, even items marked "local newer ↑".
      </div>:null}
