                </div>

          )}
          {tab==='collections'&&(
            <CollectionPicker charData={charData} data={data} updChar={updChar} update={update} />
          )}
          {tab==='settings'&&(
            <div style={{display:'flex',flexDirection:'column',gap:12}}>
              <div className="field-block">
                <label>Companions Folder <span style={{color:'var(--text3)',fontWeight:'normal',textTransform:'none',letterSpacing:0,fontSize:11}}>— auto-saves JSON to Companions\FolderName\ on every edit</span></label>
                <input value={charData.companion_folder||''} onChange={e=>updChar(c=>c.companion_folder=e.target.value||null)} placeholder="e.g. Victor (leave blank to disable auto-save)"/>
                {charData.companion_folder&&<div style={{fontSize:11,color:'var(--text3)',marginTop:4}}>Saves to: I:\Lorekeeper\Companions\{charData.companion_folder}\character.json</div>}
              </div>
              <div className="field-row">
                <div className="field-block"><label>Access Level</label><select value={charData.access_level||'private'} onChange={e=>updChar(c=>c.access_level=e.target.value)}><option value="private">Private</option><option value="unlisted">Unlisted</option><option value="public">Public</option></select></div>
                <div className="field-block"><label>Temperature Offset %</label><input type="number" min="-100" max="100" value={charData.temperature_offset_percentage||0} onChange={e=>updChar(c=>c.temperature_offset_percentage=Number(e.target.value))}/></div>
              </div>

                    <label key={k} style={{display:'flex',alignItems:'center',gap:8,fontSize:13,color:'var(--text2)',cursor:'pointer',fontWeight:'normal',textTransform:'none',letterSpacing:0}}>
                      <input type="checkbox" checked={!!charData[k]} onChange={e=>updChar(c=>c[k]=e.target.checked)} style={{width:'auto',accentColor:'var(--accent)'}}/>{l}

          {tab==='schedule'&&(
            <div style={{display:'flex',flexDirection:'column',gap:12}}>

              {charData.status!=='posted'&&<div className="field-block">
                <label>Schedule Dates</label>
                {(charData.schedule_dates||[]).map((d,i)=>(
                  <div key={i} style={{display:'flex',gap:8,marginBottom:8}}>
                    <input type="date" value={d.split('T')[0]||d} onChange={e=>updChar(c=>c.schedule_dates[i]=e.target.value)} style={{flex:1,background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',padding:'7px 10px',borderRadius:'var(--r)',fontSize:13,outline:'none',colorScheme:'dark'}}/>
                    <button className="btn danger" onClick={()=>updChar(c=>c.schedule_dates.splice(i,1))}><i className="ti ti-x"></i></button>
                  </div>
                ))}
                <button className="btn" onClick={()=>updChar(c=>{if(!c.schedule_dates)c.schedule_dates=[];c.schedule_dates.push(new Date().toISOString().split('T')[0]);})}><i className="ti ti-plus"></i>Add Date</button>
              </div>}
              <div className="field-block" style={{marginTop:12}}>
                <label>Posted Date <span style={{color:'var(--text3)',fontWeight:'normal',textTransform:'none',letterSpacing:0,fontSize:11}}>— shown on calendar</span></label>

                  <div key={i} style={{display:'flex',gap:8,marginBottom:8}}>
                    <input type="date" value={d.split('T')[0]||d} onChange={e=>updChar(c=>c.posted_dates[i]=e.target.value)} style={{flex:1,background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',padding:'7px 10px',borderRadius:'var(--r)',fontSize:13,outline:'none',colorScheme:'dark'}}/>

      </div>
    </div>
  );
}


function LorebookEntryTab({charData, data, update, updChar}) {
  const world = data.worlds.find(w => w.id === charData.world_id);
  const worldTemplates = (data.lorebook_templates||[]).filter(t => t.world_id === charData.world_id);

  // Get or init entry text: use saved, or generate from template
  const fillPlaceholders = (text) => {
    const charName = (charData.display_name||charData.name||'').toUpperCase();
    return (text||'')
      .replace(/\{\{CHARACTER NAME\}\}/g, charName)
      .replace(/\{\{CHAR\}\}/g, charData.display_name||charData.name||'')
      .replace(/\{\{char\}\}/g, charData.display_name||charData.name||'')
      .replace(/\{\{name\}\}/g, charData.display_name||charData.name||'');
  };
  const [entryText, setEntryText] = useState(() => {
    if(charData.lorebook_entry_text) return charData.lorebook_entry_text;
    if(worldTemplates.length > 0) return fillPlaceholders(worldTemplates[0].template_text);
    return '';
  });
  const [entryTitle, setEntryTitle] = useState(() => {
    if(charData.lorebook_entry_title) return charData.lorebook_entry_title;
    if(worldTemplates.length > 0) return fillPlaceholders(worldTemplates[0].title_template||charData.display_name||charData.name||'');
    return charData.display_name||charData.name||'';
  });
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState('');
  const [selectedTemplateId, setSelectedTemplateId] = useState(worldTemplates[0]?.id||'');

  if(!world) return <div style={{padding:16,color:'var(--text3)'}}>Assign this character to a world first to use lorebook entry templates.</div>;
  if(worldTemplates.length === 0) return (
    <div style={{padding:16}}>
      <div style={{color:'var(--text3)',marginBottom:12}}>No lorebook templates set up for <strong style={{color:'var(--text)'}}>{world.name}</strong>.</div>
      <div style={{fontSize:12,color:'var(--text3)'}}>Go to <strong style={{color:'var(--text)'}}>World Info → Lorebook Templates</strong> to create one.</div>
    </div>
  );

  const applyTemplate = () => {
    const tpl = (data.lorebook_templates||[]).find(t=>t.id===selectedTemplateId);
    if(!tpl) return;
    setEntryText(fillPlaceholders(tpl.template_text));
    setEntryTitle(fillPlaceholders(tpl.title_template||charData.display_name||charData.name||''));
  };

  const saveToLorebook = () => {
    const tpl = (data.lorebook_templates||[]).find(t=>t.id===selectedTemplateId);
    if(!tpl?.lorebook_id) { setMsg('No lorebook linked to this template.'); return; }
    setSaving(true);
    update(d => {
      const lb = d.lorebooks.find(l => l.id === tpl.lorebook_id);
      if(!lb) { setMsg('Lorebook not found.'); setSaving(false); return; }
      if(!lb.content) lb.content = [];
      const existing = lb.content.find(ch => ch.char_id === charData.id);
      if(existing) {
        existing.text = entryText;
        existing.title = entryTitle;
      } else {
        lb.content.push({ id: Math.random().toString(36).slice(2), title: entryTitle, text: entryText, char_id: charData.id });
      }
      lb.updated_at = new Date().toISOString();
    });
    updChar(c => { c.lorebook_entry_text = entryText; c.lorebook_entry_title = entryTitle; });
    setSaving(false);
    setMsg('✓ Saved to lorebook');
    setTimeout(() => setMsg(''), 3000);
  };

  const tpl = (data.lorebook_templates||[]).find(t=>t.id===selectedTemplateId);
  const targetLorebook = tpl ? data.lorebooks.find(l=>l.id===tpl.lorebook_id) : null;

  return (
    <div style={{display:'flex',flexDirection:'column',gap:12}}>
      {worldTemplates.length > 1 && (
        <div className="field-block">
          <label>Template</label>
          <select value={selectedTemplateId} onChange={e=>setSelectedTemplateId(e.target.value)}
            style={{background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',padding:'6px 10px',borderRadius:'var(--r)',fontSize:13,outline:'none',width:'100%'}}>
            {worldTemplates.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
          </select>
        </div>
      )}
      {(()=>{
        const [showHelp,setShowHelp]=useState(false);
        return <div>
          <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:8}}>
            <span style={{fontSize:11,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.06em',flex:1}}>Lorebook Entry</span>
            <button onClick={()=>setShowHelp(h=>!h)} style={{background:'none',border:'none',cursor:'pointer',color:'var(--text3)',fontSize:13,padding:'0 2px',lineHeight:1}} title="How does this work?">?</button>
          </div>
          {showHelp&&<div style={{padding:'10px 12px',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--r)',fontSize:12,color:'var(--text3)',lineHeight:1.7,marginBottom:10}}>
            <strong style={{color:'var(--text)',display:'block',marginBottom:6}}>How lorebook entries work:</strong>
            1. Set up a template in <strong style={{color:'var(--text)'}}>World Info → Lorebook Templates</strong><br/>
            2. Edit the chapter title and body below<br/>
            3. Click <strong style={{color:'var(--text)'}}>Save to Lorebook</strong> — creates or updates a chapter in the linked lorebook<br/>
            4. Click <strong style={{color:'var(--text)'}}>Re-apply template</strong> to reset the content from the template (fills in the character name)<br/>
            <span style={{fontSize:11,marginTop:4,display:'block',color:'var(--text3)'}}>The chapter is matched by character ID, so renaming the character won't create a duplicate.</span>
          </div>}
        </div>;
      })()}
      <div style={{display:'flex',gap:8,alignItems:'center',padding:'8px 12px',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--r)',fontSize:12}}>
        <i className="ti ti-book" style={{color:'var(--accent)',fontSize:14}}></i>
        <span style={{color:'var(--text3)'}}>Saves to:</span>
        <span style={{color:'var(--text)',fontWeight:500}}>{targetLorebook?.name||<span style={{color:'var(--red)'}}>No lorebook linked</span>}</span>
        {targetLorebook&&<span style={{color:'var(--text3)',marginLeft:'auto',fontSize:11}}>{(targetLorebook.content||[]).find(ch=>ch.char_id===charData.id)?'✓ entry exists':'new entry'}</span>}
      </div>
      <div style={{display:'flex',gap:8,marginBottom:4}}>
        <button className="btn" style={{fontSize:11}} onClick={applyTemplate}><i className="ti ti-refresh"></i>Re-apply template</button>
        <span style={{fontSize:11,color:'var(--text3)',alignSelf:'center'}}>resets title and body from template</span>
      </div>
      <div className="field-block" style={{marginBottom:8}}>
        <label>Chapter title</label>
        <input value={entryTitle} onChange={e=>setEntryTitle(e.target.value)}
          style={{fontWeight:600,fontFamily:'monospace',fontSize:13}}
          placeholder="e.g. GABRIEL OLLARSON | BUTTERFLY STROKE | CAPTAIN"/>
      </div>
      <textarea value={entryText} onChange={e=>setEntryText(e.target.value)}
        style={{width:'100%',minHeight:500,background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',padding:'10px 12px',borderRadius:'var(--r)',fontSize:12,outline:'none',resize:'vertical',fontFamily:'monospace',lineHeight:1.6}}
        placeholder="Your lorebook entry content…"/>
      <div style={{display:'flex',gap:8,alignItems:'center'}}>
        <button className="btn primary" style={{fontSize:12}} onClick={saveToLorebook} disabled={saving||!targetLorebook}>
          <i className="ti ti-device-floppy"></i>{saving?'Saving…':'Save to Lorebook'}
        </button>
        {msg&&<span style={{fontSize:12,color:'#6ee7b7'}}>{msg}</span>}
      </div>
    </div>
  );
}

function LoreExportPanel({lorebook,exportLore,exportLoreMd,loreMdPreview,setLoreMdPreview,buildLoreMd}) {
  return (
    <div className="export-panel">
      <div className="export-card">
        <div className="export-card-title">Export to JSON</div>
        <p className="export-card-desc">Platform-ready JSON stripped of app-only fields. Upload directly to Saucepan.</p>
        <button className="btn primary" onClick={()=>exportLore(lorebook)}><i className="ti ti-download"></i>Export JSON</button>
      </div>
      <div className="export-card">
        <div className="export-card-title">Export to Markdown</div>
        <p className="export-card-desc">All chapters as ## headings — good for offline reference or sharing.</p>
        <div className="export-card-meta">{(lorebook.content||[]).length} chapter{(lorebook.content||[]).length!==1?"s":""}</div>
        <div className="export-row">
          <button className="btn primary" onClick={exportLoreMd}><i className="ti ti-file-text"></i>Export MD</button>
          <button className="btn" onClick={()=>setLoreMdPreview(p=>!p)}><i className={"ti "+(loreMdPreview?"ti-eye-off":"ti-eye")}></i>{loreMdPreview?"Hide":"Preview"}</button>
        </div>
        {loreMdPreview?<pre className="md-preview">{buildLoreMd()}</pre>:null}
      </div>
    </div>
  );
}

function CollEditPanel({coll,data,update,setSelectedColl,world,exportColl}) {
  const handleImg = async () => {
    const r = await window.lorekeeper.importImage();
    if(!r) return;
    if(coll.collection_filename){
      const res = await window.lorekeeper.copyImageToFolder(r.srcPath,"Collections",coll.collection_filename.replace(/\.json$/i,""));
      if(res){update(d=>{const c=d.collections.find(x=>x.id===coll.id);if(c){c.image_data=res.base64;c.image_relpath=res.relPath;}});setSelectedColl(sc=>({...sc,image_data:res.base64,image_relpath:res.relPath}));return;}
    }
    update(d=>{const c=d.collections.find(x=>x.id===coll.id);if(c)c.image_data=r.base64;});
    setSelectedColl(sc=>({...sc,image_data:r.base64}));
  };
  return (
    <div>
      {!coll.image_data&&!world.image&&<div style={{display:"flex",gap:8,marginBottom:16,alignItems:"center"}}>
        <button className="btn" onClick={handleImg}><i className="ti ti-camera"></i>Set image</button>
      </div>}
      <div className="field-block" style={{marginBottom:12}}>
        <label>Name</label>
        <input value={coll.name||""} onChange={e=>{const v=e.target.value;update(d=>{const c=d.collections.find(x=>x.id===coll.id);if(c)c.name=v;});setSelectedColl(sc=>({...sc,name:v}));}}/>
      </div>
      <div className="field-block" style={{marginBottom:12}}>
        <label>Description</label>
        <textarea style={{minHeight:80}} value={coll.definition||""} onChange={e=>{const v=e.target.value;update(d=>{const c=d.collections.find(x=>x.id===coll.id);if(c)c.definition=v;});setSelectedColl(sc=>({...sc,definition:v}));}}/>
      </div>
      <div className="field-block" style={{marginBottom:12}}>
        <label>Tags</label>
        <TagSelector value={coll.tags||[]} onChange={v=>{update(d=>{const c=d.collections.find(x=>x.id===coll.id);if(c)c.tags=v;});setSelectedColl(sc=>({...sc,tags:v}));}} max={25}/>
      </div>
      <div className="field-block" style={{marginBottom:12}}>
        <label>World</label>
        <select value={coll.world_id||""} onChange={e=>{const v=e.target.value||null;update(d=>{const c=d.collections.find(x=>x.id===coll.id);if(c)c.world_id=v;});setSelectedColl(sc=>({...sc,world_id:v}));}}>
          <option value="">No World (standalone)</option>
          {[...data.worlds].sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)).map(w=><option key={w.id} value={w.id}>{w.emoji?w.emoji+" ":""}{w.name}</option>)}
        </select>
      </div>
      <div className="field-block" style={{marginBottom:16}}>
        <label>Auto-save filename</label>
        <input value={coll.collection_filename||""} onChange={e=>{const v=e.target.value||null;update(d=>{const c=d.collections.find(x=>x.id===coll.id);if(c)c.collection_filename=v;});setSelectedColl(sc=>({...sc,collection_filename:v}));}} placeholder="e.g. Guideverse.json"/>
        {coll.collection_filename&&<div style={{fontSize:11,color:"var(--text3)",marginTop:4}}>{"I:\\Lorekeeper\\Collections\\"}{coll.collection_filename}</div>}
      </div>
      <button className="btn danger" style={{fontSize:12,marginBottom:16}} onClick={()=>{if(window.confirm("Delete "+coll.name+"? This cannot be undone.")){update(d=>{d.collections=d.collections.filter(x=>x.id!==coll.id);});setSelectedColl(null);}}}><i className="ti ti-trash"></i>Delete</button>
      <CollectionCharPicker coll={coll} data={data} update={update} setSelectedChar={()=>{}}/>
    </div>
  );
}

function CollExportPanel({coll,data,exportColl}) {
  const exportCollMd = () => {
    const lines = ["# " + coll.name];
    if(coll.definition){lines.push(""); lines.push(coll.definition);}
    const members = data.characters.filter(ch=>(ch.collections||[]).includes(coll.id)||(coll.companions||[]).includes(ch.id));
    if(members.length>0){lines.push(""); lines.push("## Characters"); members.forEach(ch=>lines.push("- "+(ch.display_name||ch.name)));}
    if((coll.tags||[]).length>0){lines.push(""); lines.push("## Tags"); lines.push(coll.tags.join(", "));}
    const safeName = (coll.name||"collection").replace(/[^a-zA-Z0-9_-]/g,"_");
    window.lorekeeper.exportFile({defaultName: safeName+".md", content: lines.join("\n")});
  };
  return (
    <div className="export-panel">

      </div>
      <div className="export-card">
        <div className="export-card-title">Export to Markdown</div>
        <p className="export-card-desc">Collection name, description, character list, and tags as a readable document.</p>
        <button className="btn primary" onClick={exportCollMd}><i className="ti ti-file-text"></i>Export MD</button>
      </div>
    </div>
  );
}

function CharExportTab({charData, data, exportChar}) {
  const buildMd = () => {
    const c = charData;
    const lines = [];
    lines.push("# " + (c.display_name||c.name||"Character"));
    if(c.name && c.display_name && c.name !== c.display_name) lines.push("**Name:** " + c.name);
    lines.push("");
    if(c.short_description) { lines.push("## Short Description"); lines.push(c.short_description); lines.push(""); }
    if(c.full_description) { lines.push("## Full Description"); lines.push(c.full_description); lines.push(""); }
    if(c.card && c.card.trim() && c.card.trim() !== " ") { lines.push("## Character Card"); lines.push(c.card); lines.push(""); }
    if(c.advanced_prompt) { lines.push("## Advanced Prompt"); lines.push(c.advanced_prompt); lines.push(""); }
    if(c.formatting_instructions) { lines.push("## Formatting Instructions"); lines.push(c.formatting_instructions); lines.push(""); }
    if((c.starting_scenarios||[]).length > 0) {
      lines.push("## Starting Scenarios");
      c.starting_scenarios.forEach((s,i) => {
        lines.push("### " + (s.title||("Scenario " + (i+1))));
        if(s.message) lines.push(s.message);
        lines.push("");
      });
    }
    if((c.tags||[]).length > 0) { lines.push("## Tags"); lines.push(c.tags.join(", ")); lines.push(""); }
    return lines.join("\n");
  };
  const exportMd = () => {
    const md = buildMd();
    const safeName = (charData.display_name||charData.name||"character").replace(/[^a-zA-Z0-9_-]/g,"_");
    window.lorekeeper.exportFile({defaultName: safeName + "-sheet.md", content: md});
  };
  const [mdPreview, setMdPreview] = React.useState(false);
  const md = buildMd();
  return (
    <div className="export-panel">
      <div className="export-card">
        <div className="export-card-title">Export to JSON</div>
        <p className="export-card-desc">Platform-ready JSON stripped of all app-only fields. Upload directly to Saucepan.</p>
        <button className="btn primary" onClick={()=>exportChar(charData)}><i className="ti ti-download"></i>Export JSON</button>
      </div>
      <div className="export-card">
        <div className="export-card-title">Export to Markdown</div>
        <p className="export-card-desc">Display name, short + full description, character card, advanced prompt, formatting instructions, scenarios, tags.</p>
        <div className="export-card-meta">
          {[
            [charData.short_description,"short desc"],
            [charData.full_description,"full desc"],
            [charData.card&&charData.card.trim()&&charData.card.trim()!==" ","card"],
            [charData.advanced_prompt,"advanced prompt"],
            [(charData.starting_scenarios||[]).length>0,"scenarios"]
          ].map(([ok,label])=>(
            <span key={label} className={"export-field-"+(ok?"ok":"missing")}>{ok?"✓":"–"} {label}</span>
          ))}
        </div>
        <div className="export-row">
          <button className="btn primary" onClick={exportMd}><i className="ti ti-file-text"></i>Export MD</button>
          <button className="btn" onClick={()=>setMdPreview(p=>!p)}><i className={"ti "+(mdPreview?"ti-eye-off":"ti-eye")}></i>{mdPreview?"Hide":"Preview"}</button>
        </div>
        {mdPreview?<pre className="md-preview">{md}</pre>:null}
      </div>
    </div>
  );
}

function RelPortrait({id, src, r, onMouseDown}) {
  const [resolved, setResolved] = React.useState(null);
  React.useEffect(() => {
    if (!src) { setResolved(null); return; }
    if (src.startsWith('data:')) { setResolved(src); return; }
    window.lorekeeper.readImagePath(src).then(b64 => setResolved(b64||null)).catch(() => setResolved(null));
  }, [src]);
  if (!resolved) return <text x={r} y={r+6} textAnchor="middle" fontSize={22} fill="var(--text3)" style={{pointerEvents:'none',userSelect:'none'}}>👤</text>;
  return (
    <image href={resolved} x={0} y={0} width={r*2} height={r*2} clipPath={"url(#clip-"+id+")"} preserveAspectRatio="xMidYMid slice" onMouseDown={onMouseDown}/>
  );
}

function RelationshipsPage({data, update, initialWorld}) {
  const worlds = data.worlds || [];
  const [worldId, setWorldId] = useState(initialWorld || worlds[0]?.id || null);
  const [positions, setPositions] = useState({});
  const [connecting, setConnecting] = useState(null);
  const [labelInput, setLabelInput] = useState(null);
  const [labelText, setLabelText] = useState('');
  const [editEdge, setEditEdge] = useState(null);
  const [editLabelText, setEditLabelText] = useState('');
  const [dragging, setDragging] = useState(null); // node drag only
  // Draggable edit popup
  const [popupPos, setPopupPos] = useState({x: null, y: null});
  const [popupDrag, setPopupDrag] = useState(null);
  const svgRef = React.useRef();

  const worldCollIds = worldId ? data.collections.filter(col=>col.world_id===worldId).map(col=>col.id) : [];
  const worldCollCompanions = worldId ? data.collections.filter(col=>col.world_id===worldId).flatMap(col=>col.companions||[]) : [];
  const worldChars = (data.characters || []).filter(c => {
    if (!worldId) return false;
    if (c.world_id === worldId) return true;
    return (c.collections||[]).some(cid=>worldCollIds.includes(cid)) || worldCollCompanions.includes(c.id);
  });
  const rels = (data.relationships || []).filter(r => r.worldId === worldId);

  React.useEffect(() => {
    setConnecting(null);
    setLabelInput(null);
    setEditEdge(null);
    const collIds = (data.collections||[]).filter(col=>col.world_id===worldId).map(col=>col.id);
    const collCompanions = (data.collections||[]).filter(col=>col.world_id===worldId).flatMap(col=>col.companions||[]);
    const chars = (data.characters||[]).filter(c => {
      if (c.world_id === worldId) return true;
      return (c.collections||[]).some(cid=>collIds.includes(cid)) || collCompanions.includes(c.id);
    });
    const cols = Math.max(1, Math.ceil(Math.sqrt(chars.length)));
    const next = {};
    chars.forEach((c, i) => {
      next[c.id] = {x: 120 + (i % cols) * 170, y: 100 + Math.floor(i / cols) * 170};
    });
    setPositions(next);
  }, [worldId, data.characters]);

  const getSvgPoint = (e) => {
    const svg = svgRef.current;
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  };

  const getPos = (id) => positions[id] || {x: 120, y: 120};

  const onNodeMouseDown = (e, id) => {
    if (connecting) {
      if (connecting !== id) { setLabelInput({charA: connecting, charB: id}); setLabelText(''); }
      setConnecting(null);
      return;
    }
    e.preventDefault();
    const svgP = getSvgPoint(e);
    const pos = getPos(id);
    setDragging({id, ox: svgP.x - pos.x, oy: svgP.y - pos.y});
  };

  const onSvgMouseMove = (e) => {
    if (!dragging) return;
    const svgP = getSvgPoint(e);
    setPositions(prev => ({...prev, [dragging.id]: {x: svgP.x - dragging.ox, y: svgP.y - dragging.oy}}));
  };

  const onSvgMouseUp = () => setDragging(null);

  // Popup drag handlers (on the DOM, not SVG)
  const popupRef = React.useRef();
  const onPopupMouseDown = (e) => {
    e.preventDefault();
    const rect = popupRef.current ? popupRef.current.getBoundingClientRect() : {left:0,top:0};
    setPopupPos({x: rect.left, y: rect.top});
    setPopupDrag({ox: e.clientX - rect.left, oy: e.clientY - rect.top});
  };
  React.useEffect(() => {
    if (!popupDrag) return;
    const onMove = (e) => setPopupPos({x: e.clientX - popupDrag.ox, y: e.clientY - popupDrag.oy});
    const onUp = () => setPopupDrag(null);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    return () => { window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onUp); };
  }, [popupDrag]);

  const openEdge = (id, label) => {
    setEditEdge(id);
    setEditLabelText(label);
    setPopupPos({x: null, y: null}); // reset to default position
  };

  const saveRelationship = () => {
    if (!labelText.trim() || !labelInput) return;
    update(d => {
      if (!d.relationships) d.relationships = [];
      d.relationships.push({id: uuid(), worldId, charA: labelInput.charA, charB: labelInput.charB, label: labelText.trim()});
    });
    setLabelInput(null); setLabelText('');
  };

  const saveEditLabel = () => {
    if (!editLabelText.trim()) return;
    update(d => { const r = (d.relationships||[]).find(x=>x.id===editEdge); if(r) r.label = editLabelText.trim(); });
    setEditEdge(null);
  };

  const deleteRel = (id) => {
    update(d => { d.relationships = (d.relationships||[]).filter(r=>r.id!==id); });
    setEditEdge(null);
  };

  const NODE_R = 36;

  // Popup positioning
  const popupStyle = {
    position: 'fixed',
    background: 'var(--bg2)',
    border: '1px solid var(--border)',
    borderRadius: 'var(--rl)',
    padding: '10px 14px',
    display: 'flex',
    alignItems: 'center',
    gap: 10,
    zIndex: 100,
    boxShadow: '0 4px 16px rgba(0,0,0,0.3)',
    cursor: 'default',
    userSelect: 'none',
  };
  if (popupPos.x !== null) {
    popupStyle.left = popupPos.x;
    popupStyle.top = popupPos.y;
  } else {
    popupStyle.bottom = 24;
    popupStyle.left = '50%';
    popupStyle.transform = 'translateX(-50%)';
  }

  return (
    <div className="rel-page">
      <div className="rel-toolbar">
        <select value={worldId||''} onChange={e=>setWorldId(e.target.value||null)} className="rel-world-select">
          <option value="">— Pick a world —</option>
          {worlds.map(w=><option key={w.id} value={w.id}>{w.emoji?w.emoji+' ':''}{w.name}</option>)}
        </select>
        {connecting&&<span className="rel-hint">Click another character to connect — click same to cancel</span>}
        {!connecting&&worldChars.length>0&&<span className="rel-hint">Drag nodes · Click + connect to draw a relationship · Click label to edit</span>}
        {worldId&&<span className="rel-hint" style={{marginLeft:'auto',opacity:0.5}}>{worldChars.length} characters</span>}
        {worldId&&worldChars.length>0&&<button className="btn" style={{fontSize:11,padding:'3px 8px'}} onClick={()=>{const cIds=(data.collections||[]).filter(col=>col.world_id===worldId).map(col=>col.id);const cComp=(data.collections||[]).filter(col=>col.world_id===worldId).flatMap(col=>col.companions||[]);const chars=(data.characters||[]).filter(c=>{if(c.world_id===worldId)return true;return(c.collections||[]).some(cid=>cIds.includes(cid))||cComp.includes(c.id);});const cols=Math.max(1,Math.ceil(Math.sqrt(chars.length)));const next={};chars.forEach((c,i)=>{next[c.id]={x:120+(i%cols)*170,y:100+Math.floor(i/cols)*170};});setPositions(next);}}>Reset layout</button>}
        {rels.length>0&&<button className="btn danger" style={{fontSize:11,padding:"3px 8px"}} onClick={()=>{if(window.confirm("Clear all relationships for this world?"))update(d=>{d.relationships=(d.relationships||[]).filter(r=>r.worldId!==worldId);});}}>Clear all</button>}
      </div>

      {worldId&&worldChars.length===0&&<p className="text-muted" style={{padding:24}}>No characters in this world yet.</p>}

      {worldId&&worldChars.length>0&&(
        <svg ref={svgRef} className="rel-canvas" onMouseMove={onSvgMouseMove} onMouseUp={onSvgMouseUp} onMouseLeave={onSvgMouseUp}>
          <defs>
            {worldChars.map(c=>(
              <clipPath key={'clip-'+c.id} id={'clip-'+c.id}>
                <circle cx={NODE_R} cy={NODE_R} r={NODE_R}/>
              </clipPath>
            ))}
          </defs>

          {rels.map(r => {
            const a = getPos(r.charA), b = getPos(r.charB);
            const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
            const dx = b.x-a.x, dy = b.y-a.y;
            const len = Math.sqrt(dx*dx+dy*dy)||1;
            const ax = a.x+(dx/len)*NODE_R, ay = a.y+(dy/len)*NODE_R;
            const bx = b.x-(dx/len)*NODE_R, by = b.y-(dy/len)*NODE_R;
            const isSelected = editEdge===r.id;
            const labelW = Math.max(60, r.label.length*7+16);
            return (
              <g key={r.id} onClick={()=>openEdge(r.id, r.label)} style={{cursor:'pointer'}}>
                <line x1={ax} y1={ay} x2={bx} y2={by} stroke="transparent" strokeWidth={12}/>
                <line x1={ax} y1={ay} x2={bx} y2={by} stroke={isSelected?'var(--accent)':'var(--text3)'} strokeWidth={isSelected?2.5:1.5} strokeDasharray={isSelected?'':'4 3'} style={{pointerEvents:'none'}}/>
                <rect x={mx-labelW/2} y={my-10} width={labelW} height={20} rx={4} fill="var(--bg2)" stroke={isSelected?'var(--accent)':'var(--border)'} strokeWidth={1}/>
                <text x={mx} y={my+5} textAnchor="middle" fontSize={10} fill={isSelected?'var(--accent)':'var(--text2)'} style={{pointerEvents:'none',userSelect:'none'}}>{r.label}</text>
              </g>
            );
          })}

          {worldChars.map(c => {
            const pos = getPos(c.id);
            const isConnecting = connecting===c.id;
            const imgSrc = c.image?(c.image.data||c.image.relPath||null):null;
            return (
              <g key={c.id} transform={"translate("+(pos.x-NODE_R)+","+(pos.y-NODE_R)+")"} style={{cursor:dragging?.id===c.id?'grabbing':'grab'}}>
                <circle cx={NODE_R} cy={NODE_R} r={NODE_R+2} fill={isConnecting?'var(--accent)':'var(--bg2)'} stroke={isConnecting?'var(--accent)':'var(--border)'} strokeWidth={isConnecting?3:1.5} onMouseDown={e=>onNodeMouseDown(e,c.id)}/>
                <RelPortrait id={c.id} src={imgSrc} r={NODE_R} onMouseDown={e=>onNodeMouseDown(e,c.id)}/>
                <text x={NODE_R} y={NODE_R*2+14} textAnchor="middle" fontSize={11} fill="var(--text)" fontWeight="600" style={{pointerEvents:'none',userSelect:'none'}}>{(c.name||'').slice(0,18)}</text>
                <text x={NODE_R} y={NODE_R*2+26} textAnchor="middle" fontSize={9} fill={isConnecting?"var(--accent)":"var(--text3)"} style={{userSelect:'none',cursor:'pointer'}} onClick={e=>{e.stopPropagation();setConnecting(connecting===c.id?null:c.id);}}>
                  {isConnecting?'cancel':'+ connect'}
                </text>
              </g>
            );
          })}
        </svg>
      )}

      {editEdge&&(
        <div ref={popupRef} style={popupStyle}>
          <div onMouseDown={onPopupMouseDown} style={{cursor:'grab',padding:'0 4px',color:'var(--text3)',fontSize:14}}>⠿</div>
          <input className="rel-label-input" style={{width:140,padding:'4px 8px',fontSize:12}} value={editLabelText} onChange={e=>setEditLabelText(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')saveEditLabel();if(e.key==='Escape')setEditEdge(null);}}/>
          <button className="btn primary" style={{fontSize:11,padding:'3px 8px'}} onClick={saveEditLabel} disabled={!editLabelText.trim()}><i className="ti ti-check"></i>Save</button>
          <button className="btn danger" style={{fontSize:11,padding:'3px 8px'}} onClick={()=>deleteRel(editEdge)}><i className="ti ti-trash"></i></button>
          <button className="btn" style={{fontSize:11,padding:'3px 8px'}} onClick={()=>setEditEdge(null)}>✕</button>
        </div>
      )}

      {labelInput&&(
        <div className="rel-label-modal">
          <div className="rel-label-box">
            <div style={{fontSize:13,fontWeight:600,marginBottom:8,color:'var(--text)'}}>
              {(data.characters.find(c=>c.id===labelInput.charA)?.name||'?')}
              {' — '}
              {(data.characters.find(c=>c.id===labelInput.charB)?.name||'?')}
            </div>
            <input className="rel-label-input" value={labelText} onChange={e=>setLabelText(e.target.value)} placeholder="e.g. rivals, lovers, siblings..." onKeyDown={e=>{if(e.key==='Enter')saveRelationship();if(e.key==='Escape'){setLabelInput(null);setLabelText('');}}} autoFocus/>
            <div style={{display:'flex',gap:8,marginTop:10}}>
              <button className="btn primary" onClick={saveRelationship} disabled={!labelText.trim()}><i className="ti ti-check"></i>Add</button>
              <button className="btn" onClick={()=>{setLabelInput(null);setLabelText('');}}>Cancel</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

          <div className="info-card">
            <h4>Quick Info</h4>

          <div style={{display:'flex',flexDirection:'column',gap:12}}>

              <div className="field-block"><label>Name</label><input value={pData.name} onChange={e=>updP(p=>p.name=e.target.value)}/></div>
              <div className="field-block"><label>Pronouns</label><input value={pData.pronouns||''} onChange={e=>updP(p=>p.pronouns=e.target.value)} placeholder="e.g. they/them, she/her"/></div>
            </div>
            <div className="field-block"><label>Description</label><textarea value={pData.description||''} onChange={e=>updP(p=>p.description=e.target.value)} style={{minHeight:200}} placeholder="Who is this persona? Appearance, personality, background…"/></div>
            <div className="field-block">
              <label>Linked Lorebook</label>
              <select value={pData.linked_lorebook||''} onChange={e=>updP(p=>p.linked_lorebook=e.target.value||null)}>
                <option value="">— None —</option>
                {data.lorebooks.map(l=>{const w=data.worlds.find(x=>x.id===l.world_id); return <option key={l.id} value={l.id}>{w?.emoji?w.emoji+' ':''}{w?.name?w.name+' · ':''}{l.name}</option>;})}
              </select>
              <div style={{fontSize:11,color:'var(--text3)',marginTop:4}}>Personas can have one lorebook attached — can be from any world.</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}



function BackupRestorePanel({data, update}) {
  const [status, setStatus] = useState(null);
  const [msg, setMsg] = useState('');

  const globalBackup = async () => {
    setStatus('working'); setMsg('Creating backup…');
    const res = await window.lorekeeper.exportBackup({});
    if(res.cancelled) { setStatus(null); return; }
    if(res.success) { setStatus('ok'); setMsg(`✓ Backup saved (${(res.size/1024).toFixed(0)} KB)`); }
    else { setStatus('err'); setMsg('Error: ' + res.error); }
  };

  const worldBackup = async (world) => {
    setStatus('working'); setMsg(`Exporting ${world.name}…`);
    const res = await window.lorekeeper.exportBackup({worldId: world.id});
    if(res.cancelled) { setStatus(null); return; }
    if(res.success) { setStatus('ok'); setMsg(`✓ ${world.name} exported (${(res.size/1024).toFixed(0)} KB)`); }
    else { setStatus('err'); setMsg('Error: ' + res.error); }
  };

  const restore = async () => {
    if(!window.confirm('Restore from backup? This will overwrite your current data and copy all files. Make sure to back up first!')) return;
    setStatus('working'); setMsg('Restoring…');
    const res = await window.lorekeeper.restoreBackup();
    if(res.cancelled) { setStatus(null); return; }
    if(res.success) {
      if(res.data._world_export) {
        // Per-world restore — merge into existing data
        update(d => {
          res.data.worlds.forEach(w => { if(!d.worlds.find(x=>x.id===w.id)) d.worlds.push(w); else Object.assign(d.worlds.find(x=>x.id===w.id), w); });
          res.data.characters.forEach(c => { if(!d.characters.find(x=>x.id===c.id)) d.characters.push(c); else Object.assign(d.characters.find(x=>x.id===c.id), c); });
          res.data.lorebooks.forEach(l => { if(!d.lorebooks.find(x=>x.id===l.id)) d.lorebooks.push(l); else Object.assign(d.lorebooks.find(x=>x.id===l.id), l); });
          res.data.collections.forEach(c => { if(!d.collections.find(x=>x.id===c.id)) d.collections.push(c); else Object.assign(d.collections.find(x=>x.id===c.id), c); });
          (res.data.templates||[]).forEach(t => { if(!d.templates.find(x=>x.id===t.id)) d.templates.push(t); });
        });
        setStatus('ok'); setMsg('✓ World restored and merged into existing data.');
      } else {
        // Global restore — full replace
        update(() => res.data);
        setStatus('ok'); setMsg('✓ Full restore complete. Restart Lorekeeper to ensure everything is fresh.');
      }
    } else { setStatus('err'); setMsg('Error: ' + res.error); }
  };

  return (
    <div style={{marginTop:24,background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--rl)',padding:16}}>
      <div style={{fontSize:11,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:12}}>Backup & Restore</div>
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        <div>
          <div style={{fontSize:12,color:'var(--text3)',marginBottom:8}}>Global backup — everything: all worlds, characters, lorebooks, collections, personas, templates, images</div>
          <button className="btn primary" style={{fontSize:12}} onClick={globalBackup} disabled={status==='working'}>
            <i className="ti ti-archive"></i>Export full backup (.zip)
          </button>
        </div>
        <div>
          <div style={{fontSize:12,color:'var(--text3)',marginBottom:8}}>Per-world export — one world and all its content</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
            {[...data.worlds].sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)).map(w=>(
              <button key={w.id} className="btn" style={{fontSize:11}} onClick={()=>worldBackup(w)} disabled={status==='working'}>
                {w.emoji?w.emoji+' ':''}{w.name}
              </button>
            ))}
          </div>
        </div>
        <div style={{borderTop:'1px solid var(--border)',paddingTop:10}}>
          <div style={{fontSize:12,color:'var(--text3)',marginBottom:8}}>Restore from a previous backup zip. Copies all files and replaces data.</div>
          <button className="btn danger" style={{fontSize:12}} onClick={restore} disabled={status==='working'}>
            <i className="ti ti-restore"></i>Restore from backup…
          </button>
        </div>
        {status&&status!=='working'&&<div style={{fontSize:12,color:status==='ok'?'#6ee7b7':'var(--red)',marginTop:4}}>{msg}</div>}
        {status==='working'&&<div style={{fontSize:12,color:'var(--text3)',marginTop:4}}><i className="ti ti-loader"></i> {msg}</div>}
      </div>
    </div>
  );
}

function ImageMigrationPanel({data, update}) {
  const [status, setStatus] = useState(null); // null | 'scanning' | 'scanned' | 'migrating' | 'done'
  const [report, setReport] = useState([]);
  const [migrated, setMigrated] = useState(0);

  const rescanImages = async () => {
    setStatus('scanning');
    const [loreResults, collResults] = await Promise.all([
      window.lorekeeper.scanLorebooks(),
      window.lorekeeper.scanCollections(),
    ]);
    let count = 0;
    update(d => {
      for(const item of loreResults) {
        if(!item.imageRelPath) continue;
        const l = item.jsonData?.id && d.lorebooks.find(x => x.id === item.jsonData.id);
        if(l && !l.image_relpath) { l.image_relpath = item.imageRelPath; count++; }
      }
      for(const item of collResults) {
        if(!item.imageRelPath) continue;
        const c = item.jsonData?.id && d.collections.find(x => x.id === item.jsonData.id);
        if(c && !c.image_relpath) { c.image_relpath = item.imageRelPath; count++; }
      }
    });
    setStatus('rescan_done');
    setMigrated(count);
  };

  const scan = async () => {
    setStatus('scanning');
    const items = [];
    const checkItem = async (type, id, name, imageData, imageRelpath, filename) => {
      if(!imageData) return;
      if(imageRelpath) {
        const ok = await window.lorekeeper.readImagePath(imageRelpath).then(r=>!!r).catch(()=>false);
        items.push({type, id, name, status: ok?'relpath_ok':'relpath_broken', relpath:imageRelpath});
      } else {
        items.push({type, id, name, filename, status:'needs_migration'});
      }
    };
    for(const l of data.lorebooks) await checkItem('lorebook', l.id, l.name, l.image_data, l.image_relpath, l.lorebook_filename);
    for(const c of data.collections) await checkItem('collection', c.id, c.name, c.image_data, c.image_relpath, c.collection_filename);
    for(const w of data.worlds) await checkItem('world', w.id, w.name, w.image, w.image_relpath, w.name.replace(/[^a-zA-Z0-9_-]/g,'_'));
    for(const p of (data.personas||[])) await checkItem('persona', p.id, p.name, p.image?.data, p.image_relpath, p.name.replace(/[^a-zA-Z0-9_-]/g,'_'));
    for(const c of data.characters) {
      if(c.companion_profile_banner_image?.data && !c.companion_profile_banner_image?.relPath) {
        items.push({type:'companion_banner', id:c.id, name:(c.display_name||c.name)+' (banner)', filename:(c.companion_folder||c.name.replace(/[^a-zA-Z0-9_-]/g,'_'))+'_banner', status:'needs_migration'});
      }
    }
    setReport(items);
    setStatus('scanned');
  };

  const migrate = async () => {
    setStatus('migrating');
    let count = 0;
    const folderMap = {lorebook:'Lorebooks', collection:'Collections', world:'Worlds', persona:'Personas'};
    for(const item of report) {
      if(item.status !== 'needs_migration') continue;
      const basename = item.filename ? item.filename.replace(/\.json$/i,'') : item.name.replace(/[^a-zA-Z0-9_-]/g,'_').replace(/_+/g,'_').replace(/^_|_$/g,'');
      let base64 = null;
      let destFolder = folderMap[item.type]||'Misc';
      if(item.type==='lorebook') base64 = data.lorebooks.find(x=>x.id===item.id)?.image_data;
      else if(item.type==='collection') base64 = data.collections.find(x=>x.id===item.id)?.image_data;
      else if(item.type==='world') base64 = data.worlds.find(x=>x.id===item.id)?.image;
      else if(item.type==='persona') base64 = (data.personas||[]).find(x=>x.id===item.id)?.image?.data;
      else if(item.type==='companion_banner') {
        const ch = data.characters.find(x=>x.id===item.id);
        base64 = ch?.companion_profile_banner_image?.data;
        destFolder = 'Companions/' + (ch?.companion_folder || basename);
      }
      if(!base64) continue;
      const res = await window.lorekeeper.writeImageFromBase64({ base64, destFolder, filename: basename });
      if(res?.relPath) {
        update(d=>{
          if(item.type==='lorebook'){ const o=d.lorebooks.find(x=>x.id===item.id); if(o){o.image_relpath=res.relPath;o.image_data=null;}}
          else if(item.type==='collection'){ const o=d.collections.find(x=>x.id===item.id); if(o){o.image_relpath=res.relPath;o.image_data=null;}}
          else if(item.type==='world'){ const o=d.worlds.find(x=>x.id===item.id); if(o){o.image_relpath=res.relPath;o.image=null;}}
          else if(item.type==='persona'){ const o=(d.personas||[]).find(x=>x.id===item.id); if(o){o.image_relpath=res.relPath;if(o.image)o.image.data=null;}}
          else if(item.type==='companion_banner'){ const o=d.characters.find(x=>x.id===item.id); if(o)o.companion_profile_banner_image={relPath:res.relPath};}
        });
        count++;
      }
    }
    setMigrated(count);
    setStatus('done');
  };


  const needsMigration = report.filter(r=>r.status==='needs_migration');
  const relpathOk = report.filter(r=>r.status==='relpath_ok');
  const relpathBroken = report.filter(r=>r.status==='relpath_broken');

  const S = {
    box: {marginTop:24,background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--rl)',padding:16},
    label: {fontSize:11,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.06em'},
  };

  return (
    <div style={S.box}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
        <span style={S.label}>Image Storage Audit</span>
        <div style={{display:'flex',gap:6}}>
          <button className="btn" style={{fontSize:11}} onClick={rescanImages} disabled={status==='scanning'||status==='migrating'} title="Scan folders for new images and link them — touches nothing else">
            <i className="ti ti-photo-scan"></i>Rescan images
          </button>
          <button className="btn" style={{fontSize:11}} onClick={scan} disabled={status==='scanning'||status==='migrating'}>
            <i className={`ti ${status==='scanning'?'ti-loader':'ti-scan'}`}></i>
            {status==='scanning'?'Scanning…':'Audit base64'}
          </button>
        </div>
      </div>
      <p style={{fontSize:12,color:'var(--text3)',marginBottom:status?12:0}}>
        Checks lorebooks and collections for base64 images that should be stored as local files instead.
      </p>
      {status==='scanned'&&report.length===0&&(
        <div style={{fontSize:12,color:'#6ee7b7'}}>✓ No base64 images found — all clean.</div>
      )}
      {status==='scanned'&&report.length>0&&(
        <div style={{display:'flex',flexDirection:'column',gap:6}}>
          {relpathOk.length>0&&<div>
            <div style={{fontSize:12,color:'#6ee7b7',marginBottom:4}}>✓ {relpathOk.length} already using local file (relpath verified)</div>
            {relpathOk.map(r=><div key={r.id} style={{fontSize:10,color:'var(--text3)',paddingLeft:12,padding:'1px 0 1px 12px'}}>
              <i className={`ti ${r.type==='lorebook'?'ti-book':r.type==='world'?'ti-world':r.type==='persona'?'ti-masks-theater':r.type==='companion_banner'?'ti-user':'ti-folders'}`} style={{fontSize:10,marginRight:4}}></i>
              {r.name} → <span style={{fontFamily:'monospace'}}>{r.relpath}</span>
            </div>)}
          </div>}
          {relpathBroken.length>0&&<div style={{fontSize:12,color:'var(--amber)'}}>⚠ {relpathBroken.length} have relpath but file not found: {relpathBroken.map(r=>r.name).join(', ')}</div>}
          {needsMigration.length>0&&(
            <div>
              <div style={{fontSize:12,color:'var(--amber)',marginBottom:8}}>
                {needsMigration.length} item{needsMigration.length>1?'s':''} storing image as base64 — can be migrated to local files:
              </div>
              {needsMigration.map(r=>(
                <div key={r.id} style={{fontSize:11,color:'var(--text3)',padding:'3px 0',display:'flex',gap:8,alignItems:'center'}}>
                  <i className={`ti ${r.type==='lorebook'?'ti-book':'ti-folders'}`} style={{color:'var(--amber)',fontSize:12}}></i>
                  {r.name}
                  {r.filename
                    ?<span style={{fontSize:10,color:'var(--text3)'}}>→ {r.type==='lorebook'?'Lorebooks':'Collections'}\{r.filename.replace(/\.json$/i,'')}</span>
                    :<span style={{fontSize:10,color:'var(--red)'}}>— no filename set, will use sanitized name</span>}
                </div>
              ))}
              <button className="btn primary" style={{marginTop:10,fontSize:12}} onClick={migrate}>
                <i className="ti ti-file-export"></i>Migrate {needsMigration.length} image{needsMigration.length>1?'s':''} to local files
              </button>
            </div>
          )}
        </div>
      )}
      {status==='migrating'&&<div style={{fontSize:12,color:'var(--text3)'}}><i className="ti ti-loader"></i> Migrating…</div>}
      {status==='rescan_done'&&<div style={{fontSize:12,color:'#6ee7b7'}}>✓ Linked {migrated} new image{migrated!==1?'s':''} from local folders.{migrated===0?' All already up to date.':''}</div>}
      {status==='done'&&<div style={{fontSize:12,color:'#6ee7b7'}}>✓ Migrated {migrated} image{migrated!==1?'s':''} to local files. base64 cleared from data.</div>}
    </div>
  );
}

function BatchImportPage({data,update}) {
  const [companions,setCompanions]=useState([]);
  const [lorebooks,setLorebooks]=useState([]);
  const [collections,setCollections]=useState([]);
  const [scanning,setScanning]=useState(false);
  const [scanned,setScanned]=useState(false);
  const [assignments,setAssignments]=useState({}); // id -> worldId
  const [importing,setImporting]=useState(false);
  const [done,setDone]=useState(null);

  const scan=async()=>{
    setScanning(true);
    const results = await Promise.all([
      window.lorekeeper.scanCompanions(),
      window.lorekeeper.scanLorebooks(),
      window.lorekeeper.scanCollections()
    ]);
    const c=results[0], l=results[1], col=results[2];
    setCompanions(c||[]);
    setLorebooks(l||[]);
    setCollections(col||[]);
    // Auto-assign world based on existing data
    const auto={};
    (c||[]).forEach(item=>{
      if(item.jsonData?.id){
        const existing=data.characters.find(x=>x.id===item.jsonData.id);
        if(existing) auto[item.jsonData.id]=existing.world_id||'__none__';
      }
    });
    (l||[]).forEach(item=>{
      if(item.jsonData?.id){
        const existing=data.lorebooks.find(x=>x.id===item.jsonData.id);
        if(existing) auto[item.jsonData.id]=existing.world_id||'__none__';
      }
    });
    (col||[]).forEach(item=>{
      if(item.jsonData?.id){
        const existing=data.collections.find(x=>x.id===item.jsonData.id);
        if(existing) auto[item.jsonData.id]=existing.world_id||'__none__';
      }
    });
    setAssignments(auto);
    setScanning(false);
    setScanned(true);
  };

  const setA=(id,val)=>setAssignments(a=>({...a,[id]:val}));

  const importAll=async()=>{
    setImporting(true);
    let charCount=0,loreCount=0,collCount=0,skipCount=0;

    update(d=>{
      // Import collections first
      collections.forEach(item=>{
        if(!item.jsonData) return;
        const wid=assignments[item.jsonData.id||item.filename];
        if(!wid||wid==='__skip__') return;
        const worldId = wid==='__none__' ? null : wid;
        const obj=item.jsonData;
        const existing=d.collections.find(x=>x.id===obj.id);
        if(existing){
          const pts=s=>{if(!s)return 0;const t=new Date(s).getTime();return isNaN(t)?0:t;};
          if(pts(existing.updated_at)>pts(obj.updated_at)&&pts(existing.updated_at)>0){skipCount++;return;}
          existing.name=obj.name||existing.name;
          existing.definition=obj.description||existing.definition;
          existing.tags=obj.tags||existing.tags;
          existing.companions=obj.companions||existing.companions;
          existing.updated_at=now();
          if(item.filename&&!existing.collection_filename)existing.collection_filename=item.filename;
          if(item.imageRelPath&&!existing.image_relpath)existing.image_relpath=item.imageRelPath;
          collCount++;
        } else {
          d.collections.push({id:obj.id||uuid(),world_id:worldId,name:obj.name||'',definition:obj.description||'',tags:obj.tags||[],fandom_tags:obj.fandom_tags||[],access_level:obj.access_level||'private',image:obj.image||null,image_data:null,image_relpath:item.imageRelPath||null,companions:obj.companions||[],has_been_public:obj.has_been_public||false,very_nsfw:obj.very_nsfw||false,lorebook_display:obj.lorebook_display||'',posted_at:obj.posted_at||now(),updated_at:now(),hide_on_owner_profile:false,collection_filename:item.filename||null});
          collCount++;
        }
      });

      // Import lorebooks
      lorebooks.forEach(item=>{
        if(!item.jsonData) return;
        const wid=assignments[item.jsonData.id||item.filename];
        if(!wid||wid==='__skip__') return;
        const worldId = wid==='__none__' ? null : wid;
        const obj=item.jsonData;
        const existing=d.lorebooks.find(x=>x.id===obj.id);
        if(existing){
          const pts=s=>{if(!s)return 0;const t=new Date(s).getTime();return isNaN(t)?0:t;};
          if(pts(existing.updated_at)>pts(obj.updated_at)&&pts(existing.updated_at)>0){skipCount++;return;}
          existing.content=obj.content||existing.content;
          existing.tags=obj.tags||existing.tags;
          existing.name=obj.name||existing.name;
          existing.short_description=obj.short_description||existing.short_description;
          existing.updated_at=now();
          if(item.filename&&!existing.lorebook_filename)existing.lorebook_filename=item.filename;
          if(item.imageRelPath&&!existing.image_relpath)existing.image_relpath=item.imageRelPath;
          loreCount++;
        } else {
          d.lorebooks.push({id:obj.id||uuid(),world_id:worldId,name:obj.name||'',short_description:obj.short_description||'',content:obj.content||[],tags:obj.tags||[],fandom_tags:obj.fandom_tags||[],nsfw:obj.nsfw||false,very_nsfw:obj.very_nsfw||false,image_id:obj.image_id||null,image_data:null,image_relpath:item.imageRelPath||null,collaboration_type:obj.collaboration_type||'private',definition_protection:obj.definition_protection||'copy_protection',has_been_public:obj.has_been_public||false,posted_at:obj.posted_at||now(),updated_at:now(),hide_on_owner_profile:false,selected_chapter_index:0,access_level:obj.access_level||'private',lorebook_filename:item.filename||null});
          loreCount++;
        }
      });

      // Import companions
      companions.forEach(item=>{
        if(!item.jsonData) return;
        const wid=assignments[item.jsonData.id||item.folderName];
        if(!wid) return;
        const worldId = wid==='__none__' ? null : wid;
        const obj=item.jsonData;
        const status=obj.access_level==='public'?'posted':'draft';
        const portraits=(obj.portraits||[]).map(p=>{
          // Match image files by name
          const matchedImg=item.imageFiles.find(f=>
            f.name.toLowerCase().includes('profile')||
            f.name.toLowerCase()===p.name?.toLowerCase()
          );
          return {...p, data:null, relPath:matchedImg?.relPath||null};
        });
        // Assign images to portrait slots by filename order
        item.imageFiles.forEach((imgFile,idx)=>{
          if(portraits[idx]) portraits[idx].relPath=imgFile.relPath;
          else if(idx<10) portraits.push({name:imgFile.name,description:'',very_sus:false,data:null,relPath:imgFile.relPath});
        });

        const existing=d.characters.find(x=>x.id===obj.id);
        if(existing){
          const parseTs=s=>{if(!s)return 0;const t=new Date(s).getTime();return isNaN(t)?0:t;};
          const localTime = parseTs(existing.updated_at);
          const importTime = parseTs(obj.updated_at);
          // Skip if local is newer — user has edited since last platform export
          if(localTime > importTime && localTime > 0){ skipCount++; return; }
          const mainImage = portraits[0]?.relPath ? {relPath:portraits[0].relPath} : existing.image;
          const folderName = item.folderName || existing.companion_folder;
          Object.assign(existing,{name:obj.name||existing.name,display_name:obj.display_name||existing.display_name,short_description:obj.short_description||existing.short_description,full_description:obj.full_description||existing.full_description,card:obj.card||existing.card,example_dialogue:obj.example_dialogue||existing.example_dialogue,tags:obj.tags||existing.tags,fandom_tags:obj.fandom_tags||existing.fandom_tags,sus:obj.sus!==undefined?obj.sus:existing.sus,very_sus:obj.very_sus!==undefined?obj.very_sus:existing.very_sus,starting_scenarios:obj.starting_scenarios||existing.starting_scenarios,formatting_instructions:obj.formatting_instructions||existing.formatting_instructions,advanced_prompt:obj.advanced_prompt||existing.advanced_prompt,access_level:obj.access_level||existing.access_level,status,image:mainImage,portraits,updated_at:now(),companion_folder:folderName||existing.companion_folder||null});
          charCount++;
        } else {
          const char={id:obj.id||uuid(),world_id:worldId,name:obj.name||item.folderName,display_name:obj.display_name||obj.name||'',short_description:obj.short_description||'',full_description:obj.full_description||'',card:obj.card||'',example_dialogue:obj.example_dialogue||'',tags:obj.tags||[],fandom_tags:obj.fandom_tags||[],sus:obj.sus||false,very_sus:obj.very_sus||false,starting_scenarios:obj.starting_scenarios||[],formatting_instructions:obj.formatting_instructions||'',advanced_prompt:obj.advanced_prompt||'',access_level:obj.access_level||'private',open_definition:obj.open_definition||false,external_model_policy:obj.external_model_policy||'vetted_only',locked_starting_message:obj.locked_starting_message||false,unlocked_portraits:obj.unlocked_portraits!==undefined?obj.unlocked_portraits:true,hide_on_owner_profile:obj.hide_on_owner_profile||false,suppress_companion_profile_banner:obj.suppress_companion_profile_banner||false,preserve_existing_chats:obj.preserve_existing_chats!==undefined?obj.preserve_existing_chats:true,posted_at:obj.posted_at||now(),created_at:obj.created_at||now(),updated_at:now(),voice_catalog_id:obj.voice_catalog_id||null,temperature_offset_percentage:obj.temperature_offset_percentage||0,status,schedule_dates:[],collections:[],linked_lorebooks:[],image:portraits[0]?.relPath?{relPath:portraits[0].relPath}:null,portraits,companion_profile_banner_image:null,author_id:obj.author_id||'',author_handle:obj.author_handle||'',companion_folder:item.folderName||null};
          // Auto-link collections
          d.collections.forEach(col=>{if((col.companions||[]).includes(char.id))char.collections.push(col.id);});
          d.characters.push(char);
          charCount++;
        }
      });
    });

    setDone({charCount,loreCount,collCount,skipCount});
    setImporting(false);
  };

  const sortedWorlds=[...data.worlds].sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0));
  const WorldSelect = ({id}) => (
    <select value={assignments[id]||''} onChange={e=>setA(id,e.target.value)} style={{background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',padding:'5px 8px',borderRadius:'var(--r)',fontSize:12,outline:'none',flexShrink:0}}>
      <option value="">— assign world —</option>
      <option value="__none__">No World (standalone)</option>
      <optgroup label="──────────"></optgroup>
      {sortedWorlds.map(w=><option key={w.id} value={w.id}>{w.emoji?w.emoji+' ':''}{w.name}</option>)}
    </select>
  );

  if(!scanned) return (
    <div>
      <div style={{maxWidth:600}}>
        <div className="field-block" style={{marginBottom:16}}>
          <label>How it works</label>
          <p style={{fontSize:13,color:'var(--text3)',lineHeight:1.7,marginTop:4}}>
            Place your files in <code style={{background:'var(--bg3)',padding:'1px 5px',borderRadius:3,fontSize:12}}>I:\Lorekeeper\</code> like this:<br/><br/>
            <code style={{background:'var(--bg3)',padding:'6px 10px',borderRadius:4,fontSize:11,display:'block',lineHeight:1.8}}>
              Companions\CharacterName\character.json + images<br/>
              Lorebooks\lorebook.json<br/>
              Collections\collection.json
            </code>
          </p>
        </div>
        <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
          <button className="btn primary" onClick={scan} disabled={scanning}>
            <i className="ti ti-scan"></i>{scanning?'Scanning…':'Scan Folders'}
          </button>
          <button className="btn" onClick={()=>window.lorekeeper.openFolder('')}>
            <i className="ti ti-folder-open"></i>Open I:\Lorekeeper
          </button>
          <BatchImportHelp/>
        </div>
      </div>
      <ImageMigrationPanel data={data} update={update}/>
    <BackupRestorePanel data={data} update={update}/>
    </div>
  );

  if(done) return (
    <div style={{maxWidth:500,textAlign:'center',padding:'40px 0'}}>
      <i className="ti ti-circle-check" style={{fontSize:48,color:'var(--green)',display:'block',marginBottom:16}}></i>
      <h2 style={{fontSize:20,fontWeight:600,color:'var(--text)',marginBottom:8}}>Import complete!</h2>
      <p style={{fontSize:14,color:'var(--text3)',lineHeight:1.8}}>
        {done.charCount} characters imported or updated<br/>
        {done.loreCount} lorebooks imported<br/>
        {done.collCount} collections imported<br/>
        {done.skipCount} skipped (local is newer)
      </p>
      <p style={{fontSize:13,color:'var(--text3)',marginTop:16}}>Images are linked by file path — they'll load from I:\Lorekeeper\Companions\ automatically.</p>
      <button className="btn primary" style={{margin:'20px auto 0',display:'flex'}} onClick={()=>{setScanned(false);setDone(null);setCompanions([]);setLorebooks([]);setCollections([]);}}>
        <i className="ti ti-refresh"></i>Scan again
      </button>
    </div>
  );

  const pts=s=>{if(!s)return 0;const t=new Date(s).getTime();return isNaN(t)?0:t;};
  const willImport=(item,existingLocal)=>{
    if(!existingLocal) return true; // new
    const localTime=pts(existingLocal.updated_at);
    const importTime=pts(item.jsonData?.updated_at);
    return !(localTime>importTime&&localTime>0); // skip if local is newer
  };
  const totalToImport=[
    ...companions.filter(item=>{
      const id=item.jsonData?.id||item.folderName;
      const a=assignments[id];
      if(!a||a==='__skip__') return false;
      const existing=item.jsonData?.id&&data.characters.find(x=>x.id===item.jsonData.id);
      return willImport(item,existing);
    }),
    ...lorebooks.filter(item=>{
      const id=item.jsonData?.id||item.filename;
      const a=assignments[id];
      if(!a||a==='__skip__') return false;
      const existing=item.jsonData?.id&&data.lorebooks.find(x=>x.id===item.jsonData.id);
      return willImport(item,existing);
    }),
    ...collections.filter(item=>{
      const id=item.jsonData?.id||item.filename;
      const a=assignments[id];
      if(!a||a==='__skip__') return false;
      const existing=item.jsonData?.id&&data.collections.find(x=>x.id===item.jsonData.id);
      return willImport(item,existing);
    }),
  ].length;

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
        <div style={{fontSize:13,color:'var(--text3)'}}>{companions.length} companions · {lorebooks.length} lorebooks · {collections.length} collections found</div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn" onClick={scan}><i className="ti ti-refresh"></i>Rescan</button>
          <button className="btn primary" disabled={totalToImport===0||importing} onClick={importAll}>
            <i className="ti ti-download"></i>{importing?'Importing…':`Import ${totalToImport} items`}
          </button>
        </div>
      </div>

      {collections.length>0&&<div style={{marginBottom:24}}>
        <div style={{fontSize:11,color:'var(--text3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:10}}>Collections ({collections.length})</div>
        {collections.map(item=>{
          const id=item.jsonData?.id||item.filename;
          const existing=item.jsonData?.id&&data.collections.find(x=>x.id===item.jsonData.id);
          const localTime=pts(existing?.updated_at);
          const importTime=pts(item.jsonData?.updated_at);
          const isNew=!existing;
          const localNewer=!isNew&&localTime>importTime&&localTime>0;
          const upToDate=!isNew&&!localNewer&&Math.abs(localTime-importTime)<1000;
          return <div key={id} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 14px',background:'var(--bg2)',border:localNewer?'1px solid rgba(251,191,36,0.3)':'1px solid var(--border)',borderRadius:'var(--r)',marginBottom:6,opacity:upToDate?0.6:1}}>
            {item.thumbnail&&<img src={item.thumbnail} style={{width:40,height:40,borderRadius:4,objectFit:'cover',flexShrink:0}}/>}
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13,fontWeight:500,color:'var(--text)'}}>{item.jsonData?.name||item.filename}</div>
              <ScanTagChips tags={item.jsonData?.tags}/>
            </div>
            <div style={{display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
              <ScanBadge isNew={isNew} localNewer={localNewer} upToDate={upToDate}/>
              <WorldSelect id={id}/>
            </div>
          </div>;
        })}
      </div>}

      {lorebooks.length>0&&<div style={{marginBottom:24}}>
        <div style={{fontSize:11,color:'var(--text3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:10}}>Lorebooks ({lorebooks.length})</div>
        {lorebooks.map(item=>{
          const id=item.jsonData?.id||item.filename;
          const existing=item.jsonData?.id&&data.lorebooks.find(x=>x.id===item.jsonData.id);
          const localTime=pts(existing?.updated_at);
          const importTime=pts(item.jsonData?.updated_at);
          const isNew=!existing;
          const localNewer=!isNew&&localTime>importTime&&localTime>0;
          const upToDate=!isNew&&!localNewer&&Math.abs(localTime-importTime)<1000;
          return <div key={id} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 14px',background:'var(--bg2)',border:localNewer?'1px solid rgba(251,191,36,0.3)':'1px solid var(--border)',borderRadius:'var(--r)',marginBottom:6,opacity:upToDate?0.6:1}}>
            <i className="ti ti-book" style={{fontSize:18,color:'var(--amber)',flexShrink:0}}></i>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13,fontWeight:500,color:'var(--text)'}}>{item.jsonData?.name||item.filename}</div>
              <ScanTagChips tags={item.jsonData?.tags}/>
            </div>
            <div style={{display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
              <ScanBadge isNew={isNew} localNewer={localNewer} upToDate={upToDate}/>
              <WorldSelect id={id}/>
            </div>
          </div>;
        })}
      </div>}

      {companions.length>0&&<div>
        <div style={{fontSize:11,color:'var(--text3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:10}}>Companions ({companions.length})</div>
        {companions.map(item=>{
          const id=item.jsonData?.id||item.folderName;
          const existing=item.jsonData?.id&&data.characters.find(x=>x.id===item.jsonData.id);
          const pts=s=>{if(!s)return 0;const t=new Date(s).getTime();return isNaN(t)?0:t;};
          const localTime=pts(existing?.updated_at);
          const importTime=pts(item.jsonData?.updated_at);
          const isNew=!existing;
          const localNewer=!isNew&&localTime>importTime;
          const upToDate=!isNew&&localTime===importTime;
          const updateAvail=!isNew&&importTime>localTime;
          return <div key={id} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 14px',background:'var(--bg2)',border:localNewer?'1px solid rgba(251,191,36,0.3)':'1px solid var(--border)',borderRadius:'var(--r)',marginBottom:6,opacity:upToDate?0.6:1}}>
            {item.thumbnail?<img src={item.thumbnail} style={{width:40,height:40,borderRadius:4,objectFit:'cover',flexShrink:0}}/>:<div style={{width:40,height:40,borderRadius:4,background:'var(--bg3)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><i className="ti ti-user" style={{color:'var(--text3)'}}></i></div>}
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13,fontWeight:500,color:'var(--text)'}}>{item.jsonData?.display_name||item.jsonData?.name||item.folderName}</div>
              <div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>{item.imageFiles.length} images · {(()=>{if(!item.jsonData?.updated_at)return 'no date';const t=new Date(item.jsonData.updated_at);return isNaN(t.getTime())?'no date':t.toLocaleDateString();})()}</div>
              <ScanTagChips tags={item.jsonData?.tags}/>
            </div>
            <div style={{display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
              <ScanBadge isNew={isNew} localNewer={localNewer} upToDate={upToDate}/>
              <WorldSelect id={id}/>
            </div>
          </div>;
        })}
      </div>}
    <ImageMigrationPanel data={data} update={update}/>
    </div>
  );
}

  ['display_name_format','Display Name Format','input','e.g. {{name}} · Title'],
  ['short_description','Short Description','input'],
  ['full_description','Full Description (public facing)','textarea'],
  ['card','Character Card','textarea'],
  ['formatting_instructions','Formatting Instructions','textarea'],
  ['advanced_prompt','Advanced Prompt','textarea'],
  ['access_level','Access Level','select',['private','unlisted','public']],
  ['sus','Spicy','checkbox'],
  ['very_sus','Extra Spicy','checkbox'],
  ['temperature_offset_percentage','Temperature Offset %','number'],
  ['locked_starting_message','Locked Starting Message','checkbox'],

function TemplatesPage({data,update,newTemplate,clearNew}) {
  const [editing,setEditing]=useState(null);
  React.useEffect(()=>{if(newTemplate){setEditing('new');clearNew();}},[newTemplate]);
  const templates=data.templates||[];
  const worlds=data.worlds;
  const updT=(id,fn)=>update(d=>{const t=d.templates.find(x=>x.id===id);if(t)fn(t);});

  if(editing) {
    const t=editing==='new'?null:templates.find(x=>x.id===editing);
    return <TemplateEditor template={t} data={data} update={update} onBack={()=>setEditing(null)} />;
  }

  const globalTemplates=templates.filter(t=>!t.world_id);
  const worldTemplates=templates.filter(t=>!!t.world_id);

  return (
    <div>
      {templates.length===0&&<div className="empty"><i className="ti ti-template"></i><h3>No templates yet</h3><p>Templates pre-fill character fields on creation. Create a global template or associate one with a world.</p></div>}
      {globalTemplates.length>0&&<div style={{marginBottom:24}}>
        <div style={{fontSize:11,color:'var(--text3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:12}}>Global</div>
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          {globalTemplates.map(t=>(
            <div key={t.id} style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--rl)',padding:'14px 16px',display:'flex',alignItems:'center',gap:12,cursor:'pointer'}} onClick={()=>setEditing(t.id)}>
              <i className="ti ti-template" style={{fontSize:20,color:'var(--accent)',flexShrink:0}}></i>
              <div style={{flex:1}}>
                <div style={{fontSize:14,fontWeight:600,color:'var(--text)'}}>{t.name}</div>
                <div style={{fontSize:12,color:'var(--text3)',marginTop:2}}>{Object.keys(t.fields||{}).filter(k=>t.fields[k]!==undefined&&t.fields[k]!=='').length} fields set</div>
              </div>
              <button className="btn danger" style={{padding:'4px 8px',fontSize:12}} onClick={e=>{e.stopPropagation();if(window.confirm(`Delete "${t.name}"?`))update(d=>{d.templates=d.templates.filter(x=>x.id!==t.id);});}}><i className="ti ti-trash"></i></button>
            </div>
          ))}
        </div>
      </div>}
      {worlds.map(w=>{
        const wt=worldTemplates.filter(t=>t.world_id===w.id);
        if(wt.length===0) return null;
        return <div key={w.id} style={{marginBottom:24}}>
          <div style={{fontSize:11,color:'var(--text3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:12,display:'flex',alignItems:'center',gap:6}}>
            {w.emoji&&<span>{w.emoji}</span>}{w.name}
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {wt.map(t=>(
              <div key={t.id} style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--rl)',padding:'14px 16px',display:'flex',alignItems:'center',gap:12,cursor:'pointer'}} onClick={()=>setEditing(t.id)}>
                <i className="ti ti-template" style={{fontSize:20,color:'var(--teal)',flexShrink:0}}></i>
                <div style={{flex:1}}>
                  <div style={{fontSize:14,fontWeight:600,color:'var(--text)'}}>{t.name}</div>
                  <div style={{fontSize:12,color:'var(--text3)',marginTop:2}}>{Object.keys(t.fields||{}).filter(k=>t.fields[k]!==undefined&&t.fields[k]!=='').length} fields set</div>
                </div>
                <button className="btn danger" style={{padding:'4px 8px',fontSize:12}} onClick={e=>{e.stopPropagation();if(window.confirm(`Delete "${t.name}"?`))update(d=>{d.templates=d.templates.filter(x=>x.id!==t.id);});}}><i className="ti ti-trash"></i></button>
              </div>
            ))}
          </div>
        </div>;
      })}
    </div>
  );
}

function TemplateEditor({template,data,update,onBack}) {
  const isNew=!template;
  const [name,setName]=useState(template?.name||'');
  const [worldId,setWorldId]=useState(template?.world_id||'');
  const [fields,setFields]=useState(template?.fields||{});
  const setF=(k,v)=>setFields(f=>({...f,[k]:v}));
  const save=()=>{
    if(!name.trim())return;
    if(isNew){
      update(d=>{if(!d.templates)d.templates=[];d.templates.push({id:uuid(),name:name.trim(),world_id:worldId||null,fields});});
    } else {
      update(d=>{const t=d.templates.find(x=>x.id===template.id);if(t){t.name=name.trim();t.world_id=worldId||null;t.fields=fields;}});
    }
    onBack();
  };
  return (
    <div>
      <div className="breadcrumb" onClick={onBack}><i className="ti ti-arrow-left"></i><span>Templates</span><i className="ti ti-chevron-right"></i><span>{isNew?'New Template':template.name}</span></div>
      <div style={{maxWidth:700,display:'flex',flexDirection:'column',gap:14}}>
        <div className="field-row">
          <div className="field-block">
            <label>Template Name</label>
            <input value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Base Template, Guideverse Powers…"/>
          </div>
          <div className="field-block">
            <label>World <span style={{color:'var(--text3)',fontWeight:'normal',textTransform:'none',letterSpacing:0,fontSize:11}}>— leave empty for global</span></label>
            <select value={worldId} onChange={e=>setWorldId(e.target.value)}>
              <option value="">Global (all worlds)</option>
              {[...data.worlds].sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)).map(w=><option key={w.id} value={w.id}>{w.emoji?w.emoji+' ':''}{w.name}</option>)}
            </select>
          </div>
        </div>
        <div style={{fontSize:12,color:'var(--text3)',padding:'0 2px'}}>Fill in only the fields you want this template to set. Empty fields will be skipped.</div>
        {TEMPLATE_FIELDS.map(([key,label,type,extra])=>(
          <div key={key} className="field-block">
            <label>{label}</label>
            {type==='textarea'&&<textarea value={fields[key]||''} onChange={e=>setF(key,e.target.value)} style={{minHeight:key==='card'?300:80}} placeholder={`Template value for ${label}…`}/>}
            {type==='input'&&<input value={fields[key]||''} onChange={e=>setF(key,e.target.value)} placeholder={extra||''}/>}
            {type==='select'&&<select value={fields[key]||''} onChange={e=>setF(key,e.target.value)}><option value="">— don't set —</option>{extra.map(o=><option key={o} value={o}>{o}</option>)}</select>}
            {type==='checkbox'&&<label style={{display:'flex',alignItems:'center',gap:8,fontWeight:'normal',textTransform:'none',letterSpacing:0,fontSize:13,color:'var(--text2)',cursor:'pointer',marginTop:4}}>
              <input type="checkbox" checked={!!fields[key]} onChange={e=>setF(key,e.target.checked)} style={{width:'auto',accentColor:'var(--accent)'}}/>{label}
            </label>}
            {type==='number'&&<input type="number" min="-100" max="100" value={fields[key]||0} onChange={e=>setF(key,Number(e.target.value))}/>}
            {type==='tags'&&<TagSelector value={fields[key]||[]} onChange={v=>setF(key,v)} max={25}/>}
            {type==='fandom_tags'&&<TagInput value={fields[key]||[]} onChange={v=>setF(key,v.slice(0,3))}/>}
          </div>
        ))}
        <div style={{display:'flex',gap:8,marginTop:4}}>
          <button className="btn" onClick={onBack}>Cancel</button>
          <button className="btn primary" disabled={!name.trim()} onClick={save}><i className="ti ti-check"></i>{isNew?'Create Template':'Save Changes'}</button>
          {!isNew&&<button className="btn" onClick={()=>{
            const lines=["# "+name];
            const world=data.worlds.find(w=>w.id===worldId);
            if(world){lines.push("");lines.push("**World:** "+(world.emoji?world.emoji+" ":"")+world.name);}
            else{lines.push("");lines.push("**World:** Global");}
            lines.push("");lines.push("## Fields");
            TEMPLATE_FIELDS.forEach(([key,label])=>{
              const v=fields[key];
              if(v===undefined||v===''||v===false||v===null) return;
              lines.push("");
              lines.push("### "+label);
              lines.push(typeof v==="boolean"?"Yes":Array.isArray(v)?v.join(", "):String(v));
            });
            const safeName=(name||"template").replace(/[^a-zA-Z0-9_-]/g,"_");
            window.lorekeeper.exportFile({defaultName:safeName+"-template.md",content:lines.join("\n")});
          }}><i className="ti ti-file-text"></i>Export MD</button>}
        </div>
      </div>
    </div>
  );
}

function SettingsPage({data, update}) {

  const [apiKeyVisible, setApiKeyVisible] = React.useState(false);

    setApiKeySaved(true);

      <Section title="About" icon="ti-info-circle">
        <div style={{fontSize:12,color:'var(--text3)',lineHeight:1.8}}>

function AllCollectionsPage({data,update,setSelectedWorld,exportColl}) {
  const [filter,setFilter]=useState('all');
  const worlds=data.worlds;
  const collections=filter==='all'?data.collections:filter==='none'?data.collections.filter(c=>!c.world_id):data.collections.filter(c=>c.world_id===filter);
  const openColl=(col)=>{
    const w=data.worlds.find(x=>x.id===col.world_id);
    if(w) setSelectedWorld(w);
  };
  return (
    <div>
      <div style={{display:'flex',gap:8,marginBottom:16,flexWrap:'wrap'}}>
        <button className={`btn ${filter==='all'?'primary':''}`} onClick={()=>setFilter('all')}>All ({data.collections.length})</button>

        {worlds.map(w=>{
          const count=data.collections.filter(c=>c.world_id===w.id).length;
          if(count===0) return null;
          return <button key={w.id} className={`btn ${filter===w.id?'primary':''}`} onClick={()=>setFilter(w.id)}>{w.emoji?w.emoji+' ':''}{w.name} ({count})</button>;
