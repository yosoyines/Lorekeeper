// ── Text Diff Tool ────────────────────────────────────────

function TextDiffTool() {
  const [a, setA] = useState('');
  const [b, setB] = useState('');

  const computeDiff = (textA, textB) => {
    if(!textA.trim()&&!textB.trim()) return null;
    const wordsA = textA.split(/(\s+)/);
    const wordsB = textB.split(/(\s+)/);
    // Simple LCS-based word diff
    const m=wordsA.length, n=wordsB.length;
    const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
    for(let i=m-1;i>=0;i--) for(let j=n-1;j>=0;j--) dp[i][j]=wordsA[i]===wordsB[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
    const result=[];
    let i=0,j=0;
    while(i<m||j<n){
      if(i<m&&j<n&&wordsA[i]===wordsB[j]){result.push({t:'same',v:wordsA[i]});i++;j++;}
      else if(j<n&&(i>=m||dp[i+1]?.[j]<=dp[i]?.[j+1])){result.push({t:'add',v:wordsB[j]});j++;}
      else{result.push({t:'del',v:wordsA[i]});i++;}
    }
    return result;
  };

  const diff = computeDiff(a, b);
  const added = diff ? diff.filter(d=>d.t==='add'&&d.v.trim()).length : 0;
  const removed = diff ? diff.filter(d=>d.t==='del'&&d.v.trim()).length : 0;

  const S = {input:{width:'100%',minHeight:80,background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',padding:'6px 8px',borderRadius:'var(--r)',fontSize:11,outline:'none',resize:'vertical',fontFamily:'inherit',lineHeight:1.5}};

  return (
    <div style={{display:'flex',flexDirection:'column',gap:8}}>
      <div>
        <div style={{fontSize:9,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:4}}>Original</div>
        <textarea value={a} onChange={e=>setA(e.target.value)} placeholder="Paste original text…" style={S.input}/>
      </div>
      <div>
        <div style={{fontSize:9,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:4}}>Revised</div>
        <textarea value={b} onChange={e=>setB(e.target.value)} placeholder="Paste revised text…" style={S.input}/>
      </div>
      {diff&&(a.trim()||b.trim())&&(
        <div style={{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--r)',padding:10}}>
          <div style={{display:'flex',gap:12,marginBottom:8}}>
            <span style={{fontSize:11,color:'#6ee7b7'}}>+{added} added</span>
            <span style={{fontSize:11,color:'#fca5a5'}}>−{removed} removed</span>
          </div>
          <div style={{fontSize:11,lineHeight:1.8,wordBreak:'break-word'}}>
            {diff.map((d,i)=>{
              if(d.t==='same') return <span key={i}>{d.v}</span>;
              if(d.t==='add') return <span key={i} style={{background:'rgba(110,231,183,0.2)',color:'#6ee7b7',borderRadius:2,padding:'0 1px'}}>{d.v}</span>;
              return <span key={i} style={{background:'rgba(239,68,68,0.2)',color:'#fca5a5',borderRadius:2,padding:'0 1px',textDecoration:'line-through'}}>{d.v}</span>;
            })}
          </div>
        </div>
      )}
      {(a||b)&&<button className="btn" style={{justifyContent:'center',fontSize:11}} onClick={()=>{setA('');setB('');}}>
        <i className="ti ti-x"></i>Clear
      </button>}
    </div>
  );
}

                <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:6}}>
                  <div style={{fontSize:12,fontWeight:600,color:'var(--text)',marginBottom:3,flex:1}}>{results[s.key].name}</div>
                  <button className="btn" style={{padding:'1px 6px',fontSize:10,flexShrink:0}} onClick={()=>navigator.clipboard.writeText(`${results[s.key].name}: ${results[s.key].desc}`)} title="Copy"><i className="ti ti-copy" style={{fontSize:10}}></i></button>
                </div>
                <div style={{fontSize:11,color:'var(--text3)',lineHeight:1.5}}>{results[s.key].desc}</div>
              </div>
            : <div style={{fontSize:11,color:'var(--text3)',fontStyle:'italic'}}>Click Roll to generate</div>
          }
        </div>
      ))}
      <div style={{display:'flex',gap:6}}>
        <button className="btn primary" style={{flex:1,justifyContent:'center'}} onClick={rollAll}><i className="ti ti-dice"></i>Roll all</button>
        {Object.keys(results).length>0&&<button className="btn" style={{padding:'6px 10px'}} onClick={copy} title="Copy all"><i className="ti ti-copy"></i></button>}
      </div>
    </div>
  );
}

// ── Plot Archetypes Tool ──────────────────────────────────


function PlotTool({data}) {
  const [worldId, setWorldId] = useState('');
  const [result, setResult] = useState(null);
  const [source, setSource] = useState('');
  const [lastRoll, setLastRoll] = useState(null); // 'any'|'world'|'global'

  // Only list worlds that actually have custom archetypes set up — worlds with none just
  // add noise to the dropdown since there's nothing extra to roll from for them.
  const worldsWithArchetypes = data.worlds.filter(w=>(w.plot_archetypes||[]).length>0);

  const worldPool = worldId
    ? (data.worlds.find(w=>w.id===worldId)?.plot_archetypes||[])
    : [];

  const roll = (pool, label, key) => {
    if(!pool.length) return;
    setResult(pick(pool));
    setSource(label);
    setLastRoll(key);
  };

  const rollAny = () => {
    const combined = [...GLOBAL_PLOT_ARCHETYPES, ...worldPool];
    if(!combined.length) return;
    const r = pick(combined);
    setResult(r);
    setSource(GLOBAL_PLOT_ARCHETYPES.includes(r)?'Global':data.worlds.find(w=>w.id===worldId)?.name||'World');
    setLastRoll('any');
  };

  return (
    <div style={{display:'flex',flexDirection:'column',gap:8}}>
      <div style={{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--r)',padding:10}}>
        <div style={{fontSize:9,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:6}}>World filter (optional)</div>
        <select value={worldId} onChange={e=>setWorldId(e.target.value)}
          style={{width:'100%',background:'var(--bg2)',border:'1px solid var(--border)',color:'var(--text)',padding:'5px 8px',borderRadius:'var(--r)',fontSize:12,outline:'none'}}>
          <option value="">Global pool ({GLOBAL_PLOT_ARCHETYPES.length})</option>
          {worldsWithArchetypes.map(w=><option key={w.id} value={w.id}>{w.emoji?w.emoji+' ':''}{w.name} (+{(w.plot_archetypes||[]).length} custom)</option>)}
        </select>
        {worldsWithArchetypes.length===0&&<div style={{fontSize:10,color:'var(--text3)',marginTop:6}}>No worlds have custom archetypes yet — add some from a world's World Info tab.</div>}
      </div>
      <div style={{display:'flex',gap:6}}>
        <button className={`btn${lastRoll==='any'||!lastRoll?' primary':''}`} style={{flex:1,justifyContent:'center'}} onClick={rollAny}>
          <i className="ti ti-dice"></i>Roll{worldId&&worldPool.length>0?' (any)':''}
        </button>
        {worldId&&worldPool.length>0&&(
          <button className={`btn${lastRoll==='world'?' primary':''}`} style={{flex:1,justifyContent:'center'}} onClick={()=>roll(worldPool,'World only','world')}>
            <i className="ti ti-world"></i>World only
          </button>
        )}
        {worldId&&<button className={`btn${lastRoll==='global'?' primary':''}`} style={{flex:1,justifyContent:'center'}} onClick={()=>roll(GLOBAL_PLOT_ARCHETYPES,'Global','global')}>
          <i className="ti ti-books"></i>Global only
        </button>}
      </div>
      {result&&(
        <div style={{background:'var(--bg3)',border:'1px solid var(--accent2)',borderRadius:'var(--r)',padding:12}}>
          <div style={{fontSize:9,color:'var(--accent)',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:4}}>{source}</div>
          <div style={{fontSize:14,fontWeight:600,color:'var(--text)',marginBottom:4}}>{result}</div>
          {PLOT_DESCRIPTIONS[result]&&<div style={{fontSize:11,color:'var(--text3)',lineHeight:1.5,marginBottom:6}}>{PLOT_DESCRIPTIONS[result]}</div>}
          <button className="btn" style={{fontSize:10,padding:'2px 8px'}} onClick={()=>navigator.clipboard.writeText(result+(PLOT_DESCRIPTIONS[result]?' — '+PLOT_DESCRIPTIONS[result]:''))}><i className="ti ti-copy" style={{fontSize:10}}></i>Copy</button>
        </div>
      )}
    </div>
  );
}

function ImgFromPath({src, alt, style, className, onClick}) {
  const [resolved, setResolved] = React.useState(null);
  React.useEffect(()=>{
    if(!src) { setResolved(null); return; }
    if(src.startsWith('data:')) { setResolved(src); return; }
    // It's a relative path — load from disk
    window.lorekeeper.readImagePath(src).then(b64=>{
      if(!b64) console.warn('ImgFromPath: no data returned for', src);
      setResolved(b64||null);
    }).catch(e=>console.error('ImgFromPath error for', src, e));
  }, [src]);
  if(!resolved) return <div style={{...style, background:'var(--bg3)',display:'flex',alignItems:'center',justifyContent:'center'}} onClick={onClick}><i className="ti ti-photo" style={{color:'var(--text3)',fontSize:20}}></i></div>;
  return <img src={resolved} alt={alt||''} style={style} className={className} onClick={onClick}/>;
}


function ChapterChip({lid, ci, ch, on, toggle}) {
  const tok = Math.round((ch.text||'').length / 4);
  const label = tok >= 1000 ? (tok/1000).toFixed(1)+'k' : tok;
  const click = () => toggle(lid+'::'+ci);
  return <button onClick={click} style={on?LORE_ON_STYLE:LORE_OFF_STYLE}>{ch.title||('ch '+(ci+1))} · {label}</button>;
}

function ClaudePanel({data, update, currentWorld, currentChar, currentPage, setPage}) {
  const [messages, setMessages] = React.useState([]);
  const [input, setInput] = React.useState('');
  const [loading, setLoading] = React.useState(false);
  const [error, setError] = React.useState('');
  const [copiedIdx, setCopiedIdx] = React.useState(null);
  const messagesEndRef = React.useRef(null);
  const inputRef = React.useRef(null);

  // Reset chat when world or character changes
  const contextKey = `${currentWorld?.id||'global'}_${currentChar?.id||'none'}`;
  const prevContextKey = React.useRef(contextKey);
  React.useEffect(() => {
    if(prevContextKey.current !== contextKey) {
      setMessages([]);
      setError('');
      prevContextKey.current = contextKey;
    }
  }, [contextKey]);

  React.useEffect(() => {
    messagesEndRef.current?.scrollIntoView({behavior:'smooth'});
  }, [messages]);

  const buildSystemPrompt = (scopeArg) => {
    // 'character' = the edited character only; 'world' = world + lorebook summaries, no
    // chapter bodies; 'full' = everything. Chapter text is what blows past a local model's
    // context window — 27k tokens on a mature world vs ~8k available.
    const scope = scopeArg || data.settings?.assistant_context_scope || 'full';
    const world = (scope !== 'character' && currentWorld) ? data.worlds.find(w => w.id === currentWorld.id) : null;
    const parts = [];

    parts.push(`You are a creative writing assistant helping with character and world development for the Saucepan AI companion platform. Be concise and practical. When suggesting text for fields, write it ready to use — don't add meta-commentary like "here's a suggestion". Just write the content.`);

    if(world) {
      parts.push(`\n## CURRENT WORLD: ${world.name}`);
      if(world.short_description) parts.push(`World description: ${world.short_description}`);
      if((world.tags||[]).length) parts.push(`World tags: ${world.tags.join(', ')}`);
      if(world.notes) parts.push(`World notes:\n${world.notes}`);

      // All lorebooks in world with full chapter content
      const worldLores = data.lorebooks.filter(l => l.world_id === world.id);
      if(worldLores.length) {
        parts.push(`\n## LOREBOOKS IN ${world.name.toUpperCase()}`);
        worldLores.forEach(l => {
          parts.push(`\n### Lorebook: ${l.name}`);
          if(l.short_description) parts.push(l.short_description);
          // In 'world' scope the user picks which lorebooks are worth their token cost —
          // usually the one describing how the world's mechanics actually work, without
          // which a model that has never seen this setting can't write anything useful.
          // Chapter-level, not lorebook-level: a whole lorebook is 10-14k tokens on a mature
          // world, which alone overruns a local model. Usually only the chapter explaining
          // how the setting works is actually needed to write in-world.
          const picks = data.settings?.assistant_chapters || [];
          const kept = [], skipped = [];
          (l.content||[]).forEach((ch, ci) => {
            if(scope === 'full' || picks.includes(l.id+'::'+ci)) kept.push(ch);
            else if(ch.title) skipped.push(ch.title);
          });
          kept.forEach(ch => parts.push(`\n#### ${ch.title}\n${ch.text}`));
          if(skipped.length) parts.push(`Other chapters (titles only): ${skipped.join(', ')}`);
        });
      }

      // All collections in world
      const worldColls = data.collections.filter(c => c.world_id === world.id);
      if(worldColls.length) {
        parts.push(`\n## COLLECTIONS IN ${world.name.toUpperCase()}`);
        worldColls.forEach(c => {
          parts.push(`- ${c.name}${c.definition?' — '+c.definition:''}`);
        });
      }

      // All other characters in world
      const worldChars = data.characters.filter(c => c.world_id === world.id && c.id !== currentChar?.id);
      if(worldChars.length) {
        parts.push(`\n## OTHER CHARACTERS IN ${world.name.toUpperCase()}`);
        worldChars.forEach(c => {
          const line = [`${c.display_name||c.name}`];
          if(c.short_description) line.push(c.short_description);
          if((c.tags||[]).length) line.push(`[${c.tags.slice(0,5).join(', ')}]`);
          parts.push(line.join(' — '));
        });
      }
    }

    // The world's template is the house structure for these fields. Feeding it in means
    // generated text comes back already shaped the way the catalogue is written, instead
    // of needing to be reformatted by hand afterwards.
    const worldTpl = currentWorld ? (data.templates||[]).find(t => t.world_id === currentWorld.id) : null;
    const tf = worldTpl && worldTpl.fields ? worldTpl.fields : null;
    if(tf && (tf.full_description || tf.card || tf.formatting_instructions)) {
      parts.push(`\n## HOUSE FORMAT — follow this structure exactly`);
      parts.push(`When writing or rewriting a field below, match this skeleton including its headers, dividers and section order. Replace the placeholder text, keep the structure.`);
      if(tf.full_description) parts.push(`\n### Full description template\n${tf.full_description}`);
      if(tf.card) parts.push(`\n### Character card template\n${tf.card}`);
      if(tf.formatting_instructions) parts.push(`\n### Formatting instructions template\n${tf.formatting_instructions}`);
    }

    // Current character being edited
    if(currentChar) {
      const c = data.characters.find(x => x.id === currentChar.id) || currentChar;
      parts.push(`\n## CURRENT CHARACTER BEING EDITED: ${c.display_name||c.name}`);
      if(c.name) parts.push(`Name: ${c.name}`);
      if(c.display_name) parts.push(`Display name: ${c.display_name}`);
      if(c.short_description) parts.push(`Short description: ${c.short_description}`);
      if(c.full_description) parts.push(`Full description:\n${c.full_description}`);
      if(c.card) parts.push(`Character card:\n${c.card}`);
      if((c.tags||[]).length) parts.push(`Tags: ${c.tags.join(', ')}`);
      if((c.starting_scenarios||[]).length) {
        parts.push(`Scenarios:`);
        c.starting_scenarios.forEach(s => parts.push(`- ${s.title}: ${s.message?.slice(0,200)}…`));
      }
    } else if(!world) {
      parts.push(`\nNo specific world or character is currently open. You can still help with general character writing, worldbuilding, and creative writing questions.`);
    }

    return parts.join('\n');
  };

  const ctxScope = data.settings?.assistant_context_scope || 'full';
  const setScope = (v) => update(d=>{ if(!d.settings) d.settings={}; d.settings.assistant_context_scope = v; });
  const pickedChapters = data.settings?.assistant_chapters || [];
  const worldLoreList = currentWorld ? data.lorebooks.filter(l => l.world_id === currentWorld.id) : [];
  const toggleChapter = (key) => update(d=>{
    if(!d.settings) d.settings={};
    const cur = d.settings.assistant_chapters || [];
    d.settings.assistant_chapters = cur.includes(key) ? cur.filter(x=>x!==key) : [...cur, key];
  });
  const clearChapters = () => update(d=>{ if(!d.settings) d.settings={}; d.settings.assistant_chapters = []; });
  // Rough estimate — ~4 chars/token for English. Only needs to be good enough to show
  // whether the prompt will fit a local model's window before sending it.
  const ctxTokens = Math.round(buildSystemPrompt(ctxScope).length / 4);

  const send = async () => {
    if(!input.trim() || loading) return;
    const userMsg = input.trim();
    setInput('');
    setError('');
    const newMessages = [...messages, {role:'user', content:userMsg}];
    setMessages(newMessages);
    setLoading(true);

    const systemPrompt = buildSystemPrompt(ctxScope);
    const result = await callAI(data, systemPrompt, newMessages.map(m => ({role:m.role, content:m.content})), 2000);
    if(result.error) { setError(result.error); setLoading(false); return; }
    setMessages(prev => [...prev, {role:'assistant', content:result.text}]);
    setLoading(false);
  };

  const copy = (text, idx) => {
    navigator.clipboard.writeText(text);
    setCopiedIdx(idx);
    setTimeout(() => setCopiedIdx(null), 1500);
  };

  const contextLabel = currentChar
    ? (currentChar.display_name||currentChar.name)
    : currentWorld
    ? currentWorld.name
    : 'No world open';

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100%',minHeight:0}}>
      {/* API key nudge */}
      {!hasActiveKey(data.settings)&&<div style={{padding:'8px 12px',background:'rgba(251,191,36,0.08)',borderBottom:'1px solid rgba(251,191,36,0.2)',fontSize:11,color:'var(--amber)',display:'flex',alignItems:'center',gap:6,flexShrink:0}}>
        <i className="ti ti-key" style={{fontSize:12}}></i>
        No API key set — <span style={{textDecoration:'underline',cursor:'pointer'}} onClick={()=>setPage('settings')}>add in Settings</span>
      </div>}
      {/* Context scope */}
      <div style={{padding:'6px 12px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',gap:6,flexShrink:0}}>
        <span style={{fontSize:10,color:'var(--text3)',flexShrink:0}}>Context</span>
        <select value={ctxScope} onChange={e=>setScope(e.target.value)} style={CTX_SELECT_STYLE}>
          <option value="character">Character only</option>
          <option value="world">World, no lorebook text</option>
          <option value="full">Everything</option>
        </select>
        <span style={ctxTokens>7000?CTX_WARN_STYLE:CTX_OK_STYLE}>≈{ctxTokens.toLocaleString()} tok</span>
      </div>
      {ctxScope==='world'&&worldLoreList.length>0&&<div style={{padding:'0 12px 6px',borderBottom:'1px solid var(--border)',flexShrink:0,maxHeight:150,overflowY:'auto'}}>
        <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:4}}>
          <span style={{fontSize:9,color:'var(--text3)',flex:1}}>Include chapter text:</span>
          {pickedChapters.length>0&&<button onClick={clearChapters} style={{background:'none',border:'none',color:'var(--text3)',cursor:'pointer',fontSize:9,padding:0}}>clear</button>}
        </div>
        {worldLoreList.map(l=><div key={l.id} style={{marginBottom:5}}>
          <div style={{fontSize:9,color:'var(--text3)',opacity:0.7,marginBottom:2}}>{l.name}</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
            {(l.content||[]).map((ch,ci)=><ChapterChip key={ci} lid={l.id} ci={ci} ch={ch} on={pickedChapters.includes(l.id+'::'+ci)} toggle={toggleChapter}/>)}
          </div>
        </div>)}
      </div>}
      {/* Context indicator */}
      <div style={{padding:'8px 12px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',gap:6,flexShrink:0}}>
        <i className="ti ti-sparkles" style={{color:'var(--accent)',fontSize:13}}></i>
        <span style={{fontSize:11,color:'var(--text3)',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
          {currentChar?'Character: ':'World: '}<strong style={{color:'var(--text)'}}>{contextLabel}</strong>
        </span>
        {messages.length>0&&<button onClick={()=>setMessages([])} style={{background:'none',border:'none',color:'var(--text3)',cursor:'pointer',fontSize:10,padding:0}} title="Clear chat">✕</button>}
      </div>

      {/* Messages */}
      <div style={{flex:1,overflowY:'auto',padding:'10px 12px',display:'flex',flexDirection:'column',gap:10,minHeight:0}}>
        {messages.length===0&&(
          <div style={{color:'var(--text3)',fontSize:12,lineHeight:1.7,padding:'8px 0'}}>
            <div style={{marginBottom:8,color:'var(--text2)',fontWeight:500}}>What I can help with:</div>
            {[
              currentChar&&'Draft or improve the character card',
              currentChar&&'Write or expand the full description',
              currentChar&&'Suggest a short description',
              currentChar&&'Generate starting scenarios',
              currentChar&&'Check consistency with world lore',
              'Suggest tags for a character',
              'Brainstorm character ideas for this world',
              'Draft lorebook chapter content',
            ].filter(Boolean).map((s,i)=>(
              <div key={i} style={{padding:'3px 0',cursor:'pointer',color:'var(--text3)'}}
                onClick={()=>{setInput(s);inputRef.current?.focus();}}
                onMouseEnter={e=>e.currentTarget.style.color='var(--accent)'}
                onMouseLeave={e=>e.currentTarget.style.color='var(--text3)'}>
                · {s}
              </div>
            ))}
          </div>
        )}
        {messages.map((m,i)=>(
          <div key={i} style={{display:'flex',flexDirection:'column',gap:4,alignItems:m.role==='user'?'flex-end':'flex-start'}}>
            {m.role==='user'
              ? <div style={{background:'var(--accent-dim)',border:'1px solid var(--accent2)',borderRadius:'var(--rl) var(--rl) 4px var(--rl)',padding:'8px 12px',fontSize:12,color:'var(--text)',maxWidth:'90%',lineHeight:1.6}}>{m.content}</div>
              : <div style={{width:'100%'}}>
                  <div style={{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'4px var(--rl) var(--rl) var(--rl)',padding:'10px 12px',fontSize:12,color:'var(--text)',lineHeight:1.7,whiteSpace:'pre-wrap',wordBreak:'break-word'}}>{m.content}</div>
                  <button onClick={()=>copy(m.content,i)} style={{background:'none',border:'none',cursor:'pointer',color:'var(--text3)',fontSize:10,padding:'3px 0',display:'flex',alignItems:'center',gap:3,marginTop:2}}>
                    <i className={`ti ti-${copiedIdx===i?'check':'copy'}`} style={{fontSize:10}}></i>
                    {copiedIdx===i?'Copied!':'Copy'}
                  </button>
                </div>
            }
          </div>
        ))}
        {loading&&<div style={{display:'flex',gap:4,padding:'8px 0',alignItems:'center'}}>
          <div style={{width:6,height:6,borderRadius:'50%',background:'var(--accent)',animation:'pulse 1s infinite'}}></div>
          <div style={{width:6,height:6,borderRadius:'50%',background:'var(--accent)',animation:'pulse 1s infinite 0.2s'}}></div>
          <div style={{width:6,height:6,borderRadius:'50%',background:'var(--accent)',animation:'pulse 1s infinite 0.4s'}}></div>
        </div>}
        {error&&<div style={{fontSize:11,color:'var(--red)',padding:'6px 10px',background:'rgba(239,68,68,0.1)',borderRadius:'var(--r)',border:'1px solid rgba(239,68,68,0.2)'}}>{error}</div>}
        <div ref={messagesEndRef}/>
      </div>

      {/* Input */}
      <div style={{padding:'10px 12px',borderTop:'1px solid var(--border)',flexShrink:0}}>
        <div style={{display:'flex',gap:6,alignItems:'flex-end'}}>
          <textarea ref={inputRef} value={input} onChange={e=>setInput(e.target.value)}
            onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}}
            placeholder="Ask anything… (Enter to send, Shift+Enter for new line)"
            rows={3}
            style={{flex:1,background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',padding:'8px 10px',borderRadius:'var(--r)',fontSize:12,outline:'none',resize:'none',fontFamily:'inherit',lineHeight:1.5}}/>
          <button className="btn primary" onClick={send} disabled={loading||!input.trim()} style={{padding:'8px 10px',alignSelf:'flex-end',flexShrink:0}}>
            <i className="ti ti-send" style={{fontSize:13}}></i>
          </button>
        </div>
        <div style={{fontSize:10,color:'var(--text3)',marginTop:4}}>Enter to send · Shift+Enter for new line · Context resets when you change character</div>
      </div>
    </div>
  );
}

function RightPanel({tab,setTab,data,update,currentWorld,currentChar,currentPage,setPage}) {
  // Notes have no independent file backup elsewhere — unlike characters/lorebooks/
  // collections, which each auto-save to their own JSON, notes only ever lived inside
  // the single big data file. Debounced-write a standalone .md backup per world (and
  // one for the global scratchpad) so notes survive even if the main data file is lost.
  const notesFileSaveTimer = React.useRef();
  const saveNotesBackupFile = (filename, content) => {
    clearTimeout(notesFileSaveTimer.current);
    notesFileSaveTimer.current = setTimeout(() => {
      window.lorekeeper.saveNotesFile(filename, content).catch(()=>{});
    }, 800);
  };

  const saveNote=(val)=>{
    if(currentWorld){
      update(d=>{const w=d.worlds.find(x=>x.id===currentWorld.id);if(w)w.notes=val;});
      saveNotesBackupFile(currentWorld.name||'world-'+currentWorld.id, val);
    } else {
      update(d=>{d.notes=val;});
      saveNotesBackupFile('_global', val);
    }
  };
  const noteValue = currentWorld
    ? (data.worlds.find(x=>x.id===currentWorld.id)?.notes||'')
    : (data.notes||'');
  const notePlaceholder = currentWorld
    ? `Notes for ${currentWorld.name}…\n\nIdeas, plot threads, world details, reminders.`
    : `Global scratchpad…\n\nNotes here are not tied to any world.`;

  return (
    <div className="right-panel" style={{width:tab==="map"?"640px":"320px",minWidth:tab==="map"?"640px":"320px"}}>
      <div className="right-panel-tabs">
        <div className={`right-panel-tab ${tab==='notes'?'active':''}`} onClick={()=>setTab('notes')}>
          <i className="ti ti-notebook"></i>{currentWorld?`${currentWorld.emoji||''}Notes`:'Notes'}
        </div>
        <div className={`right-panel-tab ${tab==='tools'?'active':''}`} onClick={()=>setTab('tools')}>
          <i className="ti ti-tool"></i>Tools
        </div>
        <div className={`right-panel-tab ${tab==='claude'?'active':''}`} onClick={()=>setTab('claude')}>
          <i className="ti ti-sparkles"></i>Assistant
        </div>
        <div className={`right-panel-tab ${tab==='map'?'active':''}`} onClick={()=>setTab('map')}>
          <i className="ti ti-circles-relation"></i>Map
        </div>
      </div>
      <div className="right-panel-content">
        {tab==='notes'&&(
          <>

  // meant a brand-new lorebook/collection set to public for the first time would never show
  // up here at all (has_been_public only becomes true after a first successful export) —

  data.lorebooks.filter(l=>(l.has_been_public||l.access_level==='public')&&(!l.site_last_synced_at||l.updated_at>l.site_last_synced_at)).forEach(l=>{

function DashboardPage({calCells,calYear,calMonth,today,selDay,setSelDay,charsOnDay,postedOnDay,calDate,setCalDate,upcoming,data,update,setSelectedChar,openChar,openLore,openColl,setSelectedWorld}) {
  const [schedPicker,setSchedPicker]=useState(null); // cellDateStr when open
  const [schedSearch,setSchedSearch]=useState('');
  const selChars=selDay?charsOnDay(selDay):[];
  const todayStr=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  const [dismissed,setDismissed]=useState([]);
  const [showCycle,setShowCycle]=useState(false);
  // Banner keys off the scheduled date only — when the status was flipped to 'ready'
  // is irrelevant, since scheduling happens on the site and posts run whether or not
  // Lorekeeper was open that day. A date that has already passed is normal, not an error.
  const pdsDash=s=>{const p=(s.split('T')[0]).split('-');return new Date(+p[0],+p[1]-1,+p[2]);};
  const todayMid=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  const duePosts=data.characters.filter(c=>c.status==='ready'&&!dismissed.includes(c.id)).map(c=>{
    const past=(c.schedule_dates||[]).map(s=>s.split('T')[0]).filter(s=>pdsDash(s)<=todayMid).sort();
    if(!past.length) return null;
    const dueStr=past[0];
    return {char:c,dueStr:dueStr,days:Math.round((todayMid-pdsDash(dueStr))/86400000)};
  }).filter(Boolean).sort((a,b)=>a.dueStr<b.dueStr?-1:1);
  const markPosted=(c,dueStr)=>update(d=>{
    const ch=d.characters.find(x=>x.id===c.id);
    if(!ch) return;
    ch.status='posted';
    if(!ch.posted_dates)ch.posted_dates=[];
    // Stamp the day it was scheduled for, not the day it was noticed — otherwise an
    // overdue companion lands on the calendar a week away from when it actually went out.
    const stamp=dueStr||todayStr;
    if(!ch.posted_dates.includes(stamp))ch.posted_dates.push(stamp);
    advanceCycleHeadInDraft(d,ch.world_id);
  });
  const cycle=data.release_cycle||[];
  const getNextCycleWorld=()=>{
    if(cycle.length===0) return null;
    const futureDate=new Date(today.getFullYear(),today.getMonth(),today.getDate());
    const pds=s=>{const p=(s.split('T')[0]).split('-');return new Date(+p[0],+p[1]-1,+p[2]);};
    const worldIdToName={};
    data.worlds.forEach(w=>{worldIdToName[w.id]=w.name;});
    const cycleNames=cycle.map(wid=>{const w=data.worlds.find(x=>x.id===wid);return w?w.name:null;});
    const cycleIdx={};
    data.characters.forEach(c=>{
      const wName=worldIdToName[c.world_id];
      if(!wName) return;
      const ci=cycleNames.indexOf(wName);
      if(ci>=0) cycleIdx[c.id]=ci;
    });
    // Find the cycle position of the most recently posted character (by date).
    // This is the current wave head — walk forward from the next position.
    let headIdx=-1, headDate=new Date(0);
    data.characters.forEach(c=>{
      if(c.status!=='posted') return;
      const ci=cycleIdx[c.id];
      if(ci===undefined) return;
      const dates=[...(c.posted_dates||[]),...(c.schedule_dates||[])];
      dates.forEach(d=>{const pd=pds(d);if(pd>headDate){headDate=pd;headIdx=ci;}});
    });
    const startIdx=headIdx===-1?0:(headIdx+1)%cycle.length;
    for(let i=0;i<cycle.length;i++){
      const idx=(startIdx+i)%cycle.length;
      if(!cycleNames[idx]) continue; // stale
      if((data.cycle_skipped||[]).includes(cycleNames[idx])) continue; // skipped this cycle
      const chars=data.characters.filter(c=>cycleIdx[c.id]===idx);
      const futureUnposted=chars.filter(c=>c.status!=='posted'&&(c.schedule_dates||[]).some(d=>pds(d)>=futureDate));
      if(futureUnposted.length===0&&chars.every(c=>c.status==='posted'||!(c.schedule_dates||[]).length)){
        // World exists but no future chars scheduled — needs scheduling
        // Only flag if we haven't wrapped back to head (avoids false positives)
        if(i<cycle.length-1||(headIdx===-1)) return cycle[idx];
        continue;
      }
      if(futureUnposted.some(c=>c.status==='draft')) return cycle[idx];
      if(futureUnposted.length===0) return cycle[idx];
      // all ready — skip
    }
    return cycle[startIdx];
  };
  const nextWorldId=getNextCycleWorld();
  const nextWorld=nextWorldId?data.worlds.find(w=>w.id===nextWorldId):null;
  const skipNext=nextWorld?()=>update(d=>{d.cycle_skipped=[...(d.cycle_skipped||[]),nextWorld.name];}):null;
  const noteKey=(charId,dateStr)=>`${charId}_${dateStr}`;
  const getNote=(charId,dateStr)=>(data.schedule_notes||{})[noteKey(charId,dateStr)]||'';
  return (
    <div onClick={()=>setSelDay(null)}>
      {duePosts.map(p=>{
        const note=getNote(p.char.id,p.dueStr);
        return (
        <div key={p.char.id} className="today-banner">
          <i className="ti ti-bell" style={{color:'var(--accent)',fontSize:18,flexShrink:0}}></i>
          <div style={{flex:1,fontSize:13}}>
            <strong>{p.char.display_name||p.char.name}</strong>{dueLabel(p.days,p.dueStr)}
            {note&&<span style={{color:'var(--text3)',marginLeft:6}}>· {note}</span>}
          </div>
          <button className="btn primary" style={{fontSize:11,padding:'3px 10px'}} onClick={()=>markPosted(p.char,p.dueStr)}>Mark posted</button>
          <button className="btn" style={{fontSize:11,padding:'3px 10px'}} onClick={()=>setSelectedChar(p.char)}>Reschedule</button>
          <button style={{background:'none',border:'none',color:'var(--text3)',cursor:'pointer',padding:'0 4px',fontSize:16}} onClick={()=>setDismissed(x=>[...x,p.char.id])}>×</button>
        </div>
        );
      })}
      <div className="dash-layout">
        <div>
          <div className="cal-header">
            <span className="cal-month">{MONTHS[calMonth]} {calYear}</span>
            <div className="cal-nav">
              <button onClick={()=>setCalDate(d=>new Date(d.getFullYear(),d.getMonth()-1,1))}><i className="ti ti-chevron-left"></i></button>
              <button onClick={()=>setCalDate(new Date())} style={{width:'auto',padding:'0 10px',fontSize:12}}>Today</button>
              <button onClick={()=>setCalDate(d=>new Date(d.getFullYear(),d.getMonth()+1,1))}><i className="ti ti-chevron-right"></i></button>
            </div>
          </div>
          <div className="cal-grid" onClick={e=>e.stopPropagation()}>
            {DAYS.map(d=><div key={d} className="cal-dow">{d}</div>)}
            {calCells.map((cell,i)=>{
              const chars=charsOnDay(cell.d,cell.year,cell.month);
              const isToday=cell.cur&&cell.d===today.getDate()&&calYear===today.getFullYear()&&calMonth===today.getMonth();
              const cellDateStr=`${cell.year}-${String(cell.month+1).padStart(2,'0')}-${String(cell.d).padStart(2,'0')}`;
              return <div key={i} className={`cal-day${!cell.cur?' other-month':''}${isToday?' today':''}${chars.length>0?' has-events':''}${selDay===cell.d&&cell.cur?' selected':''}`} onClick={()=>{
                  if(cell.cur){setSelDay(s=>s===cell.d?null:cell.d);}
                  else if(cell.prev){setCalDate(d=>new Date(d.getFullYear(),d.getMonth()-1,1));setSelDay(cell.d);}
                  else if(cell.next){setCalDate(d=>new Date(d.getFullYear(),d.getMonth()+1,1));setSelDay(cell.d);}
                }}>
                <div className="day-num">{cell.d}</div>
                {chars.slice(0,3).map(c=>{
                  const note=getNote(c.id,cellDateStr);
                  const isDraft=c.status==='draft';
                  return <div key={c.id} className="day-char" title={note||c.name}
                    style={{cursor:isDraft?'pointer':'default',opacity:isDraft?0.75:1}}
                    onClick={e=>{if(isDraft){e.stopPropagation();setSelectedChar(c);}}}
                  >{isDraft?'[d] ':''}{c.name}{note?' ·':''}</div>;
                })}
                {chars.length>3&&<div className="day-char">+{chars.length-3}</div>}
                {postedOnDay(cell.d,cell.year,cell.month).slice(0,2).map(c=>(
                  <div key={'p'+c.id} className="day-char" title={c.name+' (posted)'}
                    style={{opacity:0.5,background:'rgba(110,231,183,0.15)',cursor:'pointer'}}
                    onClick={e=>{e.stopPropagation();setSelectedChar(c);}}
                  >{c.name}<span style={{marginLeft:3,fontSize:9,color:'#6ee7b7'}}>✓</span></div>
                ))}
              </div>;
            })}
          </div>
          {selDay&&(()=>{
            const cellDateStr=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(selDay).padStart(2,'0')}`;
            const pds=s=>{const p=(s.split('T')[0]).split('-');return new Date(+p[0],+p[1]-1,+p[2]);};
            const futureDate=new Date(today.getFullYear(),today.getMonth(),today.getDate());
            // Schedulable: draft or ready, not already scheduled for a future date
            const schedulable=data.characters.filter(c=>{
              if(c.status==='posted') return false;
              const hasFuture=(c.schedule_dates||[]).some(d=>pds(d)>futureDate);
              return !hasFuture;
            }).filter(c=>schedSearch===''||((c.display_name||c.name)+' '+(c.short_description||'')).toLowerCase().includes(schedSearch.toLowerCase()));
            return <div style={{marginTop:16,background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--rl)',padding:16}} onClick={e=>e.stopPropagation()}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
                <h3 style={{fontSize:14,fontWeight:600,margin:0}}>{MONTHS[calMonth]} {selDay}</h3>
                <button className="btn primary" style={{fontSize:11,padding:'3px 10px'}} onClick={()=>{setSchedPicker(p=>p===cellDateStr?null:cellDateStr);setSchedSearch('');}}>
                  <i className={`ti ${schedPicker===cellDateStr?'ti-x':'ti-plus'}`}></i>{schedPicker===cellDateStr?'Cancel':'Schedule'}
                </button>
              </div>
              {schedPicker===cellDateStr&&(
                <div style={{marginBottom:12,background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--r)',padding:10}}>
                  <input value={schedSearch} onChange={e=>setSchedSearch(e.target.value)} placeholder="Search characters…"
                    style={{width:'100%',background:'var(--bg2)',border:'1px solid var(--border)',color:'var(--text)',padding:'6px 10px',borderRadius:'var(--r)',fontSize:12,outline:'none',marginBottom:8}}/>
                  {schedulable.length===0
                    ?<p style={{fontSize:12,color:'var(--text3)',margin:0}}>No schedulable characters — all are posted or already have a future date.</p>
                    :<div style={{display:'flex',flexDirection:'column',gap:4,maxHeight:200,overflowY:'auto'}}>
                      {schedulable.map(c=>{
                        const world=data.worlds.find(w=>w.id===c.world_id);
                        return <div key={c.id} style={{display:'flex',alignItems:'center',gap:8,padding:'6px 8px',borderRadius:'var(--r)',cursor:'pointer',background:'var(--bg2)'}}
                          onClick={()=>{
                            update(d=>{const ch=d.characters.find(x=>x.id===c.id);if(ch){if(!ch.schedule_dates)ch.schedule_dates=[];ch.schedule_dates.push(cellDateStr);}});
                            setSchedPicker(null);setSchedSearch('');
                          }}
                          onMouseEnter={e=>e.currentTarget.style.background='var(--accent-dim)'}
                          onMouseLeave={e=>e.currentTarget.style.background='var(--bg2)'}>
                          <div style={{width:28,height:28,borderRadius:4,overflow:'hidden',flexShrink:0,background:'var(--bg3)',display:'flex',alignItems:'center',justifyContent:'center'}}>
                            {c.image?<ImgFromPath src={c.image.data||c.image.relPath} alt={c.name} style={{width:'100%',height:'100%',objectFit:'cover'}}/>:<i className="ti ti-user" style={{color:'var(--text3)',fontSize:13}}></i>}
                          </div>
                          <div style={{flex:1,minWidth:0}}>
                            <div style={{fontSize:12,fontWeight:500,color:'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.display_name||c.name}</div>
                            <div style={{fontSize:10,color:'var(--text3)'}}>{world?.name||'—'} · {c.status}</div>
                          </div>
                        </div>;
                      })}
                    </div>
                  }
                </div>
              )}
              {selChars.length===0&&schedPicker!==cellDateStr&&<p className="text-muted">Nothing scheduled.</p>}
              {selChars.map(c=>{
                const note=getNote(c.id,cellDateStr);
                return <div key={c.id} style={{marginBottom:10}}>
                  <div className="upcoming-item" style={{cursor:'pointer'}} onClick={()=>setSelectedChar(c,'schedule')}>
                    <div className="flex-1">
                      <div style={{fontSize:13,fontWeight:500,color:'var(--text)'}}>{c.display_name||c.name}</div>
                      {note&&<div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>{note}</div>}
                    </div>
                    <span className={`status-badge status-${c.status||'draft'}`}>{c.status||'draft'}</span>
                  </div>
                  <input value={note} onChange={e=>update(d=>{if(!d.schedule_notes)d.schedule_notes={};d.schedule_notes[noteKey(c.id,cellDateStr)]=e.target.value;})}
                    placeholder="Add note… (e.g. add to event link)"
                    style={{width:'100%',marginTop:4,background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',padding:'5px 8px',borderRadius:'var(--r)',fontSize:11,outline:'none'}}
                  />
                </div>;
              })}
            </div>;
          })()}
          <InProgressPanel data={data} setSelectedChar={setSelectedChar}/>
          <ReworkPanel data={data} openChar={openChar}/>
          <LorebookDraftsPanel data={data} openLore={openLore}/>
          {/* Site Checklist */}
          <SiteChecklistPanel data={data} openChar={openChar} openLore={openLore} openColl={openColl}/>

          {/* Lorekeeper Checklist */}
          {(()=>{
            const Tag=({ok,label})=><span style={{fontSize:10,padding:'1px 5px',borderRadius:3,background:ok?'rgba(110,231,183,0.12)':'rgba(251,191,36,0.12)',color:ok?'#6ee7b7':'var(--amber)',border:ok?'1px solid rgba(110,231,183,0.25)':'1px solid rgba(251,191,36,0.3)'}}>{ok?'✓ ':''}{label}</span>;
            const items=[];
            // Characters: posted with no posted date
            data.characters.filter(c=>c.status==='posted'&&(c.posted_dates||[]).length===0).forEach(c=>{
              const world=data.worlds.find(w=>w.id===c.world_id);
              items.push({key:'c-date-'+c.id,thumb:c.image,thumbIcon:'ti-user',name:c.display_name||c.name,sub:world?.name||'—',issues:['missing posted date'],onClick:()=>setSelectedChar(c,'schedule')});
            });
            // Lorebooks: only flag if public or has been public
            data.lorebooks.forEach(l=>{
              const isPublished=l.access_level==='public'||l.has_been_public;
              if(!isPublished) return;
              const world=data.worlds.find(w=>w.id===l.world_id);
              const issues=[];
              if(!l.image_id) issues.push('no image ID (upload to site first)');
              if(!l.image_data&&!l.image_relpath) issues.push('no local image backup');
              if(!(l.tags||[]).length) issues.push('no tags');
              if(!l.definition_protection||l.definition_protection==='open') issues.push('definition protection: open');
              if(issues.length===0) return;
              items.push({key:'l-'+l.id,thumb:l.image_data?{data:l.image_data}:(l.image_relpath?{relPath:l.image_relpath}:null),thumbIcon:'ti-book',thumbColor:'var(--amber)',name:l.name,sub:world?.name||'Standalone',issues,onClick:()=>openLore(l,'settings')});
            });
            // Collections: only flag if public or has been public
            data.collections.forEach(col=>{
              const isPublished=col.access_level==='public'||col.has_been_public;
              if(!isPublished) return;
              const world=data.worlds.find(w=>w.id===col.world_id);
              const issues=[];
              if(!col.image?.id) issues.push('no image ID (upload to site first)');
              if(!col.image_data&&!col.image_relpath) issues.push('no local image backup');
              if(!(col.tags||[]).length) issues.push('no tags');
              if(!col.definition) issues.push('no description');
              if(issues.length===0) return;
              items.push({key:'col-'+col.id,thumb:col.image_data?{data:col.image_data}:(col.image_relpath?{relPath:col.image_relpath}:null),thumbIcon:'ti-folders',thumbColor:'var(--accent)',name:col.name,sub:world?.name||'Standalone',issues,onClick:()=>openColl(col,'edit')});
            });
            if(items.length===0) return null;
            return <div style={{marginTop:16}}>
              <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:10}}>
                <div style={{fontSize:11,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.06em'}}>Lorekeeper Checklist</div>
                <span style={{fontSize:10,background:'rgba(251,191,36,0.15)',color:'var(--amber)',border:'1px solid rgba(251,191,36,0.3)',borderRadius:4,padding:'1px 6px'}}>{items.length}</span>
              </div>
              <div style={{display:'flex',flexDirection:'column',gap:6}}>
                {items.map(item=>(
                  <div key={item.key} style={{display:'flex',gap:10,padding:'8px 12px',background:'var(--bg2)',border:'1px solid rgba(251,191,36,0.15)',borderRadius:'var(--r)',cursor:item.onClick?'pointer':'default'}}
                    onClick={item.onClick||undefined}>
                    <div style={{width:36,height:36,borderRadius:'var(--r)',overflow:'hidden',flexShrink:0,background:'var(--bg3)',display:'flex',alignItems:'center',justifyContent:'center'}}>
                      {item.thumb?<ImgFromPath src={item.thumb.data||item.thumb.relPath} alt={item.name} style={{width:'100%',height:'100%',objectFit:'cover'}}/>:<i className={`ti ${item.thumbIcon}`} style={{color:item.thumbColor||'var(--text3)',fontSize:16}}></i>}
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:12,fontWeight:500,color:'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.name}</div>
                      <div style={{fontSize:11,color:'var(--text3)',marginBottom:4}}>{item.sub}</div>
                      <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
                        {item.issues.map(issue=><Tag key={issue} ok={false} label={issue}/>)}
                      </div>
                    </div>
                    {item.onClick&&<span style={{fontSize:11,color:'var(--amber)',alignSelf:'center',flexShrink:0}}>fix →</span>}
                  </div>
                ))}
              </div>
            </div>;
          })()}
        </div>
        <div>
          <div className="upcoming-panel">
            <h3>Upcoming</h3>
            {upcoming.length===0?<p className="text-muted" style={{fontSize:12}}>No scheduled characters yet.</p>:upcoming.map((x,i)=>{
              const w=data.worlds.find(w=>w.id===x.char.world_id);
              const dateStr=`${x.date.getFullYear()}-${String(x.date.getMonth()+1).padStart(2,'0')}-${String(x.date.getDate()).padStart(2,'0')}`;
              const note=getNote(x.char.id,dateStr);
              return <div key={i} className="upcoming-item" style={{cursor:'pointer'}} onClick={()=>setSelectedChar(x.char)}>
                <div className="upcoming-date">{x.date.getDate()}<br/><span style={{fontSize:9}}>{MONTHS[x.date.getMonth()].slice(0,3)}</span></div>
                <div className="upcoming-info flex-1">
                  <div className="name">{x.char.name}</div>
                  <div className="world" style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:160}}>{note?<span style={{color:'var(--accent)',fontSize:10}}>{note.length>40?note.slice(0,40)+'…':note}</span>:w?.name||'—'}</div>
                </div>
                <span className={`status-badge status-${x.char.status||'draft'}`}>{x.char.status||'draft'}</span>
              </div>;
            })}
          </div>
          <div className="cycle-panel">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
              <h3 style={{fontSize:11,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.06em',margin:0}}>Release Cycle</h3>
              <button className="btn" style={{fontSize:11,padding:'2px 8px'}} onClick={()=>setShowCycle(s=>!s)}><i className={`ti ${showCycle?'ti-chevron-up':'ti-settings'}`}></i>{showCycle?'Done':'Edit'}</button>
            </div>
            {nextWorld?(
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:showCycle?12:0}}>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <span style={{fontSize:12,color:'var(--text3)'}}>Next up:</span>
                  <span style={{fontSize:13,fontWeight:600,color:'var(--accent)'}}>{nextWorld.emoji?nextWorld.emoji+' ':''}{nextWorld.name}</span>
                </div>
                <button className="btn" style={{fontSize:11,padding:'2px 8px'}} onClick={skipNext}><i className="ti ti-player-skip-forward"></i>Skip</button>
              </div>
            ):<p style={{fontSize:12,color:'var(--text3)',marginBottom:showCycle?12:0}}>{cycle.length===0?'No cycle set up yet.':'All worlds covered.'}</p>}
            {showCycle&&(
              <div>
                <div style={{fontSize:11,color:'var(--text3)',marginBottom:8}}>Drag to reorder · click × to remove · add worlds below</div>
                {cycle.map((wid,i)=>{
                  const w=data.worlds.find(x=>x.id===wid);
                  if(!w) return null;
                  return <div key={wid} draggable
                    onDragStart={e=>{e.dataTransfer.setData('text/plain',String(i));}}
                    onDragOver={e=>e.preventDefault()}
                    onDrop={e=>{e.preventDefault();const from=parseInt(e.dataTransfer.getData('text/plain'));const to=i;if(from===to)return;update(d=>{const arr=[...d.release_cycle];const[item]=arr.splice(from,1);arr.splice(to,0,item);d.release_cycle=arr;});}}
                    style={{display:'flex',alignItems:'center',gap:6,marginBottom:4,padding:'4px 8px',background:'var(--bg3)',borderRadius:'var(--r)',border:wid===nextWorldId?'1px solid var(--accent2)':'1px solid var(--border)',cursor:'grab'}}>
                    <i className="ti ti-grip-vertical" style={{color:'var(--text3)',fontSize:13,flexShrink:0}}></i>
                    <span style={{fontSize:12,color:'var(--text3)',minWidth:14,textAlign:'center'}}>{i+1}</span>
                    <span style={{flex:1,fontSize:12,color:wid===nextWorldId?'var(--accent)':'var(--text)'}}>{w.emoji?w.emoji+' ':''}{w.name}</span>
                    <button style={{background:'none',border:'none',color:'var(--text3)',cursor:'pointer',padding:'0 4px'}} onClick={()=>update(d=>{d.release_cycle=d.release_cycle.filter(x=>x!==wid);d.cycle_skipped=(d.cycle_skipped||[]).filter(n=>n!==w.name);})}>×</button>
                  </div>;
                })}
                <select style={{width:'100%',marginTop:8,background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',padding:'5px 8px',borderRadius:'var(--r)',fontSize:12,outline:'none'}}
                  value="" onChange={e=>{const wid=e.target.value;if(wid&&!cycle.includes(wid))update(d=>{if(!d.release_cycle)d.release_cycle=[];d.release_cycle.push(wid);});}}>
                  <option value="">+ Add world to cycle…</option>
                  {sortedWorlds(data).filter(w=>!cycle.includes(w.id)).map(w=><option key={w.id} value={w.id}>{w.emoji?w.emoji+' ':''}{w.name}</option>)}
                </select>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function WorldsPage({data,setSelectedWorld,setModal}) {
  return data.worlds.length===0?(
    <div className="empty"><i className="ti ti-planet"></i><h3>No worlds yet</h3><p>Create your first world to start organizing everything.</p><br/><button className="btn primary" onClick={()=>setModal({type:'new-world'})} style={{margin:'0 auto'}}><i className="ti ti-plus"></i>New World</button></div>
  ):(
    <div className="worlds-grid">
      {sortedWorlds(data).map(w=>{
        const chars=data.characters.filter(c=>c.world_id===w.id).length;
        const lores=data.lorebooks.filter(l=>l.world_id===w.id).length;
        const collFb=data.collections.find(c=>c.world_id===w.id&&(c.image_data||c.image_relpath));
        const banner=w.image||w.image_relpath||(collFb?(collFb.image_data||collFb.image_relpath):null);
        return <div key={w.id} className="world-card" onClick={()=>setSelectedWorld(w)}>
          <div className="world-banner">{banner?<ImgFromPath src={banner} alt={w.name} style={IMG_COVER}/>:<i className="ti ti-planet"></i>}
          </div>
          <div className="world-card-body"><h3>{w.name}</h3><p>{w.short_description||'No description.'}</p></div>
          <div className="world-card-footer">
            <span className="world-stat"><span>{chars}</span>chars</span>
            <span className="world-stat"><span>{lores}</span>lorebooks</span>
            {(w.tags||[]).slice(0,2).map(t=><span key={t} className="tag">{t}</span>)}
          </div>
        </div>;
      })}
    </div>
  );
}

function WorldDetailPage({world,tab,setTab,worldChars,worldLores,worldColls,worldGallery,setSelectedChar,setSelectedLore,openLore,openColl,selectedLore,update,setModal,exportChar,exportLore,exportColl,setPage,setSelectedWorld,data,initialCollId,clearInitialCollId,setLightboxSrc}) {
  const tabs=[['characters','ti-users','Characters'],['lorebooks','ti-book','Lorebooks'],['collections','ti-folders','Collections'],['gallery','ti-photo','Gallery'],['info','ti-info-circle','World Info']];
  const notesFileTimer = React.useRef();
  const saveWorldNotesBackup = (val) => {
    clearTimeout(notesFileTimer.current);
    notesFileTimer.current = setTimeout(() => {
      window.lorekeeper.saveNotesFile(world.name||('world-'+world.id), val).catch(()=>{});
    }, 800);
  };
  const handleBannerUpload=async()=>{
    const _r=await window.lorekeeper.importImage();
    if(!_r) return;
    const safeName=world.name.replace(/[^a-zA-Z0-9_-]/g,'_');
    const res=await window.lorekeeper.copyImageToFolder(_r.srcPath,'Worlds',safeName);
    if(res){ update(d=>{const w=d.worlds.find(x=>x.id===world.id);if(w){w.image=res.base64;w.image_relpath=res.relPath;}}); }
    else { update(d=>{const w=d.worlds.find(x=>x.id===world.id);if(w)w.image=_r.base64;}); }
  };
  const handleGalleryUpload=async()=>{const _r=await window.lorekeeper.importImage();if(_r)update(d=>{d.gallery.push({id:uuid(),world_id:world.id,name:'image',data:_r.base64});});};
  React.useEffect(()=>{
    if(initialCollId&&clearInitialCollId) clearInitialCollId();
  },[initialCollId]);

  const wbFb = worldColls.find(c=>c.image_data||c.image_relpath);
  const worldBanner = world.image || world.image_relpath || (wbFb?(wbFb.image_data||wbFb.image_relpath):null) || null;
  const lorebook=(selectedLore&&worldLores.find(x=>x.id===selectedLore.id))||worldLores[0]||null;
  return (
    <div>
      {worldBanner&&<div style={{height:160,borderRadius:'var(--rl)',overflow:'hidden',marginBottom:16,position:'relative'}}><ImgFromPath src={worldBanner} alt={world.name} style={IMG_COVER}/><div style={{position:'absolute',inset:0,background:'linear-gradient(to top, rgba(15,14,19,0.85) 0%, transparent 60%)'}}></div><h2 style={{position:'absolute',bottom:14,left:16,fontSize:22,fontWeight:700,color:'#fff',letterSpacing:'0.01em'}}>{world.name}</h2></div>}
      <div className="breadcrumb" onClick={()=>setPage('worlds')}><i className="ti ti-arrow-left"></i><span>Worlds</span><i className="ti ti-chevron-right"></i><span>{world.name}</span></div>
      <div className="world-sub-nav">
        {tabs.map(([t,icon,label])=><div key={t} className={`sub-nav-item ${tab===t?'active':''}`} onClick={()=>setTab(t)}><i className={`ti ${icon}`}></i>{label}</div>)}
      </div>
      {tab==='characters'&&(worldChars.length===0?<div className="empty"><i className="ti ti-users"></i><h3>No characters yet</h3></div>:<div className="chars-grid">{worldChars.map(c=><CharCard key={c.id} char={c} onClick={()=>setSelectedChar(c)}/>)}</div>)}
      {tab==='lorebooks'&&(
        worldLores.length===0?<div className="empty"><i className="ti ti-book"></i><h3>No lorebooks yet</h3></div>:
        <div className="chars-grid">
          {worldLores.map(l=>{
            const imgSrc=l.image_data||l.image_relpath||null;
            return (
              <div key={l.id} className="char-card" onClick={()=>openLore(l)}>
                <div className="char-portrait">
                  {imgSrc?<ImgFromPath src={imgSrc} alt={l.name} style={{width:'100%',height:'100%',objectFit:'cover'}}/>:<i className="ti ti-book" style={{fontSize:32,color:'var(--amber)'}}></i>}
                </div>
                <div className="char-card-body">
                  <div className="char-name">{l.name}</div>
                  <div className="char-tags">
                    <span className={"status-badge status-"+(l.access_level==='public'?'posted':'draft')}>{l.access_level||'private'}</span>
                    <span className="tag" style={{color:'var(--text3)'}}>{(l.content||[]).length} ch.</span>
                    {(l.tags||[]).slice(0,3).map(t=><span key={t} className="tag">{t}</span>)}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}
      {tab==='collections'&&(
        worldColls.length===0?<div className="empty"><i className="ti ti-folders"></i><h3>No collections yet</h3></div>:
        <div className="coll-grid">
          {worldColls.map(c=>{
            const bannerImg=c.image_data||c.image_relpath||world.image||world.image_relpath||null;
            return (
              <div key={c.id} className="coll-card" onClick={()=>openColl(c)}>
                <div className="coll-banner">
                  {bannerImg?<ImgFromPath src={bannerImg} alt={c.name} style={IMG_COVER}/>:<i className="ti ti-folders" style={COLL_FOLDER_ICON}></i>}
                </div>
                <div className="coll-card-body">
                  <h3>{c.name}</h3>
                  {c.definition&&<p style={{WebkitLineClamp:2,WebkitBoxOrient:'vertical',display:'-webkit-box',overflow:'hidden'}}>{c.definition}</p>}
                  {(c.tags||[]).length>0&&<div className="char-tags" style={{marginTop:6}}>{c.tags.slice(0,4).map(t=><span key={t} className="tag">{t}</span>)}</div>}
                </div>
              </div>
            );
          })}
        </div>
      )}
      {tab==='gallery'&&(
        <div>
          <div className="gallery-grid">
            <div className="gallery-item gallery-upload" onClick={handleGalleryUpload}><i className="ti ti-cloud-upload" style={{fontSize:28}}></i><span>Upload image</span></div>
            {/* manually uploaded gallery images */}
            {worldGallery.map(g=><GalleryItem key={g.id} src={g.data||g.relPath} label={g.name} path={g.relPath} onViewFull={()=>setLightboxSrc(g.data||g.relPath)}/>)}
            {/* character portraits and portrait slots */}
            {worldChars.flatMap(c=>[

function CollectionCharPicker({coll,data,update,setSelectedChar}) {
  const [search,setSearch]=useState('');
  const [showAll,setShowAll]=useState(false);
  const q=search.toLowerCase();
  const isInColl=(ch)=>(ch.collections||[]).includes(coll.id)||(coll.companions||[]).includes(ch.id);
  const members=data.characters.filter(isInColl);
  const nonMembers=data.characters.filter(ch=>!isInColl(ch)&&(!q||ch.name.toLowerCase().includes(q)||(ch.display_name||'').toLowerCase().includes(q)));
  const toggle=(ch)=>update(d=>{
    const c=d.characters.find(x=>x.id===ch.id);
    if(!c)return;
    if(!c.collections)c.collections=[];
    const inCollections=c.collections.includes(coll.id);
    const inCompanions=(coll.companions||[]).includes(ch.id);
    if(inCollections||inCompanions){
      c.collections=c.collections.filter(x=>x!==coll.id);
      // also clean from coll.companions so imported chars are fully removed
      const dc=d.collections.find(x=>x.id===coll.id);
      if(dc&&dc.companions)dc.companions=dc.companions.filter(x=>x!==ch.id);
    } else {
      c.collections.push(coll.id);
    }
  });
  const groupByWorld=(chars)=>data.worlds.reduce((acc,w)=>{
    const wChars=chars.filter(c=>c.world_id===w.id&&(!q||c.name.toLowerCase().includes(q)||(c.display_name||'').toLowerCase().includes(q)));
    if(wChars.length>0)acc.push({world:w,chars:wChars});
    return acc;
  },[]);

  return (
    <div>
      <div style={{marginBottom:16,display:'flex',gap:10,alignItems:'center'}}>
        <div style={{position:'relative',flex:1}}>
          <i className="ti ti-search" style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'var(--text3)',fontSize:15,pointerEvents:'none'}}></i>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search characters…" style={{width:'100%',background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',padding:'7px 12px 7px 32px',borderRadius:'var(--r)',fontSize:13,outline:'none'}}/>
        </div>
        <button className={`btn ${showAll?'primary':''}`} onClick={()=>setShowAll(s=>!s)}><i className="ti ti-plus"></i>{showAll?'Hide picker':'Add characters'}</button>
      </div>

      {members.length>0&&<div style={{marginBottom:20}}>
        <div style={{fontSize:11,color:'var(--text3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:10}}>In collection ({members.length})</div>
        <div className="chars-grid">
          {members.filter(c=>!q||c.name.toLowerCase().includes(q)||(c.display_name||'').toLowerCase().includes(q)).map(c=>(
            <div key={c.id} style={{position:'relative'}}>
              <CharCard char={c} onClick={()=>setSelectedChar(c)}/>
              <button className="btn danger" style={{position:'absolute',top:6,right:6,padding:'3px 6px',fontSize:11,opacity:0.9}} onClick={e=>{e.stopPropagation();toggle(c);}} title="Remove from collection"><i className="ti ti-x"></i></button>
            </div>
          ))}
        </div>
      </div>}

      {members.length===0&&!showAll&&<div className="empty"><i className="ti ti-users"></i><h3>No characters linked yet</h3><p>Click "Add characters" to link them manually, or import their JSONs.</p></div>}

      {showAll&&<div>
        <div style={{fontSize:11,color:'var(--text3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:10}}>Add from library</div>
        {groupByWorld(nonMembers).map(({world,chars})=>(
          <div key={world.id} style={{marginBottom:16}}>
            <div style={{fontSize:11,color:'var(--text3)',marginBottom:6,display:'flex',alignItems:'center',gap:6}}>
              {(world.image||world.image_relpath)&&<ImgFromPath src={world.image||world.image_relpath} style={IMG_ICON16}/>}{world.name}
            </div>
            <div className="chars-grid">
              {chars.map(c=>(
                <div key={c.id} style={{position:'relative',cursor:'pointer'}} onClick={()=>toggle(c)}>
                  <CharCard char={c} onClick={()=>toggle(c)}/>
                  <div style={{position:'absolute',inset:0,background:'rgba(167,139,250,0.08)',borderRadius:'var(--rl)',border:'1px dashed var(--accent2)',display:'flex',alignItems:'center',justifyContent:'center',opacity:0,transition:'opacity 0.15s'}} className="add-overlay">
                    <i className="ti ti-plus" style={{fontSize:24,color:'var(--accent)'}}></i>
                  </div>
                </div>
              ))}
            </div>
          </div>
        ))}
        {nonMembers.length===0&&<p className="text-muted">All characters are already in this collection.</p>}
      </div>}
    </div>
  );
}

function CollectionPicker({charData,data,updChar,update}) {
  const [search,setSearch]=useState('');
  const q=search.toLowerCase();
  const allColls=data.collections.filter(c=>!search||c.name.toLowerCase().includes(q));
  const grouped=data.worlds.reduce((acc,w)=>{
    const wColls=allColls.filter(c=>c.world_id===w.id);
    if(wColls.length>0) acc.push({world:w,colls:wColls});
    return acc;
  },[]);
  const noWorld=allColls.filter(c=>!data.worlds.find(w=>w.id===c.world_id));
  const isLinked=(coll)=>(charData.collections||[]).includes(coll.id)||(coll.companions||[]).includes(charData.id);
  const toggle=(coll)=>update(d=>{
    const c=d.characters.find(x=>x.id===charData.id);
    if(!c)return;
    if(!c.collections)c.collections=[];
    const dc=d.collections.find(x=>x.id===coll.id);
    const inCollections=c.collections.includes(coll.id);
    const inCompanions=(dc?.companions||[]).includes(charData.id);
    if(inCollections||inCompanions){
      c.collections=c.collections.filter(x=>x!==coll.id);
      if(dc&&dc.companions)dc.companions=dc.companions.filter(x=>x!==charData.id);
    } else { c.collections.push(coll.id); }
  });
  return (
    <div style={{display:'flex',flexDirection:'column',gap:14}}>
      <div className="field-block">
        <label>Collections ({data.collections.filter(c=>isLinked(c)).length} linked)</label>
        <div style={{position:'relative',marginBottom:12,marginTop:8}}>
          <i className="ti ti-search" style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'var(--text3)',fontSize:15,pointerEvents:'none'}}></i>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search collections…" style={{width:'100%',background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',padding:'7px 12px 7px 32px',borderRadius:'var(--r)',fontSize:13,outline:'none'}}/>
        </div>
        {data.collections.length===0?<p className="text-muted">No collections yet.</p>:
          <div>
            {grouped.map(({world,colls})=>(
              <div key={world.id} style={{marginBottom:12}}>
                <div style={{fontSize:11,color:'var(--text3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:6,display:'flex',alignItems:'center',gap:6}}>
                  {(world.image||world.image_relpath)&&<ImgFromPath src={world.image||world.image_relpath} style={IMG_ICON16}/>}{world.name}
                </div>
                {colls.map(c=>{
                  const linked=isLinked(c);
                  const fromPlatform=(c.companions||[]).includes(charData.id)&&!(charData.collections||[]).includes(c.id);
                  return <div key={c.id} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 10px',background:linked?'var(--accent-dim)':'var(--bg3)',border:linked?'1px solid var(--accent2)':'1px solid var(--border)',borderRadius:'var(--r)',marginBottom:4,cursor:fromPlatform?'default':'pointer',transition:'all 0.15s',opacity:fromPlatform?0.7:1}} onClick={()=>!fromPlatform&&toggle(c)}>
                    <i className={`ti ${linked?'ti-folder-filled':'ti-folder'}`} style={{color:linked?'var(--accent)':'var(--text3)',fontSize:16,flexShrink:0}}></i>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:13,fontWeight:500,color:linked?'var(--accent)':'var(--text)'}}>{c.name}</div>
                      {fromPlatform&&<div style={{fontSize:10,color:'var(--text3)'}}>Linked via platform import</div>}
                    </div>
                    {linked&&<i className="ti ti-check" style={{color:'var(--accent)',fontSize:16,flexShrink:0}}></i>}
                  </div>;
                })}
              </div>
            ))}
            {noWorld.length>0&&<div>
              <div style={{fontSize:11,color:'var(--text3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:6}}>No World</div>
              {noWorld.map(c=>{
                const linked=isLinked(c);
                return <div key={c.id} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 10px',background:linked?'var(--accent-dim)':'var(--bg3)',border:linked?'1px solid var(--accent2)':'1px solid var(--border)',borderRadius:'var(--r)',marginBottom:4,cursor:'pointer'}} onClick={()=>toggle(c)}>
                  <i className={`ti ${linked?'ti-folder-filled':'ti-folder'}`} style={{color:linked?'var(--accent)':'var(--text3)',fontSize:16}}></i>
                  <span style={{fontSize:13,color:linked?'var(--accent)':'var(--text)'}}>{c.name}</span>
                  {linked&&<i className="ti ti-check" style={{color:'var(--accent)',fontSize:16,marginLeft:'auto'}}></i>}
                </div>;
              })}
            </div>}
          </div>
        }
      </div>
    </div>
  );
}

function LorePage({lorebook,data,update,exportLore,initialTab,importJSON,setModal,onBack}) {
  const [loreTab, setLoreTab] = useState(initialTab||'chapters');
  const [loreMdPreview, setLoreMdPreview] = useState(false);
  const [loreFindOpen,setLoreFindOpen]=useState(false);
  const [loreFindQ,setLoreFindQ]=useState('');
  useEffect(()=>{
    const h=(e)=>{
      if((e.ctrlKey||e.metaKey)&&e.key==='f'){ e.preventDefault(); setLoreFindOpen(true); }
      else if(e.key==='Escape'&&loreFindOpen){ setLoreFindOpen(false); setLoreFindQ(''); }
    };
    window.addEventListener('keydown',h);
    return ()=>window.removeEventListener('keydown',h);
  },[loreFindOpen]);
  const lore = (data.lorebooks.find(x=>x.id===lorebook.id))||lorebook;
  const world = data.worlds.find(w=>w.id===lore.world_id);

  const updLore=(fn)=>update(d=>{const l=d.lorebooks.find(x=>x.id===lorebook.id);if(l){fn(l);l.updated_at=new Date().toISOString();if(l.lorebook_filename){
    const{world_id,image_data,lorebook_filename,...lrest}=l;
    window.lorekeeper.saveLorebookJson(l.lorebook_filename,{...lrest,updated_at:l.updated_at});
  }}});

  const handleImage=async()=>{
    const r=await window.lorekeeper.importImage();
    if(!r) return;
    if(lore.lorebook_filename){
      const res=await window.lorekeeper.copyImageToFolder(r.srcPath,'Lorebooks',lore.lorebook_filename.replace(/\.json$/i,''));
      if(res){updLore(l=>{l.image_data=res.base64;l.image_relpath=res.relPath;});return;}
    }
    updLore(l=>{l.image_data=r.base64;});
  };

  const tabs=[['chapters','Chapters'],['settings','Settings'],['export','Export']];

  return (
    <div>
      <div className="breadcrumb" onClick={onBack}>
        <i className="ti ti-arrow-left"></i>
        <span>{world?world.name:'Lorebooks'}</span>
        <i className="ti ti-chevron-right"></i>
        <span>{lore.name}</span>
      </div>
      <div className="char-detail">
        <div className="char-sidebar">
          <div className="char-portrait-lg" onClick={handleImage} style={{cursor:'pointer'}}>
            {(lore.image_data||lore.image_relpath)
              ?<ImgFromPath src={lore.image_data||lore.image_relpath} alt={lore.name} style={{width:'100%',height:'100%',objectFit:'cover'}}/>
              :<div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:6}}><i className="ti ti-photo" style={{fontSize:40,color:'var(--text3)'}}></i><span style={{fontSize:11,color:'var(--text3)'}}>Set cover</span></div>
            }
          </div>
          <button className="btn" style={{width:'100%',justifyContent:'center'}} onClick={handleImage}>
            <i className="ti ti-upload"></i>{(lore.image_data||lore.image_relpath)?'Change Image':'Set Image'}
          </button>
          {(lore.image_data||lore.image_relpath)?<button className="btn danger" style={{width:'100%',justifyContent:'center',fontSize:12}} onClick={()=>updLore(l=>{l.image_data=null;l.image_relpath=null;})}><i className="ti ti-x"></i>Remove Image</button>:null}
          <div className="info-card">
            <h4>Portrait Image ID <span style={{color:'var(--text3)',fontWeight:'normal',textTransform:'none',letterSpacing:0,fontSize:10}}>(from site)</span></h4>
            <div style={{display:'flex',gap:4}}>
              <input value={lore.image_id||''} onChange={e=>updLore(l=>{l.image_id=e.target.value||null;})} placeholder="paste UUID..." style={{flex:1,background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',padding:'4px 6px',borderRadius:'var(--r)',fontSize:10,outline:'none',fontFamily:'monospace',minWidth:0}}/>
              {lore.image_id?<button className="btn" style={{padding:'3px 5px',flexShrink:0}} onClick={()=>navigator.clipboard.writeText(lore.image_id)}><i className="ti ti-copy" style={{fontSize:11}}></i></button>:null}
            </div>
          </div>
          <div className="info-card">
            <h4>Quick Info</h4>
            {world&&<div className="info-row"><span className="label">World</span><span className="value">{world.emoji?world.emoji+' ':''}{world.name}</span></div>}
            <div className="info-row"><span className="label">Status</span><span className={"status-badge status-"+(lore.status||'draft')}>{lore.status||'draft'}</span></div>
            <div className="info-row"><span className="label">Access</span><span className={"status-badge status-"+(lore.access_level==='public'?'posted':'draft')}>{lore.access_level||'private'}</span></div>
            <div className="info-row"><span className="label">Chapters</span><span className="value">{(lore.content||[]).length}</span></div>
            <div className="info-row"><span className="label">Updated</span><span className="value">{lore.updated_at?lore.updated_at.split('T')[0]:'—'}</span></div>
          </div>
          {(lore.tags||[]).length>0&&<div className="info-card">
            <h4>Tags</h4>
            <div className="char-tags">{lore.tags.map(t=><span key={t} className="tag">{t}</span>)}</div>
          </div>}
        </div>
        <div className="char-main">
          <div style={{display:'flex',gap:4,background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--rl)',padding:4,flexWrap:'wrap'}}>
            {tabs.map(([t,l])=><div key={t} className={"sub-nav-item "+(loreTab===t?'active':'')} onClick={()=>setLoreTab(t)} style={{fontSize:12,padding:'5px 10px'}}>{l}</div>)}
          </div>
          {loreFindOpen&&<FindBar fields={loreFindFields(lore)} q={loreFindQ} setQ={setLoreFindQ} setTab={setLoreTab} placeholder="Find in chapters…" onClose={()=>{setLoreFindOpen(false);setLoreFindQ('');}}/>}
          {loreTab==='chapters'&&<LoreChaptersTab lore={lore} updLore={updLore}/>}
          {loreTab==='settings'&&<LoreSettingsTab lore={lore} updLore={updLore} data={data} onBack={onBack} update={update} setModal={setModal}/>}
          {loreTab==='export'&&<LoreExportPanel lorebook={lore} exportLore={exportLore} exportLoreMd={()=>{const lines=["# "+(lore.name||"Lorebook")];if(lore.short_description){lines.push("");lines.push(lore.short_description);}(lore.content||[]).forEach(ch=>{lines.push("");lines.push("## "+(ch.title||"Untitled"));if(ch.text)lines.push(ch.text);});const safeName=(lore.name||"lorebook").replace(/[^a-zA-Z0-9_-]/g,"_");window.lorekeeper.exportFile({defaultName:safeName+"-lorebook.md",content:lines.join("\n"),folder:"Lorebooks"});}} loreMdPreview={loreMdPreview} setLoreMdPreview={setLoreMdPreview} buildLoreMd={()=>{const lines=["# "+(lore.name||"Lorebook")];(lore.content||[]).forEach(ch=>{lines.push("");lines.push("## "+(ch.title||"Untitled"));if(ch.text)lines.push(ch.text);});return lines.join("\n");}} importJSON={async()=>{const content=await window.lorekeeper.importFile();if(!content)return;try{const json=JSON.parse(content);setModal({type:'confirm-update-lore',obj:json,existing:lore});}catch{alert('Invalid JSON file.');}}} update={update}/>}
        </div>
      </div>
    </div>
  );
}

// fields: [{tab, label, text}] — the caller decides what is searchable on its page.
function FindBar({fields, q, setQ, onClose, setTab, placeholder}) {
  const needle = q.trim().toLowerCase();
  const hits = [];
  if(needle) {
    const count = (text) => {
      if(!text) return 0;
      let n=0, i=0; const h=String(text).toLowerCase();
      while((i=h.indexOf(needle,i))!==-1){ n++; i+=needle.length; }
      return n;
    };
    fields.forEach(f=>{ const n=count(f.text); if(n) hits.push({tab:f.tab, label:f.label, n:n}); });
  }
  const total = hits.reduce((a,h)=>a+h.n,0);
  return (
    <div style={{display:'flex',flexDirection:'column',gap:6,padding:'8px 10px',marginBottom:10,background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--r)'}}>
      <div style={{display:'flex',gap:8,alignItems:'center'}}>
        <i className="ti ti-search" style={{color:'var(--text3)',fontSize:14}}></i>
        <input autoFocus value={q} onChange={e=>setQ(e.target.value)} placeholder={placeholder}
          style={{flex:1,background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',padding:'5px 8px',borderRadius:'var(--r)',fontSize:12,outline:'none',minWidth:0}}/>
        <span style={{fontSize:11,color:'var(--text3)',whiteSpace:'nowrap'}}>{needle?(total+' match'+(total===1?'':'es')):''}</span>
        <button className="btn" style={{fontSize:11,padding:'2px 8px'}} onClick={onClose}>Close</button>
      </div>
      {needle&&total===0&&<div style={{fontSize:11,color:'var(--text3)'}}>No matches.</div>}
      {hits.length>0&&<div style={{display:'flex',flexWrap:'wrap',gap:4}}>
        {hits.map(h=><button key={h.label} className="btn" style={{fontSize:11,padding:'2px 8px'}} onClick={()=>setTab(h.tab)}>{h.label} · {h.n}</button>)}
      </div>}
    </div>
  );
}

                  </div>
                ))}
