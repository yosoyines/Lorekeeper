<!DOCTYPE html>
<html lang="en" style="background:#0f0e13;color:#f2f0ff;">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https: http://localhost:* http://127.0.0.1:* data: blob:">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lorekeeper</title>
<script src="https://unpkg.com/react@18.2.0/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; scrollbar-width: thin; scrollbar-color: var(--bg4) transparent; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent-dim); }
  ::-webkit-scrollbar-corner { background: transparent; }
  :root {
    --bg: #0f0e13; --bg2: #1a1825; --bg3: #231f33; --bg4: #2e2a42;
    --accent: #a78bfa; --accent2: #7c5cbf; --accent-dim: #3d2f6e;
    --text: #e8e4f4; --text2: #a49dc0; --text3: #6b6488;
    --border: rgba(167,139,250,0.12); --border2: rgba(167,139,250,0.22);
    --red: #f87171; --green: #6ee7b7; --amber: #fbbf24; --pink: #f472b6; --teal: #2dd4bf;
    --r: 8px; --rl: 12px;
  }
  /* Colorblind mode overrides */
  html.cb-rg { --red: #fb923c; --green: #60a5fa; } /* Red-Green (deuteranopia/protanopia): red→orange, green→blue */
  html.cb-by { --amber: #f87171; --teal: #e879a9; --green: #60a5fa; } /* Blue-Yellow (tritanopia): amber→red-orange, teal→pink, green→blue */

  .char-tags + .char-tags{margin-top:6px}
  .cd-col12{display:flex;flex-direction:column;gap:12px}
  .cd-col14{display:flex;flex-direction:column;gap:14px}
  .cd-col10{display:flex;flex-direction:column;gap:10px}
  .cd-col6{display:flex;flex-direction:column;gap:6px}
  .cd-row4{display:flex;gap:4px}
  .cd-row4-mb4{display:flex;gap:4px;margin-bottom:4px}
  .cd-row6{display:flex;gap:6px}
  .cd-row6w{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .cd-row8{display:flex;gap:8px}
  .cd-row8mt8{display:flex;gap:8px;margin-top:8px}
  .cd-row8mb8{display:flex;gap:8px;margin-bottom:8px}
  .cd-row8ai{display:flex;align-items:center;gap:8px}
  .cd-row8ai-mb6{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .cd-row10ai{display:flex;align-items:center;gap:10px}
  .cd-spbt{display:flex;justify-content:space-between;align-items:center}
  .cd-spbt4{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
  .cd-divider{padding-top:8px;border-top:1px solid var(--border)}
  .cd-hint{color:var(--text3);font-weight:normal;text-transform:none;letter-spacing:0}
  .cd-hint-sm{font-size:11px;color:var(--text3);font-weight:normal;text-transform:none;letter-spacing:0}
  .cd-sub{font-size:11px;color:var(--text3)}
  .cd-sub12{font-size:12px;color:var(--text3)}
  .cd-world-lbl{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
  .cd-tab-bar{display:flex;gap:4px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:4px;flex-wrap:wrap}
  .cd-tab-item{font-size:12px!important;padding:5px 10px!important}
  .cd-portrait-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:8px}
  .cd-portrait-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;position:relative;cursor:grab}
  .cd-drag-badge{position:absolute;top:6px;left:6px;z-index:2;background:rgba(0,0,0,.45);border-radius:4px;padding:2px 4px;line-height:1}
  .cd-portrait-img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;display:block}
  .cd-portrait-empty{width:100%;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center}
  .cd-portrait-uuid{padding:4px 8px;background:var(--bg2);border-top:1px solid var(--border)}
  .cd-uuid-lbl{font-size:9px;color:var(--text3);margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em}
  .cd-portrait-meta{padding:8px}
  .cd-portrait-actions{display:flex;gap:4px;margin-top:6px}
  .cd-banner-preview{height:60px;border-radius:var(--r);overflow:hidden;border:1px solid var(--border)}
  .cd-gallery-picker{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:8px;margin-bottom:4px}
  .cd-flags-col{display:flex;flex-direction:column;gap:10px;margin-top:4px}
  .cd-flag-label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2);cursor:pointer;font-weight:normal;text-transform:none;letter-spacing:0}
  .cd-scenario-hdr{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .cd-scenario-item{cursor:default}
  .cd-date-row{display:flex;gap:8px;margin-bottom:8px}
  .cd-lorebook-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r);margin-bottom:4px;cursor:pointer;transition:all .15s;background:var(--bg3);border:1px solid var(--border)}
  .cd-lorebook-row.linked{background:var(--accent-dim);border-color:var(--accent2)}
  .cd-lore-info{flex:1;min-width:0}
  .cd-lore-name{font-size:13px;font-weight:500;color:var(--text)}
  .cd-lore-name.linked{color:var(--accent)}
  .cd-lore-desc{font-size:11px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cd-linked-pill{display:flex;align-items:center;gap:6px;background:var(--accent-dim);border:1px solid var(--accent2);border-radius:var(--r);padding:4px 10px;font-size:12px;color:var(--accent)}
  .cd-remove-btn{background:none;border:none;color:var(--text3);cursor:pointer;padding:0;font-size:13px;line-height:1}
  .cd-lore-entry-hdr{display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .cd-reapply-row{display:flex;gap:8px;margin-bottom:4px}
  .cd-save-row{display:flex;gap:8px;align-items:center}
  .cd-no-world{padding:16px;color:var(--text3)}
  .cd-no-tpl{padding:16px}
  .cd-restore-drop{border-radius:var(--r);padding:16px;text-align:center;font-size:12px;color:var(--text3);margin-bottom:12px;transition:all .15s;cursor:pointer}
  .cd-restore-drop.idle{border:2px dashed var(--border2);background:transparent}
  .cd-restore-drop.active{border:2px dashed var(--accent);background:var(--accent-dim)}
  .cd-restore-footer{display:flex;justify-content:flex-end}
  html, body, #root { height: 100%; font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); }
  body { opacity: 0; }
  body.app-ready { opacity: 1; transition: opacity 0.15s ease; }
  #root { display: flex; flex-direction: column; }
  .app { display: flex; height: 100%; overflow: hidden; }
  .sidebar { width: 220px; min-width: 220px; height: 100%; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; transition: width 0.2s; overflow: hidden; }
  .sidebar.collapsed { width: 52px; min-width: 52px; }
  .sidebar-header { height: 56px; padding: 0 12px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .logo-mark { width: 28px; height: 28px; background: var(--accent-dim); border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .logo-mark i { color: var(--accent); font-size: 15px; }
  .logo-text { font-size: 15px; font-weight: 600; color: var(--accent); white-space: nowrap; letter-spacing: 0.03em; }
  .sidebar-nav { flex: 1; padding: 8px 0; overflow-y: auto; }
  .sidebar.collapsed .nav-section { visibility: hidden; }
  .nav-section { padding: 8px 12px 4px; font-size: 10px; font-weight: 600; color: var(--text3); letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }
  .sidebar.collapsed .nav-item { justify-content: center; padding: 8px 0; }
  .sidebar.collapsed .world-item { justify-content: center; padding: 8px 0; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; cursor: pointer; transition: background 0.15s; color: var(--text2); font-size: 13.5px; white-space: nowrap; }
  .nav-item:hover { background: var(--bg3); color: var(--text); }
  .nav-item.active { background: var(--accent-dim); color: var(--accent); }
  .nav-item i { font-size: 17px; flex-shrink: 0; }
  .collapse-btn { background: transparent; border: none; color: var(--text3); cursor: pointer; padding: 4px; margin-left: auto; flex-shrink: 0; display: flex; align-items: center; justify-content: center; line-height: 1; }
  .sidebar.collapsed .sidebar-header { padding: 0; justify-content: center; gap: 4px; }
  .sidebar.collapsed .sidebar-header .collapse-btn { margin-left: 0; }
  .collapse-btn:hover { color: var(--text); }
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; background: var(--bg2); }
  .topbar h1 { font-size: 16px; font-weight: 600; color: var(--text); }
  .topbar-actions { margin-left: auto; display: flex; gap: 8px; }
  .btn { background: transparent; border: 1px solid var(--border2); color: var(--text2); padding: 6px 12px; border-radius: var(--r); cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px; transition: all 0.15s; }
  .btn:hover { background: var(--bg3); color: var(--text); }
  .btn.primary { background: var(--accent-dim); border-color: var(--accent2); color: var(--accent); }
  input[type="date"] { color-scheme: dark; }
  .btn.primary:disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
  .btn.danger { border-color: rgba(248,113,113,0.3); color: var(--red); }
  .btn.danger:hover { background: rgba(248,113,113,0.1); }
  .content { flex: 1; overflow-y: auto; padding: 24px; }
  .search-wrap { position: relative; flex: 1; max-width: 320px; }
  .search-wrap i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 16px; pointer-events: none; }
  .search-wrap input { width: 100%; background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 7px 12px 7px 34px; border-radius: var(--r); font-size: 13px; outline: none; }
  .search-wrap input:focus { border-color: var(--accent2); }
  .search-results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--rl); z-index: 100; max-height: 320px; overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
  .search-result { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid var(--border); }
  .search-result:last-child { border-bottom: none; }
  .search-result:hover { background: var(--bg3); }
  .search-result .sr-name { font-size: 13.5px; font-weight: 500; color: var(--text); }
  .search-result .sr-meta { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .type-badge { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 4px; font-weight: 600; margin-right: 6px; }
  .type-char { background: rgba(167,139,250,0.15); color: var(--accent); }
  .type-world { background: rgba(45,212,191,0.12); color: var(--teal); }
  .type-lore { background: rgba(251,191,36,0.12); color: var(--amber); }
  .type-coll { background: rgba(244,114,182,0.12); color: var(--pink); }
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .cal-nav { display: flex; gap: 8px; align-items: center; }
  .cal-nav button { background: var(--bg3); border: 1px solid var(--border); color: var(--text2); width: 30px; height: 30px; border-radius: var(--r); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .cal-nav button:hover { color: var(--text); border-color: var(--border2); }
  .cal-month { font-size: 18px; font-weight: 600; color: var(--text); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-dow { text-align: center; font-size: 11px; font-weight: 600; color: var(--text3); letter-spacing: 0.05em; padding: 6px 0; text-transform: uppercase; }
  .cal-day { min-height: 80px; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r); padding: 6px 8px; cursor: pointer; transition: border-color 0.15s; overflow: hidden; }
  .cal-day:hover { border-color: var(--border2); }
  .cal-day.today { border-color: var(--accent2); }
  .cal-day.has-events { background: var(--bg3); }
  .cal-day.other-month { opacity: 0.35; }
  .cal-day.selected { border-color: var(--accent); background: var(--accent-dim); }
  .day-num { font-size: 12px; color: var(--text2); font-weight: 500; }
  .cal-day.today .day-num { color: var(--accent); font-weight: 700; }
  .day-char { font-size: 10px; color: var(--text2); background: var(--accent-dim); border-radius: 3px; padding: 1px 4px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .dash-layout { display: grid; grid-template-columns: minmax(0,1fr) 280px; gap: 20px; }
  .upcoming-panel { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--rl); padding: 16px; }
  .today-banner { background: var(--accent-dim); border: 1px solid var(--accent2); border-radius: var(--r); padding: 10px 14px; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
  .cycle-panel { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--rl); padding: 16px; margin-top: 12px; }
  .upcoming-panel h3 { font-size: 11px; font-weight: 600; color: var(--text3); margin-bottom: 12px; letter-spacing: 0.06em; text-transform: uppercase; }
  .upcoming-item { padding: 10px 0; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-start; }
  .upcoming-item:last-child { border-bottom: none; }
  .upcoming-date { font-size: 11px; color: var(--accent); font-weight: 600; min-width: 36px; text-align: center; background: var(--accent-dim); border-radius: 4px; padding: 3px 5px; line-height: 1.4; }
  .upcoming-info .name { font-size: 13px; font-weight: 500; color: var(--text); }
  .upcoming-info .world { font-size: 11px; color: var(--text3); }
  .status-badge { display: inline-block; font-size: 10px; padding: 1px 7px; border-radius: 10px; font-weight: 600; }
  .status-draft { background: rgba(107,100,136,0.3); color: var(--text3); }
  .status-ready { background: rgba(167,139,250,0.15); color: var(--accent); }
  .status-posted { background: rgba(110,231,183,0.12); color: var(--green); }
  .worlds-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  .world-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--rl); overflow: hidden; cursor: pointer; transition: border-color 0.15s, transform 0.1s; }
  .world-card:hover { border-color: var(--border2); transform: translateY(-1px); }
  .world-banner { height: 80px; background: linear-gradient(135deg, var(--accent-dim), var(--bg3)); display: flex; align-items: center; justify-content: center; position: relative; }
  .world-banner i { font-size: 32px; color: var(--accent); opacity: 0.5; }
  .world-card-body { padding: 14px; }
  .world-card-body h3 { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .world-card-body p { font-size: 12px; color: var(--text3); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .world-card-footer { padding: 10px 14px; border-top: 1px solid var(--border); display: flex; gap: 10px; flex-wrap: wrap; }
  .world-stat { font-size: 11px; color: var(--text3); }
  .world-stat span { color: var(--text2); font-weight: 600; margin-right: 3px; }
  .world-sub-nav { display: flex; gap: 2px; margin-bottom: 20px; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--rl); padding: 4px; flex-wrap: wrap; }
  .sub-nav-item { padding: 7px 14px; border-radius: var(--r); cursor: pointer; font-size: 13px; color: var(--text2); transition: all 0.15s; display: flex; align-items: center; gap: 6px; }
  .sub-nav-item:hover { color: var(--text); background: var(--bg3); }
  .sub-nav-item.active { background: var(--accent-dim); color: var(--accent); }
  .chars-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
  .char-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--rl); overflow: hidden; cursor: pointer; transition: border-color 0.15s, transform 0.1s; }
  .char-card:hover { border-color: var(--border2); transform: translateY(-1px); }
  .char-portrait { height: 200px; background: var(--bg3); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .char-portrait i { font-size: 40px; color: var(--text3); }
  .char-portrait img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .char-card-body { padding: 12px; }
  .char-name { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
  .char-display { font-size: 11px; color: var(--accent); margin-bottom: 6px; }
  .char-tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag { font-size: 10px; background: var(--bg3); color: var(--text3); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border); }
  .flag-spicy { background: rgba(251,191,36,0.1); color: var(--amber); border-color: rgba(251,191,36,0.2); }
  .flag-extra-spicy { background: rgba(248,113,113,0.1); color: var(--red); border-color: rgba(248,113,113,0.2); }
  .char-detail { display: grid; grid-template-columns: 260px 1fr; gap: 20px; }
  .char-sidebar { display: flex; flex-direction: column; gap: 12px; }
  .char-portrait-lg { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--rl); height: 260px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .char-portrait-lg img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .char-portrait-lg i { font-size: 64px; color: var(--text3); }
  .info-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--rl); padding: 14px; }
  .info-card h4 { font-size: 11px; font-weight: 600; color: var(--text3); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 10px; }
  .info-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
  .info-row:last-child { border-bottom: none; }
  .info-row .label { color: var(--text3); }
  .info-row .value { color: var(--text); font-weight: 500; text-align: right; max-width: 160px; word-break: break-word; }
  .char-main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .field-block { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--rl); padding: 16px; }
  .field-block label { font-size: 11px; font-weight: 600; color: var(--text3); letter-spacing: 0.06em; text-transform: uppercase; display: block; margin-bottom: 8px; }
  .field-block input, .field-block textarea, .field-block select { width: 100%; background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: var(--r); font-size: 13px; outline: none; font-family: inherit; resize: vertical; transition: border-color 0.15s; }
  .field-block input:focus, .field-block textarea:focus, .field-block select:focus { border-color: var(--accent2); }
  .field-block textarea { min-height: 100px; line-height: 1.6; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .scenario-item { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--r); padding: 12px; margin-bottom: 8px; position: relative; }
  .scenario-del { position: absolute; top: 10px; right: 10px; background: transparent; border: none; color: var(--text3); cursor: pointer; font-size: 16px; }
  .scenario-del:hover { color: var(--red); }
  .lore-layout { display: grid; grid-template-columns: 200px 1fr; gap: 16px; min-height: 400px; }
  .lore-chapters { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--rl); padding: 8px; }
  .chapter-item { padding: 8px 10px; border-radius: var(--r); cursor: pointer; font-size: 13px; color: var(--text2); transition: all 0.15s; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .chapter-item:hover { background: var(--bg3); color: var(--text); }
  .chapter-item.active { background: var(--accent-dim); color: var(--accent); }
  .chapter-item .ch-del { background: none; border: none; color: transparent; cursor: pointer; font-size: 14px; padding: 0; }
  .chapter-item:hover .ch-del { color: var(--text3); }
  .chapter-item:hover .ch-del:hover { color: var(--red); }
  .lore-editor { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--rl); padding: 16px; display: flex; flex-direction: column; gap: 12px; }

// Robust timestamp parser. Saucepan exports use a format like
// "2026-06-18 03:01:00.455294 +00:00:00" which native Date() cannot parse (returns NaN).
// Normalize: space -> T, truncate microseconds to milliseconds, fix the timezone offset
// from "+00:00:00" to "+00:00" before handing off to Date().
const parseTimestamp = (s) => {
  if (!s) return 0;
  let t = new Date(s).getTime();
  if (!isNaN(t)) return t;
  let norm = String(s).trim();
  norm = norm.replace(' ', 'T');
  norm = norm.replace(/(\.\d{3})\d+/, '$1');
  norm = norm.replace(/([+-]\d{2}:\d{2}):\d{2}$/, '$1');
  t = new Date(norm).getTime();
  return isNaN(t) ? 0 : t;
};

// Banner UUID actually used on export. A manually pasted id always wins; otherwise the
// companion inherits the banner of any community collection it belongs to, so shared
// collection art doesn't have to be re-uploaded per companion on the site.
function resolveBannerId(c, data) {
  const manual = c.companion_profile_banner_image && c.companion_profile_banner_image.id;
  if (manual) return manual;
  const colls = (data && data.collections) || [];
  const inColl = c.collections || [];
  for (let i = 0; i < colls.length; i++) {
    const cl = colls[i];
    if (cl.is_community && cl.image && cl.image.id && inColl.includes(cl.id)) return cl.image.id;
  }
  return null;
}

// Returns every depth field with whether it's filled, so the row shows a full checklist
// rather than only the gaps.
function reworkChecks(c) {
  return CHAR_CHECKS.map(function (f) { return {label: f[0], ok: !!f[1](c)}; });
}

// True when every field is present — the condition for allowing draft -> ready.
function charIsComplete(c) {
  return CHAR_CHECKS.every(function (f) { return !!f[1](c); });
}

function reworkPostedKey(c) {
  const dates = (c.posted_dates || []).slice().sort();
  return dates[0] || c.created_at || '9999';
}

function reworkGapCount(c) {
  const checks = reworkChecks(c);
  let n = 0;
  for (let i = 0; i < checks.length; i++) { if (!checks[i].ok) n++; }
  return n;
}

function sortedWorlds(data) {
  const order = data.world_order || [];
  return [...(data.worlds||[])].sort((a,b) => {
    const ai = order.indexOf(a.id), bi = order.indexOf(b.id);
    if(ai>=0&&bi>=0) return ai-bi;
    if(ai>=0) return -1;
    if(bi>=0) return 1;
    return (a.name||'').localeCompare(b.name||'');
  });
}

// Pure helper — operates directly on a structuredClone draft.
// Advances cycle_head_world_id if the given world is the expected next in the cycle.
// Out-of-order posts (worldIdx <= headIdx) are silently ignored.
function advanceCycleHeadInDraft(d, worldId) {
  const cycle = d.release_cycle || [];
  if(cycle.length === 0 || !worldId) return;
  const worldIdx = cycle.indexOf(worldId);
  if(worldIdx === -1) return;
  const headIdx = d.cycle_head_world_id ? cycle.indexOf(d.cycle_head_world_id) : -1;
  const expectedNext = headIdx === -1 ? 0 : (headIdx + 1) % cycle.length;
  if(worldIdx === expectedNext) d.cycle_head_world_id = worldId;
}

// Displays an image from either base64 data or file path

function renderMd(text) {
  if(!text) return '';
  // code blocks first
  let html = text.replace(/```([\s\S]*?)```/g, (_,c)=>`<pre><code>${c.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</code></pre>`);
  // inline code
  html = html.replace(/`([^`]+)`/g, (_,c)=>`<code>${c.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</code>`);
  // headings
  html = html.replace(/^#### (.+)$/gm,'<h4>$1</h4>');
  html = html.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm,'<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm,'<h1>$1</h1>');
  // hr
  html = html.replace(/^---+$/gm,'<hr/>');
  // bold+italic, bold, italic
  html = html.replace(/\*\*\*([^*]+)\*\*\*/g,'<strong><em>$1</em></strong>');
  html = html.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  html = html.replace(/\*([^*\n]+)\*/g,'<em>$1</em>');
  // blockquote
  html = html.replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>');
  // ul
  html = html.replace(/^[\-\*] (.+)$/gm,'<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
  // ol
  html = html.replace(/^\d+\. (.+)$/gm,'<li>$1</li>');
  // paragraphs: wrap non-tag lines
  html = html.split('\n').map(line=>{
    const trimmed=line.trim();
    if(!trimmed) return '<br/>';
    if(/^<(h[1-4]|ul|ol|li|pre|hr|blockquote)/.test(trimmed)) return trimmed;
    return `<p>${trimmed}</p>`;
  }).join('');
  return html;
}

// Non-visual tags stripped before building an image prompt: POV/format metadata and
// audience/relationship framing that describe the roleplay, not the character's look.
// Saucepan gives three copy formats for every image — markdown, an <img> tag, and a CSS
// background rule — and the UUID is almost always the only part wanted. Pull it out of any
// of them, or out of all three pasted together.
const UUID_RE = /[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/gi;
function extractUuids(text) {
  const found = String(text || '').match(UUID_RE) || [];
  const seen = {}, out = [];
  for (let i = 0; i < found.length; i++) {
    const v = found[i].toLowerCase();
    if (!seen[v]) { seen[v] = 1; out.push(v); }
  }
  return out;
}

// Models routinely wrap the whole prompt in quotes despite being told not to.
function stripWrappingQuotes(t) {
  let r = (t||'').trim();
  while(r.length>1 && ((r[0]==='"'&&r[r.length-1]==='"') || (r[0]==="'"&&r[r.length-1]==="'"))) {
    r = r.slice(1,-1).trim();
  }
  return r;
}

function hexToHsl(hex) {
  let r=parseInt(hex.slice(1,3),16)/255, g=parseInt(hex.slice(3,5),16)/255, b=parseInt(hex.slice(5,7),16)/255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b); let h,s,l=(max+min)/2;
  if(max===min){h=s=0;}else{const d=max-min;s=l>0.5?d/(2-max-min):d/(max+min);switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4;break;}h/=6;}
  return [Math.round(h*360),Math.round(s*100),Math.round(l*100)];
}

function hslToHex(h,s,l) {
  s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return '#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('');
}

function genPalette(baseHex, mode) {
  const [h,s,l]=hexToHsl(baseHex);
  if(mode==='complementary') return [baseHex, hslToHex((h+180)%360,s,l)];
  if(mode==='analogous') return [hslToHex((h-30+360)%360,s,l), baseHex, hslToHex((h+30)%360,s,l)];
  if(mode==='triadic') return [baseHex, hslToHex((h+120)%360,s,l), hslToHex((h+240)%360,s,l)];
  if(mode==='split') return [baseHex, hslToHex((h+150)%360,s,l), hslToHex((h+210)%360,s,l)];
  if(mode==='tetradic') return [baseHex, hslToHex((h+90)%360,s,l), hslToHex((h+180)%360,s,l), hslToHex((h+270)%360,s,l)];
  // shades
  return [hslToHex(h,s,Math.max(10,l-30)), hslToHex(h,s,Math.max(10,l-15)), baseHex, hslToHex(h,s,Math.min(90,l+15)), hslToHex(h,s,Math.min(90,l+30))];
}

// Theme generation: derive a full dark+light theme pair from a single accent color.
// The app's entire color system already runs through ~11 CSS custom properties (--bg,
// --bg2, --bg3, --bg4, --accent, --accent2, --accent-dim, --text, --text2, --text3,
// --border, --border2) consistently — unlike font-size (435 hardcoded px values, no
// relative units), this means swapping these variables at the root genuinely re-themes
// the whole app with no per-component rewrite needed.
function generateTheme(accentHex) {
  const [h, s] = hexToHsl(accentHex);
  // Keep the accent's hue and saturation, but control lightness ourselves for contrast —
  // a very light or very dark user-picked accent would otherwise produce unreadable text.
  const accentSat = Math.max(45, Math.min(s, 85));

  const dark = {
    bg: hslToHex(h, Math.min(accentSat, 18), 7),
    bg2: hslToHex(h, Math.min(accentSat, 16), 11),
    bg3: hslToHex(h, Math.min(accentSat, 16), 15),
    bg4: hslToHex(h, Math.min(accentSat, 14), 20),
    accent: hslToHex(h, accentSat, 68),
    accent2: hslToHex(h, accentSat, 53),
    accentDim: hslToHex(h, Math.min(accentSat, 45), 27),
    text: hslToHex(h, 12, 92),
    text2: hslToHex(h, 10, 65),
    text3: hslToHex(h, 8, 43),
    border: "hsla(" + h + "," + accentSat + "%,68%,0.12)",
    border2: "hsla(" + h + "," + accentSat + "%,68%,0.22)",
  };

  const light = {
    bg: hslToHex(h, Math.min(accentSat, 20), 97),
    bg2: hslToHex(h, Math.min(accentSat, 18), 94),
    bg3: hslToHex(h, Math.min(accentSat, 16), 90),
    bg4: hslToHex(h, Math.min(accentSat, 14), 85),
    accent: hslToHex(h, accentSat, 42),
    accent2: hslToHex(h, accentSat, 33),
    accentDim: hslToHex(h, Math.min(accentSat, 35), 88),
    text: hslToHex(h, 15, 12),
    text2: hslToHex(h, 12, 32),
    text3: hslToHex(h, 8, 52),
    border: "hsla(" + h + "," + accentSat + "%,30%,0.14)",
    border2: "hsla(" + h + "," + accentSat + "%,30%,0.24)",
  };

  return { dark, light };
}

function applyTheme(themeVars) {
  const root = document.documentElement.style;
  root.setProperty('--bg', themeVars.bg);
  root.setProperty('--bg2', themeVars.bg2);
  root.setProperty('--bg3', themeVars.bg3);
  root.setProperty('--bg4', themeVars.bg4);
  root.setProperty('--accent', themeVars.accent);
  root.setProperty('--accent2', themeVars.accent2);
  root.setProperty('--accent-dim', themeVars.accentDim);
  root.setProperty('--text', themeVars.text);
  root.setProperty('--text2', themeVars.text2);
  root.setProperty('--text3', themeVars.text3);
  root.setProperty('--border', themeVars.border);
  root.setProperty('--border2', themeVars.border2);
}

// Returns true if the currently-selected AI provider has an API key set.
function hasActiveKey(settings) {
  settings = settings || {};
  const provider = settings.ai_provider || 'anthropic';
  if (provider === 'anthropic') return !!settings.anthropic_api_key;
  if (provider === 'openai') return !!settings.openai_api_key;
  if (provider === 'google') return !!settings.google_api_key;
  if (provider === 'openrouter') return !!settings.openrouter_api_key;
  if (provider === 'lmstudio') return true; // local server, no key needed

}

// Shared multi-provider AI call helper — used by ClaudePanel chat and ImagePromptTool.
// Returns {text} on success or {error} on failure. Never throws.
async function callAI(data, systemPrompt, messages, maxTokens) {
  const settings = data.settings || {};
  const provider = settings.ai_provider || 'anthropic';

  try {
    if (provider === 'anthropic') {
      const apiKey = settings.anthropic_api_key || '';
      const model = settings.claude_model || 'claude-sonnet-4-6';
      if (!apiKey) return { error: 'No Anthropic API key set — add one in Settings.' };
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type':'application/json', 'anthropic-version':'2023-06-01', 'x-api-key': apiKey },
        body: JSON.stringify({ model, max_tokens: maxTokens, system: systemPrompt, messages })
      });
      const resp = await res.json();
      if (resp.error) return { error: resp.error.message || 'Anthropic API error' };
      const text = resp.content?.[0]?.text || '';
      return text ? { text } : { error: 'No response from Anthropic.' };
    }

    if (provider === 'openai') {
      const apiKey = settings.openai_api_key || '';
      const model = settings.openai_model || 'gpt-4o';
      if (!apiKey) return { error: 'No OpenAI API key set — add one in Settings.' };
      const res = await fetch('https://api.openai.com/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type':'application/json', 'Authorization': 'Bearer ' + apiKey },
        body: JSON.stringify({ model, max_tokens: maxTokens, messages: [{role:'system',content:systemPrompt}, ...messages] })
      });
      const resp = await res.json();
      if (resp.error) return { error: resp.error.message || 'OpenAI API error' };
      const text = resp.choices?.[0]?.message?.content || '';
      return text ? { text } : { error: 'No response from OpenAI.' };
    }

    if (provider === 'google') {
      const apiKey = settings.google_api_key || '';
      const model = settings.google_model || 'gemini-2.0-flash';
      if (!apiKey) return { error: 'No Google API key set — add one in Settings.' };
      const contents = messages.map(m => ({ role: m.role==='assistant'?'model':'user', parts:[{text:m.content}] }));
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type':'application/json' },
        body: JSON.stringify({ systemInstruction: { parts:[{text:systemPrompt}] }, contents, generationConfig:{maxOutputTokens:maxTokens} })
      });
      const resp = await res.json();
      if (resp.error) return { error: resp.error.message || 'Google API error' };
      const text = resp.candidates?.[0]?.content?.parts?.[0]?.text || '';
      return text ? { text } : { error: 'No response from Google.' };
    }

    if (provider === 'lmstudio') {
      const baseUrl = (settings.lmstudio_base_url || 'http://localhost:1234/v1').replace(/\/+$/, '');
      const model = settings.lmstudio_model || 'local-model';
      const res = await fetch(baseUrl + '/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type':'application/json' },
        body: JSON.stringify({ model, max_tokens: maxTokens, messages: [{role:'system',content:systemPrompt}, ...messages] })
      });
      const resp = await res.json();
      if (resp.error) return { error: (resp.error.message || resp.error) + '' };
      const text = resp.choices?.[0]?.message?.content || '';
      return text ? { text } : { error: 'No response from LM Studio.' };
    }

    if (provider === 'openrouter') {
      const apiKey = settings.openrouter_api_key || '';
      const model = settings.openrouter_model || 'anthropic/claude-sonnet-4-6';
      if (!apiKey) return { error: 'No OpenRouter API key set — add one in Settings.' };
      const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type':'application/json', 'Authorization': 'Bearer ' + apiKey },
        body: JSON.stringify({ model, max_tokens: maxTokens, messages: [{role:'system',content:systemPrompt}, ...messages] })
      });
      const resp = await res.json();
      if (resp.error) return { error: resp.error.message || 'OpenRouter API error' };
      const text = resp.choices?.[0]?.message?.content || '';
      return text ? { text } : { error: 'No response from OpenRouter.' };
    }

    return { error: 'Unknown AI provider.' };
  } catch (e) {
    if (provider === 'lmstudio') {
      const u = (data.settings || {}).lmstudio_base_url || 'http://localhost:1234/v1';
      return { error: 'Could not reach LM Studio at ' + u + ' — is the local server started and a model loaded?' };
    }
    return { error: 'Network error: ' + e.message };
  }
}

// ── Backup merge helpers ─────────────────────────────────────────────────────
const MERGE_TYPES = ['worlds','characters','lorebooks','collections','personas','templates','lorebook_templates','gallery'];

const MERGE_TYPE_LABELS = {worlds:'World',characters:'Character',lorebooks:'Lorebook',collections:'Collection',personas:'Persona',templates:'Template',lorebook_templates:'Lorebook Template',gallery:'Gallery image'};

function planMerge(local, backup) {
  const toAdd=[], toUpdate=[], conflicts=[];
  for(const type of MERGE_TYPES) {
    const bItems = backup[type]||[], lItems = local[type]||[];
    for(const bItem of bItems) {
      const lItem = lItems.find(x=>x.id===bItem.id);
      if(!lItem) {
        toAdd.push({type,item:bItem});
      } else {
        const bms=parseTimestamp(bItem.updated_at)||0, lms=parseTimestamp(lItem.updated_at)||0;
        if(bms>lms) toUpdate.push({type,item:bItem,localItem:lItem});
        else if(bms===lms||!bms||!lms) conflicts.push({type,item:bItem,localItem:lItem});
        // else local is newer — skip
      }
    }
  }
  return {toAdd,toUpdate,conflicts};
}

function applyMerge(local, backup, plan, resolutions) {
  const merged = structuredClone(local);
  // Content: add new items
  for(const {type,item} of plan.toAdd) {
    if(!merged[type]) merged[type]=[];
    merged[type].push(item);
  }
  // Content: update where backup is newer
  for(const {type,item} of plan.toUpdate) {
    const idx = merged[type].findIndex(x=>x.id===item.id);
    if(idx>=0) merged[type][idx]=item;
  }
  // Content: conflicts — user chose per-item (default: keep local)
  for(const {type,item} of plan.conflicts) {
    if((resolutions[item.id]||'local')==='backup') {
      const idx = merged[type].findIndex(x=>x.id===item.id);
      if(idx>=0) merged[type][idx]=item;
    }
  }
  // schedule_notes: merge by date key; local takes priority on same date
  if(backup.schedule_notes||local.schedule_notes) {
    merged.schedule_notes = Object.assign({},backup.schedule_notes||{},local.schedule_notes||{});
  }
  // map_positions: merge by worldId/charId; local takes priority
  const bPos=backup.map_positions||{}, lPos=local.map_positions||{};
  const mPos=structuredClone(bPos);
  for(const wid of Object.keys(lPos)) {
    mPos[wid]=Object.assign({},mPos[wid]||{},lPos[wid]);
  }
  merged.map_positions=mPos;
  // release_cycle: keep local order, append new world IDs from backup at end
  const lCyc=local.release_cycle||[], bCyc=backup.release_cycle||[];
  merged.release_cycle=[...lCyc,...bCyc.filter(id=>!lCyc.includes(id))];
  // notes: Option 2 — empty->take backup; both->append; backup empty->keep local
  const ln=(local.notes||'').trim(), bn=(backup.notes||'').trim();
  if(!ln&&bn) merged.notes=bn;
  else if(ln&&bn&&ln!==bn) {
    const today=new Date().toISOString().split('T')[0];
    merged.notes=ln+'\n\n--- Merged from backup '+today+' ---\n\n'+bn;
  }
  // settings: never touch — stays as local
  return merged;
}

const { useState, useEffect, useCallback, useRef, useMemo } = React;


function App() {

  const saveTimer = useRef();

  const [lastgoodWarning, setLastgoodWarning] = useState(false);
  const [lightboxSrc, setLightboxSrc] = useState(null);

  // Load data from disk on startup
  useEffect(() => {
    window.lorekeeper.loadData().then(res => {
      if (res && res.data) {
        // Auto-migrate: repair portrait relPath links (normalizes spaces vs underscores in names)
        const d = res.data;
        const _norm = n => (n||'').toLowerCase().replace(/[()]/g,'').replace(/[\s_]+/g,'_').replace(/^_|_$/g,'');
        (d.characters||[]).forEach(char => {
          if(!char.portraits||char.portraits.length===0) return;
          const allRel = char.portraits.map(p=>p.relPath).filter(Boolean);
          if(!allRel.length) return;
          const fm = {};
          allRel.forEach(rp => { const k=_norm(rp.replace(/\\/g,'/').split('/').pop().replace(/\.[^.]+$/,'')); if(!fm[k])fm[k]=rp; });
          char.portraits.forEach(p => { const k=_norm(p.name); if(fm[k]&&p.relPath!==fm[k])p.relPath=fm[k]; });
          char.portraits = char.portraits.filter(p => (p.image&&p.image.id)||!!fm[_norm(p.name)]);
          // Repair the main image ONLY when it points at something that no longer exists.
          // This used to overwrite image.relPath whenever it differed from profile_pic (or,
          // failing that, the first portrait), which silently reverted the chosen portrait on
          // every startup for any character with no portrait literally named 'profile_pic'.
          // Which portrait is the main image is a user choice, not something to re-derive.
          // The main image is NOT required to be one of the portraits — Set Portrait imports a
          // standalone file, so an image.relPath outside the gallery is a normal state, not
          // damage. The only safe automatic repair is following a rename: if the path matches a
          // portrait's file under name normalisation, update it. Otherwise leave it alone.
          // Falling back to profile_pic or the first portrait is what silently replaced the
          // chosen picture on every startup.
          // A portrait literally named profile_pic mirrors the site's profile-pic UUID.
          // One direction only: the profile pic field is the source, the portrait follows.
          const ppSync = char.portraits.find(p=>p.name==='profile_pic');
          if(ppSync && char.image && char.image.id) {
            if(!ppSync.image) ppSync.image = {};
            if(ppSync.image.id !== char.image.id) ppSync.image.id = char.image.id;
          }
          if(char.image && char.image.relPath) {
            const live = char.portraits.map(p=>p.relPath).filter(Boolean);
            if(live.indexOf(char.image.relPath) === -1) {
              const key = _norm(char.image.relPath.replace(/\\/g,'/').split('/').pop().replace(/\.[^.]+$/,''));
              const remapped = fm[key];
              if(remapped && live.indexOf(remapped) !== -1) char.image = {...char.image, relPath: remapped};
            }
          }
        });
        setData(d);
        if(res.usedLastgood) setLastgoodWarning(true);
      }
      setDataLoaded(true);
    }).catch(() => {
      console.error('Failed to load data — autosave will remain blocked to avoid overwriting the real file.');
    });

  }, []);

  React.useEffect(()=>{

      let headIdx=-1;

  // keep selectedChar/World in sync after updates

  }, [data.characters]);

  }, [data.worlds]);

  const update = (fn) => setData(d => { const nd = structuredClone(d); fn(nd); return nd; });

  const searchResults = useMemo(() => {
    if (!searchQ.trim()) return [];
    const q = searchQ.toLowerCase();
    const res = [];
    data.worlds.forEach(w => { if(w.name.toLowerCase().includes(q)) res.push({type:'world',id:w.id,name:w.name,sub:w.short_description||'',obj:w}); });

function TagInput({value, onChange, max}) {
  const [raw, setRaw] = useState((value||[]).join(', '));
  // keep raw in sync when value changes externally (e.g. on import)
  const lastExternal = React.useRef((value||[]).join(', '));
  React.useEffect(()=>{
    const ext=(value||[]).join(', ');
    if(ext!==lastExternal.current){ lastExternal.current=ext; setRaw(ext); }
  },[value]);
  const commit=(str)=>{
    const tags=str.split(',').map(t=>t.trim()).filter(Boolean);
    const limited=max?tags.slice(0,max):tags;
    lastExternal.current=limited.join(', ');
    onChange(limited);
  };
  return <input value={raw}
    onChange={e=>setRaw(e.target.value)}
    onBlur={e=>commit(e.target.value)}
    onKeyDown={e=>{if(e.key==='Enter'){commit(raw);}}}
    placeholder="tag1, tag2, tag3…"
    style={{width:'100%',background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',padding:'6px 10px',borderRadius:'var(--r)',fontSize:13,outline:'none'}}
  />;
}

          <GenResult label="Distance" value={result.distance}/>
          <GenResult label="About" value={result.desc}/>

}


function CropTool() {
  const cvRef = React.useRef();
  const [img, setImg] = React.useState(null);
  const [imgSrc, setImgSrc] = React.useState(null); // raw base64 — used by applyCrop to draw clean (no overlay)
  const [imgName, setImgName] = React.useState('');
  const [ratio, setRatio] = React.useState('3:4');
  const [box, setBox] = React.useState(null);   // crop box in canvas px
  const [drag, setDrag] = React.useState(null); // {type,sx,sy,sb}
  const [result, setResult] = React.useState(null);
  const [status, setStatus] = React.useState('');

  const RATIOS = {'1:1':1, '3:4':3/4, '16:9':16/9, '4:1':4, 'free':null};
  const HANDLE = 10; // handle hit radius px

  // Load image via file picker
  const loadFile = async () => {
    const res = await window.lorekeeper.importImage();
    if(!res||!res.base64) return;
    const image = new Image();
    image.onload = () => { setImg(image); setImgSrc(res.base64); setImgName(res.name||'image'); setResult(null); setStatus(''); };
    image.src = res.base64;
  };

  // Canvas internal size (capped at 900px wide for memory)
  const getCW = im => im ? Math.min(im.naturalWidth, 900) : 0;
  const getCH = im => im ? Math.round(im.naturalHeight * (getCW(im)/im.naturalWidth)) : 0;

  // Initialise / reset crop box when image or ratio changes
  React.useEffect(() => {
    if(!img) return;
    const cw = getCW(img), ch = getCH(img);
    const r = RATIOS[ratio];
    let bw = cw * 0.8, bh = ch * 0.8;
    if(r) { if(bw/bh > r) bw = bh*r; else bh = bw/r; }
    bw = Math.min(bw,cw); bh = Math.min(bh,ch);
    setBox({x:(cw-bw)/2, y:(ch-bh)/2, w:bw, h:bh});
    setResult(null);
  }, [img, ratio]);

  // Draw canvas whenever box changes
  React.useEffect(() => {
    if(!img||!box||!cvRef.current) return;
    const cv = cvRef.current;
    const cw = getCW(img), ch = getCH(img);
    cv.width = cw; cv.height = ch;
    const ctx = cv.getContext('2d');
    ctx.drawImage(img, 0, 0, cw, ch);
    // Dark overlay outside crop
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0,0,cw,box.y);
    ctx.fillRect(0,box.y,box.x,box.h);
    ctx.fillRect(box.x+box.w,box.y,cw-box.x-box.w,box.h);
    ctx.fillRect(0,box.y+box.h,cw,ch-box.y-box.h);
    // Crop border
    ctx.strokeStyle = '#a78bfa'; ctx.lineWidth = 2;
    ctx.strokeRect(box.x,box.y,box.w,box.h);
    // Rule-of-thirds grid
    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1;
    [1/3,2/3].forEach(t => {
      ctx.beginPath(); ctx.moveTo(box.x+box.w*t,box.y); ctx.lineTo(box.x+box.w*t,box.y+box.h); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(box.x,box.y+box.h*t); ctx.lineTo(box.x+box.w,box.y+box.h*t); ctx.stroke();
    });
    // Corner handles
    ctx.fillStyle = '#a78bfa';
    const handles=[[box.x,box.y],[box.x+box.w,box.y],[box.x,box.y+box.h],[box.x+box.w,box.y+box.h]];
    for(let i=0;i<handles.length;i++){ctx.fillRect(handles[i][0]-5,handles[i][1]-5,10,10);}
  }, [img, box]);

  // Map CSS mouse coords → canvas internal px
  const cvPt = e => {
    const rect = cvRef.current.getBoundingClientRect();
    return { x:(e.clientX-rect.left)*(cvRef.current.width/rect.width), y:(e.clientY-rect.top)*(cvRef.current.height/rect.height) };
  };

  const hitHandle = (x,y) => {
    if(!box) return null;
    const corners = [{cx:box.x,cy:box.y,t:'tl'},{cx:box.x+box.w,cy:box.y,t:'tr'},{cx:box.x,cy:box.y+box.h,t:'bl'},{cx:box.x+box.w,cy:box.y+box.h,t:'br'}];
    for(let i=0;i<corners.length;i++){if(Math.abs(x-corners[i].cx)<HANDLE&&Math.abs(y-corners[i].cy)<HANDLE)return corners[i].t;}
    if(x>box.x&&x<box.x+box.w&&y>box.y&&y<box.y+box.h) return 'move';
    return null;
  };

  const onMD = e => {
    const {x,y} = cvPt(e);
    const type = hitHandle(x,y);
    if(type) setDrag({type,sx:x,sy:y,sb:{...box}});
  };

  const onMM = e => {
    if(!drag||!img) return;
    const {x,y} = cvPt(e);
    const dx=x-drag.sx, dy=y-drag.sy;
    const sb=drag.sb, r=RATIOS[ratio];
    const cw=getCW(img), ch=getCH(img);
    let {x:bx,y:by,w:bw,h:bh} = sb;
    if(drag.type==='move') {
      bx = Math.max(0,Math.min(cw-bw, bx+dx));
      by = Math.max(0,Math.min(ch-bh, by+dy));
    } else {
      if(drag.type==='tl') { bw=Math.max(20,sb.w-dx); bh=r?bw/r:Math.max(20,sb.h-dy); bx=sb.x+sb.w-bw; by=sb.y+sb.h-bh; }
      else if(drag.type==='tr') { bw=Math.max(20,sb.w+dx); bh=r?bw/r:Math.max(20,sb.h-dy); by=sb.y+sb.h-bh; }
      else if(drag.type==='bl') { bw=Math.max(20,sb.w-dx); bh=r?bw/r:Math.max(20,sb.h+dy); bx=sb.x+sb.w-bw; }
      else if(drag.type==='br') { bw=Math.max(20,sb.w+dx); bh=r?bw/r:Math.max(20,sb.h+dy); }
      bx=Math.max(0,bx); by=Math.max(0,by);
      bw=Math.min(cw-bx,bw); bh=Math.min(ch-by,bh);
    }
    setBox({x:bx,y:by,w:bw,h:bh});
  };

  const onMU = () => setDrag(null);

  // Apply crop — loads a CLEAN copy of the image (no overlay) and crops at full resolution
  const applyCrop = () => {
    if(!imgSrc||!box||!img) return;
    const scale = img.naturalWidth / Math.min(img.naturalWidth, 900);
    const sx=Math.round(box.x*scale), sy=Math.round(box.y*scale);
    const sw=Math.round(box.w*scale), sh=Math.round(box.h*scale);
    if(sw<=0||sh<=0) return;
    const clean = new Image();
    clean.onload = () => {
      const out = document.createElement('canvas');
      out.width=sw; out.height=sh;
      out.getContext('2d').drawImage(clean, sx,sy,sw,sh, 0,0,sw,sh);
      setResult(out.toDataURL('image/png'));
      setStatus('');
    };
    clean.src = imgSrc;
  };

  const save = async () => {
    if(!result) return;
    const base = imgName.replace(/\.[^.]+$/,'')||'image';
    const res = await window.lorekeeper.saveImage({base64:result, defaultName:base+'-cropped.png'});
    if(res&&res.success) setStatus('✓ Saved');
    else if(res&&!res.cancelled) setStatus('Save failed');
  };

  const S2 = {box:{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--r)',padding:12}, label:{fontSize:10,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:6,display:'block'}};
  const pxW = img&&box ? Math.round(box.w*(img.naturalWidth/getCW(img))) : 0;
  const pxH = img&&box ? Math.round(box.h*(img.naturalHeight/getCH(img))) : 0;
  // Pre-define styles to avoid Babel issues with style={{}} inside && conditionals
  const cvWrap = {borderRadius:'var(--r)',overflow:'hidden',lineHeight:0,userSelect:'none'};
  const footerRow = {display:'flex',alignItems:'center',justifyContent:'space-between',gap:8};
  const dimText = {fontSize:10,color:'var(--text3)'};
  const resultImg = {width:'100%',maxHeight:180,objectFit:'contain',borderRadius:4,background:'var(--bg)',display:'block'};
  const saveBtn = {justifyContent:'center',width:'100%',marginTop:8};
  const statusStyle = {fontSize:11,marginTop:4,color:status.startsWith('\u2713')?'var(--green)':'var(--red)'};
  const ratioGrid = {display:'flex',gap:5,flexWrap:'wrap'};
  const ratioBtn = {flex:1,justifyContent:'center',fontSize:11};
  const cvStyle = {width:'100%',display:'block',cursor:drag?'grabbing':'crosshair'};
  const loadBtnStyle = {justifyContent:'center'};

  return (
    <div style={{display:'flex',flexDirection:'column',gap:10}}>
      <button className="btn" style={loadBtnStyle} onClick={loadFile}>
        <i className="ti ti-photo-up"></i>Load image…
      </button>
      {img&&(
        <div style={S2.box}>
          <span style={S2.label}>Aspect ratio</span>
          <div style={ratioGrid}>
            {Object.keys(RATIOS).map(r=>(
              <button key={r} className={"btn"+(ratio===r?' primary':'')} style={ratioBtn} onClick={()=>setRatio(r)}>
                {r==='free'?'□ Free':r}
              </button>
            ))}
          </div>
        </div>
      )}
      {img&&box&&(
        <div style={cvWrap}>
          <canvas ref={cvRef}
            style={cvStyle}
            onMouseDown={onMD} onMouseMove={onMM} onMouseUp={onMU} onMouseLeave={onMU}/>
        </div>
      )}
      {img&&box&&(
        <div style={footerRow}>
          <span style={dimText}>{pxW} × {pxH} px</span>
          <button className="btn" onClick={applyCrop}><i className="ti ti-crop"></i>Crop</button>
        </div>
      )}
      {result&&(
        <div style={S2.box}>
          <span style={S2.label}>Cropped result</span>
          <img src={result} style={resultImg} alt="cropped"/>
          <button className="btn" style={saveBtn} onClick={save}>
            <i className="ti ti-download"></i>Save…
          </button>
          {status&&<div style={statusStyle}>{status}</div>}
        </div>
      )}
    </div>
  );
}

function PasteAndSaveTool() {
  const [src,setSrc]=React.useState(null);
  const [dims,setDims]=React.useState(null);
  const [filename,setFilename]=React.useState('');
  const [drop,setDrop]=React.useState(false);
  const [status,setStatus]=React.useState('');

  const S2={box:{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--r)',padding:12},label:{fontSize:10,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:6,display:'block'}};

  const setImage=(base64,w,h,name)=>{
    setSrc(base64);
    setDims(w&&h?{w,h}:null);
    const ts=new Date().toISOString().slice(0,19).replace('T','-').replace(/:/g,'');
    setFilename(name||('paste-'+ts));
    setStatus('');
  };

  const paste=async()=>{
    const res=await window.lorekeeper.pasteImage();
    if(!res||!res.base64){setStatus('Nothing on clipboard — copy an image first');return;}
    setImage(res.base64,res.width,res.height,'');
  };

  const handleDrop=e=>{
    e.preventDefault(); setDrop(false);
    const file=[...e.dataTransfer.files].find(f=>f.type.startsWith('image/'));
    if(!file){setStatus('Drop an image file');return;}
    const reader=new FileReader();
    reader.onload=ev=>setImage(ev.target.result,null,null,file.name.replace(/\.[^.]+$/,''));
    reader.readAsDataURL(file);
  };

  const save=async()=>{
    if(!src||!filename.trim()){setStatus('Enter a filename first');return;}
    const res=await window.lorekeeper.saveImage({base64:src,defaultName:filename.trim()+'.png'});
    if(res&&res.success) setStatus('\u2713 Saved to '+res.path);
    else if(res&&!res.cancelled) setStatus('Save failed');
  };

  const zoneStyle={
    border:'2px dashed '+(drop?'var(--accent)':'var(--border2)'),
    borderRadius:'var(--r)',padding:'24px 12px',textAlign:'center',
    color:'var(--text3)',fontSize:12,cursor:'pointer',
    background:drop?'var(--accent-dim)':'transparent',
    transition:'border-color 0.15s,background 0.15s'
  };

  return (
    <div style={{display:'flex',flexDirection:'column',gap:10}}>
      <button className="btn" style={{justifyContent:'center'}} onClick={paste}>
        <i className="ti ti-clipboard-copy"></i>Paste from clipboard
      </button>
      <div style={zoneStyle}
        onDragOver={e=>{e.preventDefault();setDrop(true);}}
        onDragLeave={()=>setDrop(false)}
        onDrop={handleDrop}
        onClick={paste}>
        <i className="ti ti-photo-down" style={{fontSize:22,marginBottom:6,display:'block'}}></i>
        Drag & drop an image here
      </div>
      {src&&(
        <div style={S2.box}>
          <span style={S2.label}>Preview{dims?' \u2014 '+dims.w+'\u00d7'+dims.h:''}</span>
          <img src={src} style={{width:'100%',maxHeight:180,objectFit:'contain',borderRadius:4,background:'var(--bg)',display:'block'}}/>
        </div>
      )}
      {src&&(
        <div>
          <span style={S2.label}>Filename (saved as .png)</span>
          <div style={{display:'flex',gap:6}}>
            <input value={filename} onChange={e=>setFilename(e.target.value)}
              style={{flex:1,background:'var(--bg2)',border:'1px solid var(--border)',color:'var(--text)',padding:'6px 10px',borderRadius:'var(--r)',fontSize:12,outline:'none'}}
              placeholder="filename"/>
            <button className="btn" onClick={save} disabled={!filename.trim()}>
              <i className="ti ti-download"></i>Save\u2026
            </button>
          </div>
          {status&&<div style={{fontSize:11,marginTop:6,color:status.startsWith('\u2713')?'var(--green)':status.includes('Nothing')||status.includes('failed')?'var(--red)':'var(--text3)'}}>{status}</div>}
        </div>
      )}
      {!src&&status&&<div style={{fontSize:11,color:'var(--red)',marginTop:4}}>{status}</div>}
    </div>
  );
}

function FormatConvertTool() {
  const [src,setSrc]=React.useState(null);
  const [srcName,setSrcName]=React.useState('');
  const [fmt,setFmt]=React.useState('jpeg');
  const [quality,setQuality]=React.useState(85);
  const [result,setResult]=React.useState(null);
  const [resultSize,setResultSize]=React.useState('');
  const [busy,setBusy]=React.useState(false);
  const [status,setStatus]=React.useState('');

  const S2={box:{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--r)',padding:12},label:{fontSize:10,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:6,display:'block'}};

  const load=async()=>{
    const res=await window.lorekeeper.importImage();
    if(!res||!res.base64) return;
    setSrc(res.base64);
    setSrcName(res.name||'image');
    setResult(null); setStatus('');
  };

  const convert=()=>{
    if(!src) return;
    setBusy(true); setStatus('Converting…');
    const img=new Image();
    img.onload=()=>{
      const cv=document.createElement('canvas');
      cv.width=img.naturalWidth; cv.height=img.naturalHeight;
      const ctx=cv.getContext('2d');
      if(fmt==='jpeg'){ctx.fillStyle='#ffffff';ctx.fillRect(0,0,cv.width,cv.height);}
      ctx.drawImage(img,0,0);
      const mime=fmt==='png'?'image/png':fmt==='webp'?'image/webp':'image/jpeg';
      const q=(fmt==='jpeg'||fmt==='webp')?quality/100:undefined;
      cv.toBlob(blob=>{
        const kb=(blob.size/1024).toFixed(1);
        setResultSize(kb+' KB');
        const reader=new FileReader();
        reader.onload=()=>{setResult(reader.result);setBusy(false);setStatus('');};
        reader.readAsDataURL(blob);
      },mime,q);
    };
    img.onerror=()=>{setBusy(false);setStatus('Failed to load image.');};
    img.src=src;
  };

  const save=async()=>{
    if(!result) return;
    const ext=fmt==='jpeg'?'jpg':fmt;
    const base=srcName.replace(/\.[^.]+$/,'')||'image';
    const res=await window.lorekeeper.saveImage({base64:result,defaultName:base+'-converted.'+ext});
    if(res&&res.success) setStatus('✓ Saved');
    else if(res&&!res.cancelled) setStatus('Save failed');
  };

  const imgStyle={width:'100%',maxHeight:150,objectFit:'contain',borderRadius:4,background:'var(--bg)',display:'block'};

  return (
    <div style={{display:'flex',flexDirection:'column',gap:10}}>
      <button className="btn" style={{justifyContent:'center'}} onClick={load}>
        <i className="ti ti-photo-up"></i>Load image…
      </button>
      {src&&(
        <div style={S2.box}>
          <span style={S2.label}>Source</span>
          <img src={src} style={imgStyle} alt="source"/>
          <div style={{fontSize:10,color:'var(--text3)',marginTop:4}}>{srcName}</div>
        </div>
      )}
      {src&&(
        <div style={S2.box}>
          <span style={S2.label}>Output format</span>
          <div style={{display:'flex',gap:6,marginBottom:fmt==='jpeg'||fmt==='webp'?10:0}}>
            {[['jpeg','JPEG'],['png','PNG'],['webp','WebP']].map(([v,l])=>(
              <button key={v} className={`btn${fmt===v?' primary':''}`} style={{flex:1,justifyContent:'center',fontSize:11}} onClick={()=>setFmt(v)}>{l}</button>
            ))}
          </div>
          {(fmt==='jpeg'||fmt==='webp')&&(
            <div>
              <span style={{...S2.label,marginBottom:4}}>Quality: {quality}%</span>
              <input type="range" min={1} max={100} value={quality} onChange={e=>setQuality(+e.target.value)} style={{width:'100%',accentColor:'var(--accent)'}}/>
            </div>
          )}
        </div>
      )}
      {src&&(
        <button className="btn" style={{justifyContent:'center'}} onClick={convert} disabled={busy}>
          <i className="ti ti-transform"></i>{busy?'Converting…':'Convert'}
        </button>
      )}
      {status&&!result&&<div style={{fontSize:11,color:'var(--text3)'}}>{status}</div>}
      {result&&(
        <div style={S2.box}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:6}}>
            <span style={S2.label}>Result ({fmt.toUpperCase()})</span>
            <span style={{fontSize:10,color:'var(--text3)'}}>{resultSize}</span>
          </div>
          <img src={result} style={imgStyle} alt="result"/>
          <button className="btn" style={{justifyContent:'center',width:'100%',marginTop:8}} onClick={save}>
            <i className="ti ti-download"></i>Save…
          </button>
          {status&&<div style={{fontSize:11,color:status.startsWith('✓')?'var(--green)':'var(--red)',marginTop:4}}>{status}</div>}
        </div>
      )}
    </div>
  );
}


function ImagePromptTool({currentChar, data}) {
  const ART_STYLES = ['digital art','anime / manga','photorealistic','oil painting','watercolor','3D render','concept art','pencil sketch','comic book','pixel art'];
  const MOODS = ['dramatic','soft & warm','dark & moody','bright & vibrant','mysterious','ethereal','cinematic','cozy & intimate'];

  const [artStyle,setArtStyle] = React.useState('digital art');
  const [mood,setMood] = React.useState('dramatic');
  const [notes,setNotes] = React.useState('');
  const [result,setResult] = React.useState('');
  const [loading,setLoading] = React.useState(false);
  const [status,setStatus] = React.useState('');
  const [copied,setCopied] = React.useState(false);

  const generate = async () => {
    setLoading(true); setStatus(''); setResult('');
    const desc = currentChar ? (currentChar.short_description||'') : '';
    // Content warnings describe what the story contains, not what the picture looks like —
    // sending 'violence' or 'dead_dove' to an image model just skews the composition.
    // POV/format tags are metadata about the chat, equally irrelevant to an image.
    const tags = currentChar ? (currentChar.tags||[]).filter(t=>!CW_TAGS.has(t)&&!IMG_SKIP_TAGS.has(t)).slice(0,20).join(', ') : '';
    const card = currentChar ? (currentChar.card||'').slice(0,500) : '';
    const nl = '\n';
    // The name is deliberately never sent. An image model cannot render "Jamal Ferret",
    // so it is dead tokens at best, and a surname like Ferret actively biases the picture.
    const parts = [
      'You are an expert at writing image generation prompts for AI art tools.',
      ''
    ];
    if(currentChar) {
      parts.push('Subject:');
      if(desc) parts.push('Description: ' + desc);
      if(tags) parts.push('Tags: ' + tags);
      if(card) parts.push('Appearance/card notes: ' + card);
    }
    if(notes) parts.push('Extra context: ' + notes);
    parts.push('');
    if(currentChar) {
      parts.push('Write a single detailed image generation prompt for the subject above.');
    } else {
      // Without a character, an unconstrained model invents one and presents it as fact —
      // Exaone produced a full description of a character that did not exist. Make the
      // absence explicit so any invention is at least clearly generic.
      parts.push('No specific character has been provided. Write a single detailed generic character image generation prompt based only on the style, mood and extra context below.');
    }
    parts.push('Art style: ' + artStyle);
    parts.push('Mood/lighting: ' + mood);
    parts.push('');
    parts.push('Rules: Return ONLY the prompt text, no preamble, no surrounding quotation marks. Never state or invent a name for the subject — refer to them only by visual description, since image models cannot render names. Be specific about appearance, clothing, pose, setting, lighting, and composition. End with quality tags (high detail, sharp focus). Under 200 words.');
    const prompt = parts.join(nl);
    const result = await callAI(data, 'You are an expert at writing image generation prompts for AI art tools.', [{role:'user', content:prompt}], 400);
    if(result.error) { setStatus(result.error); } else { setResult(stripWrappingQuotes(result.text)); }
    setLoading(false);
  };

  const copy = () => {
    if(!result) return;
    navigator.clipboard.writeText(result).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);});
  };

  const S2 = {box:{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--r)',padding:12},label:{fontSize:10,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:6,display:'block'}};
  const inp = {width:'100%',background:'var(--bg2)',border:'1px solid var(--border)',color:'var(--text)',padding:'5px 8px',borderRadius:'var(--r)',fontSize:12,outline:'none',boxSizing:'border-box'};
  const labelMt = {fontSize:10,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:6,display:'block',marginTop:10};
  const notesArea = {width:'100%',background:'var(--bg2)',border:'1px solid var(--border)',color:'var(--text)',padding:'5px 8px',borderRadius:'var(--r)',fontSize:12,outline:'none',boxSizing:'border-box',minHeight:56,resize:'vertical'};
  const genBtn = {justifyContent:'center',width:'100%'};
  const charName2 = {fontSize:12,fontWeight:600,color:'var(--text)'};
  const charSub = {fontSize:11,color:'var(--text3)',marginTop:2};

  const copyBtn = {justifyContent:'center',width:'100%',marginTop:8};

function UuidExtractTool() {
  const S2 = {box:{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--r)',padding:12},label:{fontSize:10,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:6,display:'block'}};
  const [raw, setRaw] = useState('');
  const [copied, setCopied] = useState(null);
  const found = extractUuids(raw);
  const copy = (v) => { navigator.clipboard.writeText(v); setCopied(v); setTimeout(()=>setCopied(null), 1200); };
  const paste = async () => {
    try { const t = await navigator.clipboard.readText(); setRaw(t); } catch(e) {}
  };
  return (
    <div style={{display:'flex',flexDirection:'column',gap:10}}>
      <div style={S2.box}>
        <span style={S2.label}>Paste from Saucepan</span>
        <textarea value={raw} onChange={e=>setRaw(e.target.value)} placeholder="Paste the markdown, img tag, or CSS rule…"
          style={{width:'100%',minHeight:80,background:'var(--bg2)',border:'1px solid var(--border)',color:'var(--text)',padding:'7px 9px',borderRadius:'var(--r)',fontSize:11,outline:'none',fontFamily:'monospace',boxSizing:'border-box',resize:'vertical'}}/>
        <div style={{display:'flex',gap:6,marginTop:8}}>
          <button className="btn" style={{fontSize:11,padding:'3px 9px'}} onClick={paste}><i className="ti ti-clipboard"></i>Paste</button>
          {raw&&<button className="btn" style={{fontSize:11,padding:'3px 9px'}} onClick={()=>{setRaw('');setCopied(null);}}>Clear</button>}
        </div>
      </div>
      {raw.trim()&&found.length===0&&<div style={{fontSize:11,color:'var(--amber)'}}>No UUID found in that text.</div>}
      {found.length>0&&<div style={S2.box}>
        <span style={S2.label}>{found.length===1?'UUID':found.length+' UUIDs'}</span>
        {found.map(u=>(
          <div key={u} style={{display:'flex',gap:6,alignItems:'center',marginBottom:6}}>
            <code style={{flex:1,fontSize:11,fontFamily:'monospace',color:'var(--text)',background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--r)',padding:'5px 8px',overflowX:'auto',whiteSpace:'nowrap'}}>{u}</code>
            <button className="btn" style={{fontSize:11,padding:'3px 9px',flexShrink:0}} onClick={()=>copy(u)}>
              <i className={copied===u?'ti ti-check':'ti ti-copy'}></i>{copied===u?'Copied':'Copy'}
            </button>
          </div>
        ))}
        {found.length>1&&<button className="btn" style={{fontSize:11,padding:'3px 9px',marginTop:2}} onClick={()=>copy(found.join('\n'))}>
          <i className="ti ti-copy"></i>Copy all
        </button>}
      </div>}
    </div>
  );
}

function ToolsPanel({data, currentChar}) {

  const [eyeResult, setEyeResult] = useState(null);
  const [hairResult, setHairResult] = useState(null);
  const [buildResult, setBuildResult] = useState(null);

  const cmToFtIn=(val)=>{const n=parseFloat(val);if(isNaN(n))return;const ti=n/2.54;setFtIn({ft:Math.floor(ti/12).toString(),in:(ti%12).toFixed(1)});};
  const ftInToCm=(ft,inch)=>{const f=parseFloat(ft)||0,i=parseFloat(inch)||0;setCm(((f*12+i)*2.54).toFixed(1));};

  const genName=()=>{
    const pool = nameGender==='masc'?NAMES_MASC : nameGender==='fem'?NAMES_FEM : nameGender==='neutral'?NAMES_NEUTRAL : [...NAMES_MASC,...NAMES_FEM,...NAMES_NEUTRAL];
    setNameResult(`${pick(pool)} ${pick(SURNAMES)}`);

  const genEyes=()=>{
    const base=pick(EYE_BASE), detail=pick(EYE_DETAILS);

    const color=pick(HAIR_COLOR), detail=pick(HAIR_DETAIL), length=pick(HAIR_LENGTH), texture=pick(HAIR_TEXTURE), style=pick(HAIR_STYLE);

function TagSelector({value, onChange, max, showCW, worldChars}) {
  const [search, setSearch] = useState('');
  const [open, setOpen] = useState(false);
  const inputRef = React.useRef(null);

  const current = value || [];
  const nonCW = current.filter(t => !CW_TAGS.has(t));
  const cwSelected = current.filter(t => CW_TAGS.has(t));

  // World tag suggestions — most used tags in this world not already selected
  const worldSuggestions = React.useMemo(() => {
    if(!worldChars||worldChars.length===0) return [];
    const freq = {};
    worldChars.forEach(c => (c.tags||[]).forEach(t => { freq[t]=(freq[t]||0)+1; }));
    return Object.entries(freq)
      .filter(([t]) => !current.includes(t))
      .sort((a,b) => b[1]-a[1])
      .slice(0,10)
      .map(([t,count]) => ({t,count}));
  }, [worldChars, current]);

  const toggleTag = (tag) => {
    const isCW = CW_TAGS.has(tag);
    if(current.includes(tag)) {
      onChange(current.filter(t => t !== tag));
    } else {
      if(!isCW && nonCW.length >= (max||25)) return; // cap only applies to non-CW
      onChange([...current, tag]);
    }
  };

  const addCustom = (tag) => {
    const t = tag.trim().toLowerCase().replace(/\s+/g,'_');
    if(!t || current.includes(t)) return;
    const isCW = CW_TAGS.has(t);
    if(!isCW && nonCW.length >= (max||25)) return;
    onChange([...current, t]);
    setSearch('');
  };

  const filtered = search.length > 0
    ? Object.entries(SAUCEPAN_TAGS).filter(([id]) =>
        id.includes(search.toLowerCase()) && !current.includes(id))
    : [];

  const groupedFiltered = TAG_CATEGORIES.reduce((acc, cat) => {
    const items = filtered.filter(([id, meta]) => meta.c === cat);
    if(items.length) acc[cat] = items;
    return acc;
  }, {});

  return (
    <div>
      {/* Current tags */}
      <div style={{display:'flex',flexWrap:'wrap',gap:4,marginBottom:8}}>
        {cwSelected.map(t => (
          <span key={t} style={{display:'inline-flex',alignItems:'center',gap:4,fontSize:11,padding:'2px 7px',borderRadius:4,background:'rgba(239,68,68,0.12)',border:'1px solid rgba(239,68,68,0.3)',color:'#fca5a5'}}>
            ⚠ {t}<button onClick={()=>toggleTag(t)} style={{background:'none',border:'none',color:'#fca5a5',cursor:'pointer',padding:'0 0 0 2px',fontSize:12,lineHeight:1}}>×</button>
          </span>
        ))}
        {nonCW.map(t => (
          <span key={t} style={{display:'inline-flex',alignItems:'center',gap:4,fontSize:11,padding:'2px 7px',borderRadius:4,background:'var(--accent-dim)',border:'1px solid var(--accent2)',color:'var(--accent)'}}>
            {t}<button onClick={()=>toggleTag(t)} style={{background:'none',border:'none',color:'var(--accent)',cursor:'pointer',padding:'0 0 0 2px',fontSize:12,lineHeight:1}}>×</button>
          </span>
        ))}
      </div>
      {/* Counter */}
      <div style={{fontSize:11,color:'var(--text3)',marginBottom:6}}>
        {nonCW.length}/{max||25} tags{cwSelected.length>0?` · ${cwSelected.length} content warning${cwSelected.length>1?'s':''} (not capped)`:''}
      </div>
      {/* Search/add input */}
      <div style={{position:'relative'}}>
        <input ref={inputRef} value={search} onChange={e=>{setSearch(e.target.value);setOpen(true);}}
          onFocus={()=>setOpen(true)}
          onKeyDown={e=>{if(e.key==='Enter'){addCustom(search);}if(e.key==='Escape'){setOpen(false);setSearch('');}}}
          placeholder="Search or type a custom tag…"
          style={{width:'100%',background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',padding:'6px 10px',borderRadius:'var(--r)',fontSize:13,outline:'none'}}/>
        {open && search.length > 0 && (
          <div style={{position:'absolute',top:'100%',left:0,right:0,zIndex:100,background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--r)',marginTop:4,maxHeight:260,overflowY:'auto',boxShadow:'0 4px 20px rgba(0,0,0,0.4)'}}>
            {Object.entries(groupedFiltered).map(([cat, items]) => (
              <div key={cat}>
                <div style={{fontSize:9,color:'var(--text3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.06em',padding:'6px 10px 3px',borderTop:'1px solid var(--border)'}}>{cat}</div>
                {items.map(([id, meta]) => (
                  <div key={id}
                    onClick={()=>{toggleTag(id);setSearch('');inputRef.current?.focus();}}
                    title={meta.d}
                    style={{padding:'5px 10px',cursor:'pointer',display:'flex',alignItems:'center',gap:8,fontSize:12}}
                    onMouseEnter={e=>e.currentTarget.style.background='var(--accent-dim)'}
                    onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                    {CW_TAGS.has(id)&&<span style={{fontSize:9,color:'#fca5a5',background:'rgba(239,68,68,0.15)',padding:'1px 4px',borderRadius:3,flexShrink:0}}>CW</span>}
                    <span style={{fontWeight:500,color:'var(--text)'}}> {id}</span>
                    <span style={{fontSize:11,color:'var(--text3)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1}}> — {meta.d.replace(/^Content warning: /i,'')}</span>
                  </div>
                ))}
              </div>
            ))}
            {search.trim() && !SAUCEPAN_TAGS[search.trim().toLowerCase().replace(/\s+/g,'_')] && (
              <div onClick={()=>addCustom(search)}
                style={{padding:'7px 10px',cursor:'pointer',fontSize:12,color:'var(--text3)',borderTop:'1px solid var(--border)'}}
                onMouseEnter={e=>e.currentTarget.style.background='var(--accent-dim)'}
                onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                Add custom tag: <strong style={{color:'var(--text)'}}>"{search.trim()}"</strong>
              </div>
            )}
            {Object.keys(groupedFiltered).length === 0 && !search.trim() && (
              <div style={{padding:'10px',fontSize:12,color:'var(--text3)'}}>Type to search tags…</div>
            )}
          </div>
        )}
      </div>
      {/* World tag suggestions */}
      {!open && worldSuggestions.length>0 && (
        <div style={{marginTop:6}}>
          <div style={{fontSize:9,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:4}}>Common in this world</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
            {worldSuggestions.map(({t,count})=>(
              <button key={t} onClick={()=>toggleTag(t)}
                style={{fontSize:10,padding:'2px 8px',borderRadius:4,background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text2)',cursor:'pointer',display:'flex',alignItems:'center',gap:4}}
                title={SAUCEPAN_TAGS[t]?.d||t}>
                {CW_TAGS.has(t)&&<span style={{color:'#fca5a5',fontSize:9}}>CW</span>}
                {t}
                <span style={{fontSize:9,color:'var(--text3)'}}>×{count}</span>
              </button>
            ))}
          </div>
        </div>
      )}
      {/* Click outside to close */}
      {open && <div style={{position:'fixed',inset:0,zIndex:99}} onClick={()=>{setOpen(false);}}/>}
    </div>
  );
}

      onMouseLeave={()=>setHover(false)}>
      <ResolvedImg src={src} alt={label} style={{width:'100%',height:'100%',objectFit:'cover'}}
        onDims={d=>setDims(d)}/>
      {/* Always visible label */}
      <div style={{position:'absolute',bottom:0,left:0,right:0,background:'rgba(0,0,0,0.65)',fontSize:9,padding:'3px 5px',color:'#fff',lineHeight:1.4}}>

      {/* Hover overlay with details */}
      {hover&&(
        <div style={{position:'absolute',inset:0,background:'rgba(15,14,19,0.88)',display:'flex',flexDirection:'column',justifyContent:'center',padding:8,gap:3}}>
          <div style={{fontSize:10,color:'var(--text)',fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{label}</div>

function ResolvedImg({src, alt, style, className, onDims}) {
  const [resolved, setResolved] = React.useState(null);
  React.useEffect(()=>{
    if(!src){setResolved(null);return;}
    if(src.startsWith('data:')){setResolved(src);return;}
    window.lorekeeper.readImagePath(src).then(b64=>{setResolved(b64||null);}).catch(()=>setResolved(null));
  },[src]);
  if(!resolved) return <div style={{...style,background:'var(--bg3)',display:'flex',alignItems:'center',justifyContent:'center'}}><i className="ti ti-photo" style={{color:'var(--text3)',fontSize:20}}></i></div>;
  return <img src={resolved} alt={alt||''} style={style} className={className}
    onLoad={e=>{if(onDims)onDims({w:e.target.naturalWidth,h:e.target.naturalHeight});}}/>;
}
