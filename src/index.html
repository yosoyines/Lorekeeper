function ImgFromPath({src, alt, style, className}) {
  const [resolved, setResolved] = React.useState(null);
  React.useEffect(()=>{
    if(!src) { setResolved(null); return; }
    if(src.startsWith('data:')) { setResolved(src); return; }
    // It's a relative path — load from disk
    window.lorekeeper.readImagePath(src).then(b64=>{
      if(!b64) console.warn('ImgFromPath: no data returned for', src);
      setResolved(b64||null);
    }).catch(e=>console.error('ImgFromPath error for', src, e));
  }, [src]);
  if(!resolved) return <div style={{...style, background:'var(--bg3)',display:'flex',alignItems:'center',justifyContent:'center'}}><i className="ti ti-photo" style={{color:'var(--text3)',fontSize:20}}></i></div>;
  return <img src={resolved} alt={alt||''} style={style} className={className}/>;
}

// Returns display src from image object {data, path, relPath}
function getImgSrc(imgObj) {
  if(!imgObj) return null;
  if(imgObj.data) return imgObj.data;
  if(imgObj.relPath) return imgObj.relPath;
  if(imgObj.path) return imgObj.path;
  return null;
}


function ClaudePanel({data, currentWorld, currentChar, currentPage}) {
  const [messages, setMessages] = React.useState([]);
  const [input, setInput] = React.useState('');
  const [loading, setLoading] = React.useState(false);
  const [error, setError] = React.useState('');
  const [copiedIdx, setCopiedIdx] = React.useState(null);
  const messagesEndRef = React.useRef(null);
  const inputRef = React.useRef(null);

  // Reset chat when world or character changes
  const contextKey = `${currentWorld?.id||'global'}_${currentChar?.id||'none'}`;
  const prevContextKey = React.useRef(contextKey);
  React.useEffect(() => {
    if(prevContextKey.current !== contextKey) {
      setMessages([]);
      setError('');
      prevContextKey.current = contextKey;
    }
  }, [contextKey]);

  React.useEffect(() => {
    messagesEndRef.current?.scrollIntoView({behavior:'smooth'});
  }, [messages]);

  const buildSystemPrompt = () => {
    const world = currentWorld ? data.worlds.find(w => w.id === currentWorld.id) : null;
    const parts = [];

    parts.push(`You are a creative writing assistant helping with character and world development for the Saucepan AI companion platform. Be concise and practical. When suggesting text for fields, write it ready to use — don't add meta-commentary like "here's a suggestion". Just write the content.`);

    if(world) {
      parts.push(`\n## CURRENT WORLD: ${world.name}`);
      if(world.short_description) parts.push(`World description: ${world.short_description}`);
      if((world.tags||[]).length) parts.push(`World tags: ${world.tags.join(', ')}`);
      if(world.notes) parts.push(`World notes:\n${world.notes}`);

      // All lorebooks in world with full chapter content
      const worldLores = data.lorebooks.filter(l => l.world_id === world.id);
      if(worldLores.length) {
        parts.push(`\n## LOREBOOKS IN ${world.name.toUpperCase()}`);
        worldLores.forEach(l => {
          parts.push(`\n### Lorebook: ${l.name}`);
          if(l.short_description) parts.push(l.short_description);
          (l.content||[]).forEach(ch => {
            parts.push(`\n#### ${ch.title}\n${ch.text}`);
          });
        });
      }

      // All collections in world
      const worldColls = data.collections.filter(c => c.world_id === world.id);
      if(worldColls.length) {
        parts.push(`\n## COLLECTIONS IN ${world.name.toUpperCase()}`);
        worldColls.forEach(c => {
          parts.push(`- ${c.name}${c.definition?' — '+c.definition:''}`);
        });
      }

      // All other characters in world
      const worldChars = data.characters.filter(c => c.world_id === world.id && c.id !== currentChar?.id);
      if(worldChars.length) {
        parts.push(`\n## OTHER CHARACTERS IN ${world.name.toUpperCase()}`);
        worldChars.forEach(c => {
          const line = [`${c.display_name||c.name}`];
          if(c.short_description) line.push(c.short_description);
          if((c.tags||[]).length) line.push(`[${c.tags.slice(0,5).join(', ')}]`);
          parts.push(line.join(' — '));
        });
      }
    }

    // Current character being edited
    if(currentChar) {
      const c = data.characters.find(x => x.id === currentChar.id) || currentChar;
      parts.push(`\n## CURRENT CHARACTER BEING EDITED: ${c.display_name||c.name}`);
      if(c.name) parts.push(`Name: ${c.name}`);
      if(c.display_name) parts.push(`Display name: ${c.display_name}`);
      if(c.short_description) parts.push(`Short description: ${c.short_description}`);
      if(c.full_description) parts.push(`Full description:\n${c.full_description}`);
      if(c.card) parts.push(`Character card:\n${c.card}`);
      if((c.tags||[]).length) parts.push(`Tags: ${c.tags.join(', ')}`);
      if((c.starting_scenarios||[]).length) {
        parts.push(`Scenarios:`);
        c.starting_scenarios.forEach(s => parts.push(`- ${s.title}: ${s.message?.slice(0,200)}…`));
      }
    } else if(!world) {
      parts.push(`\nNo specific world or character is currently open. You can still help with general character writing, worldbuilding, and creative writing questions.`);
    }

    return parts.join('\n');
  };

  const send = async () => {
    if(!input.trim() || loading) return;
    const userMsg = input.trim();
    setInput('');
    setError('');
    const newMessages = [...messages, {role:'user', content:userMsg}];
    setMessages(newMessages);
    setLoading(true);

    try {
      const systemPrompt = buildSystemPrompt();
      const apiKey = data.settings?.anthropic_api_key || '';
      const model = data.settings?.claude_model || 'claude-sonnet-4-6';
      const headers = {'Content-Type':'application/json'};
      if(apiKey) headers['x-api-key'] = apiKey;
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers,
        body: JSON.stringify({
          model,
          max_tokens: 2000,
          system: systemPrompt,
          messages: newMessages.map(m => ({role:m.role, content:m.content}))
        })
      });
      const data_resp = await response.json();
      if(data_resp.error) { setError(data_resp.error.message); setLoading(false); return; }
      const assistantMsg = data_resp.content?.[0]?.text || '';
      setMessages(prev => [...prev, {role:'assistant', content:assistantMsg}]);
    } catch(e) {
      setError('Network error: ' + e.message);
    }
    setLoading(false);
  };

  const copy = (text, idx) => {
    navigator.clipboard.writeText(text);
    setCopiedIdx(idx);
    setTimeout(() => setCopiedIdx(null), 1500);
  };

  const contextLabel = currentChar
    ? (currentChar.display_name||currentChar.name)
    : currentWorld
    ? currentWorld.name
    : 'No world open';

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100%',minHeight:0}}>
      {/* API key nudge */}
      {!data.settings?.anthropic_api_key&&<div style={{padding:'8px 12px',background:'rgba(251,191,36,0.08)',borderBottom:'1px solid rgba(251,191,36,0.2)',fontSize:11,color:'var(--amber)',display:'flex',alignItems:'center',gap:6,flexShrink:0}}>
        <i className="ti ti-key" style={{fontSize:12}}></i>
        No API key set — <span style={{textDecoration:'underline',cursor:'pointer'}} onClick={()=>{}}>add in Settings</span>
      </div>}
      {/* Context indicator */}
      <div style={{padding:'8px 12px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',gap:6,flexShrink:0}}>
        <i className="ti ti-sparkles" style={{color:'var(--accent)',fontSize:13}}></i>
        <span style={{fontSize:11,color:'var(--text3)',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
          {currentChar?'Character: ':'World: '}<strong style={{color:'var(--text)'}}>{contextLabel}</strong>
        </span>
        {messages.length>0&&<button onClick={()=>setMessages([])} style={{background:'none',border:'none',color:'var(--text3)',cursor:'pointer',fontSize:10,padding:0}} title="Clear chat">✕</button>}
      </div>

      {/* Messages */}
      <div style={{flex:1,overflowY:'auto',padding:'10px 12px',display:'flex',flexDirection:'column',gap:10,minHeight:0}}>
        {messages.length===0&&(
          <div style={{color:'var(--text3)',fontSize:12,lineHeight:1.7,padding:'8px 0'}}>
            <div style={{marginBottom:8,color:'var(--text2)',fontWeight:500}}>What I can help with:</div>
            {[
              currentChar&&'Draft or improve the character card',
              currentChar&&'Write or expand the full description',
              currentChar&&'Suggest a short description',
              currentChar&&'Generate starting scenarios',
              currentChar&&'Check consistency with world lore',
              'Suggest tags for a character',
              'Brainstorm character ideas for this world',
              'Draft lorebook chapter content',
            ].filter(Boolean).map((s,i)=>(
              <div key={i} style={{padding:'3px 0',cursor:'pointer',color:'var(--text3)'}}
                onClick={()=>{setInput(s);inputRef.current?.focus();}}
                onMouseEnter={e=>e.currentTarget.style.color='var(--accent)'}
                onMouseLeave={e=>e.currentTarget.style.color='var(--text3)'}>
                · {s}
              </div>
            ))}
          </div>
        )}
        {messages.map((m,i)=>(
          <div key={i} style={{display:'flex',flexDirection:'column',gap:4,alignItems:m.role==='user'?'flex-end':'flex-start'}}>
            {m.role==='user'
              ? <div style={{background:'var(--accent-dim)',border:'1px solid var(--accent2)',borderRadius:'var(--rl) var(--rl) 4px var(--rl)',padding:'8px 12px',fontSize:12,color:'var(--text)',maxWidth:'90%',lineHeight:1.6}}>{m.content}</div>
              : <div style={{width:'100%'}}>
                  <div style={{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'4px var(--rl) var(--rl) var(--rl)',padding:'10px 12px',fontSize:12,color:'var(--text)',lineHeight:1.7,whiteSpace:'pre-wrap',wordBreak:'break-word'}}>{m.content}</div>
                  <button onClick={()=>copy(m.content,i)} style={{background:'none',border:'none',cursor:'pointer',color:'var(--text3)',fontSize:10,padding:'3px 0',display:'flex',alignItems:'center',gap:3,marginTop:2}}>
                    <i className={`ti ti-${copiedIdx===i?'check':'copy'}`} style={{fontSize:10}}></i>
                    {copiedIdx===i?'Copied!':'Copy'}
                  </button>
                </div>
            }
          </div>
        ))}
        {loading&&<div style={{display:'flex',gap:4,padding:'8px 0',alignItems:'center'}}>
          <div style={{width:6,height:6,borderRadius:'50%',background:'var(--accent)',animation:'pulse 1s infinite'}}></div>
          <div style={{width:6,height:6,borderRadius:'50%',background:'var(--accent)',animation:'pulse 1s infinite 0.2s'}}></div>
          <div style={{width:6,height:6,borderRadius:'50%',background:'var(--accent)',animation:'pulse 1s infinite 0.4s'}}></div>
        </div>}
        {error&&<div style={{fontSize:11,color:'var(--red)',padding:'6px 10px',background:'rgba(239,68,68,0.1)',borderRadius:'var(--r)',border:'1px solid rgba(239,68,68,0.2)'}}>{error}</div>}
        <div ref={messagesEndRef}/>
      </div>

      {/* Input */}
      <div style={{padding:'10px 12px',borderTop:'1px solid var(--border)',flexShrink:0}}>
        <div style={{display:'flex',gap:6,alignItems:'flex-end'}}>
          <textarea ref={inputRef} value={input} onChange={e=>setInput(e.target.value)}
            onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}}
            placeholder="Ask anything… (Enter to send, Shift+Enter for new line)"
            rows={3}
            style={{flex:1,background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',padding:'8px 10px',borderRadius:'var(--r)',fontSize:12,outline:'none',resize:'none',fontFamily:'inherit',lineHeight:1.5}}/>
          <button className="btn primary" onClick={send} disabled={loading||!input.trim()} style={{padding:'8px 10px',alignSelf:'flex-end',flexShrink:0}}>
            <i className="ti ti-send" style={{fontSize:13}}></i>
          </button>
        </div>
        <div style={{fontSize:10,color:'var(--text3)',marginTop:4}}>Enter to send · Shift+Enter for new line · Context resets when you change character</div>
      </div>
    </div>
  );
}

// Add pulse animation to CSS
function RightPanel({tab,setTab,data,update,currentWorld,currentChar,currentPage}) {
  const saveNote=(val)=>{
    if(currentWorld){
      update(d=>{const w=d.worlds.find(x=>x.id===currentWorld.id);if(w)w.notes=val;});
    } else {
      update(d=>{d.notes=val;});
    }
  };
  const noteValue = currentWorld
    ? (data.worlds.find(x=>x.id===currentWorld.id)?.notes||'')
    : (data.notes||'');
  const notePlaceholder = currentWorld
    ? `Notes for ${currentWorld.name}…\n\nIdeas, plot threads, world details, reminders.`
    : `Global scratchpad…\n\nNotes here are not tied to any world.`;

  return (
    <div className="right-panel" style={{width:tab==="map"?"640px":"320px",minWidth:tab==="map"?"640px":"320px"}}>
      <div className="right-panel-tabs">
        <div className={`right-panel-tab ${tab==='notes'?'active':''}`} onClick={()=>setTab('notes')}>
          <i className="ti ti-notebook"></i>{currentWorld?`${currentWorld.emoji||''}Notes`:'Notes'}
        </div>
        <div className={`right-panel-tab ${tab==='tools'?'active':''}`} onClick={()=>setTab('tools')}>
          <i className="ti ti-tool"></i>Tools
        </div>
        <div className={`right-panel-tab ${tab==='claude'?'active':''}`} onClick={()=>setTab('claude')}>
          <i className="ti ti-sparkles"></i>Claude
        </div>
        <div className={`right-panel-tab ${tab==='map'?'active':''}`} onClick={()=>setTab('map')}>
          <i className="ti ti-circles-relation"></i>Map
        </div>
      </div>
      <div className="right-panel-content">
        {tab==='notes'&&(
          <>
            {currentWorld&&<div style={{padding:'8px 12px 0',fontSize:11,color:'var(--text3)',borderBottom:'1px solid var(--border)',paddingBottom:8,display:'flex',alignItems:'center',gap:6}}>
              {currentWorld.emoji&&<span>{currentWorld.emoji}</span>}<span>{currentWorld.name}</span>
              <span style={{marginLeft:'auto',opacity:0.6}}>world notes</span>
            </div>}
            <textarea
              className="notes-area"
              value={noteValue}
              onChange={e=>saveNote(e.target.value)}
              placeholder={notePlaceholder}
            />
          </>
        )}
        {tab==='tools'&&<ToolsPanel data={data}/>}
        {tab==='claude'&&<ClaudePanel data={data} currentWorld={currentWorld} currentChar={currentChar} currentPage={currentPage}/>}
        {tab==='map'&&<RelationshipsPage data={data} update={update} initialWorld={currentWorld?.id||null}/>}
      </div>
    </div>
  );
}

function DashboardPage({calCells,calYear,calMonth,today,selDay,setSelDay,charsOnDay,postedOnDay,calDate,setCalDate,upcoming,data,update,setSelectedChar,setSelectedLore,setSelectedWorld}) {
  const [schedPicker,setSchedPicker]=useState(null); // cellDateStr when open
  const [schedSearch,setSchedSearch]=useState('');
  const selChars=selDay?charsOnDay(selDay):[];
  const todayStr=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  const [dismissed,setDismissed]=useState([]);
  const [showCycle,setShowCycle]=useState(false);
  const todayReady=data.characters.filter(c=>c.status==='ready'&&(c.schedule_dates||[]).some(d=>d.split('T')[0]===todayStr)&&!dismissed.includes(c.id));
  const cycle=data.release_cycle||[];
  const getNextCycleWorld=()=>{
    if(cycle.length===0) return null;
    const futureDate=new Date(today.getFullYear(),today.getMonth(),today.getDate());
    const pds=s=>{const p=(s.split('T')[0]).split('-');return new Date(+p[0],+p[1]-1,+p[2]);};
    // Walk cycle in order:
    // - skip worlds where all future chars are 'ready' (scheduled, handled) or 'posted'
    // - stop at first world with a 'draft' future char (needs work)
    // - stop at first world with no future scheduled char (needs scheduling)
    for(let i=0;i<cycle.length;i++){
      const wid=cycle[i];
      const futureChars=data.characters.filter(c=>c.world_id===wid&&(c.schedule_dates||[]).some(d=>pds(d)>=futureDate));
      if(futureChars.length===0) return wid; // no future entry — needs scheduling
      const hasDraft=futureChars.some(c=>c.status==='draft');
      if(hasDraft) return wid; // has a draft — stop here, needs work
      // all ready or posted — this world is handled, continue
    }
    return cycle[0];
  };
  const nextWorldId=getNextCycleWorld();
  const nextWorld=nextWorldId?data.worlds.find(w=>w.id===nextWorldId):null;
  const noteKey=(charId,dateStr)=>`${charId}_${dateStr}`;
  const getNote=(charId,dateStr)=>(data.schedule_notes||{})[noteKey(charId,dateStr)]||'';
  return (
    <div onClick={()=>setSelDay(null)}>
      {todayReady.map(c=>(
        <div key={c.id} className="today-banner">
          <i className="ti ti-bell" style={{color:'var(--accent)',fontSize:18,flexShrink:0}}></i>
          <div style={{flex:1,fontSize:13}}>
            <strong>{c.display_name||c.name}</strong> is scheduled for today
            {getNote(c.id,todayStr)&&<span style={{color:'var(--text3)',marginLeft:6}}>· {getNote(c.id,todayStr)}</span>}
          </div>
          <button className="btn primary" style={{fontSize:11,padding:'3px 10px'}} onClick={()=>update(d=>{const ch=d.characters.find(x=>x.id===c.id);if(ch){ch.status='posted';if(!ch.posted_dates)ch.posted_dates=[];const t=new Date();const td=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');if(!ch.posted_dates.includes(td))ch.posted_dates.push(td);}})}>Mark posted</button>
          <button className="btn" style={{fontSize:11,padding:'3px 10px'}} onClick={()=>setSelectedChar(c)}>Reschedule</button>
          <button style={{background:'none',border:'none',color:'var(--text3)',cursor:'pointer',padding:'0 4px',fontSize:16}} onClick={()=>setDismissed(d=>[...d,c.id])}>×</button>
        </div>
      ))}
      <div className="dash-layout">
        <div>
          <div className="cal-header">
            <span className="cal-month">{MONTHS[calMonth]} {calYear}</span>
            <div className="cal-nav">
              <button onClick={()=>setCalDate(d=>new Date(d.getFullYear(),d.getMonth()-1,1))}><i className="ti ti-chevron-left"></i></button>
              <button onClick={()=>setCalDate(new Date())} style={{width:'auto',padding:'0 10px',fontSize:12}}>Today</button>
              <button onClick={()=>setCalDate(d=>new Date(d.getFullYear(),d.getMonth()+1,1))}><i className="ti ti-chevron-right"></i></button>
            </div>
          </div>
          <div className="cal-grid" onClick={e=>e.stopPropagation()}>
            {DAYS.map(d=><div key={d} className="cal-dow">{d}</div>)}
            {calCells.map((cell,i)=>{
              const chars=cell.cur?charsOnDay(cell.d):[];
              const isToday=cell.cur&&cell.d===today.getDate()&&calYear===today.getFullYear()&&calMonth===today.getMonth();
              const cellDateStr=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(cell.d).padStart(2,'0')}`;
              return <div key={i} className={`cal-day${!cell.cur?' other-month':''}${isToday?' today':''}${chars.length>0?' has-events':''}${selDay===cell.d&&cell.cur?' selected':''}`} onClick={()=>{
                  if(cell.cur){setSelDay(s=>s===cell.d?null:cell.d);}
                  else if(cell.prev){setCalDate(d=>new Date(d.getFullYear(),d.getMonth()-1,1));setSelDay(cell.d);}
                  else if(cell.next){setCalDate(d=>new Date(d.getFullYear(),d.getMonth()+1,1));setSelDay(cell.d);}
                }}>
                <div className="day-num">{cell.d}</div>
                {chars.slice(0,3).map(c=>{
                  const note=getNote(c.id,cellDateStr);
                  const isDraft=c.status==='draft';
                  return <div key={c.id} className="day-char" title={note||c.name}
                    style={{cursor:isDraft?'pointer':'default',opacity:isDraft?0.75:1}}
                    onClick={e=>{if(isDraft){e.stopPropagation();setSelectedChar(c);}}}
                  >{isDraft?'[d] ':''}{c.name}{note?' ·':''}</div>;
                })}
                {chars.length>3&&<div className="day-char">+{chars.length-3}</div>}
                {cell.cur&&postedOnDay(cell.d).slice(0,2).map(c=>(
                  <div key={'p'+c.id} className="day-char" title={c.name+' (posted)'}
                    style={{opacity:0.5,background:'rgba(110,231,183,0.15)',cursor:'pointer'}}
                    onClick={e=>{e.stopPropagation();setSelectedChar(c);}}
                  >{c.name}<span style={{marginLeft:3,fontSize:9,color:'#6ee7b7'}}>✓</span></div>
                ))}
              </div>;
            })}
          </div>
          {selDay&&(()=>{
            const cellDateStr=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(selDay).padStart(2,'0')}`;
            const pds=s=>{const p=(s.split('T')[0]).split('-');return new Date(+p[0],+p[1]-1,+p[2]);};
            const futureDate=new Date(today.getFullYear(),today.getMonth(),today.getDate());
            // Schedulable: draft or ready, not already scheduled for a future date
            const schedulable=data.characters.filter(c=>{
              if(c.status==='posted') return false;
              const hasFuture=(c.schedule_dates||[]).some(d=>pds(d)>futureDate);
              return !hasFuture;
            }).filter(c=>schedSearch===''||((c.display_name||c.name)+' '+(c.short_description||'')).toLowerCase().includes(schedSearch.toLowerCase()));
            return <div style={{marginTop:16,background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--rl)',padding:16}} onClick={e=>e.stopPropagation()}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
                <h3 style={{fontSize:14,fontWeight:600,margin:0}}>{MONTHS[calMonth]} {selDay}</h3>
                <button className="btn primary" style={{fontSize:11,padding:'3px 10px'}} onClick={()=>{setSchedPicker(p=>p===cellDateStr?null:cellDateStr);setSchedSearch('');}}>
                  <i className={`ti ${schedPicker===cellDateStr?'ti-x':'ti-plus'}`}></i>{schedPicker===cellDateStr?'Cancel':'Schedule'}
                </button>
              </div>
              {schedPicker===cellDateStr&&(
                <div style={{marginBottom:12,background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--r)',padding:10}}>
                  <input value={schedSearch} onChange={e=>setSchedSearch(e.target.value)} placeholder="Search characters…"
                    style={{width:'100%',background:'var(--bg2)',border:'1px solid var(--border)',color:'var(--text)',padding:'6px 10px',borderRadius:'var(--r)',fontSize:12,outline:'none',marginBottom:8}}/>
                  {schedulable.length===0
                    ?<p style={{fontSize:12,color:'var(--text3)',margin:0}}>No schedulable characters — all are posted or already have a future date.</p>
                    :<div style={{display:'flex',flexDirection:'column',gap:4,maxHeight:200,overflowY:'auto'}}>
                      {schedulable.map(c=>{
                        const world=data.worlds.find(w=>w.id===c.world_id);
                        return <div key={c.id} style={{display:'flex',alignItems:'center',gap:8,padding:'6px 8px',borderRadius:'var(--r)',cursor:'pointer',background:'var(--bg2)'}}
                          onClick={()=>{
                            update(d=>{const ch=d.characters.find(x=>x.id===c.id);if(ch){if(!ch.schedule_dates)ch.schedule_dates=[];ch.schedule_dates.push(cellDateStr);}});
                            setSchedPicker(null);setSchedSearch('');
                          }}
                          onMouseEnter={e=>e.currentTarget.style.background='var(--accent-dim)'}
                          onMouseLeave={e=>e.currentTarget.style.background='var(--bg2)'}>
                          <div style={{width:28,height:28,borderRadius:4,overflow:'hidden',flexShrink:0,background:'var(--bg3)',display:'flex',alignItems:'center',justifyContent:'center'}}>
                            {c.image?<ImgFromPath src={c.image.data||c.image.relPath} alt={c.name} style={{width:'100%',height:'100%',objectFit:'cover'}}/>:<i className="ti ti-user" style={{color:'var(--text3)',fontSize:13}}></i>}
                          </div>
                          <div style={{flex:1,minWidth:0}}>
                            <div style={{fontSize:12,fontWeight:500,color:'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.display_name||c.name}</div>
                            <div style={{fontSize:10,color:'var(--text3)'}}>{world?.name||'—'} · {c.status}</div>
                          </div>
                        </div>;
                      })}
                    </div>
                  }
                </div>
              )}
              {selChars.length===0&&schedPicker!==cellDateStr&&<p className="text-muted">Nothing scheduled.</p>}
              {selChars.map(c=>{
                const note=getNote(c.id,cellDateStr);
                return <div key={c.id} style={{marginBottom:10}}>
                  <div className="upcoming-item" style={{cursor:'pointer'}} onClick={()=>setSelectedChar(c,'schedule')}>
                    <div className="flex-1">
                      <div style={{fontSize:13,fontWeight:500,color:'var(--text)'}}>{c.display_name||c.name}</div>
                      {note&&<div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>{note}</div>}
                    </div>
                    <span className={`status-badge status-${c.status||'draft'}`}>{c.status||'draft'}</span>
                  </div>
                  <input value={note} onChange={e=>update(d=>{if(!d.schedule_notes)d.schedule_notes={};d.schedule_notes[noteKey(c.id,cellDateStr)]=e.target.value;})}
                    placeholder="Add note… (e.g. add to event link)"
                    style={{width:'100%',marginTop:4,background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',padding:'5px 8px',borderRadius:'var(--r)',fontSize:11,outline:'none'}}
                  />
                </div>;
              })}
            </div>;
          })()}
          {/* Drafts in progress */}
          {(()=>{
            const drafts=data.characters.filter(c=>c.status==='draft');
            if(drafts.length===0) return null;
            const getMissing=(c)=>{
              const m=[];
              if(!c.name?.trim()) m.push('name');
              if(!c.display_name?.trim()) m.push('display name');
              if(!c.short_description?.trim()) m.push('short desc');
              if(!c.full_description?.trim()) m.push('full desc');
              if(!(c.card||'').trim()||c.card===' ') m.push('card');
              if((c.tags||[]).length<5) m.push(`tags (${(c.tags||[]).length}/5)`);
              if(!c.image) m.push('portrait');
              else if(!c.image.id) m.push('portrait UUID');
              if(!(c.portraits||[]).length) m.push('portrait slots');
              if(!(c.starting_scenarios||[]).length) m.push('scenarios');
              return m;
            };
            return <div style={{marginTop:16}}>
              <div style={{fontSize:11,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:10}}>Drafts in progress</div>
              <div style={{display:'flex',flexDirection:'column',gap:8}}>
                {drafts.map(c=>{
                  const world=data.worlds.find(w=>w.id===c.world_id);
                  const missing=getMissing(c);
                  return <div key={c.id} style={{display:'flex',gap:12,padding:'10px 12px',background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--r)',cursor:'pointer',transition:'border-color 0.15s',overflow:'hidden'}}
                    onClick={()=>setSelectedChar(c)}
                    onMouseEnter={e=>e.currentTarget.style.borderColor='var(--accent2)'}
                    onMouseLeave={e=>e.currentTarget.style.borderColor='var(--border)'}
                  >
                    <div style={{width:48,height:48,borderRadius:'var(--r)',overflow:'hidden',flexShrink:0,background:'var(--bg3)',display:'flex',alignItems:'center',justifyContent:'center'}}>
                      {c.image?<ImgFromPath src={c.image.data||c.image.relPath} alt={c.name} style={{width:'100%',height:'100%',objectFit:'cover'}}/>:<i className="ti ti-user" style={{color:'var(--text3)',fontSize:20}}></i>}
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:13,fontWeight:600,color:'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.display_name||c.name}{c.short_description&&<span style={{fontWeight:400,color:'var(--text3)'}}> · {c.short_description}</span>}</div>
                      <div style={{fontSize:11,color:'var(--text3)',marginTop:2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{world?.name||'No world'}{c.schedule_dates?.length>0?` · ${c.schedule_dates[0]}`:' · unscheduled'}</div>
                      {missing.length>0&&<div style={{display:'flex',flexWrap:'wrap',gap:3,marginTop:5}}>
                        {missing.map(m=><span key={m} style={{fontSize:9,padding:'1px 5px',borderRadius:3,background:'rgba(251,191,36,0.12)',color:'var(--amber)',border:'1px solid rgba(251,191,36,0.25)'}}>{m}</span>)}
                      </div>}
                      {missing.length===0&&<div style={{marginTop:5}}><span style={{fontSize:9,padding:'1px 5px',borderRadius:3,background:'rgba(110,231,183,0.12)',color:'#6ee7b7',border:'1px solid rgba(110,231,183,0.25)'}}>✓ ready to post</span></div>}
                    </div>
                    <span style={{fontSize:10,color:'#9ca3af',background:'rgba(156,163,175,0.15)',border:'1px solid rgba(156,163,175,0.2)',padding:'2px 7px',borderRadius:4,alignSelf:'flex-start',flexShrink:0,marginTop:2}}>draft</span>
                  </div>;
                })}
              </div>
            </div>;
          })()}
          {/* Site Checklist */}
          {(()=>{
            const pending=[];
            // Characters: posted, has been synced before, updated since last sync
            data.characters.filter(c=>c.status==='posted'&&c.site_last_synced_at&&c.updated_at>c.site_last_synced_at).forEach(c=>{
              const world=data.worlds.find(w=>w.id===c.world_id);
              pending.push({key:'sc-'+c.id,type:'character',id:c.id,thumb:c.image,thumbIcon:'ti-user',name:c.display_name||c.name,sub:world?.name||'—',onClick:()=>setSelectedChar(c)});
            });
            // Lorebooks: has been public, synced before, updated since
            data.lorebooks.filter(l=>l.has_been_public&&l.site_last_synced_at&&l.updated_at>l.site_last_synced_at).forEach(l=>{
              const world=data.worlds.find(w=>w.id===l.world_id);
              pending.push({key:'sl-'+l.id,type:'lorebook',id:l.id,thumb:null,thumbIcon:'ti-book',thumbColor:'var(--amber)',name:l.name,sub:world?.name||'Standalone',onClick:()=>setSelectedLore(l)});
            });
            // Collections: has been public, synced before, updated since
            data.collections.filter(c=>c.has_been_public&&c.site_last_synced_at&&c.updated_at>c.site_last_synced_at).forEach(c=>{
              const world=data.worlds.find(w=>w.id===c.world_id);
              pending.push({key:'sc2-'+c.id,type:'collection',id:c.id,thumb:null,thumbIcon:'ti-folders',thumbColor:'var(--accent)',name:c.name,sub:world?.name||'Standalone',onClick:null});
            });
            if(pending.length===0) return null;
            return <div style={{marginTop:16}}>
              {(()=>{
                const [helpOpen,setHelpOpen]=useState(false);
                return <div style={{marginBottom:10}}>
                  <div style={{display:'flex',alignItems:'center',gap:6}}>
                    <div style={{fontSize:11,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.06em'}}>Site Checklist</div>
                    <span style={{fontSize:10,background:'rgba(239,68,68,0.15)',color:'#fca5a5',border:'1px solid rgba(239,68,68,0.3)',borderRadius:4,padding:'1px 6px'}}>{pending.length}</span>
                    <span style={{fontSize:10,color:'var(--text3)',flex:1}}>needs re-export</span>
                    <button onClick={()=>setHelpOpen(h=>!h)} style={{background:'none',border:'none',cursor:'pointer',color:'var(--text3)',fontSize:12,padding:'0 2px',lineHeight:1}} title="How does this work?">?</button>
                  </div>
                  {helpOpen&&<div style={{marginTop:8,padding:'8px 10px',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--r)',fontSize:11,color:'var(--text3)',lineHeight:1.7}}>
                    <strong style={{color:'var(--text)',display:'block',marginBottom:4}}>How to clear an item:</strong>
                    1. Click the item → go to character / lorebook<br/>
                    2. Click <strong style={{color:'var(--text)'}}>Export</strong> to download the JSON<br/>
                    3. Upload the JSON to the site<br/>
                    4. Item disappears from this list ✓<br/>
                    <span style={{color:'var(--text3)',fontSize:10,marginTop:4,display:'block'}}>Items appear here when you edit something after its last export.</span>
                  </div>}
                </div>;
              })()}
              <div style={{display:'flex',flexDirection:'column',gap:6}}>
                {pending.map(item=>(
                  <div key={item.key} style={{display:'flex',gap:10,padding:'8px 12px',background:'var(--bg2)',border:'1px solid rgba(239,68,68,0.15)',borderRadius:'var(--r)',cursor:item.onClick?'pointer':'default',alignItems:'center'}}
                    onClick={item.onClick||undefined}>
                    <div style={{width:36,height:36,borderRadius:'var(--r)',overflow:'hidden',flexShrink:0,background:'var(--bg3)',display:'flex',alignItems:'center',justifyContent:'center'}}>
                      {item.thumb?<ImgFromPath src={item.thumb.data||item.thumb.relPath} alt={item.name} style={{width:'100%',height:'100%',objectFit:'cover'}}/>:<i className={`ti ${item.thumbIcon}`} style={{color:item.thumbColor||'var(--text3)',fontSize:16}}></i>}
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:12,fontWeight:500,color:'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.name}</div>
                      <div style={{fontSize:11,color:'var(--text3)'}}>{item.sub} · edited since last export</div>
                    </div>
                    {item.onClick&&<span style={{fontSize:11,color:'#fca5a5',alignSelf:'center',flexShrink:0}}>go →</span>}
                  </div>
                ))}
              </div>
            </div>;
          })()}

          {/* Lorekeeper Checklist */}
          {(()=>{
            const Tag=({ok,label})=><span style={{fontSize:10,padding:'1px 5px',borderRadius:3,background:ok?'rgba(110,231,183,0.12)':'rgba(251,191,36,0.12)',color:ok?'#6ee7b7':'var(--amber)',border:ok?'1px solid rgba(110,231,183,0.25)':'1px solid rgba(251,191,36,0.3)'}}>{ok?'✓ ':''}{label}</span>;
            const items=[];
            // Characters: posted with no posted date
            data.characters.filter(c=>c.status==='posted'&&(c.posted_dates||[]).length===0).forEach(c=>{
              const world=data.worlds.find(w=>w.id===c.world_id);
              items.push({key:'c-date-'+c.id,thumb:c.image,thumbIcon:'ti-user',name:c.display_name||c.name,sub:world?.name||'—',issues:['missing posted date'],onClick:()=>setSelectedChar(c,'schedule')});
            });
            // Lorebooks: only flag if public or has been public
            data.lorebooks.forEach(l=>{
              const isPublished=l.access_level==='public'||l.has_been_public;
              if(!isPublished) return;
              const world=data.worlds.find(w=>w.id===l.world_id);
              const issues=[];
              if(!l.image_id) issues.push('no image ID (upload to site first)');
              if(!l.image_data) issues.push('no local image backup');
              if(!(l.tags||[]).length) issues.push('no tags');
              if(!l.definition_protection||l.definition_protection==='open') issues.push('definition protection: open');
              if(issues.length===0) return;
              items.push({key:'l-'+l.id,thumb:l.image_data?{data:l.image_data}:null,thumbIcon:'ti-book',thumbColor:'var(--amber)',name:l.name,sub:world?.name||'Standalone',issues,onClick:()=>setSelectedLore(l)});
            });
            // Collections: only flag if public or has been public
            data.collections.forEach(col=>{
              const isPublished=col.access_level==='public'||col.has_been_public;
              if(!isPublished) return;
              const world=data.worlds.find(w=>w.id===col.world_id);
              const issues=[];
              if(!col.image?.id) issues.push('no image ID (upload to site first)');
              if(!col.image_data) issues.push('no local image backup');
              if(!(col.tags||[]).length) issues.push('no tags');
              if(!col.definition) issues.push('no description');
              if(issues.length===0) return;
              items.push({key:'col-'+col.id,thumb:col.image_data?{data:col.image_data}:null,thumbIcon:'ti-folders',thumbColor:'var(--accent)',name:col.name,sub:world?.name||'Standalone',issues,onClick:world?()=>setSelectedWorld(world,'collections'):null});
            });
            if(items.length===0) return null;
            return <div style={{marginTop:16}}>
              <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:10}}>
                <div style={{fontSize:11,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.06em'}}>Lorekeeper Checklist</div>
                <span style={{fontSize:10,background:'rgba(251,191,36,0.15)',color:'var(--amber)',border:'1px solid rgba(251,191,36,0.3)',borderRadius:4,padding:'1px 6px'}}>{items.length}</span>
              </div>
              <div style={{display:'flex',flexDirection:'column',gap:6}}>
                {items.map(item=>(
                  <div key={item.key} style={{display:'flex',gap:10,padding:'8px 12px',background:'var(--bg2)',border:'1px solid rgba(251,191,36,0.15)',borderRadius:'var(--r)',cursor:item.onClick?'pointer':'default'}}
                    onClick={item.onClick||undefined}>
                    <div style={{width:36,height:36,borderRadius:'var(--r)',overflow:'hidden',flexShrink:0,background:'var(--bg3)',display:'flex',alignItems:'center',justifyContent:'center'}}>
                      {item.thumb?<ImgFromPath src={item.thumb.data||item.thumb.relPath} alt={item.name} style={{width:'100%',height:'100%',objectFit:'cover'}}/>:<i className={`ti ${item.thumbIcon}`} style={{color:item.thumbColor||'var(--text3)',fontSize:16}}></i>}
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:12,fontWeight:500,color:'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.name}</div>
                      <div style={{fontSize:11,color:'var(--text3)',marginBottom:4}}>{item.sub}</div>
                      <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
                        {item.issues.map(issue=><Tag key={issue} ok={false} label={issue}/>)}
                      </div>
                    </div>
                    {item.onClick&&<span style={{fontSize:11,color:'var(--amber)',alignSelf:'center',flexShrink:0}}>fix →</span>}
                  </div>
                ))}
              </div>
            </div>;
          })()}
        </div>
        <div>
          <div className="upcoming-panel">
            <h3>Upcoming</h3>
            {upcoming.length===0?<p className="text-muted" style={{fontSize:12}}>No scheduled characters yet.</p>:upcoming.map((x,i)=>{
              const w=data.worlds.find(w=>w.id===x.char.world_id);
              const dateStr=`${x.date.getFullYear()}-${String(x.date.getMonth()+1).padStart(2,'0')}-${String(x.date.getDate()).padStart(2,'0')}`;
              const note=getNote(x.char.id,dateStr);
              return <div key={i} className="upcoming-item" style={{cursor:'pointer'}} onClick={()=>setSelectedChar(x.char)}>
                <div className="upcoming-date">{x.date.getDate()}<br/><span style={{fontSize:9}}>{MONTHS[x.date.getMonth()].slice(0,3)}</span></div>
                <div className="upcoming-info flex-1">
                  <div className="name">{x.char.name}</div>
                  <div className="world" style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:160}}>{note?<span style={{color:'var(--accent)',fontSize:10}}>{note.length>40?note.slice(0,40)+'…':note}</span>:w?.name||'—'}</div>
                </div>
                <span className={`status-badge status-${x.char.status||'draft'}`}>{x.char.status||'draft'}</span>
              </div>;
            })}
          </div>
          <div className="cycle-panel">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
              <h3 style={{fontSize:11,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.06em',margin:0}}>Release Cycle</h3>
              <button className="btn" style={{fontSize:11,padding:'2px 8px'}} onClick={()=>setShowCycle(s=>!s)}><i className={`ti ${showCycle?'ti-chevron-up':'ti-settings'}`}></i>{showCycle?'Done':'Edit'}</button>
            </div>
            {nextWorld?(
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:showCycle?12:0}}>
                <span style={{fontSize:12,color:'var(--text3)'}}>Next up:</span>
                <span style={{fontSize:13,fontWeight:600,color:'var(--accent)'}}>{nextWorld.emoji?nextWorld.emoji+' ':''}{nextWorld.name}</span>
              </div>
            ):<p style={{fontSize:12,color:'var(--text3)',marginBottom:showCycle?12:0}}>{cycle.length===0?'No cycle set up yet.':'All worlds covered.'}</p>}
            {showCycle&&(
              <div>
                <div style={{fontSize:11,color:'var(--text3)',marginBottom:8}}>Drag to reorder · click × to remove · add worlds below</div>
                {cycle.map((wid,i)=>{
                  const w=data.worlds.find(x=>x.id===wid);
                  if(!w) return null;
                  return <div key={wid} draggable
                    onDragStart={e=>{e.dataTransfer.setData('text/plain',String(i));}}
                    onDragOver={e=>e.preventDefault()}
                    onDrop={e=>{e.preventDefault();const from=parseInt(e.dataTransfer.getData('text/plain'));const to=i;if(from===to)return;update(d=>{const arr=[...d.release_cycle];const[item]=arr.splice(from,1);arr.splice(to,0,item);d.release_cycle=arr;});}}
                    style={{display:'flex',alignItems:'center',gap:6,marginBottom:4,padding:'4px 8px',background:'var(--bg3)',borderRadius:'var(--r)',border:wid===nextWorldId?'1px solid var(--accent2)':'1px solid var(--border)',cursor:'grab'}}>
                    <i className="ti ti-grip-vertical" style={{color:'var(--text3)',fontSize:13,flexShrink:0}}></i>
                    <span style={{fontSize:12,color:'var(--text3)',minWidth:14,textAlign:'center'}}>{i+1}</span>
                    <span style={{flex:1,fontSize:12,color:wid===nextWorldId?'var(--accent)':'var(--text)'}}>{w.emoji?w.emoji+' ':''}{w.name}</span>
                    <button style={{background:'none',border:'none',color:'var(--text3)',cursor:'pointer',padding:'0 4px'}} onClick={()=>update(d=>{d.release_cycle=d.release_cycle.filter(x=>x!==wid);})}>×</button>
                  </div>;
                })}
                <select style={{width:'100%',marginTop:8,background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',padding:'5px 8px',borderRadius:'var(--r)',fontSize:12,outline:'none'}}
                  value="" onChange={e=>{const wid=e.target.value;if(wid&&!cycle.includes(wid))update(d=>{if(!d.release_cycle)d.release_cycle=[];d.release_cycle.push(wid);});}}>
                  <option value="">+ Add world to cycle…</option>
                  {data.worlds.filter(w=>!cycle.includes(w.id)).sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)).map(w=><option key={w.id} value={w.id}>{w.emoji?w.emoji+' ':''}{w.name}</option>)}
                </select>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function WorldsPage({data,setSelectedWorld,setModal}) {
  return data.worlds.length===0?(
    <div className="empty"><i className="ti ti-planet"></i><h3>No worlds yet</h3><p>Create your first world to start organizing everything.</p><br/><button className="btn primary" onClick={()=>setModal({type:'new-world'})} style={{margin:'0 auto'}}><i className="ti ti-plus"></i>New World</button></div>
  ):(
    <div className="worlds-grid">
      {[...data.worlds].sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)).map(w=>{
        const chars=data.characters.filter(c=>c.world_id===w.id).length;
        const lores=data.lorebooks.filter(l=>l.world_id===w.id).length;
        const banner=w.image||data.collections.find(c=>c.world_id===w.id&&c.image_data)?.image_data;
        return <div key={w.id} className="world-card" onClick={()=>setSelectedWorld(w)} onContextMenu={e=>{e.preventDefault();setCtxMenu({x:e.clientX,y:e.clientY,world:w});}}>
          <div className="world-banner">{banner?<img src={banner} alt={w.name} style={{width:'100%',height:'100%',objectFit:'cover'}}/>:<i className="ti ti-planet"></i>}
            {w.pinned&&<div style={{position:'absolute',top:6,right:6,background:'rgba(0,0,0,0.5)',borderRadius:4,padding:'2px 5px',fontSize:11,color:'var(--accent)',display:'flex',alignItems:'center',gap:3}}><i className="ti ti-pin-filled" style={{fontSize:11}}></i></div>}
          </div>
          <div className="world-card-body"><h3>{w.name}</h3><p>{w.short_description||'No description.'}</p></div>
          <div className="world-card-footer">
            <span className="world-stat"><span>{chars}</span>chars</span>
            <span className="world-stat"><span>{lores}</span>lorebooks</span>
            {(w.tags||[]).slice(0,2).map(t=><span key={t} className="tag">{t}</span>)}
          </div>
        </div>;
      })}
    </div>
  );
}

function WorldDetailPage({world,tab,setTab,worldChars,worldLores,worldColls,worldGallery,setSelectedChar,setSelectedLore,selectedLore,update,setModal,exportChar,exportLore,exportColl,setPage,setSelectedWorld,data}) {
  const tabs=[['characters','ti-users','Characters'],['lorebooks','ti-book','Lorebooks'],['collections','ti-folders','Collections'],['gallery','ti-photo','Gallery'],['info','ti-info-circle','World Info']];
  const handleBannerUpload=async()=>{
    const _r=await window.lorekeeper.importImage();
    if(!_r) return;
    const safeName=world.name.replace(/[^a-zA-Z0-9_-]/g,'_');
    const res=await window.lorekeeper.copyImageToFolder(_r.srcPath,'Worlds',safeName);
    if(res){ update(d=>{const w=d.worlds.find(x=>x.id===world.id);if(w){w.image=res.base64;w.image_relpath=res.relPath;}}); }
    else { update(d=>{const w=d.worlds.find(x=>x.id===world.id);if(w)w.image=_r.base64;}); }
  };
  const handleGalleryUpload=async()=>{const _r=await window.lorekeeper.importImage();if(_r)update(d=>{d.gallery.push({id:uuid(),world_id:world.id,name:'image',data:_r.base64});});};
  const [selectedColl,setSelectedColl]=useState(null);
  const [collTab,setCollTab]=useState('edit');
  const updColl=(fn)=>update(d=>{
    const c=d.collections.find(x=>x.id===selectedColl?.id);
    if(!c)return;
    fn(c);
    c.updated_at=new Date().toISOString();
    setSelectedColl(sc=>({...sc,...c}));setCollTab('edit');
    if(c.collection_filename){
      const{world_id,image_data,collection_filename,...rest}=c;
      window.lorekeeper.saveCollectionJson(c.collection_filename,{...rest,updated_at:c.updated_at});
    }
  });
  const worldBanner = world.image || world.image_relpath || worldColls.find(c=>c.image_data)?.image_data || null;
  const lorebook=(selectedLore&&worldLores.find(x=>x.id===selectedLore.id))||worldLores[0]||null;
  return (
    <div>
      {worldBanner&&!selectedColl&&<div style={{height:160,borderRadius:'var(--rl)',overflow:'hidden',marginBottom:16,position:'relative'}}><img src={worldBanner} alt={world.name} style={{width:'100%',height:'100%',objectFit:'cover'}}/><div style={{position:'absolute',inset:0,background:'linear-gradient(to top, rgba(15,14,19,0.85) 0%, transparent 60%)'}}></div><h2 style={{position:'absolute',bottom:14,left:16,fontSize:22,fontWeight:700,color:'#fff',letterSpacing:'0.01em'}}>{world.name}</h2></div>}
      <div className="breadcrumb" onClick={()=>setPage('worlds')}><i className="ti ti-arrow-left"></i><span>Worlds</span><i className="ti ti-chevron-right"></i><span>{world.name}</span></div>
      <div className="world-sub-nav">
        {tabs.map(([t,icon,label])=><div key={t} className={`sub-nav-item ${tab===t?'active':''}`} onClick={()=>{setTab(t);setSelectedColl(null);}}><i className={`ti ${icon}`}></i>{label}</div>)}
      </div>
      {tab==='characters'&&(worldChars.length===0?<div className="empty"><i className="ti ti-users"></i><h3>No characters yet</h3></div>:<div className="chars-grid">{worldChars.map(c=><CharCard key={c.id} char={c} onClick={()=>setSelectedChar(c)}/>)}</div>)}
      {tab==='lorebooks'&&(
        <div>
          {worldLores.length===0?<div className="empty"><i className="ti ti-book"></i><h3>No lorebooks yet</h3></div>:
          <div style={{display:'flex',flexDirection:'column',gap:16}}>
            <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
              {worldLores.map((l,i)=><div key={l.id}
                draggable
                onDragStart={e=>{e.dataTransfer.setData('lore-id',l.id);e.currentTarget.style.opacity='0.4';}}
                onDragEnd={e=>{e.currentTarget.style.opacity='1';}}
                onDragOver={e=>{e.preventDefault();e.currentTarget.style.borderColor='var(--accent)';}}
                onDragLeave={e=>{e.currentTarget.style.borderColor=selectedLore?.id===l.id?'var(--accent2)':'var(--border)';}}
                onDrop={e=>{
                  e.preventDefault();
                  e.currentTarget.style.borderColor=selectedLore?.id===l.id?'var(--accent2)':'var(--border)';
                  const fromId=e.dataTransfer.getData('lore-id');
                  if(fromId===l.id)return;
                  update(d=>{
                    const fromIdx=d.lorebooks.findIndex(x=>x.id===fromId);
                    const toIdx=d.lorebooks.findIndex(x=>x.id===l.id);

                    const [moved]=d.lorebooks.splice(fromIdx,1);
                    d.lorebooks.splice(toIdx,0,moved);

                style={{background:'var(--bg2)',border:selectedLore?.id===l.id?'1px solid var(--accent2)':'1px solid var(--border)',borderRadius:'var(--r)',padding:'7px 14px',cursor:'grab',fontSize:13,color:selectedLore?.id===l.id?'var(--accent)':'var(--text2)',display:'flex',flexDirection:'column',gap:4,minWidth:140,transition:'border-color 0.15s'}}
                onClick={()=>setSelectedLore(l)}>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <i className="ti ti-grip-vertical" style={{fontSize:12,color:'var(--text3)',flexShrink:0}}></i>
                  {(l.image_data||l.image_relpath)?<ImgFromPath src={l.image_data||l.image_relpath} alt={l.name} style={{width:24,height:24,borderRadius:4,objectFit:'cover',flexShrink:0}}/>:<i className="ti ti-book"></i>}{l.name}
                </div>
                {(l.tags||[]).length>0&&<div style={{display:'flex',flexWrap:'wrap',gap:3}}>{(l.tags||[]).slice(0,5).map(t=><span key={t} className="tag" style={{fontSize:9}}>{t}</span>)}</div>}
              </div>)}
            </div>
            {lorebook&&<LoreboookEditor lorebook={lorebook} update={update} exportLore={exportLore}/>}
          </div>}
        </div>
      )}
      {tab==='collections'&&(worldColls.length===0?<div className="empty"><i className="ti ti-folders"></i><h3>No collections yet</h3></div>:
        <div>
          {selectedColl ? (
            <div>
              <div className="breadcrumb" onClick={()=>{setSelectedColl(null);setCollTab("edit");}} style={{marginBottom:16}}>
                <i className="ti ti-arrow-left"></i><span>Collections</span><i className="ti ti-chevron-right"></i><span>{selectedColl.name}</span>
              </div>
              {(selectedColl.image_data||world.image)&&<div style={{height:140,borderRadius:'var(--rl)',overflow:'hidden',marginBottom:16,position:'relative'}}>
                <img src={selectedColl.image_data||world.image} alt={selectedColl.name} style={{width:'100%',height:'100%',objectFit:'cover'}}/>
                <div style={{position:'absolute',inset:0,background:'linear-gradient(to top, rgba(15,14,19,0.8) 0%, transparent 60%)'}}></div>
                <h2 style={{position:'absolute',bottom:12,left:16,fontSize:20,fontWeight:700,color:'#fff'}}>{selectedColl.name}</h2>
                <button className="btn" style={{position:'absolute',top:10,right:10,background:'rgba(0,0,0,0.5)',border:'1px solid rgba(255,255,255,0.2)',color:'#fff'}} onClick={async()=>{const r=await window.lorekeeper.importImage();if(!r)return;if(selectedColl.collection_filename){const res=await window.lorekeeper.copyImageToFolder(r.srcPath,'Collections',selectedColl.collection_filename.replace(/\.json$/i,''));if(res){update(d=>{const c=d.collections.find(x=>x.id===selectedColl.id);if(c){c.image_data=res.base64;c.image_relpath=res.relPath;}});setSelectedColl(sc=>({...sc,image_data:res.base64,image_relpath:res.relPath}));return;}}update(d=>{const c=d.collections.find(x=>x.id===selectedColl.id);if(c)c.image_data=r.base64;});setSelectedColl(sc=>({...sc,image_data:r.base64}));}}><i className="ti ti-camera"></i>Change image</button>
              </div>}

function LoreboookEditor({lorebook,update,exportLore}) {
  const [activeIdx,setActiveIdx]=useState(0);
  const [loreTab,setLoreTab]=useState('edit');
  const chapters=lorebook.content||[];
  const chapter=chapters[activeIdx]||null;
  const updLore=(fn)=>update(d=>{const l=d.lorebooks.find(x=>x.id===lorebook.id);if(l){fn(l);l.updated_at=new Date().toISOString();if(l.lorebook_filename){
        const{world_id,image_data,lorebook_filename,...lrest}=l;
        window.lorekeeper.saveLorebookJson(l.lorebook_filename,{...lrest,updated_at:l.updated_at});
      }}});
  const handleImage=async()=>{
    const r=await window.lorekeeper.importImage();
    if(!r) return;
    if(lorebook.lorebook_filename){
      const folder='Lorebooks';
      const baseName=lorebook.lorebook_filename.replace(/\.json$/i,'');
      const res=await window.lorekeeper.copyImageToFolder(r.srcPath,folder,baseName);
      if(res) { updLore(l=>{l.image_data=res.base64;l.image_relpath=res.relPath;}); return; }
    }
    updLore(l=>{l.image_data=r.base64;});
  };
  const buildLoreMd = () => {
    const lines = [];
    lines.push("# " + (lorebook.name||"Lorebook"));
    if(lorebook.short_description) { lines.push(""); lines.push(lorebook.short_description); }
    (lorebook.content||[]).forEach(ch => {
      lines.push(""); lines.push("## " + (ch.title||"Untitled"));
      if(ch.text) lines.push(ch.text);
    });
    return lines.join("\n");
  };
  const exportLoreMd = () => {
    const safeName = (lorebook.name||"lorebook").replace(/[^a-zA-Z0-9_-]/g,"_");
    window.lorekeeper.exportFile({defaultName: safeName + ".md", content: buildLoreMd()});
  };
  const [loreMdPreview,setLoreMdPreview]=useState(false);
  const loreTabBar = (
    <div className="lore-tab-bar">
      {[["edit","Edit"],["export","Export"]].map(([t,l])=>(
        <button key={t} onClick={()=>setLoreTab(t)} className={"lore-tab-btn"+(loreTab===t?" active":"")}>{l}</button>
      ))}
    </div>
  );
  if(loreTab==="export") return (
    <div>
      {loreTabBar}
      <LoreExportPanel lorebook={lorebook} exportLore={exportLore} exportLoreMd={exportLoreMd} loreMdPreview={loreMdPreview} setLoreMdPreview={setLoreMdPreview} buildLoreMd={buildLoreMd}/>
    </div>
  );
  return (
    <div>
      {loreTabBar}
    <div className="lore-layout">
      <div className="lore-chapters">
        <div style={{padding:'8px 10px',display:'flex',justifyContent:'space-between',alignItems:'center',borderBottom:'1px solid var(--border)',marginBottom:4}}>
          <span style={{fontSize:11,color:'var(--text3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.06em'}}>Chapters</span>
          <button className="btn" style={{padding:'3px 8px',fontSize:11}} onClick={()=>{updLore(l=>{l.content.push({id:uuid(),title:'New Chapter',text:''});});setActiveIdx(chapters.length);}}><i className="ti ti-plus"></i></button>
        </div>
        {chapters.map((ch,i)=>(
          <div key={ch.id} className={`chapter-item ${activeIdx===i?'active':''}`} onClick={()=>setActiveIdx(i)}>
            <span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1}}>{ch.title||'Untitled'}</span>
            <button className="ch-del" onClick={e=>{e.stopPropagation();updLore(l=>{l.content.splice(i,1)});if(activeIdx>=i&&activeIdx>0)setActiveIdx(a=>a-1);}}><i className="ti ti-x"></i></button>
          </div>
        ))}
        <hr className="divider" style={{margin:'8px 0'}}/>
        <div style={{padding:'4px 6px',display:'flex',flexDirection:'column',gap:6}}>
          <div style={{borderRadius:'var(--r)',overflow:'hidden',background:'var(--bg3)',border:'1px solid var(--border)',aspectRatio:'1',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:6,cursor:'pointer',position:'relative'}} onClick={handleImage}>
            {(lorebook.image_data||lorebook.image_relpath) ? <ImgFromPath src={lorebook.image_data||lorebook.image_relpath} alt="cover" style={{width:'100%',height:'100%',objectFit:'cover',position:'absolute',inset:0}}/> : <><i className="ti ti-photo" style={{fontSize:24,color:'var(--text3)'}}></i><span style={{fontSize:10,color:'var(--text3)'}}>Cover image</span></>}
          </div>
          {lorebook.image_id && <div>
            <div style={{fontSize:9,color:'var(--text3)',marginBottom:2,textTransform:'uppercase',letterSpacing:'0.05em'}}>Image ID</div>
            <div style={{display:'flex',gap:4}}>
              <input readOnly value={lorebook.image_id} style={{flex:1,background:'var(--bg2)',border:'1px solid var(--border)',color:'var(--text3)',padding:'3px 6px',borderRadius:'var(--r)',fontSize:9,outline:'none',fontFamily:'monospace',minWidth:0}}/>
              <button className="btn" style={{padding:'3px 5px',fontSize:10,flexShrink:0}} onClick={()=>navigator.clipboard.writeText(lorebook.image_id)}><i className="ti ti-copy" style={{fontSize:11}}></i></button>
            </div>
          </div>}
          <button className="btn" style={{width:'100%',justifyContent:'center',fontSize:12}} onClick={handleImage}><i className="ti ti-upload"></i>{(lorebook.image_data||lorebook.image_relpath)?'Change Image':'Upload Image'}</button>
          {(lorebook.image_data||lorebook.image_relpath)&&<button className="btn danger" style={{width:'100%',justifyContent:'center',fontSize:12}} onClick={()=>updLore(l=>{l.image_data=null;l.image_relpath=null;})}><i className="ti ti-x"></i>Remove Image</button>}
          <hr className="divider"/>
          <input value={lorebook.short_description||''} onChange={e=>updLore(l=>{l.short_description=e.target.value;})} placeholder="Short description…" style={{background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',padding:'6px 8px',borderRadius:'var(--r)',fontSize:12,outline:'none',fontFamily:'inherit'}}/>
          <div style={{marginTop:8}}>
            <div style={{fontSize:9,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:3}}>Lorebooks filename (auto-save)</div>
            <input value={lorebook.lorebook_filename||''} onChange={e=>updLore(l=>{l.lorebook_filename=e.target.value||null;})} placeholder="e.g. MyLorebook.json" style={{background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',padding:'4px 8px',borderRadius:'var(--r)',fontSize:11,outline:'none',fontFamily:'inherit',width:'100%'}}/>
            {lorebook.lorebook_filename&&<div style={{fontSize:10,color:'var(--text3)',marginTop:2}}>I:\Lorekeeper\Lorebooks\{lorebook.lorebook_filename}</div>}
          </div>
          <TagSelector value={lorebook.tags||[]} onChange={v=>updLore(l=>{l.tags=v;})} max={25}/>
          <div style={{marginTop:8}}>
            <div style={{fontSize:9,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:3}}>Access Level</div>
            <select value={lorebook.access_level||'private'} onChange={e=>updLore(l=>{l.access_level=e.target.value;})} style={{width:'100%',background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',padding:'4px 8px',borderRadius:'var(--r)',fontSize:11,outline:'none'}}>
              <option value="private">Private</option>
              <option value="public">Public</option>
            </select>
          </div>
          <div style={{marginTop:8}}>
            <div style={{fontSize:9,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:3}}>Definition Protection</div>
            <select value={lorebook.definition_protection||'copy_protection'} onChange={e=>updLore(l=>{l.definition_protection=e.target.value;})} style={{width:'100%',background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',padding:'4px 8px',borderRadius:'var(--r)',fontSize:11,outline:'none'}}>
              <option value="open">Open — anyone can read</option>
              <option value="copy_protection">Copy Protection (recommended)</option>

          <button className="btn" style={{width:'100%',justifyContent:'center',fontSize:12}} onClick={()=>exportLore(lorebook)}><i className="ti ti-download"></i>Export</button>
          <button className="btn danger" style={{width:'100%',justifyContent:'center',fontSize:12}} onClick={()=>{if(window.confirm(`Delete "${lorebook.name}"? This cannot be undone.`))update(d=>{d.lorebooks=d.lorebooks.filter(x=>x.id!==lorebook.id);});}}><i className="ti ti-trash"></i>Delete</button>
        </div>
      </div>
      <div className="lore-editor">
        {!chapter?<p className="text-muted">No chapters. Add one to start.</p>:<>
          <input value={chapter.title} onChange={e=>updLore(l=>{l.content[activeIdx].title=e.target.value;})} placeholder="Chapter title"/>
          <MdField value={chapter.text} onChange={e=>updLore(l=>{l.content[activeIdx].text=e.target.value;})} style={{minHeight:400}} placeholder="Write lore here... markdown supported"/>
        </>}
      </div>
    </div>
    </div>
  );
}

function CollectionCharPicker({coll,data,update,setSelectedChar}) {
  const [search,setSearch]=useState('');
  const [showAll,setShowAll]=useState(false);
  const q=search.toLowerCase();
  const isInColl=(ch)=>(ch.collections||[]).includes(coll.id)||(coll.companions||[]).includes(ch.id);
  const members=data.characters.filter(isInColl);
  const nonMembers=data.characters.filter(ch=>!isInColl(ch)&&(!q||ch.name.toLowerCase().includes(q)||(ch.display_name||'').toLowerCase().includes(q)));
  const toggle=(ch)=>update(d=>{
    const c=d.characters.find(x=>x.id===ch.id);
    if(!c)return;
    if(!c.collections)c.collections=[];
    const inCollections=c.collections.includes(coll.id);
    const inCompanions=(coll.companions||[]).includes(ch.id);
    if(inCollections||inCompanions){
      c.collections=c.collections.filter(x=>x!==coll.id);
      // also clean from coll.companions so imported chars are fully removed
      const dc=d.collections.find(x=>x.id===coll.id);
      if(dc&&dc.companions)dc.companions=dc.companions.filter(x=>x!==ch.id);
    } else {
      c.collections.push(coll.id);
    }
  });
  const groupByWorld=(chars)=>data.worlds.reduce((acc,w)=>{
    const wChars=chars.filter(c=>c.world_id===w.id&&(!q||c.name.toLowerCase().includes(q)||(c.display_name||'').toLowerCase().includes(q)));
    if(wChars.length>0)acc.push({world:w,chars:wChars});
    return acc;
  },[]);

  return (
    <div>
      <div style={{marginBottom:16,display:'flex',gap:10,alignItems:'center'}}>
        <div style={{position:'relative',flex:1}}>
          <i className="ti ti-search" style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'var(--text3)',fontSize:15,pointerEvents:'none'}}></i>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search characters…" style={{width:'100%',background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',padding:'7px 12px 7px 32px',borderRadius:'var(--r)',fontSize:13,outline:'none'}}/>
        </div>
        <button className={`btn ${showAll?'primary':''}`} onClick={()=>setShowAll(s=>!s)}><i className="ti ti-plus"></i>{showAll?'Hide picker':'Add characters'}</button>
      </div>

      {members.length>0&&<div style={{marginBottom:20}}>
        <div style={{fontSize:11,color:'var(--text3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:10}}>In collection ({members.length})</div>
        <div className="chars-grid">
          {members.filter(c=>!q||c.name.toLowerCase().includes(q)||(c.display_name||'').toLowerCase().includes(q)).map(c=>(
            <div key={c.id} style={{position:'relative'}}>
              <CharCard char={c} onClick={()=>setSelectedChar(c)}/>
              <button className="btn danger" style={{position:'absolute',top:6,right:6,padding:'3px 6px',fontSize:11,opacity:0.9}} onClick={e=>{e.stopPropagation();toggle(c);}} title="Remove from collection"><i className="ti ti-x"></i></button>
            </div>
          ))}
        </div>
      </div>}

      {members.length===0&&!showAll&&<div className="empty"><i className="ti ti-users"></i><h3>No characters linked yet</h3><p>Click "Add characters" to link them manually, or import their JSONs.</p></div>}

      {showAll&&<div>
        <div style={{fontSize:11,color:'var(--text3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:10}}>Add from library</div>
        {groupByWorld(nonMembers).map(({world,chars})=>(
          <div key={world.id} style={{marginBottom:16}}>
            <div style={{fontSize:11,color:'var(--text3)',marginBottom:6,display:'flex',alignItems:'center',gap:6}}>
              {world.image&&<img src={world.image} style={{width:16,height:16,borderRadius:2,objectFit:'cover'}}/>}{world.name}
            </div>
            <div className="chars-grid">
              {chars.map(c=>(
                <div key={c.id} style={{position:'relative',cursor:'pointer'}} onClick={()=>toggle(c)}>
                  <CharCard char={c} onClick={()=>toggle(c)}/>
                  <div style={{position:'absolute',inset:0,background:'rgba(167,139,250,0.08)',borderRadius:'var(--rl)',border:'1px dashed var(--accent2)',display:'flex',alignItems:'center',justifyContent:'center',opacity:0,transition:'opacity 0.15s'}} className="add-overlay">
                    <i className="ti ti-plus" style={{fontSize:24,color:'var(--accent)'}}></i>
                  </div>
                </div>
              ))}
            </div>
          </div>
        ))}
        {nonMembers.length===0&&<p className="text-muted">All characters are already in this collection.</p>}
      </div>}
    </div>
  );
}

function CollectionPicker({charData,data,updChar,update}) {
  const [search,setSearch]=useState('');
  const q=search.toLowerCase();
  const allColls=data.collections.filter(c=>!search||c.name.toLowerCase().includes(q));
  const grouped=data.worlds.reduce((acc,w)=>{
    const wColls=allColls.filter(c=>c.world_id===w.id);
    if(wColls.length>0) acc.push({world:w,colls:wColls});
    return acc;
  },[]);
  const noWorld=allColls.filter(c=>!data.worlds.find(w=>w.id===c.world_id));
  const isLinked=(coll)=>(charData.collections||[]).includes(coll.id)||(coll.companions||[]).includes(charData.id);
  const toggle=(coll)=>update(d=>{
    const c=d.characters.find(x=>x.id===charData.id);
    if(!c)return;
    if(!c.collections)c.collections=[];
    const dc=d.collections.find(x=>x.id===coll.id);
    const inCollections=c.collections.includes(coll.id);
    const inCompanions=(dc?.companions||[]).includes(charData.id);
    if(inCollections||inCompanions){
      c.collections=c.collections.filter(x=>x!==coll.id);
      if(dc&&dc.companions)dc.companions=dc.companions.filter(x=>x!==charData.id);
    } else { c.collections.push(coll.id); }
  });
  return (
    <div style={{display:'flex',flexDirection:'column',gap:14}}>
      <div className="field-block">
        <label>Collections ({data.collections.filter(c=>isLinked(c)).length} linked)</label>
        <div style={{position:'relative',marginBottom:12,marginTop:8}}>
          <i className="ti ti-search" style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'var(--text3)',fontSize:15,pointerEvents:'none'}}></i>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search collections…" style={{width:'100%',background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',padding:'7px 12px 7px 32px',borderRadius:'var(--r)',fontSize:13,outline:'none'}}/>
        </div>
        {data.collections.length===0?<p className="text-muted">No collections yet.</p>:
          <div>
            {grouped.map(({world,colls})=>(
              <div key={world.id} style={{marginBottom:12}}>
                <div style={{fontSize:11,color:'var(--text3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:6,display:'flex',alignItems:'center',gap:6}}>
                  {world.image&&<img src={world.image} style={{width:16,height:16,borderRadius:2,objectFit:'cover'}}/>}{world.name}
                </div>
                {colls.map(c=>{
                  const linked=isLinked(c);
                  const fromPlatform=(c.companions||[]).includes(charData.id)&&!(charData.collections||[]).includes(c.id);
                  return <div key={c.id} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 10px',background:linked?'var(--accent-dim)':'var(--bg3)',border:linked?'1px solid var(--accent2)':'1px solid var(--border)',borderRadius:'var(--r)',marginBottom:4,cursor:fromPlatform?'default':'pointer',transition:'all 0.15s',opacity:fromPlatform?0.7:1}} onClick={()=>!fromPlatform&&toggle(c)}>
                    <i className={`ti ${linked?'ti-folder-filled':'ti-folder'}`} style={{color:linked?'var(--accent)':'var(--text3)',fontSize:16,flexShrink:0}}></i>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:13,fontWeight:500,color:linked?'var(--accent)':'var(--text)'}}>{c.name}</div>
                      {fromPlatform&&<div style={{fontSize:10,color:'var(--text3)'}}>Linked via platform import</div>}
                    </div>
                    {linked&&<i className="ti ti-check" style={{color:'var(--accent)',fontSize:16,flexShrink:0}}></i>}
                  </div>;
                })}
              </div>
            ))}
            {noWorld.length>0&&<div>
              <div style={{fontSize:11,color:'var(--text3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:6}}>No World</div>
              {noWorld.map(c=>{
                const linked=isLinked(c);
                return <div key={c.id} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 10px',background:linked?'var(--accent-dim)':'var(--bg3)',border:linked?'1px solid var(--accent2)':'1px solid var(--border)',borderRadius:'var(--r)',marginBottom:4,cursor:'pointer'}} onClick={()=>toggle(c)}>
                  <i className={`ti ${linked?'ti-folder-filled':'ti-folder'}`} style={{color:linked?'var(--accent)':'var(--text3)',fontSize:16}}></i>
                  <span style={{fontSize:13,color:linked?'var(--accent)':'var(--text)'}}>{c.name}</span>
                  {linked&&<i className="ti ti-check" style={{color:'var(--accent)',fontSize:16,marginLeft:'auto'}}></i>}
                </div>;
              })}
            </div>}
          </div>
        }
      </div>
    </div>
  );
}

function CharCard({char,onClick}) {

function StandaloneLorePage({lorebook,data,update,exportLore,onBack}) {
  const updLore=(fn)=>update(d=>{const l=d.lorebooks.find(x=>x.id===lorebook.id);if(l){fn(l);l.updated_at=new Date().toISOString();if(l.lorebook_filename){
        const{world_id,image_data,lorebook_filename,...lrest}=l;
        window.lorekeeper.saveLorebookJson(l.lorebook_filename,{...lrest,updated_at:l.updated_at});
      }}});
  const lore=(data.lorebooks.find(x=>x.id===lorebook.id))||lorebook;
  const handleImage=async()=>{
    const r=await window.lorekeeper.importImage();
    if(!r) return;
    if(lorebook.lorebook_filename){
      const folder='Lorebooks';
      const baseName=lorebook.lorebook_filename.replace(/\.json$/i,'');
      const res=await window.lorekeeper.copyImageToFolder(r.srcPath,folder,baseName);
      if(res) { updLore(l=>{l.image_data=res.base64;l.image_relpath=res.relPath;}); return; }
    }
    updLore(l=>{l.image_data=r.base64;});
  };
  return (
    <div>
      <div className="breadcrumb" onClick={onBack}><i className="ti ti-arrow-left"></i><span>Lorebooks</span><i className="ti ti-chevron-right"></i><span>{lore.name}</span></div>
      <LoreboookEditor lorebook={lore} update={update} exportLore={exportLore}/>
    </div>
  );
}

function AllLorebooksPage({data,update,setSelectedWorld,setSelectedLore,exportLore}) {
  const [filter,setFilter]=useState('all');
  const worlds=data.worlds;
  const lorebooks=filter==='all'?data.lorebooks:filter==='none'?data.lorebooks.filter(l=>!l.world_id):data.lorebooks.filter(l=>l.world_id===filter);

  const openLorebook=(l)=>{
    const w=data.worlds.find(x=>x.id===l.world_id);
    if(w){ setSelectedWorld(w); setWorldTab('lorebooks'); setSelectedLore(l); setPage('world'); }
    else { setSelectedLore(l); setPage('lore'); }
  };

  return (
    <div>
      <div style={{display:'flex',gap:8,marginBottom:16,flexWrap:'wrap'}}>
        <button className={`btn ${filter==='all'?'primary':''}`} onClick={()=>setFilter('all')}>All ({data.lorebooks.length})</button>
        <button className={`btn ${filter==='none'?'primary':''}`} onClick={()=>setFilter('none')}>Standalone ({data.lorebooks.filter(l=>!l.world_id).length})</button>
        {worlds.map(w=>{
          const count=data.lorebooks.filter(l=>l.world_id===w.id).length;
          if(count===0) return null;
          return <button key={w.id} className={`btn ${filter===w.id?'primary':''}`} onClick={()=>setFilter(w.id)}>{w.emoji?w.emoji+' ':''}{w.name} ({count})</button>;
        })}
      </div>
      {lorebooks.length===0?<div className="empty"><i className="ti ti-book"></i><h3>No lorebooks</h3></div>:
      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        {lorebooks.map(l=>{
          const w=data.worlds.find(x=>x.id===l.world_id);
          return <div key={l.id} style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--rl)',padding:'14px 16px',display:'flex',alignItems:'center',gap:12,cursor:'pointer'}} onClick={()=>openLorebook(l)}>
            {(l.image_data||l.image_relpath)?<ImgFromPath src={l.image_data||l.image_relpath} alt={l.name} style={{width:48,height:48,borderRadius:6,objectFit:'cover',flexShrink:0}}/>:<div style={{width:48,height:48,borderRadius:6,background:'var(--bg3)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><i className="ti ti-book" style={{fontSize:22,color:'var(--amber)'}}></i></div>}
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:14,fontWeight:600,color:'var(--text)'}}>{l.name}</div>
              <div style={{fontSize:12,color:'var(--text3)',marginTop:2,display:'flex',gap:8,alignItems:'center'}}>
                {w?<span>{w.emoji?w.emoji+' ':''}{w.name}</span>:<span style={{color:'var(--accent)',fontSize:11}}>Standalone</span>}
                <span>·</span><span>{(l.content||[]).length} chapters</span>
                <span>·</span><span style={{color:l.access_level==='public'?'#6ee7b7':'var(--text3)'}}>{l.access_level||'private'}</span>
              </div>
              {(l.tags||[]).length>0&&<div className="char-tags" style={{marginTop:4}}>{l.tags.slice(0,5).map(t=><span key={t} className="tag">{t}</span>)}</div>}
            </div>
            <button className="btn" style={{padding:'5px 10px',fontSize:12,flexShrink:0}} onClick={e=>{e.stopPropagation();exportLore(l);}}><i className="ti ti-download"></i></button>
          </div>;
        })}
      </div>}
    </div>
  );
}

              {charData.image?.id&&<button className="btn" style={{padding:'4px 6px',fontSize:10,flexShrink:0}} onClick={()=>navigator.clipboard.writeText(charData.image.id)} title="Copy"><i className="ti ti-copy" style={{fontSize:12}}></i></button>}

                        <button className="btn danger" style={{padding:'3px 6px',fontSize:11}} onClick={()=>updChar(c=>c.portraits.splice(i,1))}><i className="ti ti-x"></i></button>

                {(charData.portraits||[]).length < 10 && (

                    <button className="btn" style={{aspectRatio:'3/4',width:'100%',flexDirection:'column',gap:6,justifyContent:'center',border:'1.5px dashed var(--border2)'}} onClick={async()=>{

              <div className="field-block">
                <label>Linked Lorebooks</label>
                <p style={{fontSize:12,color:'var(--text3)',marginBottom:12}}>Lorebooks attached to this character. Can span across worlds.</p>
                {data.lorebooks.length===0 ? <p className="text-muted">No lorebooks exist yet. Create one inside a world first.</p> :
                  Object.entries(data.lorebooks.reduce((acc,l)=>{
                    const w=data.worlds.find(x=>x.id===l.world_id);
                    const wname=w?.name||'No World';

                        return <div key={l.id} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 10px',background:linked?'var(--accent-dim)':'var(--bg3)',border:linked?'1px solid var(--accent2)':'1px solid var(--border)',borderRadius:'var(--r)',marginBottom:4,cursor:'pointer',transition:'all 0.15s'}} onClick={()=>updChar(c=>{if(!c.linked_lorebooks)c.linked_lorebooks=[];if(c.linked_lorebooks.includes(l.id)){c.linked_lorebooks=c.linked_lorebooks.filter(x=>x!==l.id);}else{c.linked_lorebooks.push(l.id);}})}>
                          {l.image_data?<img src={l.image_data} alt={l.name} style={{width:32,height:32,borderRadius:4,objectFit:'cover',flexShrink:0}}/>:<i className="ti ti-book" style={{fontSize:18,color:linked?'var(--accent)':'var(--text3)',flexShrink:0}}></i>}
                          <div style={{flex:1,minWidth:0}}>

                        <i className="ti ti-book" style={{fontSize:13}}></i>{l.name}{w&&<span style={{color:'var(--text3)',fontSize:11}}>· {w.name}</span>}
                        <button style={{background:'none',border:'none',color:'var(--text3)',cursor:'pointer',padding:0,fontSize:13}} onClick={()=>updChar(c=>{c.linked_lorebooks=c.linked_lorebooks.filter(x=>x!==lid);})}><i className="ti ti-x"></i></button>
                      </div>:null;
                    })}
