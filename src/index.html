        <div style={{fontSize:11,color:'var(--text3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:10}}>Collections ({collections.length})</div>
        {collections.map(item=>{
          const id=item.jsonData?.id||item.filename;
          const existing=item.jsonData?.id&&data.collections.find(x=>x.id===item.jsonData.id);
          const localTime=pts(existing?.updated_at);
          const importTime=pts(item.jsonData?.updated_at);
          const isNew=!existing;
          const localNewer=!isNew&&localTime>importTime&&localTime>0;
          const upToDate=!isNew&&!localNewer&&Math.abs(localTime-importTime)<1000;
          return <div key={id} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 14px',background:'var(--bg2)',border:localNewer?'1px solid rgba(251,191,36,0.3)':'1px solid var(--border)',borderRadius:'var(--r)',marginBottom:6,opacity:upToDate?0.6:1}}>
            {item.thumbnail&&<img src={item.thumbnail} style={{width:40,height:40,borderRadius:4,objectFit:'cover',flexShrink:0}}/>}
            <div style={{flex:1,minWidth:0}}>

              <ScanTagChips tags={item.jsonData?.tags}/>

            <div style={{display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
              <ScanBadge isNew={isNew} localNewer={localNewer&&!forceImport&&!forceItems.has(id)} upToDate={upToDate}/>
              {localNewer&&!forceImport?(forceItems.has(id)?<span style={{fontSize:10,color:'var(--amber)'}}><i className="ti ti-alert-triangle"></i> will overwrite</span>:<button className="btn" style={{fontSize:11,padding:'4px 8px'}} onClick={()=>setForceItems(s=>new Set([...s,id]))} title="Import this item anyway, overwriting your local edits">Import anyway</button>):null}

      {lorebooks.length>0&&<div style={{marginBottom:24}}>
        <div style={{fontSize:11,color:'var(--text3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:10}}>Lorebooks ({lorebooks.length})</div>

          const id=item.jsonData?.id||item.filename;
          const existing=item.jsonData?.id&&data.lorebooks.find(x=>x.id===item.jsonData.id);
          const localTime=pts(existing?.updated_at);
          const importTime=pts(item.jsonData?.updated_at);
          const isNew=!existing;
          const localNewer=!isNew&&localTime>importTime&&localTime>0;
          const upToDate=!isNew&&!localNewer&&Math.abs(localTime-importTime)<1000;
          return <div key={id} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 14px',background:'var(--bg2)',border:localNewer?'1px solid rgba(251,191,36,0.3)':'1px solid var(--border)',borderRadius:'var(--r)',marginBottom:6,opacity:upToDate?0.6:1}}>
            <i className="ti ti-book" style={{fontSize:18,color:'var(--amber)',flexShrink:0}}></i>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13,fontWeight:500,color:'var(--text)'}}>{item.jsonData?.name||item.filename}</div>
              <ScanTagChips tags={item.jsonData?.tags}/>
            </div>
            <div style={{display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
              <ScanBadge isNew={isNew} localNewer={localNewer&&!forceImport&&!forceItems.has(id)} upToDate={upToDate}/>
              {localNewer&&!forceImport?(forceItems.has(id)?<span style={{fontSize:10,color:'var(--amber)'}}><i className="ti ti-alert-triangle"></i> will overwrite</span>:<button className="btn" style={{fontSize:11,padding:'4px 8px'}} onClick={()=>setForceItems(s=>new Set([...s,id]))} title="Import this item anyway, overwriting your local edits">Import anyway</button>):null}
              <WorldSelect id={id}/>
            </div>
          </div>;
        })}
      </div>}

      {companions.length>0&&<div>
        <div style={{fontSize:11,color:'var(--text3)',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:10}}>Companions ({companions.length})</div>
        {companions.map(item=>{
          const id=item.jsonData?.id||item.folderName;
          const existing=item.jsonData?.id&&data.characters.find(x=>x.id===item.jsonData.id);
          const pts=parseTimestamp;
          const localTime=pts(existing?.updated_at);
          const importTime=pts(item.jsonData?.updated_at);
          const isNew=!existing;
          const localNewer=!isNew&&localTime>importTime&&localTime>0;
          const upToDate=!isNew&&localTime===importTime;
          const updateAvail=!isNew&&importTime>localTime;
          return <div key={id} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 14px',background:'var(--bg2)',border:localNewer?'1px solid rgba(251,191,36,0.3)':'1px solid var(--border)',borderRadius:'var(--r)',marginBottom:6,opacity:upToDate?0.6:1}}>
            {item.thumbnail?<img src={item.thumbnail} style={{width:40,height:40,borderRadius:4,objectFit:'cover',flexShrink:0}}/>:<div style={{width:40,height:40,borderRadius:4,background:'var(--bg3)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><i className="ti ti-user" style={{color:'var(--text3)'}}></i></div>}
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13,fontWeight:500,color:'var(--text)'}}>{item.jsonData?.display_name||item.jsonData?.name||item.folderName}</div>
              <div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>{item.imageFiles.length} images · {(()=>{if(!item.jsonData?.updated_at)return 'no date';const t=new Date(item.jsonData.updated_at);return isNaN(t.getTime())?'no date':t.toLocaleDateString();})()}</div>
              <ScanTagChips tags={item.jsonData?.tags}/>
            </div>
            <div style={{display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
              <ScanBadge isNew={isNew} localNewer={localNewer&&!forceImport&&!forceItems.has(id)} upToDate={upToDate}/>
              {localNewer&&!forceImport?(forceItems.has(id)?<span style={{fontSize:10,color:'var(--amber)'}}><i className="ti ti-alert-triangle"></i> will overwrite</span>:<button className="btn" style={{fontSize:11,padding:'4px 8px'}} onClick={()=>setForceItems(s=>new Set([...s,id]))} title="Import this item anyway, overwriting your local edits">Import anyway</button>):null}
              <WorldSelect id={id}/>
            </div>
          </div>;
        })}
      </div>}
    <ImageMigrationPanel data={data} update={update}/>
    </div>
  );
}


function TemplatesPage({data,update,newTemplate,clearNew}) {
  const [editing,setEditing]=useState(null);
  const [filter,setFilter]=useState('all');
  React.useEffect(()=>{if(newTemplate){setEditing('new');clearNew();}},[newTemplate]);
  const templates=data.templates||[];
  const worlds=data.worlds;
  const updT=(id,fn)=>update(d=>{const t=d.templates.find(x=>x.id===id);if(t)fn(t);});

  if(editing) {
    const t=editing==='new'?null:templates.find(x=>x.id===editing);
    return <TemplateEditor template={t} data={data} update={update} onBack={()=>setEditing(null)} />;
  }

  const globalTemplates=templates.filter(t=>!t.world_id);
  const worldTemplates=templates.filter(t=>!!t.world_id);
  const visibleWorlds=filter==='all'?worlds:worlds.filter(w=>w.id===filter);
  const showGlobal=filter==='all'||filter==='none';

  const TplCard = ({t, accent}) => (
    <div className="tpl-card" onClick={()=>setEditing(t.id)}>
      <i className={"ti ti-template"} style={{fontSize:20,color:accent||'var(--accent)',flexShrink:0}}></i>
      <div style={{flex:1}}>
        <div className="tpl-card-name">{t.name}</div>

      </div>
      <button className="btn danger" style={{padding:'4px 8px',fontSize:12}} onClick={e=>{e.stopPropagation();if(window.confirm("Delete "+t.name+"?"))update(d=>{d.templates=d.templates.filter(x=>x.id!==t.id);});}}><i className="ti ti-trash"></i></button>
    </div>
  );
  return (
    <div>
      {templates.length>0&&<div style={{display:'flex',gap:8,marginBottom:16}}>
        <WorldFilterDropdown worlds={worlds} value={filter} onChange={setFilter} includeStandalone/>
      </div>}
      {templates.length===0&&<div className="empty"><i className="ti ti-template"></i><h3>No templates yet</h3><p>Templates pre-fill character fields on creation. Create a global template or associate one with a world.</p></div>}
      {showGlobal&&globalTemplates.length>0&&<div className="tpl-section">
        <div className="tpl-section-header">Global</div>
        <div className="tpl-list">{globalTemplates.map(t=><TplCard key={t.id} t={t} accent="var(--accent)"/>)}</div>
      </div>}
      {visibleWorlds.map(w=>{
        const wt=worldTemplates.filter(t=>t.world_id===w.id);
        if(wt.length===0) return null;
        return <div key={w.id} className="tpl-section">
          <div className="tpl-section-header">{w.emoji&&<span>{w.emoji}</span>}{w.name}</div>
          <div className="tpl-list">{wt.map(t=><TplCard key={t.id} t={t} accent="var(--teal)"/>)}</div>
        </div>;
      })}
    </div>
  );
}

function TemplateEditor({template,data,update,onBack}) {
  const isNew=!template;
  const [name,setName]=useState(template?.name||'');
  const [worldId,setWorldId]=useState(template?.world_id||'');
  const [fields,setFields]=useState(template?.fields||{});
  const setF=(k,v)=>setFields(f=>({...f,[k]:v}));
  const save=()=>{
    if(!name.trim())return;
    const trimmedName=name.trim();
    const templateId = isNew ? uuid() : template.id;
    if(isNew){
      update(d=>{if(!d.templates)d.templates=[];d.templates.push({id:templateId,name:trimmedName,world_id:worldId||null,fields});});
    } else {
      update(d=>{const t=d.templates.find(x=>x.id===template.id);if(t){t.name=trimmedName;t.world_id=worldId||null;t.fields=fields;}});
    }
    // Templates had no independent file backup — only ever lived inside the main data
    // file, same gap notes had before being fixed. Auto-save a standalone JSON backup
    // to Templates\ on every create/edit, separate from the main data file write.
    const safeName=trimmedName.replace(/[^a-zA-Z0-9_-]/g,"_");
    window.lorekeeper.saveTemplateFile(safeName, {id:templateId,name:trimmedName,world_id:worldId||null,fields}).catch(()=>{});
    onBack();
  };
  return (
    <div>
      <div className="breadcrumb" onClick={onBack}><i className="ti ti-arrow-left"></i><span>Templates</span><i className="ti ti-chevron-right"></i><span>{isNew?'New Template':template.name}</span></div>
      <div className="tpl-editor">
        <div className="field-row">
          <div className="field-block">
            <label>Template Name</label>
            <input value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. Base Template, Guideverse Powers…"/>
          </div>
          <div className="field-block">
            <label>World <span style={{color:'var(--text3)',fontWeight:'normal',textTransform:'none',letterSpacing:0,fontSize:11}}>— leave empty for global</span></label>
            <select value={worldId} onChange={e=>setWorldId(e.target.value)}>
              <option value="">Global (all worlds)</option>
              {sortedWorlds(data).map(w=><option key={w.id} value={w.id}>{w.emoji?w.emoji+' ':''}{w.name}</option>)}
            </select>
          </div>
        </div>
        <div className="tpl-hint">Fill in only the fields you want this template to set. Empty fields will be skipped.</div>
        {TEMPLATE_FIELDS.map(([key,label,type,extra])=>(
          <div key={key} className="field-block">
            <label>{label}</label>
            {type==='textarea'&&<textarea value={fields[key]||''} onChange={e=>setF(key,e.target.value)} style={{minHeight:key==='card'?300:80}} placeholder={`Template value for ${label}…`}/>}
            {type==='input'&&<input value={fields[key]||''} onChange={e=>setF(key,e.target.value)} placeholder={extra||''}/>}
            {type==='select'&&<select value={fields[key]||''} onChange={e=>setF(key,e.target.value)}><option value="">— don't set —</option>{extra.map(o=><option key={o} value={o}>{o}</option>)}</select>}
            {type==='checkbox'&&<label style={{display:'flex',alignItems:'center',gap:8,fontWeight:'normal',textTransform:'none',letterSpacing:0,fontSize:13,color:'var(--text2)',cursor:'pointer',marginTop:4}}>
              <input type="checkbox" checked={!!fields[key]} onChange={e=>setF(key,e.target.checked)} style={{width:'auto',accentColor:'var(--accent)'}}/>{label}
            </label>}
            {type==='number'&&<input type="number" min="-100" max="100" value={fields[key]||0} onChange={e=>setF(key,Number(e.target.value))}/>}
            {type==='tags'&&<TagSelector value={fields[key]||[]} onChange={v=>setF(key,v)} max={25}/>}
            {type==='fandom_tags'&&<TagInput value={fields[key]||[]} onChange={v=>setF(key,v.slice(0,3))}/>}
          </div>
        ))}
        <div className="export-row" style={{marginTop:4}}>
          <button className="btn" onClick={onBack}>Cancel</button>
          <button className="btn primary" disabled={!name.trim()} onClick={save}><i className="ti ti-check"></i>{isNew?'Create Template':'Save Changes'}</button>
          {!isNew&&<button className="btn" onClick={()=>{
            const lines=["# "+name];
            const world=data.worlds.find(w=>w.id===worldId);
            if(world){lines.push("");lines.push("**World:** "+(world.emoji?world.emoji+" ":"")+world.name);}
            else{lines.push("");lines.push("**World:** Global");}
            lines.push("");lines.push("## Fields");
            TEMPLATE_FIELDS.forEach(([key,label])=>{
              const v=fields[key];
              if(v===undefined||v===''||v===false||v===null) return;
              lines.push("");
              lines.push("### "+label);
              lines.push(typeof v==="boolean"?"Yes":Array.isArray(v)?v.join(", "):String(v));
            });
            const safeName=(name||"template").replace(/[^a-zA-Z0-9_-]/g,"_");
            window.lorekeeper.exportFile({defaultName:safeName+"-template.md",content:lines.join("\n"),folder:"Templates"});
          }}><i className="ti ti-file-text"></i>Export MD</button>}
        </div>
      </div>
    </div>
  );
}

function ThemeGenerator({settings, update}) {
  const savedTheme = settings.theme || {};
  const [accentHex, setAccentHex] = React.useState(savedTheme.accent_hex || '#a78bfa');
  const [previewMode, setPreviewMode] = React.useState(savedTheme.mode || 'dark');
  const [hexInput, setHexInput] = React.useState('');
  const [hexErr, setHexErr] = React.useState(false);

  const { dark, light } = generateTheme(accentHex);
  const preview = previewMode === 'light' ? light : dark;

  const handleHexInput = (v) => {
    setHexInput(v);
    const val = v.startsWith('#') ? v : '#'+v;
    if(/^#[0-9a-fA-F]{6}$/.test(val)) { setAccentHex(val); setHexErr(false); }
    else { setHexErr(v.length>0); }
  };

  const apply = () => {
    update(d => { if(!d.settings) d.settings={}; d.settings.theme = {accent_hex: accentHex, mode: previewMode}; });
  };

  const reset = () => {
    update(d => { if(d.settings) d.settings.theme = null; });
    applyTheme({
      bg:'#0f0e13', bg2:'#1a1825', bg3:'#231f33', bg4:'#2e2a42',
      accent:'#a78bfa', accent2:'#7c5cbf', accentDim:'#3d2f6e',
      text:'#e8e4f4', text2:'#a49dc0', text3:'#6b6488',
      border:'rgba(167,139,250,0.12)', border2:'rgba(167,139,250,0.22)',
    });
  };

  const isApplied = savedTheme.accent_hex === accentHex && savedTheme.mode === previewMode;

  return (
    <div>
      <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:12}}>
        <div style={{width:32,height:32,borderRadius:6,background:accentHex,border:'1px solid rgba(255,255,255,0.15)',flexShrink:0}}/>
        <input value={hexInput||accentHex} onChange={e=>handleHexInput(e.target.value)}
          style={{flex:1,background:'var(--bg3)',border:hexErr?'1px solid var(--red)':'1px solid var(--border)',color:'var(--text)',padding:'6px 10px',borderRadius:'var(--r)',fontSize:12,outline:'none',fontFamily:'monospace',maxWidth:160}}/>
        <div style={{display:'flex',gap:4}}>
          <button className={"btn"+(previewMode==='dark'?' primary':'')} style={{fontSize:11,padding:'5px 10px'}} onClick={()=>setPreviewMode('dark')}><i className="ti ti-moon"></i>Dark</button>
          <button className={"btn"+(previewMode==='light'?' primary':'')} style={{fontSize:11,padding:'5px 10px'}} onClick={()=>setPreviewMode('light')}><i className="ti ti-sun"></i>Light</button>
        </div>
      </div>

      <div style={{fontSize:9,fontWeight:600,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:6}}>Preview</div>
      <div style={{display:'flex',border:'1px solid var(--border)',borderRadius:'var(--rl)',overflow:'hidden',marginBottom:12}}>
        <div style={{width:90,background:preview.bg2,padding:10,display:'flex',flexDirection:'column',gap:6,borderRight:'1px solid '+preview.border}}>
          <div style={{width:18,height:18,borderRadius:4,background:preview.accentDim,display:'flex',alignItems:'center',justifyContent:'center'}}>
            <div style={{width:8,height:8,borderRadius:2,background:preview.accent}}/>
          </div>
          <div style={{height:6,width:'80%',borderRadius:2,background:preview.accent,opacity:0.5}}/>
          <div style={{height:6,width:'60%',borderRadius:2,background:preview.text3,opacity:0.5}}/>
          <div style={{height:6,width:'70%',borderRadius:2,background:preview.text3,opacity:0.5}}/>
        </div>
        <div style={{flex:1,background:preview.bg,padding:12}}>
          <div style={{fontSize:12,fontWeight:700,color:preview.text,marginBottom:6}}>Sample heading</div>
          <div style={{fontSize:10,color:preview.text2,marginBottom:8,lineHeight:1.5}}>This is body text on the main background, showing readability.</div>
          <div style={{display:'flex',gap:6}}>
            <div style={{padding:'4px 10px',borderRadius:6,background:preview.accent,color:previewMode==='light'?'#fff':preview.bg,fontSize:10,fontWeight:600}}>Primary</div>
            <div style={{padding:'4px 10px',borderRadius:6,background:preview.bg3,border:'1px solid '+preview.border,color:preview.text2,fontSize:10}}>Secondary</div>
          </div>
          <div style={{marginTop:8,padding:8,borderRadius:6,background:preview.bg3,border:'1px solid '+preview.border,fontSize:9,color:preview.text3}}>Card / panel surface (--bg3)</div>
        </div>
      </div>

      <div style={{display:'flex',gap:8}}>
        <button className="btn primary" style={{fontSize:12}} disabled={isApplied} onClick={apply}><i className="ti ti-check"></i>{isApplied?'Applied':'Apply theme'}</button>
        {savedTheme.accent_hex&&<button className="btn" style={{fontSize:12}} onClick={reset}><i className="ti ti-refresh"></i>Reset to default</button>}
      </div>
      <div style={{fontSize:10,color:'var(--text3)',marginTop:8}}>Generated from the same color logic as the Color tool — pick any accent and Lorekeeper derives a full background/text/border ramp around it for both dark and light mode.</div>
    </div>
  );
}

function SettingsPage({data, update, dataPath}) {
  const settings = data.settings || {};
  const set = (key, val) => update(d => { if(!d.settings) d.settings={}; d.settings[key]=val; });

  const [apiKeyVisible, setApiKeyVisible] = React.useState(false);
  const [lmTest, setLmTest] = React.useState(null);
  const testLmStudio = async () => {
    const base = ((data.settings||{}).lmstudio_base_url || 'http://localhost:1234/v1').replace(/\/+$/, '');
    setLmTest({state:'testing', msg:'Contacting ' + base + '…'});
    try {
      const res = await fetch(base + '/models');
      const j = await res.json();
      const ids = (j.data||[]).map(m=>m.id);
      if(!ids.length) { setLmTest({state:'warn', msg:'Connected, but no model is loaded in LM Studio.'}); return; }
      setLmModels(ids);
      setLmTest({state:'ok', msg:'Connected. Loaded: ' + ids.join(', '), ids:ids});
    } catch(e) {
      setLmTest({state:'err', msg:'No response from ' + base + '. Start the server in LM Studio (Developer tab) and load a model.'});
    }
  };
  const [lmModels, setLmModels] = React.useState(null);
  // Pull the loaded-model list as soon as the LM Studio panel is visible, so the model
  // dropdown is populated without having to press Test first.
  const lmBase = ((data.settings||{}).lmstudio_base_url || 'http://localhost:1234/v1').replace(/\/+$/, '');
  React.useEffect(() => {
    if((data.settings||{}).ai_provider !== 'lmstudio') return;
    let cancelled = false;
    fetch(lmBase + '/models').then(r=>r.json()).then(j=>{
      if(!cancelled) setLmModels((j.data||[]).map(m=>m.id));
    }).catch(()=>{ if(!cancelled) setLmModels([]); });
    return () => { cancelled = true; };
  }, [(data.settings||{}).ai_provider, lmBase]);

  const [apiKeySaved, setApiKeySaved] = React.useState(false);

  const saveApiKey = (field, val) => {
    set(field, val);

              <option value="gemini-2.0-flash">Gemini 2.0 Flash (default — fast)</option>
              <option value="gemini-2.0-pro">Gemini 2.0 Pro (most capable)</option>
            </select>
          </Field>
        </React.Fragment>}

        {settings.ai_provider==='openrouter'&&<React.Fragment>
          <Field label="OpenRouter API Key" hint="Get yours at openrouter.ai. One key gives access to many underlying models. Stored locally in your data file.">
            <div style={{display:'flex',gap:8}}>
              <div style={{flex:1,position:'relative'}}>
                <input type={apiKeyVisible?'text':'password'} value={settings.openrouter_api_key||''} onChange={e=>set('openrouter_api_key',e.target.value)} placeholder="sk-or-..."
                  style={{width:'100%',background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',padding:'8px 36px 8px 10px',borderRadius:'var(--r)',fontSize:12,outline:'none',fontFamily:'monospace'}}/>
                <button onClick={()=>setApiKeyVisible(v=>!v)} style={{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',cursor:'pointer',color:'var(--text3)',fontSize:13,padding:0}}>
                  <i className={`ti ti-eye${apiKeyVisible?'-off':''}`}></i>
                </button>
              </div>
              <button className="btn primary" style={{flexShrink:0}} onClick={()=>saveApiKey('openrouter_api_key',settings.openrouter_api_key||'')}>
                {apiKeySaved?<><i className="ti ti-check"></i>Saved</>:<><i className="ti ti-device-floppy"></i>Save</>}
              </button>
            </div>
            {settings.openrouter_api_key&&<div style={{fontSize:11,color:'#6ee7b7',marginTop:6}}>✓ API key is set</div>}
          </Field>
          <Field label="Model" hint="Any OpenRouter model slug, e.g. anthropic/claude-sonnet-4-6, openai/gpt-4o, google/gemini-2.0-flash, meta-llama/llama-3.3-70b-instruct.">
            <input type="text" value={settings.openrouter_model||'anthropic/claude-sonnet-4-6'} onChange={e=>set('openrouter_model',e.target.value)} placeholder="anthropic/claude-sonnet-4-6"
              style={{width:'100%',background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',padding:'7px 10px',borderRadius:'var(--r)',fontSize:12,outline:'none',fontFamily:'monospace',boxSizing:'border-box'}}/>
          </Field>
        </React.Fragment>}

        {settings.ai_provider==='lmstudio'&&<React.Fragment>
          <Field label="Server URL" hint="LM Studio → Developer tab → start the server. Default port is 1234. No API key is needed.">
            <input type="text" value={settings.lmstudio_base_url||''} onChange={e=>set('lmstudio_base_url',e.target.value)} placeholder="http://localhost:1234/v1"
              style={{width:'100%',background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',padding:'7px 10px',borderRadius:'var(--r)',fontSize:12,outline:'none',fontFamily:'monospace',boxSizing:'border-box'}}/>
          </Field>
          <Field label="Model" hint="Every model currently loaded in LM Studio. Load more than one to switch between them from here without leaving Lorekeeper.">
            <LmModelPicker models={lmModels} value={settings.lmstudio_model||''} onPick={v=>set('lmstudio_model',v)} onRefresh={testLmStudio}/>
          </Field>
          <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
            <button className="btn" onClick={testLmStudio}><i className="ti ti-plug-connected"></i>Test connection</button>
            {lmTest&&<span style={lmTest.state==='ok'?LM_OK_STYLE:lmTest.state==='warn'?LM_WARN_STYLE:LM_ERR_STYLE}>{lmTest.msg}</span>}
          </div>
          <div style={{fontSize:11,color:'var(--text3)',marginTop:10,lineHeight:1.6}}>
            Local models have far less context room than the cloud providers — often 8k tokens against 200k. Use the Assistant's context scope selector to narrow what gets sent; sending a whole large world will overflow the window.
          </div>
        </React.Fragment>}
      </Section>

      <Section title="Appearance" icon="ti-palette">
        <Field label="Font Size" hint="Adjusts the base font size across the app.">
          <div style={{display:'flex',gap:6}}>
            {[['small','Small'],['normal','Normal'],['large','Large'],['xlarge','X-Large']].map(([v,l])=>(
              <button key={v} className={`btn${(settings.font_size||'normal')===v?' primary':''}`}
                style={{flex:1,justifyContent:'center',fontSize:11}} onClick={()=>set('font_size',v)}>{l}</button>
            ))}
          </div>
        </Field>
        <Field label="Theme" hint="Pick an accent color to generate a matching dark and light theme. Preview before applying.">
          <ThemeGenerator settings={settings} update={update}/>
        </Field>
        <Field label="Colorblind Mode" hint="Adjusted color palettes for common colorblindness types. Changes red/green or blue/yellow pairs to distinguishable alternatives.">
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
              {[['','Off'],['rg','Red-Green'],['by','Blue-Yellow']].map(([val,label])=>(
                <button key={val} className={`btn${(settings.colorblind_mode||'')=== val?' primary':''}`}
                  onClick={()=>update(d=>{if(!d.settings)d.settings={};d.settings.colorblind_mode=val;})}>
                  {label}
                </button>
              ))}
            </div>
            {(settings.colorblind_mode||'')==='rg'&&<div style={{fontSize:11,color:'var(--text3)',lineHeight:1.5}}>Deuteranopia / Protanopia — replaces red with orange and green with blue so they are never confused.</div>}
            {(settings.colorblind_mode||'')==='by'&&<div style={{fontSize:11,color:'var(--text3)',lineHeight:1.5}}>Tritanopia — replaces yellow-amber with red-orange and teal with pink so they are never confused with blue.</div>}
          </div>
        </Field>
      </Section>

      <Section title="Data" icon="ti-database">
        <Field label="Data file location" hint="Where your Lorekeeper data is stored.">
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            <code style={{flex:1,background:'var(--bg3)',border:'1px solid var(--border)',padding:'7px 10px',borderRadius:'var(--r)',fontSize:11,color:'var(--text3)',fontFamily:'monospace',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{dataPath||'I:\\Lorekeeper\\lorekeeper-data.json'}</code>
            <button className="btn" style={{flexShrink:0}} onClick={()=>window.lorekeeper.openFolder('')}><i className="ti ti-folder-open"></i>Open</button>
          </div>
        </Field>
        <Field label="Auto-save debounce" hint="How quickly changes are saved to disk after you stop typing.">
          <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
            {[[300,'Fast (300ms)'],[600,'Normal (600ms)'],[1000,'Slow (1s)'],[2000,'Very slow (2s)']].map(([v,l])=>(
              <button key={v} className={`btn${(data.settings?.autosave_debounce||600)===v?' primary':''}`}
                style={{fontSize:11,flex:1,justifyContent:'center'}}
                onClick={()=>update(d=>{if(!d.settings)d.settings={};d.settings.autosave_debounce=v;})}>{l}</button>
            ))}
          </div>
          <div style={{fontSize:11,color:'var(--text3)',marginTop:6}}>Currently: {data.settings?.autosave_debounce||600}ms after you stop typing</div>
        </Field>
      </Section>

      <Section title="About" icon="ti-info-circle">
        <div style={{fontSize:12,color:'var(--text3)',lineHeight:1.8}}>
          <div><strong style={{color:'var(--text)'}}>Lorekeeper</strong> — AI companion management for Saucepan</div>
          <div>Built by Ine · Electron + React 18.2.0</div>
          <div style={{marginTop:8}}>
            <strong style={{color:'var(--text)'}}>Pinned dependencies</strong><br/>
            React 18.2.0 · Babel 7.23.10 · Tabler Icons 2.44.0 · adm-zip
          </div>
          <div style={{marginTop:8}}>
            <a href="https://console.anthropic.com" target="_blank" style={{color:'var(--accent)'}}>Get Anthropic API key ↗</a>
          </div>
        </div>
      </Section>

    </div>
  );
}

function HelpPage() {
  const P = ({children}) => <p style={{fontSize:13,color:'var(--text2)',lineHeight:1.7,marginBottom:8}}>{children}</p>;
  const B = ({children}) => <strong style={{color:'var(--text)'}}>{children}</strong>;
  const Code = ({children}) => <code style={{background:'var(--bg3)',padding:'1px 5px',borderRadius:3,fontSize:12,fontFamily:'monospace',color:'var(--accent)'}}>{children}</code>;

  return (
    <div style={{maxWidth:760}}>
      <p style={{fontSize:13,color:'var(--text3)',marginBottom:20}}>Lorekeeper help reference. Click any section to expand.</p>

      <HelpSection title="Dashboard" icon="ti-layout-dashboard">
        <P>The dashboard is your daily workflow hub.</P>
        <P><B>Calendar</B> — Shows scheduled characters (purple chips) and posted dates (green ✓). Click any day to expand it and see what is scheduled. Click a day to open the scheduler and add characters.</P>
        <P><B>Today Banner</B> — Any character marked ready whose scheduled date has arrived or already passed, with a Mark Posted button. It keys off the scheduled date, not the day you set the status, so scheduling a month ahead and marking them later behaves the same. Marking posted stamps the <I>scheduled</I> date, not the day you clicked, so a late-marked character still lands on the right calendar day.</P>
        <P><B>Upcoming</B> — Next 5 scheduled characters with their dates and readiness status.</P>
        <P><B>Release Cycle</B> — A rotating world queue. Set the order in which you cycle through worlds. The next world up is shown here.</P>
        <P><B>Site Checklist</B> — Characters, lorebooks, and collections edited since last export. Clear an item by exporting it and uploading it to the site.</P>
        <P><B>Lorekeeper Checklist</B> — Pre-export validation for public items. Flags missing fields, missing portrait UUIDs, etc.</P>
        <P><B>Drafts in Progress</B> — All draft characters with a visual indicator for missing required fields.</P>
        <HelpTip text="Required for export: name, display name, short description, full description, card, 5+ tags, portrait, portrait UUID, portrait slots, scenarios." />
      </HelpSection>

      <HelpSection title="Characters" icon="ti-users">
        <P>Each character has 11 tabs:</P>
        <P><B>Identity</B> — Name, display name, short description (max 140 chars), world, tags (max 25; content warning tags don't count), fandom tags (max 3).</P>
        <P><B>Full Description</B> — The long-form public description shown on the character's site profile. Separate from the Character Card, which the model sees but readers do not.</P>
        <P><B>Character Card</B> — The system prompt. Supports markdown. Use the macro reference panel for Saucepan macros like {'{{user}}'} and {'{{char}}'}.</P>
        <P><B>Formatting</B> — Formatting instructions, advanced prompt, and example dialogue.</P>
        <P><B>Scenarios</B> — Up to 7500 characters. Drag the grip handle to reorder scenarios.</P>
        <P><B>Main portrait vs portrait slots.</B> The large image on the left is the character's main picture. It does not have to be one of the portrait slots — Set Portrait can import any image. Lorekeeper never reassigns it on its own; the only automatic change is following a file rename.</P>
        <P>A portrait slot named exactly <Code>profile_pic</Code> mirrors the Profile Pic UUID from the site. That copying is one-way: the Profile Pic field is the source and the slot follows it, so editing the slot's own UUID will not change the profile pic.</P>
        <P><B>Portraits</B> — Up to 10 portrait slots. Each needs a platform Image ID (UUID). Drag to reorder portraits.</P>
        <P><B>Lorebooks</B> — Link this character to lorebooks. Linked lorebooks are what the Assistant reads for world context.</P>
        <P><B>Collections</B> — Which collections this character belongs to. A character can be in collections across several worlds.</P>
        <P><B>Schedule</B> — Set status (draft / ready / posted), schedule dates, and posted dates. Setting status to Posted auto-stamps today as the posted date.</P>
        <P><B>Lorebook Entry</B> — If a lorebook template is set up for the world, fill in the character's entry and save it directly to the world lorebook.</P>
        <P><B>Settings</B> — Access level, temperature, spicy flags, companion folder (for auto-save). Also contains <B>Update from JSON</B>, <B>Export JSON</B>, and <B>Export MD</B>.</P>
        <HelpTip text="Export JSON strips all app-only fields automatically. Images export as UUID references only — make sure portrait UUIDs are set first." />
      </HelpSection>

      <HelpSection title="Worlds" icon="ti-world">
        <P>Each world groups characters, lorebooks, collections, and gallery images together.</P>
        <P><B>Characters / Lorebooks / Collections tabs</B> — Browse and manage content in this world. Characters from other worlds that belong to a collection in this world also appear here.</P>
        <P><B>Gallery tab</B> — All images associated with this world.</P>
        <P><B>World Info tab</B> — Edit world name, description, tags, banner image, notes, plot archetypes (for the Plot tool), and lorebook templates.</P>
        <P><B>Export ZIP</B> — The Export ZIP button in the topbar packages all posted characters + public lorebooks + public collections for this world into a dated zip file, stripped of app-only fields and ready to upload. Stamps site_last_synced_at on everything exported.</P>
        <HelpTip text="Drag the grip handle (⠿) next to a world in the sidebar to reorder worlds. The order is saved and used throughout the app." />
      </HelpSection>

      <HelpSection title="Lorebooks" icon="ti-book">
        <P>Lorebooks hold world lore as chapters. Each chapter is a titled text entry.</P>
        <P><B>Chapters tab</B> — Add, reorder, and edit chapters.</P>
        <P><B>Settings tab</B> — Access level, definition protection, image ID, tags, and auto-save filename.</P>
        <P><B>Export tab</B> — Export as platform-ready JSON or as a Markdown document (all chapters as ## headings).</P>
        <P><B>Access level</B> — Set to Public when ready to upload. Private lorebooks are excluded from the Site Checklist and world Export ZIP.</P>
        <P><B>Definition protection</B> — Copy Protection is recommended. Avoid Open.</P>
        <P><B>Auto-save filename</B> — Set a filename (e.g. <Code>MyLorebook.json</Code>) and Lorekeeper auto-saves the lorebook to <Code>Lorebooks\</Code> on every edit.</P>
        <HelpTip text="Standalone lorebooks (no world) are accessible from the Lorebooks page in the sidebar." />
      </HelpSection>

      <HelpSection title="Collections" icon="ti-folders">
        <P>Collections group characters together on the site.</P>
        <P><B>Edit tab</B> — Name, description, tags, world, auto-save filename, and character picker.</P>
        <P><B>Export tab</B> — Export as platform-ready JSON or as a Markdown document (name, description, character list, tags).</P>
        <P><B>Character picker</B> — Add or remove characters from the collection. Characters from any world can be added.</P>
        <P><B>Access level</B> — Set to Public to include the collection in world Export ZIPs.</P>
        <HelpTip text="A character can belong to multiple collections across different worlds — this is intentional. Collections are the mechanism for cross-world grouping." />
      </HelpSection>

      <HelpSection title="Personas" icon="ti-masks-theater">
        <P>Personas are your player characters — independent of worlds, used across roleplay.</P>
        <P>Each persona has a name, pronouns, description, portrait, and an optional linked lorebook.</P>
        <P>The <B>Export MD</B> button in the topbar exports a markdown sheet with name, pronouns, description, and linked lorebook name.</P>
      </HelpSection>

      <HelpSection title="Templates (character creation)" icon="ti-template">
        <P>Character templates pre-fill fields when creating a new character.</P>
        <P>Global templates are available everywhere. World templates only appear when creating a character in that world.</P>
        <P>Supported fields: display name format, short/full description, card, formatting, advanced prompt, tags, fandom tags, access level, spicy flags, temperature, and more.</P>
        <P>The <B>Export MD</B> button in the template editor exports a reference sheet with all non-empty fields.</P>
        <HelpTip text="Use {{name}} in the Display Name Format field — it gets replaced with the character's actual name on creation." />
      </HelpSection>

      <HelpSection title="Lorebook Templates (per-world)" icon="ti-template">
        <P>Lorebook templates let you define a structured format for character entries in a world lorebook — e.g. a hockey player profile for all team members.</P>
        <HelpStep n={1} text="Go to the world → World Info tab → Lorebook Templates section."/>
        <HelpStep n={2} text="Click New template. Give it a name, pick the target lorebook, set a chapter title template (e.g. CHARACTER NAME | POSITION | ROLE), and paste the template text."/>
        <HelpStep n={3} text="Use {{CHARACTER NAME}} for the character's name in uppercase, and {{CHAR}} for normal case."/>
        <HelpStep n={4} text="Open any character in that world → Lorebook Entry tab. The template appears pre-filled with their name."/>
        <HelpStep n={5} text="Edit the chapter title and fill in the template body, then click Save to Lorebook."/>
        <HelpTip text="Saving updates the existing chapter if one already exists for that character (matched by character ID, not title)." />
      </HelpSection>

      <HelpSection title="Relationship Map" icon="ti-circles-relation">
        <P>The Map tab in the right panel (expand with the toggle button in the topbar) shows a visual relationship map for a world.</P>
        <P><B>Nodes</B> — Each character in the world appears as a portrait circle. Drag nodes to reposition them. The layout resets when you switch worlds.</P>
        <P><B>Drawing connections</B> — Click <B>+ connect</B> under a character, then click another character. A prompt asks for a relationship label (e.g. rivals, lovers, siblings).</P>
        <P><B>Editing connections</B> — Click a line or its label to open the edit popup at the bottom of the panel. Drag the popup by the ⠿ handle to move it out of the way. Edit the label or delete the connection.</P>
        <P><B>Reset layout</B> — Re-runs the auto-layout grid if nodes drift off-screen.</P>
        <HelpTip text="Characters that belong to this world via a collection (not just world_id) also appear — cross-world characters like shared cast members show up correctly." />
      </HelpSection>

      <HelpSection title="Tools panel" icon="ti-tool">
        <P>Open the Tools tab in the right panel.</P>
        <P><B>Height</B> — Convert cm ↔ ft/in. Click result to copy.</P>
        <P><B>Names</B> — Generate names by gender. International pool.</P>
        <P><B>Physicals</B> — Roll eyes, hair, and build separately or all at once.</P>
        <P><B>Nationality</B> — Filter by region. Shows language and currency.</P>
        <P><B>Color</B> — HSL sliders + 6 harmony modes. Click swatches to copy hex.</P>
        <P><B>Text Diff</B> — Paste two versions of a text to highlight what changed.</P>
        <P><B>Personality</B> — Roll Literary Archetype, MBTI, Jungian, and Attachment Style.</P>
        <P><B>Plot</B> — Roll from 100 global archetypes, or filter to world-specific ones added in World Info.</P>
        <P><B>Esper Powers</B> — Rolls an ability type, rank (F through S), drawback, and codename for an esper character.</P>
        <P><B>Hockey</B> — Rolls a position, role description, handedness, and character trait for a hockey player.</P>
        <P><B>Swim</B> — Rolls a stroke, event distance, stroke description, and swimmer archetype.</P>
        <P><B>Western Zodiac</B> — Rolls a sun sign with element, modality, traits, shadow side, and vibe.</P>
        <P><B>Chinese Zodiac</B> — Rolls a sign with element, reference years, traits, shadow side, and vibe.</P>
        <P><B>Img UUID</B> — Saucepan offers three copy formats for every image (markdown, an img tag, a CSS background rule) and the UUID is usually the only part you want. Paste any of them — or all three at once — and this pulls the UUID out. Results are deduplicated, so pasting all three formats of the same image gives one UUID, not three.</P>
        <P><B>Image Prompt Generator</B> — Generates an image generation prompt for the current character using whichever AI provider is set in Settings, including a local model via LM Studio. Art style and mood dropdowns; optional extra notes; copy button.</P>
        <P>Content warnings and POV/format tags are stripped before the prompt is built — they describe what the story contains, not what the picture looks like, and sending them skews the composition. Tags still export to Saucepan normally. The character's name is also never sent, since image models cannot render a name and a surname can bias the result.</P>
      </HelpSection>

      <HelpSection title="Image Tools" icon="ti-photo">
        <P>Found in the right panel → Tools tab → Image Tools section.</P>
        <P><B>Format Converter</B> — Convert images between PNG, JPEG, and WebP. Drag or paste an image, pick a format, download the result.</P>
        <P><B>Paste &amp; Save</B> — Paste a screenshot or image from clipboard and save it directly to a character's portrait folder. Useful for quickly capturing site images.</P>
        <P><B>Crop</B> — Crop any image to an exact pixel region. Drag to define the crop area, adjust handles, download the result.</P>
        <P><B>Image Prompt Generator</B> — See Tools panel section above.</P>
      </HelpSection>

      <HelpSection title="Editing conveniences" icon="ti-keyboard">
        <P><B>Ctrl+F — find in long text.</B> On a character, searches Full Description, Character Card, Formatting, and every intro. On a lorebook, searches the short description and every chapter. On a collection, the definition and lorebook display. Matches appear as buttons showing the count per field; clicking one jumps to that tab. Esc closes.</P>
        <HelpTip text="This is a Lorekeeper search, not the browser's. It has to be, because the browser's find cannot see text inside editable fields — which is where all of this content lives." />
        <P><B>Spell check</B> — Misspellings are underlined in every text field. Right-click one for suggestions, or to add the word to your dictionary. The same menu carries cut, copy, and paste.</P>
      </HelpSection>

      <HelpSection title="Import / Export" icon="ti-file-import">
        <P>The Import/Export page has three sections: <B>Backup</B>, <B>Restore</B>, and <B>Import</B>.</P>
        <P><B>Backup</B> — Export a full ZIP of everything (data + all images), or export a single world as a ZIP. Store backups somewhere safe outside the Lorekeeper folder.</P>
        <P><B>Restore</B> — Two options: <B>Import &amp; merge from backup</B> reads a ZIP and shows a preview of adds, updates, and conflicts — nothing is deleted, local-only data is preserved, and you choose Keep Local or Take Backup per conflict. <B>Restore from last good backup</B> is the emergency option: replaces all data with the auto-saved lastgood file (no zip needed).</P>
        <P><B>Import (single items or batch)</B> — Paste a JSON directly, or click Scan Folders to scan <Code>Companions\</Code>, <Code>Lorebooks\</Code>, and <Code>Collections\</Code>. Each item shows a badge: new / update ↓ / local newer ↑ / up to date. Assign worlds and click Import.</P>
        <HelpTip text="Items marked 'local newer' are skipped by default. Click 'Import anyway' on that item, or check 'Force import all', to override. Images alongside JSONs are automatically linked as image_relpath." />
        <P>If the JSON you pick turns out to be a full Lorekeeper backup rather than a single item, Lorekeeper now stops and says so, showing what the file holds against what you currently have. Confirming replaces everything — use Restore → Import &amp; merge from backup instead if you only wanted part of it.</P>
      </HelpSection>

      <HelpSection title="Auto-save to disk" icon="ti-device-floppy">
        <P>Characters, lorebooks, and collections can auto-save to <Code>I:\Lorekeeper\</Code> on every edit.</P>
        <P>Set a <B>Folder Name</B> on a character (Settings tab) and it saves to <Code>Companions\FolderName\companion.json</Code>.</P>
        <P>Set a <B>Lorebook Filename</B> on a lorebook and it saves to <Code>Lorebooksilename.json</Code>.</P>
        <P>Set a <B>Collections Filename</B> on a collection and it saves to <Code>Collectionsilename.json</Code>.</P>
        <P>New items get a filename auto-generated from their name. Clear the field to disable auto-save.</P>
        <HelpTip text="Auto-saved files have app-only fields stripped — they are clean platform-format JSONs ready to upload." />
      </HelpSection>

      <HelpSection title="Image Storage Audit" icon="ti-photo-scan">
        <P>Keeps images stored as local files instead of base64 blobs in the data JSON.</P>
        <P><B>Rescan images</B> — Scans folders for image files and links them to existing items. Use after dropping images into <Code>Lorebooks\</Code> or <Code>Collections\</Code> manually.</P>
        <P><B>Audit base64</B> — Sorts every image into four states: already using a local file; has a path but the file is missing; still base64 with no file yet; and has a working file but is <I>also</I> still carrying leftover base64 in the data.</P>
        <P><B>Clear leftover base64</B> — For that last group. No file is written, since the image is already on disk — this only drops the redundant copy out of the JSON. This is usually where the bulk of a large data file goes.</P>
        <P><B>Link / Write</B> — For items with no file yet. Where a matching image is already sitting in the folder, the button offers to link it rather than write a duplicate; the button text says which it will do.</P>
      </HelpSection>

      <HelpSection title="Data Safety" icon="ti-shield-check">
        <P>Lorekeeper protects your data with several layers:</P>
        <P><B>Auto-save</B> — Data is written after every change (600ms debounce). A load guard prevents saving until data is fully loaded.</P>
        <P><B>Shrink-refuse</B> — If a save would shrink the data file beyond a safety threshold, it is refused. Prevents runaway autosaves from overwriting real data with an empty shape.</P>
        <P><B>Last-good backup</B> — On every successful save, the previous file is copied to <Code>lorekeeper-data.lastgood.json</Code>. Use Restore → Restore from last good backup to recover it without a zip.</P>
        <P><B>Flush on close</B> — Closing the window used to kill a pending save mid-write. Lorekeeper now holds the window open until the last change has actually reached disk.</P>
        <P><B>Pre-shrink snapshot</B> — Operations that legitimately shrink the data file a lot, such as clearing base64 images, copy the old file to <Code>lorekeeper-data.preshrink-{'{date}'}.json</Code> first. These are safe to delete once you have confirmed everything looks right; nothing removes them automatically.</P>
        <P><B>Export ZIP (world topbar)</B> — Platform-ready zip for upload to Saucepan. Not the same as a backup — only includes posted characters, public lorebooks, and public collections.</P>
        <HelpTip text="Do a full backup before any restore. Full backup zips are the safest recovery option; the lastgood file is for quick recovery from recent corruption." />
      </HelpSection>

      <HelpSection title="Settings" icon="ti-settings">
        <P><B>Font size</B> — Changes the base font size across the whole app immediately.</P>
        <P><B>AI provider &amp; API key</B> — Used by the Assistant and the Image Prompt Generator. Choose Anthropic, OpenAI, Google, OpenRouter, or LM Studio, then paste the matching key. LM Studio runs locally and needs no key — start its server, load one or more models, and pick from the Model dropdown, which lists whatever is currently loaded. Loading several means switching between them without leaving Lorekeeper.</P>
        <P><B>Autosave debounce</B> — How long to wait after a keystroke before saving. Default 600ms.</P>
        <P><B>Data file</B> — Shows where data is stored. Click to open the folder.</P>
        <P><B>Theme and colorblind mode</B> — Settings → Appearance. Pick an accent color to generate a full dark/light theme. Colorblind mode adjusts red/green or blue/yellow pairs: Red-Green mode (deuteranopia/protanopia) swaps red→orange and green→blue; Blue-Yellow mode (tritanopia) swaps amber→red-orange and teal→pink.</P>
      </HelpSection>

      <HelpSection title="AI assistant" icon="ti-sparkles">
        <P>The Assistant tab in the right panel gives you an AI writing assistant that knows your world context. Powered by whichever provider you choose in Settings: Anthropic, OpenAI, Google, OpenRouter, or a local model via LM Studio.</P>
        <P><B>What it knows</B> depends on the context scope selector at the top of the Assistant panel:</P>
        <P><B>Character</B> — only the character you are editing. <B>World</B> — the world, its characters and collections, and lorebook summaries without the chapter text. <B>Full</B> — everything, including full chapter text.</P>
        <P>Chapter text is what overruns a local model's context window: a mature world runs to roughly 27k tokens against the ~8k many local models allow. On a local model, start at Character or World.</P>
        <P><B>Chat resets</B> when you switch to a different character or world. Copy anything useful before switching.</P>
        <HelpTip text="Click any suggested prompt on the empty chat screen to pre-fill it. Or just type — 'write a short description for this character', 'suggest scenarios based on the card', etc." />
        <div style={{marginTop:8,padding:'10px 12px',background:'rgba(251,191,36,0.08)',border:'1px solid rgba(251,191,36,0.25)',borderRadius:'var(--r)',fontSize:12,color:'var(--amber)',lineHeight:1.7}}>
          <strong style={{display:'block',marginBottom:4}}>⚠ Cloud providers need an API key — separate from any chat subscription</strong>
          Each provider's consumer chat app (claude.ai, chatgpt.com, gemini.google.com) is billed separately from its developer API. You need an API key with credits, not just a subscription. LM Studio is the exception: it runs on your own machine, needs no key, and costs nothing per message.
        </div>
        <div style={{marginTop:8,fontSize:12,color:'var(--text3)',lineHeight:1.8}}>
          <strong style={{color:'var(--text)',display:'block',marginBottom:4}}>Setup (Anthropic example):</strong>
          <HelpStep n={1} text="Go to console.anthropic.com and create an account (separate from claude.ai)."/>
          <HelpStep n={2} text="Add credits — minimum $5. There is no free tier."/>
          <HelpStep n={3} text="Go to API Keys → Create Key. Copy the key (starts with sk-ant-)."/>
          <HelpStep n={4} text="In Lorekeeper → Settings → AI Provider → select Anthropic → paste the key → Save."/>
        </div>
        <P>Other providers follow the same pattern: create an account at the provider's developer console (platform.openai.com, aistudio.google.com, or openrouter.ai), add credits, generate a key, and paste it in the matching Settings field.</P>
        <P><B>Cost estimate:</B> roughly $0.05–0.15 per conversation with a capable cloud model, depending on world size. Lighter models (Haiku, GPT-4o mini, Gemini Flash) are cheaper but less capable. A local model through LM Studio costs nothing per message, at the price of a much smaller context window.</P>
      </HelpSection>
    </div>
  );
}

function AllCollectionsPage({data,update,openColl,exportColl}) {
  const [filter,setFilter]=useState('all');
  const worlds=data.worlds;
  const collections=filter==='all'?data.collections:filter==='none'?data.collections.filter(c=>!c.world_id):data.collections.filter(c=>c.world_id===filter);
  return (
    <div>
      <div style={{display:'flex',gap:8,marginBottom:16}}>
        <WorldFilterDropdown worlds={worlds} value={filter} onChange={setFilter} includeStandalone/>
      </div>
      {collections.length===0?<div className="empty"><i className="ti ti-folders"></i><h3>No collections</h3></div>:
      <div className="coll-grid">
        {collections.map(col=>{
          const w=data.worlds.find(x=>x.id===col.world_id);
          const charCount=data.characters.filter(c=>(c.collections||[]).includes(col.id)||(col.companions||[]).includes(c.id)).length;
          const img=col.image_data||col.image_relpath||(w?.image)||(w?.image_relpath)||null;
          return (
            <div key={col.id} className="coll-card" onClick={()=>openColl(col)}>
              <div className="coll-banner">
                {img?<ImgFromPath src={img} alt={col.name} style={IMG_COVER}/>:<i className="ti ti-folders" style={COLL_FOLDER_ICON}></i>}
              </div>
              <div className="coll-card-body">
                <h3>{col.name}</h3>
                <div style={{fontSize:11,color:'var(--text3)',marginBottom:4}}>
                  {w?<span>{w.emoji?w.emoji+' ':''}{w.name}</span>:<span style={{color:'var(--accent)'}}>Standalone</span>}
                  {' · '}{charCount} characters
                </div>
                {col.definition&&<p style={{WebkitLineClamp:2,WebkitBoxOrient:'vertical',display:'-webkit-box',overflow:'hidden'}}>{col.definition}</p>}
                {(col.tags||[]).length>0&&<div className="char-tags" style={{marginTop:6}}>{col.tags.slice(0,4).map(t=><span key={t} className="tag">{t}</span>)}</div>}
              </div>
            </div>
          );
        })}
      </div>}
    </div>
  );
}


function WorldSelectWithCreate({data,worldId,setWorldId,update}) {
  const [newName,setNewName]=useState('');
  const creating=worldId==='__new__';
  const createWorld=()=>{
    if(!newName.trim())return;
    const id=uuid();
    update(d=>d.worlds.push({id,name:newName.trim(),short_description:'',tags:[],fandom_tags:[],created_at:now()}));
    setWorldId(id);
  };
  return (
    <div className="form-group">
      <label>World</label>
      <select value={creating?'__new__':worldId} onChange={e=>setWorldId(e.target.value)}>
        <option value="">— Select —</option>
        <option value="__none__">No World (standalone)</option>
        {sortedWorlds(data).map(w=><option key={w.id} value={w.id}>{w.emoji?w.emoji+' ':''}{w.name}</option>)}
        <option value="__new__">＋ Create new world…</option>
      </select>
      {creating&&<div style={{display:'flex',gap:8,marginTop:8}}>
        <input autoFocus value={newName} onChange={e=>setNewName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&createWorld()} placeholder="New world name…" style={{flex:1,background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',padding:'8px 12px',borderRadius:'var(--r)',fontSize:13,outline:'none'}}/>
        <button className="btn primary" onClick={createWorld} disabled={!newName.trim()}>Create</button>
      </div>}
    </div>
  );
}

function Modal({modal,setModal,data,update,setData,assignLore,assignChar,assignColl,updateCharFromJSON,updateLoreFromJSON,updateCollFromJSON,deleteChar,deleteWorld,deleteLore,deleteColl,selectedWorld}) {

    <p style={{fontSize:13,color:'var(--text3)',marginBottom:20}}>Importing will overwrite all fields from the JSON while keeping your app-specific data (world, status, schedule dates, portrait).</p>

      <button className="btn" onClick={()=>setModal(null)}>Cancel</button>

  </div></div>;

  if(modal.type==='incomplete-status') return <div className="modal-bg"><div className="modal">

    <p style={{fontSize:13,color:'var(--text3)',marginBottom:12}}>
      {modal.missing.length} field{modal.missing.length===1?' is':'s are'} still missing, so this character can't be marked {modal.target}:

    <div style={{display:'flex',flexWrap:'wrap',gap:4,marginBottom:20}}>
      {modal.missing.map(m=><span key={m} style={{fontSize:11,padding:'2px 7px',borderRadius:3,background:'rgba(251,191,36,0.12)',color:'var(--amber)',border:'1px solid rgba(251,191,36,0.25)'}}>{m}</span>)}

    </div>
  </div></div>;

  if(modal.type==='confirm-full-restore') return <div className="modal-bg"><div className="modal">
    <h2>This is a full backup, not a single item</h2>
    <p style={{fontSize:13,color:'var(--text3)',marginBottom:12}}>The file you picked contains an entire Lorekeeper dataset:</p>
    <p style={{fontSize:13,color:'var(--text)',marginBottom:12}}>
      {modal.counts.worlds} worlds · {modal.counts.characters} characters · {modal.counts.lorebooks} lorebooks · {modal.counts.collections} collections
    </p>
    <p style={{fontSize:13,color:'var(--red)',marginBottom:8}}><strong>Importing it replaces everything you currently have.</strong></p>
    <p style={{fontSize:13,color:'var(--text3)',marginBottom:20}}>
      Your current data — {(data.worlds||[]).length} worlds, {(data.characters||[]).length} characters, {(data.lorebooks||[]).length} lorebooks, {(data.collections||[]).length} collections — would be discarded. If you only wanted to bring in some of it, cancel and use Import from backup on the Import/Export page instead, which merges rather than replaces.
    </p>
    <div className="modal-footer">
      <button className="btn" onClick={()=>setModal(null)}>Cancel</button>
      <button className="btn danger" onClick={()=>{setData(modal.obj);setModal(null);}}>Replace everything</button>
    </div>
  </div></div>;

  if(modal.type==='confirm-update-lore') return <div className="modal-bg"><div className="modal">
    <h2>Update existing lorebook?</h2>
    <p style={{fontSize:13,color:'var(--text3)',marginBottom:8}}>A lorebook with this ID already exists:</p>
    <p style={{fontSize:14,fontWeight:600,color:'var(--amber)',marginBottom:16}}>{modal.existing.name}</p>
    <p style={{fontSize:13,color:'var(--text3)',marginBottom:20}}>Importing will overwrite all content from the JSON while keeping the world assignment.</p>
    <div className="modal-footer">
      <button className="btn" onClick={()=>setModal(null)}>Cancel</button>
      <button className="btn" onClick={()=>{setModal({type:'assign-lore',obj:modal.obj});}}>Import as New</button>
      <button className="btn primary" onClick={()=>updateLoreFromJSON(modal.obj,modal.existing)}>Update Existing</button>
    </div>
  </div></div>;

  if(modal.type==='assign-coll') return <div className="modal-bg"><div className="modal"><h2>Assign Collection to World</h2><p style={{fontSize:13,color:'var(--text3)',marginBottom:8}}>"{modal.obj.name}"</p><p style={{fontSize:12,color:'var(--text3)',marginBottom:16}}>{(modal.obj.companions||[]).length} companions will be auto-linked if their IDs match existing characters.</p><WorldSelectWithCreate data={data} worldId={worldId} setWorldId={setWorldId} update={update}/><div className="modal-footer"><button className="btn" onClick={()=>setModal(null)}>Cancel</button><button className="btn primary" disabled={(!worldId||worldId==='__new__')&&worldId!=='__none__'} onClick={()=>assignColl(worldId)}>Import</button></div></div></div>;

  if(modal.type==='confirm-update-coll') return <div className="modal-bg"><div className="modal"><h2>Update existing collection?</h2><p style={{fontSize:13,color:'var(--text3)',marginBottom:8}}>A collection with this ID already exists:</p><p style={{fontSize:14,fontWeight:600,color:'var(--teal)',marginBottom:16}}>{modal.existing.name}</p><p style={{fontSize:13,color:'var(--text3)',marginBottom:20}}>This will update the name, description and tags, and re-link any matching characters.</p><div className="modal-footer"><button className="btn" onClick={()=>setModal(null)}>Cancel</button><button className="btn" onClick={()=>{setModal({type:'assign-coll',obj:modal.obj});}}>Import as New</button><button className="btn primary" onClick={()=>updateCollFromJSON(modal.obj)}>Update Existing</button></div></div></div>;

  if(modal.type==='assign-lore') return <div className="modal-bg"><div className="modal"><h2>Assign Lorebook to World</h2><p style={{fontSize:13,color:'var(--text3)',marginBottom:16}}>"{modal.obj.name}"</p><WorldSelectWithCreate data={data} worldId={worldId} setWorldId={setWorldId} update={update}/><div className="modal-footer"><button className="btn" onClick={()=>setModal(null)}>Cancel</button><button className="btn primary" disabled={(!worldId||worldId==='__new__')&&worldId!=='__none__'} onClick={()=>assignLore(worldId)}>Import</button></div></div></div>;

  if(modal.type==='assign-char') return <div className="modal-bg"><div className="modal"><h2>Assign Character to World</h2><p style={{fontSize:13,color:'var(--text3)',marginBottom:16}}>"{modal.obj.name}"</p><WorldSelectWithCreate data={data} worldId={worldId} setWorldId={setWorldId} update={update}/><div className="modal-footer"><button className="btn" onClick={()=>setModal(null)}>Cancel</button><button className="btn primary" disabled={(!worldId||worldId==='__new__')&&worldId!=='__none__'} onClick={()=>assignChar(worldId)}>Import</button></div></div></div>;

  if(modal.type==='new-persona') return <div className="modal-bg"><div className="modal"><h2>New Persona</h2><div className="form-group"><label>Name</label><input autoFocus value={form.name||''} onChange={e=>f('name',e.target.value)} placeholder="Persona name"/></div><div className="form-group"><label>Pronouns</label><input value={form.pronouns||''} onChange={e=>f('pronouns',e.target.value)} placeholder="they/them, she/her…"/></div><div className="modal-footer"><button className="btn" onClick={()=>setModal(null)}>Cancel</button><button className="btn primary" disabled={!form.name?.trim()} onClick={()=>{update(d=>{if(!d.personas)d.personas=[];d.personas.push({id:uuid(),name:form.name.trim(),pronouns:form.pronouns||'',description:'',image:null,linked_lorebook:null,created_at:now()});});setModal(null);}}>Create</button></div></div></div>;

  if(modal.type==='confirm-delete-world') return (<div className="modal-bg"><div className="modal">
    <h2>Delete world?</h2>
    <p style={{fontSize:13,color:'var(--text3)',marginBottom:8}}>This will permanently delete <strong style={{color:'var(--text)'}}>{modal.world.name}</strong> and <strong style={{color:'var(--red)'}}>all its characters, lorebooks, collections, templates and gallery images</strong>.</p>
    <p style={{fontSize:12,color:'var(--text3)',marginBottom:20}}>This cannot be undone.</p>
    <div className="modal-footer">
      <button className="btn" onClick={()=>setModal(null)}>Cancel</button>
      <button className="btn danger" onClick={()=>deleteWorld(modal.world)}>Delete everything</button>
    </div>
  </div></div>);

  if(modal.type==='confirm-delete-lore') return (<div className="modal-bg"><div className="modal">
    <h2>Delete lorebook?</h2>
    <p style={{fontSize:13,color:'var(--text3)',marginBottom:20}}>This will permanently delete <strong style={{color:'var(--text)'}}>{modal.lore.name}</strong>. This cannot be undone.</p>
    <div className="modal-footer">
      <button className="btn" onClick={()=>setModal(null)}>Cancel</button>
      <button className="btn danger" onClick={()=>deleteLore(modal.lore)}>Delete</button>
    </div>
  </div></div>);

  if(modal.type==='confirm-delete-coll') return (<div className="modal-bg"><div className="modal">
    <h2>Delete collection?</h2>
    <p style={{fontSize:13,color:'var(--text3)',marginBottom:20}}>This will permanently delete <strong style={{color:'var(--text)'}}>{modal.coll.name}</strong>. This cannot be undone.</p>
    <div className="modal-footer">
      <button className="btn" onClick={()=>setModal(null)}>Cancel</button>
      <button className="btn danger" onClick={()=>deleteColl(modal.coll)}>Delete</button>
    </div>
  </div></div>);

  if(modal.type==='confirm-delete-persona') return <div className="modal-bg"><div className="modal"><h2>Delete persona?</h2><p style={{fontSize:13,color:'var(--text3)',marginBottom:20}}>This will permanently delete <strong style={{color:'var(--text)'}}>{modal.persona.name}</strong>. This cannot be undone.</p><div className="modal-footer"><button className="btn" onClick={()=>setModal(null)}>Cancel</button><button className="btn danger" onClick={()=>{update(d=>{d.personas=(d.personas||[]).filter(p=>p.id!==modal.persona.id);});modal.onBack&&modal.onBack();setModal(null);}}>Delete</button></div></div></div>;

  if(modal.type==='new-world') return <div className="modal-bg"><div className="modal"><h2>New World</h2><div className="form-group"><label>Name</label><input autoFocus value={form.name||''} onChange={e=>f('name',e.target.value)} placeholder="e.g. Gardenverse"/></div><div className="form-group"><label>Short Description</label><textarea value={form.desc||''} onChange={e=>f('desc',e.target.value)} placeholder="What is this world about?"/></div><div className="form-group"><label>Tags (comma separated)</label><input value={form.tags||''} onChange={e=>f('tags',e.target.value)} placeholder="romance, sci-fi, historical…"/></div><div className="modal-footer"><button className="btn" onClick={()=>setModal(null)}>Cancel</button><button className="btn primary" disabled={!form.name?.trim()} onClick={()=>{update(d=>d.worlds.push({id:uuid(),name:form.name.trim(),short_description:form.desc||'',tags:form.tags?form.tags.split(',').map(t=>t.trim()).filter(Boolean):[],fandom_tags:[],notes:'',created_at:now()}));setModal(null);}}>Create</button></div></div></div>;

  if(modal.type==='new-char') return <div className="modal-bg"><div className="modal"><h2>New Character</h2>
    <div className="form-group"><label>Name</label><input autoFocus value={form.name||''} onChange={e=>f('name',e.target.value)} placeholder="Character name" onKeyDown={e=>e.key==='Enter'&&form.name?.trim()&&document.getElementById('create-char-btn').click()}/></div>
    <div className="form-group"><label>World</label><select value={form.wid||modal.worldId||''} onChange={e=>f('wid',e.target.value)}><option value="">— Select world —</option><option value="__none__">No World (standalone)</option>{sortedWorlds(data).map(w=><option key={w.id} value={w.id}>{w.emoji?w.emoji+' ':''}{w.name}</option>)}</select></div>
    {(()=>{
      const wid=form.wid||modal.worldId||'';
      const globalT=(data.templates||[]).filter(t=>!t.world_id);
      const worldT=(data.templates||[]).filter(t=>t.world_id===wid);
      const allT=[...globalT,...worldT];
      if(allT.length===0) return null;
      return <div className="form-group"><label>Template <span style={{color:'var(--text3)',fontWeight:'normal',textTransform:'none',letterSpacing:0,fontSize:11}}>— pre-fills character fields</span></label>
        <select value={form.templateId||''} onChange={e=>f('templateId',e.target.value)}>
          <option value="">None</option>
          {globalT.length>0&&<optgroup label="Global">{globalT.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}</optgroup>}
          {worldT.length>0&&<optgroup label="World">{worldT.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}</optgroup>}
        </select>
      </div>;
    })()}
    <div className="form-group"><label>Folder Name <span style={{color:'var(--text3)',fontWeight:'normal',textTransform:'none',letterSpacing:0,fontSize:11}}>— subfolder in Companions\ for auto-saving JSON</span></label><input value={form.folder!==undefined?form.folder:(form.name||'').replace(/[^a-zA-Z0-9_-]/g,'_')} onChange={e=>f('folder',e.target.value)} placeholder="CharacterName"/><div style={{fontSize:11,color:'var(--text3)',marginTop:4}}>Clear to disable auto-save (can be changed in Settings)</div></div>
    <div className="modal-footer"><button className="btn" onClick={()=>setModal(null)}>Cancel</button>
    <button id="create-char-btn" className="btn primary" disabled={!form.name?.trim()} onClick={()=>{
      const wid=form.wid||modal.worldId||'';
      const worldId=wid==='__none__'?null:wid||null;
      const tpl=(data.templates||[]).find(t=>t.id===form.templateId);
      const tf=tpl?.fields||{};
      const effectiveFolder = form.folder!==undefined ? form.folder.trim() : (form.name||'').replace(/[^a-zA-Z0-9_-]/g,'_');
      update(d=>d.characters.push({
        id:uuid(),name:form.name.trim(),
        display_name:tf.display_name_format?tf.display_name_format.replace('{{name}}',form.name.trim()):'',
        world_id:worldId,
        short_description:tf.short_description||'',
        full_description:tf.full_description||'',
        card:tf.card||'',
        example_dialogue:'',
        tags:[...(tf.tags||[])]  ,fandom_tags:[...(tf.fandom_tags||[])],
        sus:tf.sus||false,very_sus:tf.very_sus||false,
        starting_scenarios:[],
        formatting_instructions:tf.formatting_instructions||'',
        advanced_prompt:tf.advanced_prompt||'',
        access_level:tf.access_level||'private',
        open_definition:tf.open_definition||false,
        external_model_policy:'vetted_only',
        locked_starting_message:tf.locked_starting_message||false,
        unlocked_portraits:true,hide_on_owner_profile:false,
        suppress_companion_profile_banner:false,preserve_existing_chats:true,
        posted_at:now(),created_at:now(),updated_at:now(),
        voice_catalog_id:null,temperature_offset_percentage:tf.temperature_offset_percentage||0,
        status:'draft',schedule_dates:[],posted_dates:[],collections:[],linked_lorebooks:[],image:null,author_id:'',author_handle:'',
        companion_folder:effectiveFolder||null
      }));
      // Write initial JSON to disk if folder was specified
      if(effectiveFolder){
        const folderName=effectiveFolder;
        const tf2=tpl?.fields||{};
        const initData={name:form.name.trim(),display_name:tf2.display_name_format?tf2.display_name_format.replace('{{name}}',form.name.trim()):'',short_description:tf2.short_description||''  ,full_description:tf2.full_description||'',card:tf2.card||' ',example_dialogue:'',tags:[],fandom_tags:[],sus:tf2.sus||false,very_sus:tf2.very_sus||false,starting_scenarios:[],formatting_instructions:tf2.formatting_instructions||'',advanced_prompt:tf2.advanced_prompt||'',access_level:tf2.access_level||'private',open_definition:tf2.open_definition||false,external_model_policy:'vetted_only',locked_starting_message:tf2.locked_starting_message||false,unlocked_portraits:true,hide_on_owner_profile:false,suppress_companion_profile_banner:false,preserve_existing_chats:true,posted_at:now(),created_at:now(),updated_at:now(),voice_catalog_id:null,temperature_offset_percentage:tf2.temperature_offset_percentage||0,image:null,portraits:[]};
        window.lorekeeper.saveCompanionJson(folderName, initData);
      }
      setModal(null);
    }}>Create</button></div></div></div>;

  if(modal.type==='new-lore') return <div className="modal-bg"><div className="modal"><h2>New Lorebook</h2><div className="form-group"><label>Name</label><input autoFocus value={form.name||''} onChange={e=>f('name',e.target.value)} placeholder="Lorebook name"/></div><div className="form-group"><label>Short Description</label><textarea value={form.desc||''} onChange={e=>f('desc',e.target.value)} placeholder="What does this lorebook cover?"/></div><div className="form-group"><label>World</label><select value={form.wid!==undefined?form.wid:(modal.worldId||'')} onChange={e=>f('wid',e.target.value)}><option value="">No World (standalone)</option>{sortedWorlds(data).map(w=><option key={w.id} value={w.id}>{w.emoji?w.emoji+' ':''}{w.name}</option>)}</select></div><div className="modal-footer"><button className="btn" onClick={()=>setModal(null)}>Cancel</button><button className="btn primary" disabled={!form.name?.trim()} onClick={()=>{const wid=form.wid!==undefined?form.wid:(modal.worldId||'');const fname=(form.name.trim().replace(/[^a-zA-Z0-9_-]/g,'_'))+'.json';update(d=>d.lorebooks.push({id:uuid(),world_id:wid||null,name:form.name.trim(),short_description:form.desc||'',content:[],tags:[],fandom_tags:[],nsfw:false,very_nsfw:false,image_id:null,collaboration_type:'private',definition_protection:'copy_protection',has_been_public:false,posted_at:now(),updated_at:now(),hide_on_owner_profile:false,selected_chapter_index:0,access_level:'private',lorebook_filename:fname}));window.lorekeeper.saveLorebookJson(fname,{name:form.name.trim(),short_description:form.desc||'',content:[],tags:[],fandom_tags:[],nsfw:false,very_nsfw:false,image_id:null,collaboration_type:'private',definition_protection:'copy_protection',has_been_public:false,posted_at:now(),updated_at:now(),hide_on_owner_profile:false,access_level:'private'});setModal(null);}}>Create</button></div></div></div>;

  if(modal.type==='new-coll') return <div className="modal-bg"><div className="modal"><h2>New Collection</h2><div className="form-group"><label>Name</label><input autoFocus value={form.name||''} onChange={e=>f('name',e.target.value)} placeholder="Collection name"/></div><div className="form-group"><label>Public Definition</label><textarea value={form.def||''} onChange={e=>f('def',e.target.value)} placeholder="Public-facing description"/></div><div className="modal-footer"><button className="btn" onClick={()=>setModal(null)}>Cancel</button><button className="btn primary" disabled={!form.name?.trim()} onClick={()=>{const fname=(form.name.trim().replace(/[^a-zA-Z0-9_-]/g,'_'))+'.json';update(d=>d.collections.push({id:uuid(),world_id:modal.worldId||null,name:form.name.trim(),definition:form.def||'',tags:[],fandom_tags:[],access_level:'private',image:null,image_data:null,companions:[],has_been_public:false,very_nsfw:false,lorebook_display:false,posted_at:now(),updated_at:now(),hide_on_owner_profile:false,collection_filename:fname}));window.lorekeeper.saveCollectionJson(fname,{name:form.name.trim(),definition:form.def||'',tags:[],fandom_tags:[],access_level:'private',image:null,companions:[],has_been_public:false,very_nsfw:false,lorebook_display:false,posted_at:now(),updated_at:now(),hide_on_owner_profile:false});setModal(null);}}>Create</button></div></div></div>;

  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
